.history{margin-top:37px;min-height:0;display:flex;flex-direction:column}.history-head{display:flex;align-items:center;justify-content:space-between;margin:0 11px 10px;color:var(--quiet);font-weight:520;font-size:12px}.round-icon{display:grid;place-items:center;width:28px;height:28px;border-radius:6px;color:var(--quiet)}.round-icon:hover{color:var(--text);background:var(--hover)}.search-field{margin:0 5px 9px;width:calc(100% - 10px);height:33px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:6px;padding:0 10px;font-size:13px}.history-list{overflow-y:auto;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin}.history-item{height:37px;min-height:37px;display:block;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 13px;border-radius:6px;color:#bdbdc0;font-size:13.5px}.history-item.selected{color:var(--text);background:var(--active)}

.main{min-width:0;flex:1;display:flex;flex-direction:column;position:relative}.topbar{height:61px;min-height:61px;display:flex;align-items:center;justify-content:space-between;padding:0 29px;border-bottom:1px solid var(--line);gap:20px}.top-left,.top-right{display:flex;align-items:center;gap:16px;min-width:0}.page-name{font-size:13.5px;font-weight:550;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.top-right{gap:0}.model-button{padding:8px 9px;display:flex;align-items:center;gap:9px;border-radius:6px;font-size:13px;color:var(--muted)}.model-button:hover{background:var(--hover);color:var(--text)}.model-button .icon{width:14px;height:14px}.model-button .icon svg{width:14px;height:14px}.top-model{position:relative}

.composer{width:100%;border:1px solid #48484c;background:var(--surface);border-radius:13px;padding:16px 16px 11px;position:relative;transition:border-color .12s}.composer:focus-within{border-color:#77717f}.composer textarea{display:block;width:100%;max-height:186px;min-height:56px;height:56px;resize:none;background:transparent;border:0;outline:0;color:var(--text);font-size:14.5px;line-height:1.6;padding:0 2px}.composer textarea::placeholder{color:#969699;opacity:1}.composer-row{display:flex;align-items:center;gap:6px;margin-top:6px;height:34px}.tool-trigger,.mode-trigger{display:flex;align-items:center;gap:7px;justify-content:center;height:33px;padding:0 9px;border-radius:7px;color:var(--muted)}.tool-trigger{width:33px;padding:0}.tool-trigger:hover,.mode-trigger:hover{background:var(--hover);color:var(--text)}.mode-trigger{font-size:12.5px}.mode-trigger .icon{width:13px;height:13px}.mode-trigger .icon svg{width:13px;height:13px}.composer-spacer{flex:1}.send{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--accent);color:#231d28}.send:not(:disabled):hover{filter:brightness(1.08)}.send svg{stroke-width:2}

.chat-wrap{flex:1;min-height:0;display:flex;flex-direction:column}.scroll{overflow-y:auto;min-height:0;flex:1;scrollbar-color:var(--border) transparent;padding:49px 30px 40px}.messages{width:min(754px,100%);margin:0 auto;display:flex;flex-direction:column;align-items:stretch;gap:42px}.msg-user{align-self:flex-end;padding:12px 17px;max-width:min(82%,590px);border-radius:13px;background:var(--user);font-size:14px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.msg-assistant{font-size:14.5px;line-height:1.8;max-width:100%;overflow-wrap:anywhere}.reply-name{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:-.05px;margin-bottom:11px}.reply-name .mark{display:inline-block;margin-right:8px;color:var(--accent);font-size:14px;font-weight:700}.msg-assistant p{margin:0 0 14px}.msg-assistant p:last-of-type{margin-bottom:0}.msg-assistant strong{font-weight:600;color:var(--text)}.msg-assistant pre{border-radius:8px;background:var(--code);border:1px solid var(--line);padding:15px 16px;overflow:auto;font:13px/1.65 'Cascadia Code',Consolas,monospace;white-space:pre}.msg-assistant code{font:12px Consolas,monospace;color:#cbb6d7}.reply-actions{display:flex;gap:12px;margin-top:18px}.reply-actions button{display:flex;align-items:center;gap:7px;color:var(--quiet);font-size:12px;padding:4px 0}.reply-actions button:hover{color:var(--text)}.reply-actions .icon,.reply-actions .icon svg{width:14px;height:14px}.chat-bottom{padding:13px 30px 25px}.chat-bottom .composer{margin:0 auto;max-width:754px}.view-placeholder{margin:auto;max-width:600px;padding:40px}.view-placeholder h2{font-size:24px;font-weight:500;letter-spacing:-.5px}.view-placeholder p{color:var(--muted)}.view-placeholder button{font-size:13px;color:var(--accent);margin-top:7px}.compact-note{margin:11px 0 0 2px;color:var(--quiet);font-size:11px}
@media(max-width:900px){.sidebar{width:220px;min-width:220px}.topbar{padding:0 18px}.start{padding:20px 26px 120px}.scroll{padding:32px 25px}.chat-bottom{padding:12px 22px 20px}}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}

 <div class="composer">
  <textarea rows="2" placeholder="Nachricht an NERAL …" aria-label="Nachricht an NERAL"></textarea>

<script>
(()=>{'use strict';
const el=(id)=>document.getElementById(id);let active='new',mode='Denken';const tools={'Websuche':false,'Code-Check':false,'Projektdateien':false};
const samples={
 sql:{title:'SQL JOIN verstehen',question:'Wann brauche ich eigentlich LEFT JOIN und wann INNER JOIN?',answer:`<p>Das hängt davon ab, ob du auch Datensätze <strong>ohne passenden Eintrag</strong> behalten möchtest.</p><p><strong>INNER JOIN</strong> gibt nur die Zeilen aus, für die beide Tabellen übereinstimmende Werte haben. <strong>LEFT JOIN</strong> zeigt zusätzlich alle Zeilen der linken Tabelle.</p><pre>SELECT Artist.Name, Album.Title\nFROM Artist\nLEFT JOIN Album\n  ON Artist.ArtistID = Album.ArtistID;</pre><p>Hier erscheinen also auch Künstler, für die noch kein Album gespeichert ist.</p>`},
 python:{title:'Python-Fehler finden',question:'Wieso bekomme ich einen KeyError bei einem Dictionary?',answer:`<p>Ein <code>KeyError</code> bedeutet, dass der abgefragte Schlüssel an dieser Stelle nicht vorhanden ist.</p><p>Schau dir zuerst die tatsächlichen Schlüssel an:</p><pre>print(data.keys())\nprint(repr(key))</pre><p>Häufig liegt es an Groß- und Kleinschreibung oder daran, dass ein Schlüssel als Zahl statt als Zeichenkette gespeichert wurde.</p>`},
 neral:{title:'NERAL weiterentwickeln',question:'Was sollte bei der Benutzeroberfläche von NERAL Priorität haben?',answer:`<p>Der Chat muss sich leicht bedienen lassen. Verlauf, Modellwechsel und Werkzeuge sollten erreichbar sein, ohne den Schreibbereich zu verdrängen.</p><p>Die technischen Details gehören in eigene Ansichten und nicht dauerhaft auf die Startseite.</p>`},
 physik:{title:'Coulomb-Gesetz',question:'Was passiert mit der Kraft, wenn ich die Ladung verdopple und den Abstand verdreifache?',answer:`<p>Nach dem Coulomb-Gesetz hängt die Kraft vom Produkt der Ladungen und vom Quadrat des Abstands ab.</p><pre>F′ / F = 2 / 3² = 2/9</pre><p>Die neue Kraft beträgt also etwa <strong>22,2 %</strong> der ursprünglichen Kraft.</p>`}
};
function closeMenus(){document.querySelectorAll('.menu-pop').forEach(p=>p.classList.remove('open'))}
function populateComposer(where){const target=el(where);target.innerHTML=el('composerTemplate').innerHTML;const wrap=target.querySelector('.composer'),textarea=wrap.querySelector('textarea'),send=wrap.querySelector('.send');wrap.querySelector('.mode-label').textContent=mode;
function syncMenu(){wrap.querySelectorAll('[data-mode]').forEach(b=>{let yes=b.dataset.mode===mode;b.setAttribute('aria-checked',String(yes));b.querySelector('[data-check]').hidden=!yes});wrap.querySelectorAll('[data-tool]').forEach(b=>{let yes=tools[b.dataset.tool];b.setAttribute('aria-checked',String(yes));b.querySelector('[data-check]').hidden=!yes})};syncMenu();
wrap.querySelectorAll('[data-open]').forEach(button=>button.addEventListener('click',(ev)=>{ev.stopPropagation();let pop=wrap.querySelector('.'+button.dataset.open+'-pop'),will=!pop.classList.contains('open');closeMenus();pop.classList.toggle('open',will)}));
wrap.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',(ev)=>{ev.stopPropagation();mode=b.dataset.mode;document.querySelectorAll('.mode-label').forEach(n=>n.textContent=mode);document.querySelectorAll('.composer').forEach(n=>n.querySelectorAll('[data-mode]').forEach(x=>{let y=x.dataset.mode===mode;x.setAttribute('aria-checked',String(y));x.querySelector('[data-check]').hidden=!y}));closeMenus();textarea.focus()}));
wrap.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',(ev)=>{ev.stopPropagation();tools[b.dataset.tool]=!tools[b.dataset.tool];document.querySelectorAll('.composer').forEach(n=>n.querySelectorAll('[data-tool]').forEach(x=>{let y=tools[x.dataset.tool];x.setAttribute('aria-checked',String(y));x.querySelector('[data-check]').hidden=!y}))}));
function submit(){const t=textarea.value.trim();if(!t)return;textarea.value='';showCustom(t);send.disabled=true}
send.addEventListener('click',submit);textarea.addEventListener('input',()=>{send.disabled=!textarea.value.trim();textarea.style.height='56px';textarea.style.height=Math.min(186,Math.max(56,textarea.scrollHeight))+'px'});textarea.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit()}if(e.key==='Escape')closeMenus()})}
populateComposer('homeComposer');
function hideAll(){el('start').hidden=true;el('chat').hidden=true;el('placeholder').hidden=true;closeMenus();document.querySelectorAll('.history-item').forEach(n=>n.classList.remove('selected'));if(innerWidth<=650)el('sidebar').classList.add('collapsed')}
function showHome(){active='new';hideAll();el('start').hidden=false;el('pageName').textContent='Neuer Chat';const field=el('homeComposer').querySelector('textarea');field.value='';el('homeComposer').querySelector('.send').disabled=true}
function renderConversation(data){hideAll();el('chat').hidden=false;el('pageName').textContent=data.title;el('messages').replaceChildren();const user=document.createElement('div');user.className='msg-user';user.textContent=data.question;const reply=document.createElement('article');reply.className='msg-assistant';reply.innerHTML='<div class="reply-name"><span class="mark">n</span>neral</div>'+data.answer+'<div class="reply-actions"><button aria-label="Antwort kopieren" id="copyReply"><span class="icon"><svg><use href="#i-copy"/></svg></span>Kopieren</button></div>';el('messages').append(user,reply);el('copyReply').addEventListener('click',()=>{const button=el('copyReply');navigator.clipboard?.writeText(reply.innerText).then(()=>{button.textContent='Kopiert'}).catch(()=>{button.textContent='Text markieren'})});populateComposer('chatComposer')}
function openHistory(key){active=key;const data=samples[key];if(!data)return;renderConversation(data);document.querySelectorAll('.history-item').forEach(n=>n.classList.toggle('selected',n.dataset.chat===key))}
function showCustom(text){active='custom';const safe=text.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));renderConversation({title:'Neue Unterhaltung',question:text,answer:'<p>Dies ist eine Designvorschau. Für eine echte Antwort muss die NERAL-Laufzeit angeschlossen werden.</p>'});const input=el('chatComposer').querySelector('textarea');input.focus()}
function openPage(name){hideAll();el('placeholder').hidden=false;el('pageName').textContent=name;el('placeholderTitle').textContent=name}
el('newChat').addEventListener('click',showHome);document.querySelectorAll('.history-item').forEach(n=>n.addEventListener('click',()=>openHistory(n.dataset.chat)));el('projects').addEventListener('click',()=>openPage('Projekte'));el('agents').addEventListener('click',()=>openPage('Agenten'));el('settings').addEventListener('click',()=>openPage('Einstellungen'));el('backToChat').addEventListener('click',showHome);el('sidebarToggle').addEventListener('click',()=>el('sidebar').classList.toggle('collapsed'));
el('searchToggle').addEventListener('click',()=>{const i=el('searchInput');i.hidden=!i.hidden;if(!i.hidden)i.focus();else{i.value='';document.querySelectorAll('.history-item').forEach(n=>n.hidden=false)}});el('searchInput').addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.history-item').forEach(n=>n.hidden=!n.textContent.toLowerCase().includes(q))});
el('modelToggle').addEventListener('click',e=>{e.stopPropagation();const pop=el('modelPop'),will=!pop.classList.contains('open');closeMenus();pop.classList.toggle('open',will)});el('modelNeral').addEventListener('click',closeMenus);document.addEventListener('click',e=>{if(!e.target.closest('.composer')&&!e.target.closest('.top-model'))closeMenus()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenus();if(e.ctrlKey&&e.key.toLowerCase()==='k'){e.preventDefault();el('searchInput').hidden=false;el('searchInput').focus()}});
if(innerWidth<=650)el('sidebar').classList.add('collapsed');if(new URLSearchParams(location.search).get('view')==='chat')openHistory('sql');
})();
</script>
