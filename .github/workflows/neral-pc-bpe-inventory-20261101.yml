name: Arctus350 read-only BPE corpus inventory — one-shot PC 2026-11-01
on:
  push:
    paths:
      - '.github/workflows/neral-pc-bpe-inventory-20261101.yml'
permissions:
  contents: read
jobs:
  local-corpus-metadata:
    runs-on: [self-hosted, Windows, X64, neral-gpu]
    timeout-minutes: 6
    env:
      CUDA_VISIBLE_DEVICES: '-1'
      HELIOS_DEVICE: cpu
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - name: Synthetic metadata contract and Python syntax
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $python = 'C:\Users\astad\Documents\Codex\2026-09-05\lo\outputs\neral\.venv\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'Trusted NERAL Python environment missing' }
          & $python -c "import ast,pathlib; ast.parse(pathlib.Path('frontier350/readonly_corpus_inventory.py').read_text(encoding='utf8')); ast.parse(pathlib.Path('tests/test_readonly_corpus_inventory.py').read_text(encoding='utf8')); print('METADATA_PROBE_SYNTAX_OK')"
          if ($LASTEXITCODE -ne 0) { throw 'Syntax failed' }
          & $python -m pytest -q -p no:cacheprovider tests/test_readonly_corpus_inventory.py
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic metadata inventory tests failed' }
      - name: Check exact previously inventoried BPE directories (metadata and size only)
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $python = 'C:\Users\astad\Documents\Codex\2026-09-05\lo\outputs\neral\.venv\Scripts\python.exe'
          $root = 'C:\Users\astad\Documents\Codex\2026-09-05\lo\outputs\neral'
          $pilot = Join-Path $root 'frontier350_bpe_recovery_pilot_arctus-recovery-lr-20260911-r2'
          $continuation = Join-Path $root 'frontier350_bpe_continuation_1b_arctus1b-focus-20260910-v2'
          $foundation = Join-Path $root 'frontier350_bpe_foundation_1b_arctus1b-20260910-v1'
          & $python -m frontier350.readonly_corpus_inventory --candidate $pilot --candidate $continuation --candidate $foundation
          if ($LASTEXITCODE -ne 0) { throw 'Read-only corpus inventory failed' }

      - name: Verify original 20M-token pilot shards against cryptographic hashes (read-only)
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $python = 'C:\Users\astad\Documents\Codex\2026-09-05\lo\outputs\neral\.venv\Scripts\python.exe'
          $root = 'C:\Users\astad\Documents\Codex\2026-09-05\lo\outputs\neral'
          $env:NERAL_PILOT_MANIFEST = Join-Path $root 'frontier350_bpe_recovery_pilot_arctus-recovery-lr-20260911-r2\manifest.json'
          & $python -c "import os,json; from pathlib import Path; from frontier350.vast4090_guard import validate_data_manifest; v=validate_data_manifest(Path(os.environ['NERAL_PILOT_MANIFEST'])); print(json.dumps({'pilot_shard_sha256_verified':True,'train_shards':v['train_shards'],'valid_shards':v['valid_shards'],'original_data_modified':False,'private_data_uploaded':False,'training_ready':False}))"
          if ($LASTEXITCODE -ne 0) { throw 'Pilot BPE shard SHA-256 verification failed' }

      - name: Verify original 500M and 1.05B token BPE shards by SHA-256 (read-only)
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $python = 'C:\Users\astad\Documents\Codex\2026-09-05\lo\outputs\neral\.venv\Scripts\python.exe'
          $root = 'C:\Users\astad\Documents\Codex\2026-09-05\lo\outputs\neral'
          $env:NERAL_CONTINUATION_MANIFEST = Join-Path $root 'frontier350_bpe_continuation_1b_arctus1b-focus-20260910-v2\manifest.json'
          $env:NERAL_FOUNDATION_MANIFEST = Join-Path $root 'frontier350_bpe_foundation_1b_arctus1b-20260910-v1\manifest.json'
          & $python -c "import os,json; from pathlib import Path; from frontier350.vast4090_guard import validate_data_manifest; v=validate_data_manifest(Path(os.environ['NERAL_CONTINUATION_MANIFEST'])); print(json.dumps({'continuation_shard_sha256_verified':True,'train_shards':v['train_shards'],'valid_shards':v['valid_shards'],'training_started':False,'training_ready':False}))"
          if ($LASTEXITCODE -ne 0) { throw 'Continuation BPE SHA-256 verification failed' }
          & $python -c "import os,json; from pathlib import Path; from frontier350.vast4090_guard import validate_data_manifest; v=validate_data_manifest(Path(os.environ['NERAL_FOUNDATION_MANIFEST'])); print(json.dumps({'foundation_shard_sha256_verified':True,'train_shards':v['train_shards'],'valid_shards':v['valid_shards'],'training_started':False,'training_ready':False}))"
          if ($LASTEXITCODE -ne 0) { throw 'Foundation BPE SHA-256 verification failed' }
