name: NERAL three-tier isolated Waitress launcher CPU contract
on:
  push:
    branches: [feat/neral-three-tier-local-live-20261117]
    paths:
      - 'Start-Neral-Three-Tier.ps1'
      - 'tests/test_neral_three_tier_launcher.py'
      - '.github/workflows/neral-three-tier-launcher-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Start-Neral-Three-Tier.ps1'
      - 'tests/test_neral_three_tier_launcher.py'
      - '.github/workflows/neral-three-tier-launcher-ci.yml'
permissions:
  contents: read
jobs:
  launcher-security-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check isolated dependency consent and zero training environment mutations
        run: |
          python -m pip install --disable-pip-version-check pytest==8.4.2
          python -m pytest -q --color=no tests/test_neral_three_tier_launcher.py
