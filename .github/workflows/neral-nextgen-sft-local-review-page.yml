name: Neral SFT local offline review page
on:
  push:
    branches: [experiment/nextgen-v1-isolated]
    paths: ['.github/workflows/neral-nextgen-sft-local-review-page.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  create-local:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          path: nextgen_sft_local_review_repo
          clean: false
          persist-credentials: false
      - name: Create local HTML only, do not publish any text
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          $stage='D:\NeralScaleV81\sft_review_stage_35126575836\review_only_candidates'
          $out=Join-Path $stage 'REVIEW_LOCAL.html'
          if (Test-Path -LiteralPath $out) {throw 'never overwrite local review page'}
          function To-WSL([string]$p) {
            if ($p -notmatch '^[CcDd]:\\' -or $p.Contains("'")) {throw 'invalid input path'}
            return ('/mnt/'+$p.Substring(0,1).ToLowerInvariant()+'/'+$p.Substring(3).Replace('\','/'))
          }
          $repo=To-WSL (Join-Path $env:GITHUB_WORKSPACE 'nextgen_sft_local_review_repo')
          $train=To-WSL (Join-Path $stage 'candidate_train.jsonl')
          $valid=To-WSL (Join-Path $stage 'candidate_validation.jsonl')
          $flags=To-WSL (Join-Path $stage 'AUTOMATED_FLAGS.json')
          $report=To-WSL (Join-Path $stage 'STAGING_REPORT.json')
          $target=To-WSL $out
          & wsl.exe -- bash -lc "cd '$repo' && ~/.venvs/neral-triton-py312/bin/python frontier350/nextgen_v1/build_local_sft_review.py --train '$train' --validation '$valid' --flags '$flags' --stage '$report' --out '$target'"
          if($LASTEXITCODE -ne 0){throw 'offline review builder failed'}
          if (-not (Test-Path -LiteralPath $out -PathType Leaf)) {throw 'review HTML missing'}
          Write-Host ('review_page_created_locally=true bytes='+(Get-Item -LiteralPath $out).Length)
          Write-Host ('local_review_page_path='+$out)
          Write-Host 'No dataset, HTML, weights or conversation text is uploaded or approved.'
