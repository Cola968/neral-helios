name: Neral V8.2 Throughput Static CI

on:
  push:
    branches: [experiment/scale-v8-2-throughput]
    paths:
      - 'frontier350/train_v8_2_stage_launcher.py'
      - 'frontier350/apply_v8_2_throughput.py'
      - 'frontier350/v8_2_profile_contract.py'
      - 'frontier350/v8_2_throughput_gate.py'
      - 'frontier350/v8_2_thermal_soak.py'
      - 'frontier350/apply_v8_2_metric_cadence_fix.py'
      - 'frontier350/test_v8_2_throughput.py'
      - 'frontier350/test_v8_2_metric_cadence_fix.py'
      - '.github/workflows/neral350-v8-2-static-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and patch benchmark-only metrics
        run: |
          python -m py_compile \
            frontier350/train_v8_2_stage_launcher.py \
            frontier350/apply_v8_2_throughput.py \
            frontier350/v8_2_profile_contract.py \
            frontier350/apply_v8_2_metric_cadence_fix.py \
            frontier350/v8_2_throughput_gate.py \
            frontier350/v8_2_thermal_soak.py \
            frontier350/test_v8_2_throughput.py \
            frontier350/test_v8_2_metric_cadence_fix.py
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run profile and metrics contract tests
        run: python -m pytest -q frontier350/test_v8_2_throughput.py frontier350/test_v8_2_metric_cadence_fix.py
      - name: Apply metrics patch and recompile
        run: |
          python frontier350/apply_v8_2_metric_cadence_fix.py
          python -m py_compile frontier350/v8_2_throughput_gate.py frontier350/v8_2_thermal_soak.py
