name: NERAL v2-full and Luna 1100 balanced corpus with Docker source proof

on:
  push:
    branches: [feat/qlora-v2-full-and-luna]
    paths:
      - 'scripts/neral_v2_mix_build.py'
      - 'scripts/neral_v2_docker_proof.py'
      - 'scripts/neral_v2_full_train.py'
      - 'tests/test_neral_v2_mix_build.py'
      - 'tests/test_neral_v2_full_train_contract.py'
      - '.github/workflows/neral-v2-full-luna-data-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: neral-full-luna-cpu-source-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  curriculum-1100-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CUDA_VISIBLE_DEVICES: '-1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded CPU verifier and test dependencies
        run: |
          python -m pip install pytest==8.4.2 sympy==1.14.0 networkx==3.6.1 z3-solver==4.16.0.0
      - name: Original 1.1+1.2 provenance and strict 32/40/24 exclusions
        run: python -m pytest -q tests/test_neral_v2_mix_build.py
      - name: Generate exactly 1100 train and 140 fresh validation plus Luna 480/75
        run: python -B -m scripts.neral_v2_mix_build --out cpu-artifacts/curriculum
      - name: Verify full-trainer split contract and fail-closed Docker claim
        env:
          NERAL_FULL_DATASET_DIR: cpu-artifacts/curriculum
        run: python -m pytest -q tests/test_neral_v2_full_train_contract.py
      - name: Actually re-execute all Python+AST repair examples inside isolated Docker
        run: |
          python -B -m scripts.neral_v2_docker_proof --dataset cpu-artifacts/curriculum --out cpu-artifacts/curriculum/docker_proof.json
      - name: Confirm isolated Docker receipt matches train + val manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('cpu-artifacts/curriculum/manifest.json').read_text())
          p=json.loads(Path('cpu-artifacts/curriculum/docker_proof.json').read_text())
          assert m['train_total']==1100 and m['val_total']==140
          assert m['luna_train']==480 and m['luna_validation']==75
          assert p['status']=='python_docker_all_pass' and p['docker_verified'] is True
          assert p['python_cases_verified']==216 and p['one_step_ast_repairs_verified']>=30
          assert p['train_sha256']==m['split_sha256']['train']
          assert p['val_sha256']==m['split_sha256']['validation']
          print('NERAL_BALANCED_DOCKER_RELEASE_GATE_PASS')
          PY
      - name: Publish generated synthetic corpus and proof receipts (NO weights/private profiles)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neral-1100-balanced-docker-proven-${{ github.run_id }}
          path: cpu-artifacts/curriculum/
          retention-days: 14
          if-no-files-found: warn
