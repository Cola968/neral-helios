name: Arctus350 numeric-label integrity (CPU, no weights)
on:
  pull_request:
    paths:
      - 'frontier350/arctus350_label_integrity.py'
      - 'frontier350/train_chat350.py'
      - 'tests/test_arctus350_label_integrity.py'
      - '.github/workflows/arctus350-label-integrity-ci.yml'
permissions:
  contents: read
jobs:
  label-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail-closed native SFT labels and previous quality audit
        run: python -m unittest tests.test_arctus350_label_integrity tests.test_chat350_quality_audits -v
      - name: Syntax
        run: python -m compileall -q frontier350/arctus350_label_integrity.py tests/test_arctus350_label_integrity.py
