name: Phoenix real-export contract synthetic CPU
on:
  pull_request:
    paths:
      - 'frontier350/nextgen_v1/phoenix_real_answer_export.py'
      - 'frontier350/nextgen_v1/test_phoenix_real_answer_export.py'
      - 'frontier350/nextgen_v1/phoenix_blind_ab_audit.py'
      - '.github/workflows/phoenix-real-export-contract-cpu.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-export-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and execute synthetic-only exporter contract
        working-directory: frontier350/nextgen_v1
        run: |
          python -m py_compile phoenix_real_answer_export.py test_phoenix_real_answer_export.py
          python -m unittest -v test_phoenix_real_answer_export.py
