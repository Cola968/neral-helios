name: Neral 350M Frontier 15K Fusion Sweep

on:
  push:
    branches: [frontier/neral350-v1]
    paths:
      - 'frontier350_requests/speed_fusion.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: neral-350m-frontier-15k-fusion
  cancel-in-progress: false

jobs:
  fusion-sweep:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - name: Checkout Frontier branch
        uses: actions/checkout@v4
        with:
          ref: frontier/neral350-v1
          clean: true
          persist-credentials: false

      - name: Validate explicit 15k request
        run: |
          $ErrorActionPreference='Stop'
          $p='frontier350_requests\speed_fusion.json'
          if(-not(Test-Path $p -PathType Leaf)){throw '15k request missing'}
          $r=Get-Content $p -Raw | ConvertFrom-Json
          $props=@($r.PSObject.Properties.Name | Sort-Object)
          if(($props -join ',') -ne 'action,architecture,request_id,seq,target_tps,version'){throw 'unsupported 15k request fields'}
          if([int]$r.version -ne 1){throw 'unsupported request version'}
          if($r.action -ne 'speed_fusion_frontier350'){throw 'wrong action'}
          if($r.architecture -ne 'frontier350-v1'){throw 'wrong architecture'}
          if([int]$r.seq -ne 512){throw '15k sweep sequence contract must be 512'}
          if([int]$r.target_tps -ne 15000){throw 'target must be exactly 15000 tok/s'}
          if($r.request_id -notmatch '^[A-Za-z0-9._-]{1,64}$'){throw 'invalid request id'}

      - name: Resolve isolated RTX environment
        id: env
        run: |
          $ErrorActionPreference='Stop'
          $assets=if($env:NERAL_ASSETS_ROOT){$env:NERAL_ASSETS_ROOT}else{'C:\Users\astad\Documents\Codex\2026-09-05\lo\outputs\neral'}
          $python=if($env:NERAL_PYTHON){$env:NERAL_PYTHON}else{Join-Path $assets '.venv\Scripts\python.exe'}
          $train=Join-Path $assets 'frontier350_bpe_pilot_v1\train'
          if(-not(Test-Path $python -PathType Leaf)){throw "Python missing: $python"}
          if(-not(Test-Path $train -PathType Container)){throw "real BPE train shards missing: $train"}
          & $python -c "import torch; assert torch.cuda.is_available() and torch.cuda.is_bf16_supported(); print(torch.cuda.get_device_name(0)); print(torch.__version__); print(torch.version.cuda)"
          if($LASTEXITCODE -ne 0){throw 'CUDA/BF16 validation failed'}
          nvidia-smi --query-gpu=name,driver_version,memory.total,memory.free,temperature.gpu,power.draw --format=csv,noheader
          "python=$python" >> $env:GITHUB_OUTPUT
          "train=$train" >> $env:GITHUB_OUTPUT

      - name: Compile and verify fused parameter contract
        run: |
          & '${{ steps.env.outputs.python }}' -m py_compile frontier350/model350.py frontier350/model350_fast.py frontier350/speed_fusion350.py
          if($LASTEXITCODE -ne 0){throw '15k path compile failed'}
          & '${{ steps.env.outputs.python }}' -c "import sys; sys.path.insert(0,'frontier350'); from model350 import Neral350M; from model350_fast import Neral350MFast; a=Neral350M().parameter_report(); b=Neral350MFast().parameter_report(); print(a,b); assert a['total']==349825152 and b['total']==349825152"
          if($LASTEXITCODE -ne 0){throw 'fused parameter contract failed'}

      - name: Benchmark fused execution toward 15k tok/s
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force frontier350_15k_report | Out-Null
          & '${{ steps.env.outputs.python }}' -u frontier350/speed_fusion350.py --train-data '${{ steps.env.outputs.train }}' --out frontier350_15k_report/fusion_sweep.json --seq 512 --steps 10 --warmup 4
          if($LASTEXITCODE -ne 0){throw '15k fusion sweep failed'}

      - name: Print 15k decision
        if: always()
        run: |
          $p='frontier350_15k_report\fusion_sweep.json'
          if(Test-Path $p -PathType Leaf){
            $r=Get-Content $p -Raw | ConvertFrom-Json
            Write-Host ("target_reached=" + $r.target_reached)
            if($null -ne $r.best){
              Write-Host ("best_e2e_tps=" + $r.best.e2e_tokens_per_second)
              Write-Host ("best_layout=" + $r.best.layout)
              Write-Host ("best_mb=" + $r.best.microbatch)
              Write-Host ("best_compile=" + $r.best.compile_mode)
              Write-Host ("best_peak_vram_gb=" + $r.best.peak_allocated_gb)
            }
          }

      - name: Upload aggregate 15k report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neral350-frontier-15k-fusion-${{ github.run_id }}
          path: frontier350_15k_report/
          retention-days: 30
          if-no-files-found: warn
