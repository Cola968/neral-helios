name: NERAL V3 grounded web reader and three-stage agent CPU contracts
on:
  pull_request:
    branches: [main]
    paths:
      - 'neral_v3_web_reader.py'
      - 'neral_v3_agent.py'
      - 'neral_web_api.py'
      - 'neral_three_tier_runtime.py'
      - 'static/neral-preview.js'
      - 'tests/test_neral_v3_*.py'
      - '.github/workflows/neral-v3-cpu.yml'
  push:
    branches: [main]
    paths:
      - 'neral_v3_web_reader.py'
      - 'neral_v3_agent.py'
      - 'neral_web_api.py'
      - 'neral_three_tier_runtime.py'
      - 'static/neral-preview.js'
      - 'tests/test_neral_v3_*.py'
      - '.github/workflows/neral-v3-cpu.yml'
permissions:
  contents: read
jobs:
  v3-cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing local proof dependencies
        run: python -m pip install 'z3-solver==4.16.0.0' 'Flask>=3,<4' 'waitress==3.0.2' 'pypdf>=5,<7'
      - name: Focused V3 reader and evidence contracts
        run: python -m unittest discover -s tests -p 'test_neral_v3_*.py' -v
      - name: Existing V2.2 tool and data integration regressions
        run: python -m unittest discover -s tests -p test_neral_three_tier_everyday.py -v
      - name: HTTP web API and source regressions
        run: python -m unittest discover -s tests -p test_neral_live_sources.py -v
      - name: V3 and UI syntax
        run: |
          python -m py_compile neral_v3_web_reader.py neral_v3_agent.py neral_three_tier_runtime.py neral_web_api.py
          node --check static/neral-preview.js
          node --check static/neral-web-live.js
