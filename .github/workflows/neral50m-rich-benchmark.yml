name: Neral 50M Rich Benchmark

on:
  push:
    branches:
      - benchmark-run
    paths:
      - benchmark_requests/request.json

permissions:
  contents: read

concurrency:
  group: neral-50m-rich-benchmark
  cancel-in-progress: false

jobs:
  benchmark-current:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        working-directory: src

    steps:
      - name: Checkout trusted benchmark code from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: src
          clean: true
          persist-credentials: false

      - name: Checkout authorization request only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: requestsrc
          clean: true
          persist-credentials: false

      - name: Validate request and local runtime
        id: env
        run: |
          $ErrorActionPreference='Stop'
          $requestPath=Join-Path '..\requestsrc' 'benchmark_requests\request.json'
          if(-not(Test-Path $requestPath)){throw 'Benchmark request missing.'}
          $r=Get-Content $requestPath -Raw|ConvertFrom-Json
          $props=@($r.PSObject.Properties.Name|Sort-Object)
          if(($props -join ',') -ne 'action,request_id,version'){throw 'Unsupported request fields.'}
          if([int]$r.version -ne 1 -or $r.action -ne 'benchmark_current50'){throw 'Unsupported benchmark request.'}
          if($r.request_id -notmatch '^[A-Za-z0-9._-]{1,64}$'){throw 'Invalid request_id.'}
          $verifiedAssets='C:\Users\astad\Documents\Codex\2026-09-05\lo\outputs\neral'
          $verifiedPython='C:\Users\astad\Documents\Codex\2026-09-05\lo\outputs\neral\.venv\Scripts\python.exe'
          $assets=if($env:NERAL_ASSETS_ROOT){$env:NERAL_ASSETS_ROOT}else{$verifiedAssets}
          $python=if($env:NERAL_PYTHON){$env:NERAL_PYTHON}else{$verifiedPython}
          if(-not(Test-Path $assets -PathType Container)){throw "Assets missing: $assets"}
          if(-not(Test-Path $python -PathType Leaf)){throw "Python missing: $python"}
          & $python -c "import torch; assert torch.cuda.is_available(); print(torch.__version__); print(torch.version.cuda); print(torch.cuda.get_device_name(0))"
          if($LASTEXITCODE -ne 0){throw 'CUDA validation failed.'}
          "assets=$assets" >> $env:GITHUB_OUTPUT
          "python=$python" >> $env:GITHUB_OUTPUT
          nvidia-smi --query-gpu=name,driver_version,memory.total,memory.free,temperature.gpu,power.draw --format=csv,noheader

      - name: Run complete rich benchmark
        run: |
          $ErrorActionPreference='Stop'
          & '${{ steps.env.outputs.python }}' -X utf8 run_current_benchmark50.py --assets '${{ steps.env.outputs.assets }}' --out rich_reports
          if($LASTEXITCODE -ne 0){throw 'Rich benchmark failed.'}

      - name: Reject private checkpoint or corpus uploads
        if: always()
        run: |
          if(Test-Path rich_reports){
            $bad=Get-ChildItem rich_reports -Recurse -File|Where-Object{$_.Extension -in '.pt','.pth','.bin','.safetensors','.parquet','.gz'}
            if($bad){throw 'Private model/corpus found in benchmark upload directory.'}
          }

      - name: Persist benchmark reports locally
        if: always()
        run: |
          $assets='${{ steps.env.outputs.assets }}'
          if(-not $assets){exit 0}
          $dest=Join-Path $assets ('reports\rich_benchmark_'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force $dest|Out-Null
          if(Test-Path rich_reports){Copy-Item rich_reports\* $dest -Recurse -Force}
          Write-Host "Persisted rich benchmark reports to $dest"

      - name: Upload reports and SVG graphics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neral-50m-rich-benchmark-${{ github.run_id }}
          path: src/rich_reports/
          if-no-files-found: warn
          retention-days: 30
