name: NERAL v2 branch complete Linux CPU regression audit
on:
  push:
    branches: [feat/qlora-v2-full-and-luna]
    paths: ['.github/workflows/neral-v2-full-cpu-regression.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-linux-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CUDA_VISIBLE_DEVICES: '-1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies from previous baseline
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-neral-preview.txt
          python -m pip install --disable-pip-version-check PyYAML cryptography "jsonschema>=4.20,<5"
          python -m pip install --disable-pip-version-check torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Run all CPU tests including legacy suite with exact failed node ids
        shell: bash
        run: |
          mkdir -p cpu-results
          set +e
          python -B -m pytest -q --color=no tests --junitxml=cpu-results/pytest.xml > cpu-results/pytest.log 2>&1
          status=$?
          set -e
          echo "$status" > cpu-results/pytest.exit
          python scripts/neral_1_2_legacy_compare.py --extract cpu-results/pytest.xml > cpu-results/pytest-summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('cpu-results/pytest-summary.json').read_text())
          print('NERAL_V2_FULL_CPU_RESULT', json.dumps({'tests':data['tests'],'failures':len(data['failures']),'errors':data['errors']},sort_keys=True))
          print('NERAL_V2_FULL_CPU_FAILED_NAMES',json.dumps(data['failures']))
          PY
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neral-v2-legacy-full-cpu-${{ github.run_id }}
          path: cpu-results/
          retention-days: 14
          if-no-files-found: warn
