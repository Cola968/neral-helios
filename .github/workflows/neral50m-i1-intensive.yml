name: Neral 50M I1 Intensive Training

on:
  push:
    branches:
      - i1-train-run
    paths:
      - i1_requests/request.json

permissions:
  contents: read

concurrency:
  group: neral-50m-i1-intensive
  cancel-in-progress: false

jobs:
  train-i1:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 900
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        working-directory: src

    steps:
      - name: Checkout trusted I1 code from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: src
          clean: true
          persist-credentials: false

      - name: Checkout authorization request only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: requestsrc
          clean: true
          persist-credentials: false

      - name: Validate authorization and RTX environment
        id: env
        run: |
          $ErrorActionPreference='Stop'
          $requestPath=Join-Path '..\requestsrc' 'i1_requests\request.json'
          if(-not(Test-Path $requestPath)){throw 'I1 request missing.'}
          $r=Get-Content $requestPath -Raw|ConvertFrom-Json
          $props=@($r.PSObject.Properties.Name|Sort-Object)
          if(($props -join ',') -ne 'action,request_id,version'){throw 'Unsupported request fields.'}
          if([int]$r.version -ne 1 -or $r.action -ne 'train_i1'){throw 'Unsupported I1 request.'}
          if($r.request_id -notmatch '^[A-Za-z0-9._-]{1,64}$'){throw 'Invalid request_id.'}
          $verifiedAssets='C:\Users\astad\Documents\Codex\2026-09-05\lo\outputs\neral'
          $verifiedPython='C:\Users\astad\Documents\Codex\2026-09-05\lo\outputs\neral\.venv\Scripts\python.exe'
          $assets=if($env:NERAL_ASSETS_ROOT){$env:NERAL_ASSETS_ROOT}else{$verifiedAssets}
          $python=if($env:NERAL_PYTHON){$env:NERAL_PYTHON}else{$verifiedPython}
          if(-not(Test-Path $assets -PathType Container)){throw "Assets missing: $assets"}
          if(-not(Test-Path $python -PathType Leaf)){throw "Python missing: $python"}
          & $python -c "import torch; assert torch.cuda.is_available() and torch.cuda.is_bf16_supported(); print(torch.__version__); print(torch.version.cuda); print(torch.cuda.get_device_name(0))"
          if($LASTEXITCODE -ne 0){throw 'CUDA/BF16 validation failed.'}
          "assets=$assets" >> $env:GITHUB_OUTPUT
          "python=$python" >> $env:GITHUB_OUTPUT
          nvidia-smi --query-gpu=name,driver_version,memory.total,memory.free,temperature.gpu,power.draw --format=csv,noheader

      - name: Run one intensive I1 campaign
        run: |
          $ErrorActionPreference='Stop'
          $env:PYTHONUNBUFFERED='1'
          $assets='${{ steps.env.outputs.assets }}'
          $python='${{ steps.env.outputs.python }}'
          New-Item -ItemType Directory -Force 'i1_reports'|Out-Null
          $stop=Join-Path (Get-Location) 'i1_reports\LIVE_STOP'
          Remove-Item $stop -Force -ErrorAction SilentlyContinue
          $watcherArgs='-u -X utf8 training_live_status50.py --assets "{0}" --reports "i1_reports" --interval 30 --stop-file "{1}"' -f $assets,$stop
          $watcher=Start-Process -FilePath $python -ArgumentList $watcherArgs -NoNewWindow -PassThru
          try {
            & $python -u -X utf8 run_50m_i1.py --assets $assets --reports i1_reports
            if($LASTEXITCODE -ne 0){throw 'I1 campaign failed.'}
          }
          finally {
            Set-Content -Path $stop -Value 'stop' -Encoding ascii
            if($watcher -and -not $watcher.HasExited){
              [void]$watcher.WaitForExit(10000)
              if(-not $watcher.HasExited){$watcher.Kill()}
            }
            Remove-Item $stop -Force -ErrorAction SilentlyContinue
          }

      - name: Reject private checkpoint or corpus uploads
        if: always()
        run: |
          if(Test-Path i1_reports){
            $bad=Get-ChildItem i1_reports -Recurse -File|Where-Object{$_.Extension -in '.pt','.pth','.bin','.safetensors','.parquet','.gz'}
            if($bad){throw 'Private model/corpus found in upload directory.'}
          }

      - name: Persist final reports locally
        if: always()
        run: |
          $assets='${{ steps.env.outputs.assets }}'
          if(-not $assets){exit 0}
          $dest=Join-Path $assets ('reports\runner_50m_i1_'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force $dest|Out-Null
          if(Test-Path i1_reports){Copy-Item i1_reports\* $dest -Recurse -Force}
          Write-Host "Persisted I1 reports to $dest"

      - name: Upload reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neral-50m-i1-${{ github.run_id }}
          path: src/i1_reports/
          if-no-files-found: warn
          retention-days: 14
