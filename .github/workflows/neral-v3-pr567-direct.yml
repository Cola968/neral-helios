# Owner-authorized real 4/4 Chrome retest after structured two-sided Firefox comparison.
name: NERAL PR567 direct RTX4070 four-task Chrome acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/neral_v3_pr567_upgrade.ps1'
      - 'scripts/neral_v3_pr567_browser_e2e.cjs'
      - '.github/workflows/neral-v3-pr567-direct.yml'
permissions:
  contents: read
jobs:
  direct-guarded-4of4:
    if: github.event.pull_request.head.repo.full_name == 'Cola968/neral-helios' && github.head_ref == 'codex/neral-v3-evidence-agent'
    runs-on: [self-hosted, windows, x64, neral-gpu]
    concurrency:
      group: neral-pr567-direct-9690-exclusive
      cancel-in-progress: false
    timeout-minutes: 75
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require owner-approved exact direct live test
        id: approval
        run: |
          $ErrorActionPreference='Stop'
          $subject=(& git log -1 --format=%s).Trim()
          if($env:GITHUB_HEAD_REF -eq 'codex/neral-v3-evidence-agent' -and
             $subject -eq 'ops(v3): owner-approved PR567 direct RTX4070 test'){
            'run=true' >> $env:GITHUB_OUTPUT
            Write-Host 'NERAL_PR567_DIRECT_4OF4_APPROVED'
          }else{
            'run=false' >> $env:GITHUB_OUTPUT
            Write-Host 'NERAL_PR567_DIRECT_4OF4_SAFE_SKIP'
          }
      - uses: actions/setup-node@v4
        if: steps.approval.outputs.run == 'true'
        with:
          node-version: '22'
      - name: Parse managed service upgrade and run real Windows CPU tests
        if: steps.approval.outputs.run == 'true'
        run: |
          $ErrorActionPreference='Stop'
          $tok=$null;$err=$null
          [Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/neral_v3_pr567_upgrade.ps1'),[ref]$tok,[ref]$err) | Out-Null
          if(@($err).Count -ne 0){throw 'PowerShell staging or rollback script invalid'}
          & node --check scripts/neral_v3_pr567_browser_e2e.cjs
          if($LASTEXITCODE -ne 0){throw 'Chrome script syntax invalid'}
          $py='D:/neral-qlora/venv/Scripts/python.exe'
          & $py -B -m unittest discover -s tests -p test_neral_evidence_agent.py -v
          if($LASTEXITCODE -ne 0){throw 'V3 context boundary tests failed on RTX4070 PC'}
          $curl=(Get-Command curl.exe -ErrorAction Stop).Source
          $http=@(& $curl --noproxy '*' --silent --connect-timeout 4 --max-time 12 --output NUL --write-out '%{http_code}' 'http://127.0.0.1:9690/')
          if($LASTEXITCODE -ne 0 -or ($http -join '').Trim() -ne '200'){
            throw 'Pre-update V2.2 service did not answer 9690 HTTP 200'
          }
          Write-Host 'NERAL_PR567_DIRECT_LOCAL_CPU_AND_HTTP200_GREEN'
      - name: Run genuine Chrome 4of4 on 9690 with automatic rollback
        if: steps.approval.outputs.run == 'true'
        run: |
          $ErrorActionPreference='Stop'
          & .\scripts\neral_v3_pr567_upgrade.ps1
          if($LASTEXITCODE -ne 0){throw 'V3 Chrome 4/4 failed, release forbidden; rollback required'}
          Write-Host 'NERAL_PR567_DIRECT_REAL_CHROME_4OF4_PASS'
