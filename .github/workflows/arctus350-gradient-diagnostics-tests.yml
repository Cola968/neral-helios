name: Arctus350 task gradient interference diagnostics CPU contracts
on:
  pull_request:
    types: [opened,synchronize]
    paths:
      - 'frontier350/arctus350_gradient_diagnostics.py'
      - 'tests/test_arctus350_gradient_diagnostics.py'
      - '.github/workflows/arctus350-gradient-diagnostics-tests.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest tests.test_arctus350_gradient_diagnostics -v
      - run: python -m py_compile frontier350/arctus350_gradient_diagnostics.py
