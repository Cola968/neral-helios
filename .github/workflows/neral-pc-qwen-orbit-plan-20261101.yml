name: NERAL Qwen/Orbit safe planning — one-shot Windows CPU 2026-11-01
on:
  push:
    paths:
      - '.github/workflows/neral-pc-qwen-orbit-plan-20261101.yml'
permissions:
  contents: read
jobs:
  plan-contracts:
    runs-on: [self-hosted, Windows, X64, neral-gpu]
    timeout-minutes: 6
    env:
      HELIOS_PREPARATION_MODE: '1'
      HELIOS_DEVICE: cpu
      NERAL_ASSISTANT_ENABLED: '0'
      CUDA_VISIBLE_DEVICES: '-1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: false
      - name: Pure Qwen plan parsing, no network or model inference
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $p = 'C:\Users\astad\Documents\Codex\2026-09-05\lo\outputs\neral\.venv\Scripts\python.exe'
          if (-not(Test-Path -LiteralPath $p -PathType Leaf)) { throw 'Existing trusted Python unavailable' }
          & $p -m unittest tests.test_neral_agent_plan tests.test_neral_agent_plan_api tests.test_neral_assistant -v
          if ($LASTEXITCODE -ne 0) { throw 'Local agent planning contract failures' }
