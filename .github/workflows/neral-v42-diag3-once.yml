name: NERAL V4.2 single approved 3+3 GPU telemetry with rollback
# Exact main commit message: title only, no body, before one authorized GPU dispatch.
# One-time owner-approved source-pinned run: ALL jobs checkout V4.2 baseline 09aecb09be4256e46c7f7a50a4314e7c72754db9.
# This workflow-only trigger commit must never alter the six measured source probes.
# 2026-11-23 owner authorized exact post-PR610-611 3+3, source-pinned, no Blind200/AB50.
# 2026-11-23 second authorized single 3+3 after owner import repair: exact source baseline 09aecb09be4256e46c7f7a50a4314e7c72754db9.
on:
  pull_request:
    paths:
      - .github/workflows/neral-v42-diag3-once.yml
      - scripts/build_neral_1_0_preview.py
      - scripts/neral_v42_telemetry_probe.py
      - scripts/neral_v42_gpu_memory.py
      - scripts/neral_v42_gpu_owner_preflight.ps1
      - tests/test_neral_v42_final_telemetry_cpu.py
      - neral_evidence_agent.py
      - scripts/neral_v42_apollo_real_html_cpu.py
      - tests/test_neral_v42_deploy_manifest_cpu.py
      - scripts/neral_v41_owner.ps1
      - neral_evidence_agent.py
      - tests/test_neral_v42_bottlenecks_cpu.py
      - tests/test_neral_v42_fastpath_math_evidence_cpu.py
      - tests/test_neral_v42_remaining_failures_cpu.py
      - tests/test_neral_v42_failure_attribution_cpu.py
      - tests/test_neral_v42_vram_web_deadline_cpu.py
      - tests/test_neral_v42_pipeline_quality_cpu.py
      - tests/test_neral_1_0_standalone_release.py
  push:
    branches: [main]
    paths: [.github/workflows/neral-v42-diag3-once.yml]
permissions:
  contents: read
jobs:
  standalone:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && (github.event.head_commit.message == 'NERAL V4.2 owner-approved telemetry 3x2 diagnosis 20261122' || github.event.head_commit.message == 'NERAL V4.2 owner-approved telemetry 3x2 bottleneck recheck 20261122' || github.event.head_commit.message == 'NERAL V4.2 owner-approved telemetry 3x2 fastpath math evidence 20261122' || github.event.head_commit.message == 'NERAL V4.2 owner-approved telemetry 3x2 quartz year final 20261122' || github.event.head_commit.message == 'NERAL V4.2 owner-approved telemetry 3x2 vram web latency 20261122' || github.event.head_commit.message == 'NERAL V4.2 owner-approved telemetry 3x2 float tolerance recheck 20261122' || github.event.head_commit.message == 'NERAL V4.2 owner-approved telemetry 3x2 source year math guard 20261122' || github.event.head_commit.message == 'NERAL V4.2 owner-approved final telemetry 3x2 freeze 20261123')) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '997647cbfa3a720812a7ed99e50c2b44a7b07ecb' }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare same offline bundle dependencies as release CI
        run: |
          python -m pip install -r requirements.txt -r requirements-neral-preview.txt sympy z3-solver
          python scripts/vendor_katex.py
      - name: All standalone-release regression tests, including real ZIP imports
        run: |
          python -m unittest discover -s tests -p test_neral_1_0_standalone_release.py -v
          python -m unittest discover -s tests -p test_neral_v42_deploy_manifest_cpu.py -v
          python -m unittest discover -s tests -p test_neral_v42_final_telemetry_cpu.py -v
          python -m unittest discover -s tests -p test_neral_v42_bottlenecks_cpu.py -v
          python -m unittest discover -s tests -p test_neral_v42_fastpath_math_evidence_cpu.py -v
          python -m unittest discover -s tests -p test_neral_v42_remaining_failures_cpu.py -v
          python -m unittest discover -s tests -p test_neral_v42_failure_attribution_cpu.py -v
          python -m unittest discover -s tests -p test_neral_v42_vram_web_deadline_cpu.py -v
      - name: Assemble complete real release ZIP and verify contents
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          python -m scripts.build_neral_1_0_preview --out dist/NERAL-1.0-Local-Preview.zip
          if($LASTEXITCODE -ne 0){throw 'Standalone ZIP build failed'}
          python -c "from zipfile import ZipFile; f=ZipFile('dist/NERAL-1.0-Local-Preview.zip'); assert f.testzip() is None; names=set(f.namelist()); assert all('NERAL-1.0-Local/'+x in names for x in ('neral_v42_telemetry.py','neral_v42_quality.py','neral_v42_deadline.py','neral_obsidian_deep.py','neral_local_wiki.py','neral_v41_context.py','neral_verified_notes.py','neral_verified_training.py','neral_v32_verifier.py','neral_knowledge_verifier.py'))"
          if($LASTEXITCODE -ne 0){throw 'Standalone ZIP content verification failed'}
  cpu-preflight:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && (github.event.head_commit.message == 'NERAL V4.2 owner-approved telemetry 3x2 diagnosis 20261122' || github.event.head_commit.message == 'NERAL V4.2 owner-approved telemetry 3x2 bottleneck recheck 20261122' || github.event.head_commit.message == 'NERAL V4.2 owner-approved telemetry 3x2 fastpath math evidence 20261122' || github.event.head_commit.message == 'NERAL V4.2 owner-approved telemetry 3x2 quartz year final 20261122' || github.event.head_commit.message == 'NERAL V4.2 owner-approved telemetry 3x2 vram web latency 20261122' || github.event.head_commit.message == 'NERAL V4.2 owner-approved telemetry 3x2 float tolerance recheck 20261122' || github.event.head_commit.message == 'NERAL V4.2 owner-approved telemetry 3x2 source year math guard 20261122' || github.event.head_commit.message == 'NERAL V4.2 owner-approved final telemetry 3x2 freeze 20261123')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '997647cbfa3a720812a7ed99e50c2b44a7b07ecb' }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt sympy z3-solver
      - name: Quality, Deep real repair, telemetry, API and knowledge provenance
        run: |
          python -m py_compile neral_v42_telemetry.py neral_v42_quality.py neral_evidence_agent.py neral_obsidian_deep.py neral_three_tier_runtime.py scripts/neral_v42_telemetry_probe.py scripts/neral_v42_gpu_memory.py
          python -m unittest discover -s tests -p test_neral_v42_deploy_manifest_cpu.py -v
          python -m unittest discover -s tests -p test_neral_v42_final_telemetry_cpu.py -v
          python -m unittest discover -s tests -p test_neral_v42_bottlenecks_cpu.py -v
          python -m unittest discover -s tests -p test_neral_v42_fastpath_math_evidence_cpu.py -v
          python -m unittest discover -s tests -p test_neral_v42_remaining_failures_cpu.py -v
          python -m unittest discover -s tests -p test_neral_v42_failure_attribution_cpu.py -v
          python -m unittest discover -s tests -p test_neral_v42_vram_web_deadline_cpu.py -v
          python -m unittest discover -s tests -p test_neral_v42_pipeline_quality_cpu.py -v
          python -m unittest discover -s tests -p test_neral_v42_telemetry_cpu.py -v
          python -m unittest discover -s tests -p test_neral_v42_obsidian_cpu.py -v
          python -m unittest discover -s tests -p test_neral_v42_grading_diagnostics_cpu.py -v
          python -m unittest discover -s tests -p test_neral_v42_offline_rag.py -v
          python -m unittest discover -s tests -p test_neral_v42_latency_routing_cpu.py -v
          python -m unittest discover -s tests -p test_neral_three_tier_api.py -v
          python -m unittest discover -s tests -p test_neral_evidence_agent.py -v
          python -m unittest discover -s tests -p test_neral_web_v4_cpu.py -v
      - name: Real Wikipedia Apollo 11 HTML CPU analysis
        run: python -m scripts.neral_v42_apollo_real_html_cpu
      - name: Prove exact approvedV42Diag3 and rejection of replay/unrelated push
        shell: pwsh
        run: ./tests/test_neral_v41_owner_approval.ps1

  owner-deploy:
    needs: [standalone, cpu-preflight]
    if: ${{ github.event_name == 'push' && needs.standalone.result == 'success' && needs.cpu-preflight.result == 'success' }}
    runs-on: [self-hosted, Windows, X64, neral-gpu]
    timeout-minutes: 30
    concurrency:
      group: neral-v32-exclusive-local-9690
      cancel-in-progress: false
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '997647cbfa3a720812a7ed99e50c2b44a7b07ecb'
          persist-credentials: false
      - name: Stage only pinned owner V4.2 with SHA256 backup and no inference
        env:
          NERAL_V42_DIAG3_APPROVED: NERAL-V42-DIAG3-APPROVED
          NERAL_V42_DIAG3_PREFLIGHT: ${{ needs.cpu-preflight.result }}
          NERAL_V42_DIAG3_MERGE_TITLE: ${{ github.event.head_commit.message }}
        run: |
          $ErrorActionPreference='Stop'
          & .\scripts\neral_v41_owner.ps1
          if($LASTEXITCODE -ne 0){throw 'Owner stage failed'}
          & 'D:/neral-qlora/venv/Scripts/python.exe' -m scripts.neral_v42_owner_availability
          if($LASTEXITCODE -ne 0){throw 'Owner API availability after stage failed'}
          Write-Host 'NERAL_DIAG3_OWNER_STAGED_NO_INFERENCE'

  quartz-three:
    needs: owner-deploy
    runs-on: [self-hosted, Windows, X64, neral-gpu]
    timeout-minutes: 18
    concurrency:
      group: neral-v32-exclusive-local-9690
      cancel-in-progress: false
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '997647cbfa3a720812a7ed99e50c2b44a7b07ecb'
          persist-credentials: false
      - name: Quartz exactly three public synthetic probes only
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP ('neral-diag3-'+$env:GITHUB_RUN_ID+'-Quartz')
          if(Test-Path -LiteralPath $dir){throw 'Refuse reuse of diagnostic output'}
          New-Item -ItemType Directory -Path $dir | Out-Null
          & 'D:/neral-qlora/venv/Scripts/python.exe' -m scripts.neral_v42_telemetry_probe --tier Quartz --summary (Join-Path $dir 'summary.json')
          if($LASTEXITCODE -ne 0){throw 'Quartz diagnostic incomplete'}
      - name: Publish only numeric and enumerated Quartz telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neral-v42-diag3-quartz-${{ github.run_id }}
          path: ${{ runner.temp }}/neral-diag3-${{ github.run_id }}-Quartz/summary.json
          if-no-files-found: warn
          retention-days: 14

  obsidian-three:
    needs: [owner-deploy, quartz-three]
    if: ${{ always() && needs.owner-deploy.result == 'success' }}
    runs-on: [self-hosted, Windows, X64, neral-gpu]
    timeout-minutes: 22
    concurrency:
      group: neral-v32-exclusive-local-9690
      cancel-in-progress: false
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '997647cbfa3a720812a7ed99e50c2b44a7b07ecb'
          persist-credentials: false
      - name: Obsidian Deep exactly the same three synthetic probes only
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP ('neral-diag3-'+$env:GITHUB_RUN_ID+'-Obsidian')
          if(Test-Path -LiteralPath $dir){throw 'Refuse reuse of diagnostic output'}
          New-Item -ItemType Directory -Path $dir | Out-Null
          & 'D:/neral-qlora/venv/Scripts/python.exe' -m scripts.neral_v42_telemetry_probe --tier Obsidian --summary (Join-Path $dir 'summary.json')
          if($LASTEXITCODE -ne 0){throw 'Obsidian diagnostic incomplete'}
      - name: Publish only numeric and enumerated Obsidian telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neral-v42-diag3-obsidian-${{ github.run_id }}
          path: ${{ runner.temp }}/neral-diag3-${{ github.run_id }}-Obsidian/summary.json
          if-no-files-found: warn
          retention-days: 14

  restore-original-owner:
    if: ${{ always() && needs.owner-deploy.result == 'success' }}
    needs: [owner-deploy, quartz-three, obsidian-three]
    runs-on: [self-hosted, Windows, X64, neral-gpu]
    timeout-minutes: 22
    concurrency:
      group: neral-v32-exclusive-local-9690
      cancel-in-progress: false
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '997647cbfa3a720812a7ed99e50c2b44a7b07ecb'
          persist-credentials: false
      - name: Restore exact same-run original owner service, then HTTP200
        env:
          NERAL_V42_DIAG3_APPROVED: NERAL-V42-DIAG3-APPROVED
          NERAL_V42_DIAG3_PREFLIGHT: success
          NERAL_V42_DIAG3_MERGE_TITLE: ${{ github.event.head_commit.message }}
          NERAL_V42_SMOKE5_REVERT: '1'
        run: |
          $ErrorActionPreference='Stop'
          & .\scripts\neral_v41_owner.ps1
          if($LASTEXITCODE -ne 0){throw 'Owner original rollback failed'}
          Write-Host 'NERAL_DIAG3_ORIGINAL_OWNER_RESTORED_HTTP200'
