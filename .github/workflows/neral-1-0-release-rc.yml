      - 'static/neral-motion.css'
      - 'static/neral-motion.js'
      - 'static/neral-preview.js'
      - 'templates/neral_preview.html'
      - 'tests/test_neral_1_0_attachments.py'
      - 'tests/test_neral_1_0_codecheck_files.py'
      - 'tests/test_neral_1_0_local_preview.py'
      - 'tests/neral_1_0_windows_extracted_launcher_smoke.ps1'
      - 'tests/test_neral_1_0_preview_cancel_v2.cjs'
      - 'tests/test_neral_1_0_preview_history.cjs'
      - 'tests/test_neral_1_0_project_files.cjs'
      - 'tests/test_neral_1_0_release_artifact_freshness.py'
      - 'tests/test_neral_1_0_standalone_release.py'
      - 'tests/test_neral_1_0_extracted_http.py'
      - 'tests/test_neral_1_0_voice_client.cjs'
      - 'tests/test_neral_1_0_voice_plugins.py'
      - 'tests/test_neral_logic_transfer.py'
      - 'tests/test_neral_high_verified_first.py'
      - 'tests/test_neral_high_package.py'
permissions:
  contents: read
jobs:
  cpu-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install preview server dependencies for CI only
        run: python -m pip install -r requirements-neral-preview.txt
      - name: Local account creation and cross-user data isolation
        run: python -m unittest discover -s tests -p test_neral_1_0_accounts.py -v
      - name: Offline source and EXE updater security tests
        run: python -m unittest discover -s tests -p test_neral_auto_update.py -v
      - name: New standalone app security, reproducible package and CSRF HTTP contracts
        run: python -m unittest discover -s tests -p test_neral_1_0_standalone_release.py -v
      - name: Boot the installed ZIP under real Waitress localhost HTTP (not Flask test client)
        run: python -m unittest discover -s tests -p test_neral_1_0_extracted_http.py -v
      - name: Every bundled file change must rebuild the correct current SHA
        run: python -m unittest discover -s tests -p test_neral_1_0_release_artifact_freshness.py -v
      - name: New voice and web plugin security/readiness contracts
        run: python -m unittest discover -s tests -p test_neral_1_0_voice_plugins.py -v
      - name: Offline image/document attachment security and multimodal contracts
        run: python -m unittest discover -s tests -p test_neral_1_0_attachments.py -v
      - name: Python syntax safety and file-context contracts
        run: python -m unittest discover -s tests -p test_neral_1_0_codecheck_files.py -v
      - name: HIGH verified direct responses and installed ZIP contracts
        run: |
          python -m unittest discover -s tests -p test_neral_high_verified_first.py -v
          python -m unittest discover -s tests -p test_neral_high_package.py -v
      - name: Offline voice PCM and endpoint contracts
        run: python -m unittest discover -s tests -p test_neral_local_voice.py -v
      - name: Offline speech browser lifecycle contracts
        run: |
          node --check static/neral-local-voice.js
          node --test tests/test_neral_local_voice_browser.cjs
      - name: Historic one-click preview still has fail-closed model preflight
        run: python -m unittest discover -s tests -p test_neral_1_0_local_preview.py -v
      - name: Real extracted Windows launcher, live HTTP and safe port refusal
        if: runner.os == 'Windows'
        shell: powershell
        run: .\tests\neral_1_0_windows_extracted_launcher_smoke.ps1
        env:
          NERAL_AUTO_UPDATE: '0'
      - name: Syntax and browser JS
        run: python -m py_compile neral_auto_update.py neral_preview_server.py neral_local_accounts.py neral_preview_attachments.py scripts/build_neral_1_0_preview.py scripts/neral_1_0_local_live_smoke.py
      - run: node --check static/neral-accounts.js
      - run: node --test tests/test_neral_1_0_account_client.cjs
      - run: node --check static/neral-preview.js
      - run: node --check static/neral-motion.js
      - run: node --check static/neral-dynamic-ui.js
      - run: node --test tests/test_neral_dynamic_ui.cjs
      - run: node --test tests/test_neral_1_0_preview_history.cjs
      - run: node --test tests/test_neral_1_0_preview_cancel_v2.cjs
      - run: node --test tests/test_neral_1_0_voice_client.cjs
      - run: node --test tests/test_neral_1_0_project_files.cjs
      - run: node --check static/neral-local-chat.js
  preview-package:
    # A CPU-tested QA build is useful immediately; it is NOT a PC-tested RC.
    # Publish only on trusted main, from its exact SHA and after both OS checks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [cpu-contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deterministic source-only manual QA ZIP - NOT PC VERIFIED
        run: |
          mkdir -p dist
          python -m scripts.build_neral_1_0_preview --out dist/NERAL-1.0-Local-Preview.zip
          cd dist
          sha256sum NERAL-1.0-Local-Preview.zip > SHA256SUMS.txt
          printf '%s\n' "${{ github.sha }}" > SOURCE-COMMIT.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 1
          test "$(wc -c < SOURCE-COMMIT.txt)" -eq 41
      - name: Publish manual QA preview - NOT-PC-VERIFIED
        uses: actions/upload-artifact@v4
        with:
          name: NERAL-1.0-Local-Preview-CPU-TESTED-NOT-PC-VERIFIED
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  local-windows-pc:
    # Lock the scarce self-hosted PC only while the live model test runs.
    # Ubuntu/Windows CPU contracts must never contend for the GPU lock.
    concurrency:
      group: neral-qwen7b-r32-gpu-exclusive
      cancel-in-progress: false
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&  (github.head_ref == 'release/neral-1-0-standalone-preview-20261108' || github.head_ref == 'feat/neral-1-0-voice-websearch-main-20261108'))
    needs: [cpu-contracts]
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 22
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    env:
      HF_HUB_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      NERAL_AGENT_BACKEND: ollama
      NERAL_AGENT_OLLAMA_MODEL: 'qwen3:8b'
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
          clean: true
          persist-credentials: false
          ref: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
      - name: Real local Ollama inventory, FAST, THINK and CSRF smoke - no downloads
        run: |
          $ErrorActionPreference='Stop'
          $py=Join-Path $env:USERPROFILE 'NERAL-QLoRA-Research\training-env-py312\Scripts\python.exe'
          $code=Join-Path $env:GITHUB_WORKSPACE 'code'
          $out=Join-Path $env:RUNNER_TEMP 'neral-1-0-pc-smoke-scalar.json'
          if(-not(Test-Path -LiteralPath $py -PathType Leaf)){
            throw 'Existing Python 3.12 runtime missing. Cannot claim PC release readiness.'
          }
          if(Test-Path -LiteralPath $out){throw 'Smoke report already exists; overwrite refused'}
          # The QLoRA training interpreter must NOT be modified to install
          # a web server. Create a disposable QA venv under runner TEMP only.
          $env:PYTHONPATH=$code
          $venv=Join-Path $env:RUNNER_TEMP "neral-preview-qa-$env:GITHUB_RUN_ID"
          if(Test-Path -LiteralPath $venv){throw 'Refuse existing temporary venv'}
          & $py -B -m venv $venv
          if($LASTEXITCODE -ne 0){throw 'Isolated QA Python creation failed'}
          $qa=Join-Path $venv 'Scripts\python.exe'
          & $qa -B -m pip install --disable-pip-version-check --no-input --no-cache-dir -r (Join-Path $code 'requirements-neral-preview.txt')
          if($LASTEXITCODE -ne 0){throw 'Unable to prepare isolated web QA dependencies'}
          Push-Location $code
          try{
            & $qa -B -c 'import flask; import neral_preview_server; print(1)'
            if($LASTEXITCODE -ne 0){throw 'Isolated preview Python failed import preflight'}
            & $qa -B -m scripts.neral_1_0_local_live_smoke --out $out
            if($LASTEXITCODE -ne 0){throw 'Actual installed local Ollama FAST/THINK failed'}
          } finally {Pop-Location}
          $report=Get-Content -LiteralPath $out -Raw | ConvertFrom-Json
          if($report.status -ne 'NERAL_1_0_LOCAL_PC_SMOKE_PASSED' -or
             $report.fast_actual_inference -ne $true -or
             $report.think_actual_inference -ne $true -or
             $report.attachment_actual_inference -ne $true -or
             ($report.optional_vision_model_installed -eq $true -and $report.optional_vision_live_verified -ne $true) -or
             $report.csrf_and_origin_blocked -ne $true -or
             $report.foundation_provenance_preserved -ne $true -or
             $report.release_validated -ne $false -or
             $report.weights_promoted -ne $false){
            throw 'Unsafe or incomplete scalar PC release smoke'
          }
          $dir=Join-Path $code 'neral_1_0_pc_scalar'
          if(Test-Path $dir){throw 'Report path exists'}
          New-Item -ItemType Directory -Path $dir -ErrorAction Stop|Out-Null
          Copy-Item -LiteralPath $out -Destination (Join-Path $dir 'summary.json')
      - name: Publish scalar verdict only - no user prompts, chats, models
        uses: actions/upload-artifact@v4
        with:
          name: neral-1-0-pc-live-verdict
          path: code/neral_1_0_pc_scalar/summary.json
          if-no-files-found: error
          retention-days: 14
  package-rc:
    needs: [cpu-contracts, local-windows-pc]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build deterministic verified-allowlist ZIP (NO model weights)
        run: |
          mkdir -p dist
          python -m scripts.build_neral_1_0_preview --out dist/NERAL-1.0-Local-Preview.zip
          cd dist
          sha256sum NERAL-1.0-Local-Preview.zip > SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 1
      - name: Publish source-only release candidate after BOTH CI and real PC pass
        uses: actions/upload-artifact@v4
        with:
          name: NERAL-1.0-Local-Preview-RELEASE-CANDIDATE
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  public-preview-download:
    # A public, direct ZIP link replaces the confusing Actions artifact download.
    # Never publish an untested PR, CPU-only build or model weights.
    needs: [package-rc]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: write
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Fetch archive that passed CPU and live Windows-PC gates
        uses: actions/download-artifact@v4
        with:
          name: NERAL-1.0-Local-Preview-RELEASE-CANDIDATE
          path: dist
      - name: Verify SHA256 and source-only safety before public upload
        shell: bash
        run: |
          cd dist
          sha256sum -c SHA256SUMS.txt
          python - <<'PY'
          import json
          from zipfile import ZipFile
          with ZipFile('NERAL-1.0-Local-Preview.zip') as bundle:
              names = set(bundle.namelist())
              assert 'NERAL-1.0-Local/START HIER.txt' in names
              assert 'NERAL-1.0-Local/Start NERAL 1.0 Local.cmd' in names
              manifest = json.loads(bundle.read('NERAL-1.0-Local/RELEASE-MANIFEST.json'))
              assert manifest['model_weights_included'] is False
              assert manifest['release_validated'] is False
              assert manifest['weights_promoted'] is False
              assert not any('/local_state/' in path or path.endswith('.safetensors') for path in names)
          PY
          printf '%s\n' "$SOURCE_SHA" > SOURCE-COMMIT.txt
      - name: Publish unique immutable-tag prerelease download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="neral-preview-${SOURCE_SHA:0:12}"
          gh release create "$tag" \
            dist/NERAL-1.0-Local-Preview.zip \
            dist/SHA256SUMS.txt \
            dist/SOURCE-COMMIT.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --prerelease \
            --latest=false \
            --title "NERAL 1.0 Local Preview (${SOURCE_SHA:0:12})" \
            --notes "Direkter Windows-Download nach Linux/Windows-CPU-Gates und lokalem Windows-Ollama-Live-Test. ZIP entpacken, START HIER.txt lesen, Start NERAL 1.0 Local.cmd doppelklicken. Dies ist ein Release-Kandidat ohne Modellgewichte, kein stabiler 1.0-Release."
