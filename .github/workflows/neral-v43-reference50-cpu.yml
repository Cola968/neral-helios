name: NERAL V4.3 raw-vs-1.0 reference50 CPU preflight only
on:
  push:
    branches: ['feat/v43-reference50-raw9b-vs-neral10-20261123']
    paths:
      - scripts/neral_v43_reference50.py
      - tests/test_neral_v43_reference50_cpu.py
      - scripts/neral_v43_reference50_live.py
      - .github/workflows/neral-v43-reference50-cpu.yml
  pull_request:
    paths:
      - scripts/neral_v43_reference50.py
      - tests/test_neral_v43_reference50_cpu.py
      - .github/workflows/neral-v43-reference50-cpu.yml
permissions:
  contents: read
jobs:
  benchmark-privacy-cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/neral_v43_reference50.py scripts/neral_v43_reference50_live.py tests/test_neral_v43_reference50_cpu.py
      - run: python -m unittest discover -s tests -p test_neral_v43_reference50_cpu.py -v
