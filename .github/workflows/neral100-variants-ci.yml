name: Neral 100M Helix variants CI
on:
  pull_request:
    paths:
      - 'architectures100_variants.py'
      - 'probe_neral100_a2.py'
      - 'tests/test_model100_variants.py'
      - '.github/workflows/neral100-variants-ci.yml'
permissions:
  contents: read
jobs:
  variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m py_compile architectures100_variants.py probe_neral100_a2.py
      - run: python -m pytest tests/test_model100_variants.py -q
