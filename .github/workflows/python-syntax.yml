name: Python syntax

on:
  pull_request:
    paths:
      - '**.py'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all Python sources
        run: python -m compileall -q -x 'local_state|runs|pretrain50_data|\.venv' .
      - name: Validate frozen RawMath suite
        run: python raw_math50_data.py
