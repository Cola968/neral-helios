name: Phoenix v4 final self-hosted CPU regression (NO REAL TRAINING)
on:
  push:
    branches: [experiment/phoenix-sft-fp32-audit]
    paths:
      - '.github/workflows/phoenix-v4-final-cpu-regression-once.yml'
permissions:
  contents: read
concurrency:
  group: neral-local-storage-readonly
  cancel-in-progress: false
jobs:
  v4-cpu-validation:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 12
    steps:
      - name: Checkout pinned v4 branch source without retained Git credentials
        uses: actions/checkout@v4
        with:
          ref: 16cce97a2f37b33a74a73eb4bc00a70b15b5bcf5
          path: phoenix_v4_final_cpu_source
          persist-credentials: false
      - name: Run all synthetic contracts and tiny model actual Torch replay without CUDA
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          function WslPath([string]$p) {
            $full=[IO.Path]::GetFullPath($p)
            if($full -notmatch '^([A-Za-z]):\\(.*)$') { throw 'Absolute Windows drive path required' }
            return '/mnt/' + $matches[1].ToLowerInvariant() + '/' + $matches[2].Replace('\','/')
          }
          $repo=[IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'phoenix_v4_final_cpu_source'))
          $workspace=[IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\')+'\'
          if(-not $repo.StartsWith($workspace,[StringComparison]::OrdinalIgnoreCase) -or [IO.Path]::GetFileName($repo) -ne 'phoenix_v4_final_cpu_source') { throw 'Unexpected checkout path' }
          if((Get-PSDrive C).Free -lt 30GB -or (Get-PSDrive D).Free -lt 200GB) { throw 'Disk reserve failed' }
          if($repo.Contains("'")) { throw 'Unsupported shell quote in checkout path' }
          $cmd="set -euo pipefail; export CUDA_VISIBLE_DEVICES=-1 PYTHONDONTWRITEBYTECODE=1 OMP_NUM_THREADS=2 MKL_NUM_THREADS=2; cd '$(WslPath $repo)'; ~/.venvs/neral-triton-py312/bin/python -B -m compileall -q frontier350/native_resume_preflight350.py frontier350/train350.py frontier350/train350_compiled.py frontier350/nextgen_v1/train_full_with_journal.py frontier350/nextgen_v1/phoenix_warmstart_readiness.py; ~/.venvs/neral-triton-py312/bin/python -B -m unittest discover -s frontier350/nextgen_v1 -p 'test_phoenix_*.py'; ~/.venvs/neral-triton-py312/bin/python -B -m unittest discover -s frontier350/nextgen_v1 -p 'test_sft_*.py'; ~/.venvs/neral-triton-py312/bin/python -B -m unittest discover -s frontier350/nextgen_v1 -p 'test_storage_budget.py'; ~/.venvs/neral-triton-py312/bin/python -B -m unittest discover -s frontier350/nextgen_v1 -p 'test_checkpoint_journal.py'; ~/.venvs/neral-triton-py312/bin/python -B frontier350/nextgen_v1/phoenix_native_positive_resume_cpu.py --execute --cpu-only"
          Write-Host 'Full Phoenix v4 synthetic CPU contracts and temporary tiny optimizer only. No private data, real model load, GPU training, weights or output modification.'
          & wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0) { throw 'Final v4 regression failed; no real training started' }
          Write-Host 'Full v4 CPU suite and tiny replay passed. Model quality and 350M GPU readiness remain unverified.'
