name: NERAL v4 200-step experimental training CPU safety contracts
on:
  pull_request:
    paths:
      - 'scripts/neral_v4_train_patcher.py'
      - 'tests/test_neral_v4_train_patcher.py'
      - '.github/workflows/neral-v4-r16-training.yml'
      - '.github/workflows/neral-v4-train-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/neral_v4_train_patcher.py'
      - 'tests/test_neral_v4_train_patcher.py'
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_neral_v4_train_patcher.py -v
      - run: python -m compileall -q scripts/neral_v4_train_patcher.py tests/test_neral_v4_train_patcher.py
