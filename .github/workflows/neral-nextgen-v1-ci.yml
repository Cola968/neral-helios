name: Neral NextGen V1 CPU evidence contracts

on:
  push:
    branches: [experiment/nextgen-v1-isolated]
    paths:
      - 'frontier350/nextgen_v1/**'
      - '.github/workflows/neral-nextgen-v1-ci.yml'
  pull_request:
    branches: [experiment/scale-v8-3b]
    paths:
      - 'frontier350/nextgen_v1/**'
      - '.github/workflows/neral-nextgen-v1-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check pure-CPU evidence and SFT contracts; syntax-check GPU probe
        run: |
          python -m py_compile frontier350/nextgen_v1/admission.py frontier350/nextgen_v1/probe.py frontier350/nextgen_v1/sft_contract.py frontier350/nextgen_v1/test_admission.py frontier350/nextgen_v1/test_sft_contract.py
          python -m unittest discover -v -s frontier350/nextgen_v1 -p 'test_*.py'
      - name: Explicitly record evidence boundary
        run: |
          echo 'This job runs synthetic CPU contract tests only: NO CUDA, NO training, NO model inference, NO GPU probe, NO user dataset, NO remote jobs.'
