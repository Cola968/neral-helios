name: NERAL exact effective LoRA drift CPU contracts (Linux Windows)
on:
  pull_request:
    paths:
      - 'scripts/neral_lora_drift_audit.py'
      - 'tests/test_neral_lora_drift_audit.py'
      - '.github/workflows/neral-lora-drift-ci.yml'
      - '.github/workflows/neral-lora-drift-cpu-manual.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/neral_lora_drift_audit.py'
      - 'tests/test_neral_lora_drift_audit.py'
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only numpy
        run: python -m pip install numpy
      - name: Test exact effective BA drift, replay token budget and SHA guard
        run: python -m unittest discover -s tests -p test_neral_lora_drift_audit.py -v
      - name: Syntax
        run: python -m py_compile scripts/neral_lora_drift_audit.py
