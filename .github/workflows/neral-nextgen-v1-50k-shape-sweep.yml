name: Neral NextGen V1 50k Synthetic Shape Sweep

on:
  push:
    branches: [experiment/nextgen-v1-isolated]
    paths: ['.github/workflows/neral-nextgen-v1-50k-shape-sweep.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Distinct from all previous workflows, so a pending V8 diagnostic cannot be replaced.
# The single self-hosted GPU runner serializes jobs, and the preflight refuses
# to run until all earlier known GPU workflows finish and RTX4070 is idle.
concurrency:
  group: neral-nextgen-v1-50k-synthetic-shapes
  cancel-in-progress: false

jobs:
  guarded-50k-shape-search:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: Verify earlier GPU workflows finished and RTX4070 truly idle
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          foreach($id in @(35069331704,35080263936,35084101942,35084877377)){
            $r=Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/actions/runs/$id" -Headers $headers -Method Get -TimeoutSec 15
            if($r.status -ne 'completed'){throw "Previous GPU workflow $id still $($r.status); refusing contention"}
          }
          $gpu=(nvidia-smi --query-gpu=name --format=csv,noheader|Select-Object -First 1).Trim()
          $temp=[int]((nvidia-smi --query-gpu=temperature.gpu --format=csv,noheader,nounits|Select-Object -First 1).Trim())
          $free=[int]((nvidia-smi --query-gpu=memory.free --format=csv,noheader,nounits|Select-Object -First 1).Trim())
          if($gpu -notmatch 'RTX 4070' -or $temp -gt 78 -or $free -lt 9000){throw "GPU not idle/cool: name=$gpu temp=$temp C free=$free MiB"}
          function W([string]$p){$f=[IO.Path]::GetFullPath($p); '/mnt/'+$f.Substring(0,1).ToLower()+'/'+$f.Substring(3).Replace('\','/')}
          "repo=$(W (Get-Location).Path)"|Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host 'Previous workflows completed; safe, synthetic-only NextGen sweep.'
          exit 0

      - name: Test isolated script syntax and shape-policy unit tests
        run: |
          $ErrorActionPreference='Stop'; $repo='${{ steps.guard.outputs.repo }}'
          $cmd="set -e; cd '$repo'; ~/.venvs/neral-triton-py312/bin/python -m py_compile frontier350/nextgen_v1/probe.py frontier350/nextgen_v1/test_probe_shape.py; ~/.venvs/neral-triton-py312/bin/python -m unittest discover -v -s frontier350/nextgen_v1 -p test_probe_shape.py"
          wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0){throw 'Synthetic shape guard unit tests failed'}
          exit 0

      - name: Exploratory compiled 12 x 512
        run: |
          $ErrorActionPreference='Stop'; $repo='${{ steps.guard.outputs.repo }}'
          $cmd="set -e; cd '$repo'; ~/.venvs/neral-triton-py312/bin/python -u frontier350/nextgen_v1/probe.py --execute --train-blocks 4 --execution compile-default --batch 12 --seq 512 --warmup 5 --steps 24 --out frontier350_nextgen_50k/compiled_b12_s512.json"
          wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0){throw 'Batch12 failed or guarded stop; no larger candidate started'}
          exit 0

      - name: Matched eager 16 x 512 baseline
        run: |
          $ErrorActionPreference='Stop'; $repo='${{ steps.guard.outputs.repo }}'
          $cmd="set -e; cd '$repo'; ~/.venvs/neral-triton-py312/bin/python -u frontier350/nextgen_v1/probe.py --execute --train-blocks 4 --execution eager --batch 16 --seq 512 --warmup 5 --steps 24 --out frontier350_nextgen_50k/eager_b16_s512.json"
          wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0){throw 'Batch16 eager failed or guarded stop; no compiled candidate started'}
          exit 0

      - name: Matched compiled 16 x 512 candidate
        run: |
          $ErrorActionPreference='Stop'; $repo='${{ steps.guard.outputs.repo }}'
          $cmd="set -e; cd '$repo'; ~/.venvs/neral-triton-py312/bin/python -u frontier350/nextgen_v1/probe.py --execute --train-blocks 4 --execution compile-default --batch 16 --seq 512 --warmup 5 --steps 24 --out frontier350_nextgen_50k/compiled_b16_s512.json"
          wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0){throw 'Batch16 compile failed or guarded stop; NO speed achievement claim'}
          exit 0

      - name: Upload all available bounded experimental evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neral-nextgen-v1-50k-synthetic-${{ github.run_id }}
          path: frontier350_nextgen_50k/*.json
          if-no-files-found: warn
          retention-days: 30
