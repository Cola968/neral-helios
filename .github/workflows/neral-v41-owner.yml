name: NERAL V4.1 W39 owner staged live acceptance with rollback
on:
  push:
    branches: [codex/neral-v41-context-memory-tiers-20261121]
    paths:
      - 'scripts/neral_v41_owner.ps1'
      - 'scripts/neral_v41_owner_smoke.py'
      - 'neral_v41_context.py'
      - 'neral_verified_notes.py'
      - 'neral_three_tier_runtime.py'
      - 'neral_preview_server.py'
      - 'static/neral-preview.js'
      - 'static/neral-reference-ui.js'
      - 'templates/neral_preview.html'
      - '.github/workflows/neral-v41-owner.yml'
      - 'docs/NERAL_V41_BLIND200.md'
permissions:
  contents: read
jobs:
  preflight:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt sympy z3-solver
      - name: Verify sources, regressions and smoke syntax without GPU
        run: |
          python -m py_compile neral_v41_context.py neral_verified_notes.py neral_three_tier_runtime.py neral_preview_server.py scripts/neral_v41_owner_smoke.py
          python -m unittest discover -s tests -p test_neral_v41_cpu.py -v
          python -m unittest discover -s tests -p test_neral_three_tier_api.py -v
          python -m unittest discover -s tests -p test_neral_web_v4_cpu.py -v
          node --check static/neral-preview.js
          node --check static/neral-reference-ui.js
      - name: Parse owner deployment without executing (Windows hosted)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $t=$null;$e=$null
          [void][Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/neral_v41_owner.ps1'),[ref]$t,[ref]$e)
          if(@($e).Count -ne 0){throw 'V4.1 owner script has PowerShell parser errors'}
          Write-Host 'NERAL_V41_OWNER_POWERSHELL_PARSE_OK'
  stage-owner:
    needs: [preflight]
    if: >-
      github.ref == 'refs/heads/codex/neral-v41-context-memory-tiers-20261121' &&
      startsWith(github.event.head_commit.message, 'v41-owner-APPROVED:')
    runs-on: [self-hosted, Windows, X64, neral-gpu]
    concurrency:
      group: neral-v32-exclusive-local-9690
      cancel-in-progress: false
    timeout-minutes: 28
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stage 7 V4.1 files, verify real local HTTP/CSRF 7+3, keep or rollback
        timeout-minutes: 27
        run: |
          $ErrorActionPreference='Stop'
          & .\scripts\neral_v41_owner.ps1
          if($LASTEXITCODE -ne 0){throw 'V4.1 owner acceptance failed'}
