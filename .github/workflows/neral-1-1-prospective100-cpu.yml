name: NERAL 1.1 stronger assert and prospective100 preflight CPU
on:
  push:
    branches: [feat/neral-1-1-fallback-ast-prospective100-20261115]
    paths:
      - 'neral_adaptive_planner.py'
      - 'tests/test_neral_1_1_fallback_ast_prospective.py'
      - '.github/workflows/neral-1-1-prospective100-cpu.yml'
      - 'scripts/neral_1_1_prospective_blind100.py'
      - 'neral_python_unique_logic.py'
      - 'neral_adaptive_bounded_fallback.py'
      - 'neral_python_source_router.py'
      - 'tests/test_neral_1_1_ast_unique_budget.py'
      - '.github/workflows/neral-1-1-ast-unique-budget-cpu.yml'
      - 'neral_python_assert_contract.py'
      - 'neral_python_math_verifier.py'
      - 'tests/test_neral_1_1_z3_first_failfast.py'
      - 'neral_python_logic_verifier.py'
      - 'neral_adaptive_ollama.py'
      - 'neral_local_chat_api.py'
      - 'tests/test_neral_adaptive_think_http.py'
      - 'tests/test_neral_adaptive_ollama.py'
      - 'tests/test_neral_python_logic_verifier.py'
      - 'tests/test_neral_adaptive_planner.py'
      - 'scripts/neral_1_1_offline_aggregate.py'
      - 'tests/test_neral_1_1_offline_aggregate.py'
      - '.github/workflows/neral-1-1-adaptive-planner-cpu.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CUDA_VISIBLE_DEVICES: '-1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      WANDB_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only proof dependencies
        run: python -m pip install 'z3-solver>=4.13,<5' 'jsonschema>=4.20,<5' 'Flask>=3,<4'
      - name: Compile planner and pre-existing guards
        run: python -B -m py_compile neral_adaptive_planner.py neral_python_logic_verifier.py neral_nl_verified_route.py neral_tir_regression_guard.py
      - name: Synthetic prospective generator dry-run without future random seed
        run: python -B -m scripts.neral_1_1_prospective_blind100 --cpu-preflight --authorize NERAL_1_1_FRESH_PROSPECTIVE100_RTX4070_ONCE
      - name: New strict tautology and 1536-token Qwen CPU contract
        run: python -B -m unittest discover -s tests -p 'test_neral_1_1_fallback_ast_prospective.py' -v
      - name: New disjoint AST unique logic and bounded fallback CPU regressions
        run: python -B -m unittest discover -s tests -p 'test_neral_1_1_ast_unique_budget.py' -v
      - name: Z3-first fail-fast assert/source math regression
        run: python -B -m unittest discover -s tests -p 'test_neral_1_1_z3_first_failfast.py' -v
      - name: Adaptive controller CPU tests (mock model and sandbox)
        run: python -B -m unittest discover -s tests -p 'test_neral_adaptive_planner.py' -v
      - name: New independent Python logic oracle CPU tests (zero GPU)
        run: python -B -m unittest discover -s tests -p 'test_neral_python_logic_verifier.py' -v
      - name: Adaptive local-model proposal contracts (CPU fake transport)
        run: python -B -m unittest discover -s tests -p 'test_neral_adaptive_ollama.py' -v
      - name: Explicit THINK HTTP opt-in and PR537 fallback (Flask CPU fakes)
        run: python -B -m unittest discover -s tests -p 'test_neral_adaptive_think_http.py' -v
      - name: Offline aggregate metadata-only tests
        run: python -B -m unittest discover -s tests -p 'test_neral_1_1_offline_aggregate.py' -v
      - name: Existing PR542 source and schema regression CPU suites
        run: |
          for suite in \
            test_neral_nl_schema_bridge.py \
            test_neral_nl_schema_old_cases.py \
            test_neral_nl_schema_probe.py \
            test_neral_nl_schema_diagnostics.py \
            test_neral_v2_structured_output.py \
            test_neral_nl_family_oneshot.py \
            test_neral_v2_nonempty_fewshot.py \
            test_neral_nl_verified_route.py \
            test_neral_pin_fullsource_fallback_20261114.py \
            test_neral_think_nl_guard_http.py \
            test_neral_nl_local_ollama.py \
            test_neral_preview_nl_z3_dependency.py \
            test_neral_nl_single_promotion.py \
            test_neral_typed_constraints_v2.py \
            test_neral_tir_regression_guard.py \
            test_neral_boolean_constraints.py; do
            python -B -m unittest discover -s tests -p "$suite" -v || exit 1
          done
