name: NERAL Qwen model identity CPU
on:
  pull_request:
    paths:
      - app.py
      - neral_assistant.py
      - chat_store.py
      - static/**
      - tests/test_qwen_model_identity*
      - .github/workflows/neral-qwen-model-identity.yml
concurrency:
  group: neral-qwen-model-identity-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HELIOS_ASSETS_ROOT: ${{ github.workspace }}/.test-identity/assets
      HELIOS_STATE_ROOT: ${{ github.workspace }}/.test-identity/state
      HELIOS_DEVICE: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q tests/test_qwen_model_identity.py
      - run: node --test tests/test_qwen_model_identity.js
