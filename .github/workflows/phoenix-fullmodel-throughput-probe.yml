name: Phoenix full-model real-data throughput probe

on:
  push:
    branches: [experiment/phoenix-blind-ab-audit-20260919]
    paths:
      - '.github/workflows/phoenix-fullmodel-throughput-probe.yml'
      - 'frontier350/nextgen_v1/phoenix_fullmodel_throughput_probe.py'

permissions:
  contents: read

concurrency:
  group: neral-nextgen-local-gpu-training
  cancel-in-progress: false

jobs:
  throughput:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 45
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: phoenix_fullmodel_probe_${{ github.run_id }}
          clean: false
          persist-credentials: false

      - name: Probe 24-layer real-data training shapes
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          function ToWsl([string]$p) {
            $f=[IO.Path]::GetFullPath($p)
            if($f -notmatch '^([A-Za-z]):\\(.*)$'){throw 'Absolute Windows path required'}
            return '/mnt/'+$matches[1].ToLowerInvariant()+'/'+$matches[2].Replace('\','/')
          }
          $repo=Join-Path $env:GITHUB_WORKSPACE ('phoenix_fullmodel_probe_'+$env:GITHUB_RUN_ID)
          $base='D:\NeralScaleV81\_continuity_v5\continuity_002073161216_f7a73e283421.pt'
          $assets=if($env:NERAL_ASSETS_ROOT){$env:NERAL_ASSETS_ROOT}else{Join-Path $env:USERPROFILE 'Documents\Codex\2026-09-05\lo\outputs\neral'}
          $train=Join-Path $assets 'frontier350_safe_v8_arctus-safe-v8-20260912-r1_xling05\train'
          $out='D:\NeralPrivateAssets\phoenix\fullmodel_throughput_' + $env:GITHUB_RUN_ID + '.json'
          foreach($p in @($repo,$base,$assets,$train,$out)){if($p.Contains("'")){throw 'Unsafe quote in path'}}
          if(-not(Test-Path -LiteralPath $base -PathType Leaf)){throw 'Historical anchor missing'}
          if(-not(Test-Path -LiteralPath $train -PathType Container)){throw 'Foundation shard directory missing'}
          if(Test-Path -LiteralPath $out){throw 'Create-only report exists'}
          nvidia-smi --query-gpu=name,memory.total,memory.free,utilization.gpu,temperature.gpu --format=csv,noheader
          $cmd="set -euo pipefail; cd '$(ToWsl $repo)'; test -x ~/.venvs/neral-triton-py312/bin/python; ~/.venvs/neral-triton-py312/bin/python -B -m py_compile frontier350/nextgen_v1/phoenix_fullmodel_throughput_probe.py; ~/.venvs/neral-triton-py312/bin/python -B -u frontier350/nextgen_v1/phoenix_fullmodel_throughput_probe.py --execute --trusted-own-checkpoint --checkpoint '$(ToWsl $base)' --train-data '$(ToWsl $train)' --out '$(ToWsl $out)'"
          & wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0){throw 'Full-model throughput probe produced no passing shape'}
          Write-Host 'Aggregate throughput report remains local; no model/data artifact uploaded.'

      - name: Post-probe telemetry
        if: always()
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: nvidia-smi --query-gpu=name,memory.used,memory.free,utilization.gpu,temperature.gpu --format=csv,noheader
