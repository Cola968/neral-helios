name: B2 data pipeline

on:
  pull_request:
    paths:
      - 'prepare_pretrain50_b2.py'
      - 'pretrain50_b2.py'
      - 'b2_sources/**'
      - 'tests/test_b2_data.py'
      - '.github/workflows/b2-data-ci.yml'

permissions:
  contents: read

jobs:
  data-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile B2 sources
        run: python -m py_compile prepare_pretrain50_b2.py pretrain50_b2.py tests/test_b2_data.py
      - name: Install lightweight test dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy
      - name: Test provenance, filters, split and no-replay quotas
        run: python -m pytest tests/test_b2_data.py -q
