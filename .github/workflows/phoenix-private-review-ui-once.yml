name: Phoenix private offline review UI once
on:
  push:
    branches: [experiment/phoenix-sft-fp32-audit]
    paths: ['.github/workflows/phoenix-private-review-ui-once.yml']
permissions:
  contents: read
concurrency:
  group: neral-local-private-data-cpu
  cancel-in-progress: false
jobs:
  build-local-ui:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: phoenix_review_ui_source
          clean: true
          persist-credentials: false
      - name: Generate local-only HTML
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          function ToWsl([string]$p) {
            $f = [IO.Path]::GetFullPath($p)
            if ($f -notmatch '^([A-Za-z]):\\(.*)$') { throw 'Absolute Windows path required' }
            return '/mnt/' + $matches[1].ToLowerInvariant() + '/' + $matches[2].Replace('\','/')
          }
          $repo = Join-Path $env:GITHUB_WORKSPACE 'phoenix_review_ui_source'
          $root = 'D:\NeralPrivateAssets'
          $queue = Join-Path $root 'phoenix\screened_review_queue_v1.jsonl'
          $out = Join-Path $root 'phoenix\screened_review_queue_v1.html'
          $sha = '94053e24e34b309ced74cf0ecdf75db484b4168718a260039ae3b7931c579f81'
          if (-not (Test-Path -LiteralPath $queue -PathType Leaf)) { throw 'private queue missing' }
          if ((Get-FileHash -LiteralPath $queue -Algorithm SHA256).Hash.ToLowerInvariant() -ne $sha) { throw 'private queue identity changed' }
          if (Test-Path -LiteralPath $out) { throw 'review UI already exists; refusing overwrite' }
          $cmd = "set -euo pipefail; cd '$(ToWsl $repo)'; ~/.venvs/neral-triton-py312/bin/python -u frontier350/nextgen_v1/phoenix_private_review_ui.py --assets-root '$(ToWsl $root)' --queue '$(ToWsl $queue)' --queue-sha256 '$sha' --out '$(ToWsl $out)'"
          & wsl.exe -- bash -lc $cmd
          if ($LASTEXITCODE -ne 0) { throw 'offline review UI generation blocked' }
          if (-not (Test-Path -LiteralPath $out -PathType Leaf)) { throw 'offline review UI missing after generator' }
          Write-Host ('PRIVATE_REVIEW_UI|created=true|bytes=' + (Get-Item -LiteralPath $out).Length + '|training_approved=false')
          Write-Host 'HTML contains private review text locally; it was NOT uploaded or printed.'
