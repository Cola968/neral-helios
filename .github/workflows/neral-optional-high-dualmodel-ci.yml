name: NERAL optional dual-model HIGH CPU safety contracts
on:
  pull_request:
    paths:
      - 'neral_agent_autonomy.py'
      - 'neral_preview_server.py'
      - 'neral_local_chat_api.py'
      - 'Start-Neral-1.0-Local.ps1'
      - 'tests/test_neral_experimental_high_qwen35.py'
      - '.github/workflows/neral-optional-high-dualmodel-ci.yml'
permissions:
  contents: read
jobs:
  dual-model-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test-only local preview dependencies
        run: python -m pip install -r requirements-neral-preview.txt
      - name: Opt-in model switching, revert and leak prevention
        run: python -B -m unittest discover -s tests -p test_neral_experimental_high_qwen35.py -v
      - name: Existing LOW/HIGH and exact verification regressions
        run: |
          python -B -m unittest discover -s tests -p test_neral_1_0_ollama_mode_contracts.py -v
          python -B -m unittest discover -s tests -p test_neral_high_verified_first.py -v
          python -B -m unittest discover -s tests -p test_neral_optional_measured_inference.py -v
      - name: Syntax
        run: python -B -m py_compile neral_agent_autonomy.py neral_preview_server.py neral_local_chat_api.py
