name: NERAL PR558 read-only live web result pipeline diagnostic
on:
  workflow_dispatch:
  push:
    branches: [feat/neral-three-tier-local-live-20261117]
    paths: ['.github/workflows/neral-three-tier-web-diagnostic.yml']
permissions:
  contents: read
concurrency:
  group: neral-pr558-web-diagnostic
  cancel-in-progress: false
jobs:
  web-pipeline:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 8
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect live search response without modifying NERAL or model processes
        run: |
          $ErrorActionPreference='Stop'
          $base='http://127.0.0.1:9690'
          $session=New-Object Microsoft.PowerShell.Commands.WebRequestSession
          $receipt=Invoke-RestMethod -Uri ($base+'/api/neral/preview/session') -WebSession $session -TimeoutSec 10
          if($receipt.three_tier_enabled -ne $true -or -not $receipt.csrf){throw 'No authenticated browser-compatible preview session'}
          $query='aktuellen BER-Flugverbindungen.'
          $headers=@{'X-Neral-CSRF'=[string]$receipt.csrf}
          function Probe([bool]$verify) {
            $body=@{query=$query;verify_links=$verify}|ConvertTo-Json -Compress
            return Invoke-RestMethod -Method Post -Uri ($base+'/api/web/search') -WebSession $session -Headers $headers -ContentType 'application/json' -Body $body -TimeoutSec 70
          }
          $raw=Probe $false
          $verified=Probe $true
          $out=@{
            query_kind='public_ber_flight_connections'
            raw_hits=@($raw.results).Count
            raw_titles=@($raw.results|Select-Object -First 5|ForEach-Object {[string]$_.title})
            verified_hits=@($verified.results).Count
            discovered_previews=@($verified.previews).Count
            provider=[string]$verified.provider
            providers_contacted=@($verified.providers_contacted)
            previews_topical=@($verified.previews|Where-Object{$_.topically_relevant -eq $true}).Count
          }
          Write-Host ('NERAL_PR558_WEB_DIAG_SCALAR '+($out|ConvertTo-Json -Compress -Depth 5))
          Write-Host 'NERAL_PR558_NO_SERVICES_OR_MODELS_MODIFIED'
