name: NERAL current live status read-only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neral-v43-owner-live-diagnostic
  cancel-in-progress: false
jobs:
  status:
    runs-on: [self-hosted, Windows, X64, neral-gpu]
    timeout-minutes: 2
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - name: Check local health and current profile without changing service
        run: |
          $ErrorActionPreference='Stop'
          $base='http://127.0.0.1:9690'
          try{
            $h=Invoke-RestMethod ($base+'/health') -TimeoutSec 5
            Write-Host ('CURRENT_HEALTH '+($h|ConvertTo-Json -Compress -Depth 5))
            $s=New-Object Microsoft.PowerShell.Commands.WebRequestSession
            Invoke-WebRequest ($base+'/') -UseBasicParsing -WebSession $s -TimeoutSec 5 | Out-Null
            $r=Invoke-RestMethod ($base+'/api/neral/chat/three-tier/status') -WebSession $s -TimeoutSec 5
            Write-Host ('CURRENT_PROFILE '+(@{v43=$r.v43_profile;web=$r.web_search;quartz=$r.quartz}|ConvertTo-Json -Depth 5 -Compress))
          }catch{Write-Host 'CURRENT_SERVICE_UNREACHABLE'}
          $dest='C:\NERAL-V43-Final'
          Write-Host ('FINAL_STARTER_PRESENT '+(Test-Path -LiteralPath (Join-Path $dest 'Start NERAL V4.3 Web.cmd')))
          Write-Host 'READ_ONLY_NO_PROCESS_CHANGES'
