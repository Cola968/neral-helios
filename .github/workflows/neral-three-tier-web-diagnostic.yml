name: NERAL article live root cause and multi-source regression
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neral-v43-owner-live-diagnostic
  cancel-in-progress: false
jobs:
  probe:
    runs-on: [self-hosted, Windows, X64, neral-gpu]
    timeout-minutes: 5
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          path: v43-article-probe-${{ github.run_id }}
          persist-credentials: false
      - name: Trace public HTTP response classifications only
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:GITHUB_WORKSPACE ('v43-article-probe-'+$env:GITHUB_RUN_ID)
          $env:PYTHONPATH=$src
          $env:PYTHONDONTWRITEBYTECODE='1'
          Push-Location -LiteralPath $src
          try{
            $code=@'
          import json
          from urllib.parse import urlsplit
          import neral_page_reader as p
          from neral_web_search import WebSearch,rewrite_search_query
          from neral_news_articles import article_text,publisher_links
          old=p._PinnedConnection.getresponse
          def traced(self,*args,**kwargs):
              response=old(self,*args,**kwargs)
              print("HTTP_TRACE "+json.dumps({"host":self.host,"http":response.status,"encoding":response.getheader("Content-Encoding"),"mime":response.getheader("Content-Type"),"redirect_host":urlsplit(response.getheader("Location") or "").hostname}),flush=True)
              return response
          p._PinnedConnection.getresponse=traced
          for query in ("Flughafen BER aktuelle Nachrichten","Flughafen MUC aktuelle Nachrichten"):
              engine=WebSearch()
              for hit in engine.search_news(rewrite_search_query(query))[:6]:
                  home=hit.get("publisher_url")
                  for kind,url in (("aggregator",hit["url"]),("publisher",home)):
                      if not url:continue
                      page=p.fetch_and_extract(url,query,include_markup=True)
                      html=(page or {}).get("markup","")
                      article=article_text(html)
                      print("PROBE "+json.dumps({"query":query,"kind":kind,"host":urlsplit(url).hostname,"final_host":urlsplit((page or {}).get("url","")).hostname,"markup_chars":len(html),"text_chars":len((page or {}).get("text","")),"article_chars":(article or {}).get("article_chars",0),"matching_links":len(publisher_links(html,(page or {}).get("url",url),hit["title"])) if html else 0}),flush=True)
          '@
            $code | & 'D:\neral-qlora\venv\Scripts\python.exe' -B -
            if($LASTEXITCODE -ne 0){throw 'HTTP probe failed'}
            & 'D:\neral-qlora\venv\Scripts\python.exe' -B -m unittest discover -s tests -p test_neral_news_articles.py -v
            if($LASTEXITCODE -ne 0){throw 'Multi-source regression failed'}
          }finally{Pop-Location}
