name: NERAL airport relevance regression on owner PC
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neral-v43-owner-live-diagnostic
  cancel-in-progress: false
jobs:
  regression:
    runs-on: [self-hosted, Windows, X64, neral-gpu]
    timeout-minutes: 8
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          path: v43-relevance-${{ github.run_id }}
          persist-credentials: false
      - name: Run focused CPU tests
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:GITHUB_WORKSPACE ('v43-relevance-'+$env:GITHUB_RUN_ID)
          $env:PYTHONDONTWRITEBYTECODE='1'
          $env:PYTHONPATH=$src
          Push-Location -LiteralPath $src
          try{
            & 'D:\neral-qlora\venv\Scripts\python.exe' -B -m unittest discover -s tests -p test_neral_official_news.py -v
            if($LASTEXITCODE -ne 0){throw 'Official index regression failed'}
            & 'D:\neral-qlora\venv\Scripts\python.exe' -B -m unittest discover -s tests -p test_neral_fresh_news_evidence.py -v
            if($LASTEXITCODE -ne 0){throw 'Fresh news regression failed'}
            & 'D:\neral-qlora\venv\Scripts\python.exe' -B -m unittest discover -s tests -p test_neral_airport_relevance.py -v
            if($LASTEXITCODE -ne 0){throw 'Airport relevance regression failed'}
            & 'D:\neral-qlora\venv\Scripts\python.exe' -B -m unittest discover -s tests -p test_neral_web_search.py -v
            if($LASTEXITCODE -ne 0){throw 'Web search regression failed'}
            & 'D:\neral-qlora\venv\Scripts\python.exe' -B -m unittest discover -s tests -p test_neral_v43_verified_start.py -v
            if($LASTEXITCODE -ne 0){throw 'Launcher regression failed'}
            $testDeps=Join-Path $env:RUNNER_TEMP ('neral-pytest-'+$env:GITHUB_RUN_ID)
            & 'D:\neral-qlora\venv\Scripts\python.exe' -B -m pip install --disable-pip-version-check --no-input --target $testDeps 'pytest==8.3.5'
            if($LASTEXITCODE -ne 0){throw 'Isolated test dependency preparation failed'}
            $env:PYTHONPATH=$src+';'+$testDeps
            & 'D:\neral-qlora\venv\Scripts\python.exe' -B -m pytest -q tests/test_neral_v43_live_web_cpu.py tests/test_neral_web_v4_cpu.py
            if($LASTEXITCODE -ne 0){throw 'V43 live web regression failed'}
            $code=@'
          import json,time
          from neral_web_search import WebSearch
          from neral_v43_live_web import search_live_sources
          for q in ("Welche aktuellen Nachrichten gibt es zum Flughafen BER?", "Was gibt es Neues am Flughafen MUC?", "In welchem Jahr landete Apollo 11 auf dem Mond?"):
              start=time.monotonic()
              result=search_live_sources(WebSearch(),q)
              print("CANDIDATE_LIVE "+json.dumps({"query":q,"status":result["status"],"error":result["error"],"provider":result["provider"],"sources":result["sources"],"seconds":round(time.monotonic()-start,3)},ensure_ascii=True),flush=True)
          '@
            $code | & 'D:\neral-qlora\venv\Scripts\python.exe' -B -
            if($LASTEXITCODE -ne 0){throw 'Public candidate probe crashed'}
          }finally{Pop-Location}
