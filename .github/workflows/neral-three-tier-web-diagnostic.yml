name: NERAL isolated V4.3 live diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neral-v43-owner-live-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64, neral-gpu]
    timeout-minutes: 5
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - name: Inspect active local service without checkout or process changes
        run: |
          $ErrorActionPreference='Stop'
          $base='http://127.0.0.1:9690'
          $owners=@(Get-NetTCPConnection -LocalAddress 127.0.0.1 -LocalPort 9690 -State Listen -ErrorAction SilentlyContinue | Select-Object -ExpandProperty OwningProcess -Unique)
          foreach($ownerId in $owners){
            $proc=Get-CimInstance Win32_Process -Filter ("ProcessId="+$ownerId)
            Write-Host ('OWNER '+(@{preview=($proc.CommandLine -match 'neral_preview_server');v43=($proc.CommandLine -match '--v43-profile')}|ConvertTo-Json -Compress))
          }
          $health=Invoke-RestMethod ($base+'/health') -TimeoutSec 10
          Write-Host ('HEALTH '+($health|ConvertTo-Json -Depth 5 -Compress))
          $s=New-Object Microsoft.PowerShell.Commands.WebRequestSession
          Invoke-WebRequest ($base+'/') -UseBasicParsing -WebSession $s -TimeoutSec 10 | Out-Null
          $info=Invoke-RestMethod ($base+'/api/neral/preview/session') -WebSession $s -TimeoutSec 10
          $status=Invoke-RestMethod ($base+'/api/neral/chat/three-tier/status') -WebSession $s -TimeoutSec 10
          Write-Host ('PROFILE '+(@{v43=$status.v43_profile;web=$status.web_search;deep=$status.obsidian_deep}|ConvertTo-Json -Depth 6 -Compress))
          $headers=@{'X-Neral-CSRF'=[string]$info.csrf}
          $q='Welche aktuellen Nachrichten gibt es zum Flughafen BER?'
          $body=@{tier='Quartz';prompt=$q;history=@();force_sandbox=$false}|ConvertTo-Json -Compress
          try{
            $r=Invoke-RestMethod ($base+'/api/neral/chat/three-tier') -Method Post -WebSession $s -Headers $headers -ContentType 'application/json; charset=utf-8' -Body $body -TimeoutSec 100
            Write-Host ('CHAT '+(@{status=$r.web_search_status;error=$r.error_code;provider=$r.web_search_provider;sources=@($r.web_sources|Where-Object{$_}).Count;seconds=$r.seconds;model=$r.model;verification=$r.verification_scope}|ConvertTo-Json -Compress))
          }catch{
            $code=if($_.Exception.Response){[int]$_.Exception.Response.StatusCode}else{0}
            $err=$null
            try{$err=$_.ErrorDetails.Message|ConvertFrom-Json}catch{}
            Write-Host ('CHAT_FAILURE '+(@{http=$code;error=$err.error;error_code=$err.error_code;web_error=$err.web_search_error;web_status=$err.web_search_status}|ConvertTo-Json -Compress))
            throw 'Live chat probe did not complete'
          }
