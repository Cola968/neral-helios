name: NERAL V4.3 verified launcher CPU test and staging
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neral-v43-owner-live-diagnostic
  cancel-in-progress: false
jobs:
  stage:
    runs-on: [self-hosted, Windows, X64, neral-gpu]
    timeout-minutes: 5
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          path: v43-launcher-${{ github.run_id }}
          persist-credentials: false
      - name: CPU regression tests and copy only two new user-launchable files
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\NERAL-V43-Websearch'
          $src=Join-Path $env:GITHUB_WORKSPACE ('v43-launcher-'+$env:GITHUB_RUN_ID)
          $py='D:\neral-qlora\venv\Scripts\python.exe'
          $deps=Join-Path $root 'local_state/three-tier-web-deps'
          if(-not (Test-Path -LiteralPath (Join-Path $deps 'waitress/__init__.py'))){throw 'Missing isolated waitress'}
          if((& git -C $root rev-parse HEAD).Trim() -ne '1e86f52f73c2521d7591ac3d8d79c5dd78041508'){throw 'Unexpected local source head'}
          foreach($file in @('neral_preview_server.py','neral_three_tier_runtime.py','neral_v43_live_web.py','neral_web_search.py')){
            $actual=(& git -C $root hash-object -- $file).Trim()
            $expected=(& git -C $src rev-parse ('HEAD:'+$file)).Trim()
            if($actual -ne $expected){throw 'Local source differs from tested version'}
          }
          $env:PYTHONPATH=$src+';'+$deps
          $env:HF_HUB_OFFLINE='1'
          $env:TRANSFORMERS_OFFLINE='1'
          $env:HF_DATASETS_OFFLINE='1'
          $env:PYTHONDONTWRITEBYTECODE='1'
          Push-Location -LiteralPath $src
          try{
            & $py -B -m unittest discover -s tests -p test_neral_v43_verified_start.py -v
            if($LASTEXITCODE -ne 0){throw 'Launcher CPU regression failed; no files copied'}
          }finally{Pop-Location}
          foreach($file in @('neral_v43_verified_start.py','Start NERAL V4.3 Web.cmd')){
            $from=Join-Path $src $file
            $to=Join-Path $root $file
            if(Test-Path -LiteralPath $to){
              if((Get-FileHash -LiteralPath $from).Hash -ne (Get-FileHash -LiteralPath $to).Hash){throw 'Existing destination differs; not overwritten'}
            }else{
              Copy-Item -LiteralPath $from -Destination $to -ErrorAction Stop
            }
            if((Get-FileHash -LiteralPath $from).Hash -ne (Get-FileHash -LiteralPath $to).Hash){throw 'Staged file integrity failure'}
            Write-Host ('STAGED '+$file)
          }
          Write-Host 'NERAL_V43_LAUNCHER_READY_NO_PROCESS_CHANGES'
