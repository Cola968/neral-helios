name: NERAL final news feed fallback CPU and real public acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neral-v43-owner-live-diagnostic
  cancel-in-progress: false
jobs:
  verify:
    runs-on: [self-hosted, Windows, X64, neral-gpu]
    timeout-minutes: 7
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          path: v43-final-${{ github.run_id }}
          persist-credentials: false
      - name: Run CPU tests and actual public news requests
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:GITHUB_WORKSPACE ('v43-final-'+$env:GITHUB_RUN_ID)
          $py='D:\neral-qlora\venv\Scripts\python.exe'
          $env:PYTHONDONTWRITEBYTECODE='1'
          $env:PYTHONPATH=$src
          Push-Location -LiteralPath $src
          try{
            foreach($test in @('test_neral_feed_fallback.py','test_neral_official_news.py','test_neral_fresh_news_evidence.py','test_neral_airport_relevance.py','test_neral_web_search.py','test_neral_v43_verified_start.py')){
              & $py -B -m unittest discover -s tests -p $test -v
              if($LASTEXITCODE -ne 0){throw ('CPU regression failed '+$test)}
            }
            $testDeps=Join-Path $env:RUNNER_TEMP ('neral-final-tests-'+$env:GITHUB_RUN_ID)
            & $py -B -m pip install --disable-pip-version-check --no-input --target $testDeps 'pytest==8.3.5'
            if($LASTEXITCODE -ne 0){throw 'Isolated test dependency setup failed'}
            $env:PYTHONPATH=$src+';'+$testDeps
            & $py -B -m pytest -q tests/test_neral_v43_live_web_cpu.py tests/test_neral_web_v4_cpu.py
            if($LASTEXITCODE -ne 0){throw 'Web regressions failed'}
            & node --check static/neral-preview.js
            if($LASTEXITCODE -ne 0){throw 'Frontend syntax failed'}
            $code=@'
          import json,time
          from unittest.mock import Mock
          from neral_v43_verified_start import build_verified_app
          from neral_three_tier_runtime import LUNA,RAW_9B
          from neral_agent_autonomy import OllamaLocalBackend
          from neral_v43_live_web import search_live_sources
          from neral_web_search import WebSearch
          rt,app=build_verified_app(OllamaLocalBackend("qwen3:8b"),Mock(model=LUNA,adapter_sha256=None,loaded=True),Mock(model=RAW_9B,adapter_sha256=None,loaded=True),execute_python=Mock())
          for q in ("Welche aktuellen Nachrichten gibt es zum Flughafen BER?","Was gibt es Neues am Flughafen MUC?"):
              start=time.monotonic()
              with app.test_client() as c:
                  base="http://127.0.0.1:9690"
                  c.get("/",base_url=base)
                  csrf=c.get("/api/neral/preview/session",base_url=base).json["csrf"]
                  r=c.post("/api/neral/chat/three-tier",base_url=base,headers={"X-Neral-CSRF":csrf},json={"tier":"Quartz","prompt":q,"history":[],"force_sandbox":False})
                  data=r.get_json()
                  print("LIVE_HTTP "+json.dumps({"query":q,"http":r.status_code,"status":data.get("web_search_status"),"sources":data.get("web_sources",[]),"model_generated":data.get("model_generated"),"seconds":round(time.monotonic()-start,3)},ensure_ascii=True),flush=True)
                  assert r.status_code==200 and data.get("web_search_status")=="headlines_only" and data["web_sources"] and data["model_generated"] is False
          result=search_live_sources(WebSearch(),"In welchem Jahr landete Apollo 11 auf dem Mond?")
          print("FACT_LIVE "+json.dumps({"status":result["status"],"sources":result["sources"]},ensure_ascii=True),flush=True)
          assert result["status"]=="ok" and any(x.get("page_read") for x in result["sources"])
          '@
            $code | & $py -B -
            if($LASTEXITCODE -ne 0){throw 'Actual public search acceptance failed'}
          }finally{Pop-Location}
      - name: Stage accepted candidate into new independent local directory
        run: |
          $ErrorActionPreference='Stop'
          $old='C:\NERAL-V43-Websearch'
          $dest='C:\NERAL-V43-Final'
          $src=Join-Path $env:GITHUB_WORKSPACE ('v43-final-'+$env:GITHUB_RUN_ID)
          $expected=(& git -C $src rev-parse HEAD).Trim()
          if($expected -ne $env:GITHUB_SHA){throw 'Unexpected candidate commit'}
          if((& git -C $old rev-parse HEAD).Trim() -ne '1e86f52f73c2521d7591ac3d8d79c5dd78041508'){throw 'Original source changed'}
          $deps=Join-Path $old 'local_state/three-tier-web-deps'
          if(-not(Test-Path -LiteralPath (Join-Path $deps 'waitress/__init__.py'))){throw 'Isolated waitress missing'}
          if(Test-Path -LiteralPath $dest){throw 'Final destination already exists; preserve it'}
          & git -C $old fetch --no-tags $src $expected
          if($LASTEXITCODE -ne 0){throw 'Source transfer failed'}
          & git -C $old worktree add --detach $dest $expected
          if($LASTEXITCODE -ne 0){throw 'Final worktree creation failed'}
          if((& git -C $dest rev-parse HEAD).Trim() -ne $expected){throw 'Final source identity mismatch'}
          $local=Join-Path $dest 'local_state'
          New-Item -ItemType Directory -Path $local -Force | Out-Null
          $newDeps=Join-Path $local 'three-tier-web-deps'
          Copy-Item -LiteralPath $deps -Destination $newDeps -Recurse
          if(-not(Test-Path -LiteralPath (Join-Path $newDeps 'waitress/__init__.py'))){throw 'Final dependency missing'}
          $env:PYTHONPATH=$dest+';'+$newDeps
          $env:PYTHONDONTWRITEBYTECODE='1'
          Push-Location -LiteralPath $dest
          try{
            & 'D:\neral-qlora\venv\Scripts\python.exe' -B -m unittest discover -s tests -p test_neral_v43_verified_start.py -v
            if($LASTEXITCODE -ne 0){throw 'Local staged boot contract failed'}
            Write-Host ('FINAL_STAGED_HEAD '+$expected)
            Write-Host 'FINAL_STARTER C:\NERAL-V43-Final\Start NERAL V4.3 Web.cmd'
          }finally{Pop-Location}
          try{
            $h=Invoke-RestMethod 'http://127.0.0.1:9690/health' -TimeoutSec 5
            Write-Host ('EXISTING_SERVICE '+($h|ConvertTo-Json -Compress -Depth 5))
          }catch{Write-Host 'EXISTING_SERVICE_UNREACHABLE'}
          Write-Host 'NO_ACTIVE_PROCESS_OR_MODEL_CHANGES'

