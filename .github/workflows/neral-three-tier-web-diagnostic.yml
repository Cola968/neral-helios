name: NERAL cross-topic discovery regression and live probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neral-v43-owner-live-diagnostic
  cancel-in-progress: false
jobs:
  verify:
    runs-on: [self-hosted, Windows, X64, neral-gpu]
    timeout-minutes: 8
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          path: v43-general-${{ github.run_id }}
          persist-credentials: false
      - name: Run cross-topic publisher contract
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:GITHUB_WORKSPACE ('v43-general-'+$env:GITHUB_RUN_ID)
          $env:PYTHONPATH=$src
          $env:PYTHONDONTWRITEBYTECODE='1'
          Push-Location -LiteralPath $src
          try{
            & 'D:\neral-qlora\venv\Scripts\python.exe' -B -m unittest discover -s tests -p test_neral_general_relevance.py -v
            if($LASTEXITCODE -ne 0){throw 'General relevance regression failed'}
            & 'D:\neral-qlora\venv\Scripts\python.exe' -B -m unittest discover -s tests -p test_neral_generic_news_discovery.py -v
            if($LASTEXITCODE -ne 0){throw 'Generic source discovery regression failed'}
            $py='D:\neral-qlora\venv\Scripts\python.exe'
            foreach($test in @('test_neral_news_articles.py','test_neral_feed_fallback.py','test_neral_official_news.py','test_neral_fresh_news_evidence.py','test_neral_airport_relevance.py','test_neral_web_search.py','test_neral_v43_verified_start.py')){
              & $py -B -m unittest discover -s tests -p $test -v
              if($LASTEXITCODE -ne 0){throw ('Regression failed '+$test)}
            }
            $testDeps=Join-Path $env:RUNNER_TEMP ('neral-general-tests-'+$env:GITHUB_RUN_ID)
            & $py -B -m pip install --disable-pip-version-check --no-input --target $testDeps 'pytest==8.3.5'
            if($LASTEXITCODE -ne 0){throw 'Isolated test deps failed'}
            $env:PYTHONPATH=$src+';'+$testDeps
            & $py -B -m pytest -q tests/test_neral_v43_live_web_cpu.py tests/test_neral_web_v4_cpu.py tests/test_neral_v43_reference50_live_cpu.py
            if($LASTEXITCODE -ne 0){throw 'Web or benchmark isolation failed'}
            $code=@'
          import json,time
          from neral_web_search import WebSearch
          from neral_v43_live_web import search_live_sources,route_live_query
          cases=(
              ("aviation","Welche aktuellen Nachrichten gibt es zum Flughafen BER?"),
              ("aviation_2","Was gibt es Neues am Flughafen MUC?"),
              ("space","Welche aktuellen Nachrichten gibt es zur NASA Artemis Mission?"),
              ("technology","Welche aktuellen Nachrichten gibt es zu künstlicher Intelligenz?"),
              ("politics","Welche aktuellen Nachrichten gibt es zum Deutschen Bundestag?"),
              ("sport","Welche aktuellen Nachrichten gibt es zur Fußball Bundesliga?"),
              ("fact","In welchem Jahr landete Apollo 11 auf dem Mond?"),
              ("software","Welche Version von Python ist aktuell?"),
              ("weather","Wie ist das Wetter morgen in Berlin?"),
          )
          for category,q in cases:
              start=time.monotonic()
              routed=route_live_query(q)
              result=search_live_sources(WebSearch(),routed) if routed else {"status":"not_routed","sources":[]}
              print("GENERAL_LIVE "+json.dumps({"category":category,"status":result["status"],"read_pages":sum(x.get("page_read") is True for x in result["sources"]),"full_articles":sum(x.get("page_read") is True and x.get("article_chars",0)>=240 and not x.get("article_truncated") for x in result["sources"]),"sources":[{"title":x.get("title"),"page_read":x.get("page_read"),"article_chars":x.get("article_chars")} for x in result["sources"]],"seconds":round(time.monotonic()-start,3),"benchmark_blocked":route_live_query(q,benchmark=True) is None},ensure_ascii=True),flush=True)
          '@
            $code | & $py -B -
            if($LASTEXITCODE -ne 0){throw 'General live probe crashed'}
          }finally{Pop-Location}
