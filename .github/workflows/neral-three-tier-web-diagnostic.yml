name: NERAL cross-topic discovery regression and live probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neral-v43-owner-live-diagnostic
  cancel-in-progress: false
jobs:
  verify:
    runs-on: [self-hosted, Windows, X64, neral-gpu]
    timeout-minutes: 8
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          path: v43-general-${{ github.run_id }}
          persist-credentials: false
      - name: Run cross-topic publisher contract
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:GITHUB_WORKSPACE ('v43-general-'+$env:GITHUB_RUN_ID)
          $env:PYTHONPATH=$src
          $env:PYTHONDONTWRITEBYTECODE='1'
          Push-Location -LiteralPath $src
          try{
            & 'D:\neral-qlora\venv\Scripts\python.exe' -B -m unittest discover -s tests -p test_neral_query_planning.py -v
            if($LASTEXITCODE -ne 0){throw 'Query planning regression failed'}
            & 'D:\neral-qlora\venv\Scripts\python.exe' -B -m unittest discover -s tests -p test_neral_public_news.py -v
            if($LASTEXITCODE -ne 0){throw 'Public news provider regression failed'}
            & node --test tests/test_neral_v43_history.cjs tests/test_neral_1_0_preview_history.cjs tests/test_neral_1_0_preview_cancel_v2.cjs tests/test_neral_three_tier_ui.cjs
            if($LASTEXITCODE -ne 0){throw 'Chat UI regression failed'}
            & 'D:\neral-qlora\venv\Scripts\python.exe' -B -m unittest discover -s tests -p test_neral_general_relevance.py -v
            if($LASTEXITCODE -ne 0){throw 'General relevance regression failed'}
            & 'D:\neral-qlora\venv\Scripts\python.exe' -B -m unittest discover -s tests -p test_neral_generic_news_discovery.py -v
            if($LASTEXITCODE -ne 0){throw 'Generic source discovery regression failed'}
            $py='D:\neral-qlora\venv\Scripts\python.exe'
            foreach($test in @('test_neral_news_articles.py','test_neral_feed_fallback.py','test_neral_official_news.py','test_neral_fresh_news_evidence.py','test_neral_airport_relevance.py','test_neral_web_search.py','test_neral_v43_verified_start.py')){
              & $py -B -m unittest discover -s tests -p $test -v
              if($LASTEXITCODE -ne 0){throw ('Regression failed '+$test)}
            }
            $testDeps=Join-Path $env:RUNNER_TEMP ('neral-general-tests-'+$env:GITHUB_RUN_ID)
            & $py -B -m pip install --disable-pip-version-check --no-input --target $testDeps 'pytest==8.3.5'
            if($LASTEXITCODE -ne 0){throw 'Isolated test deps failed'}
            $env:PYTHONPATH=$src+';'+$testDeps
            & $py -B -m pytest -q tests/test_neral_v43_live_web_cpu.py tests/test_neral_web_v4_cpu.py tests/test_neral_v43_reference50_live_cpu.py
            if($LASTEXITCODE -ne 0){throw 'Web or benchmark isolation failed'}
            & $py -B -m unittest discover -s tests -p test_neral_v43_live_probe.py -v
            if($LASTEXITCODE -ne 0){throw 'Live acceptance gate regression failed'}
            & $py -B -m scripts.neral_v43_live_probe
            if($LASTEXITCODE -ne 0){throw 'Cross-topic live evidence gate failed'}
          }finally{Pop-Location}
