name: NERAL 6-arm true same-prompt weight comparison (manual local GPU, read-only)
on:
  workflow_dispatch:
    inputs:
      authorize:
        type: string
        required: true
        description: 'Exact manual evaluation permit EVALUATE_NERAL_6ARM_PROMPT_PARITY_READONLY'
permissions:
  contents: read
concurrency:
  group: neral-qwen7b-r32-gpu-exclusive
  cancel-in-progress: false
jobs:
  sixarm:
    if: github.ref == 'refs/heads/main' && inputs.authorize == 'EVALUATE_NERAL_6ARM_PROMPT_PARITY_READONLY'
    runs-on: [self-hosted,windows,x64,neral-gpu]
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    env:
      HF_HUB_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      WANDB_DISABLED: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: control
          clean: true
          persist-credentials: false
      - name: CPU prove historic raw answers, source SHA, exact prompts and prepare new private comparison
        run: |
          $ErrorActionPreference='Stop'
          $control=Join-Path $env:GITHUB_WORKSPACE 'control'
          $py=Join-Path $env:USERPROFILE 'NERAL-QLoRA-Research\training-env-py312\Scripts\python.exe'
          $root=Join-Path $env:USERPROFILE 'NERAL-QLoRA-Research'
          $prior=Join-Path $root 'v61-new-dev72-42413414400-1'
          $out=Join-Path $root "sixarm-parity-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if(-not(Test-Path -LiteralPath $py -PathType Leaf) -or
             -not(Test-Path -LiteralPath $prior -PathType Container) -or
             (Test-Path -LiteralPath $out)){throw 'Original sealed 72-case raw source missing or output already present'}
          Push-Location $control
          try{
            $env:PYTHONPATH=$control
            & $py -B -m unittest discover -s tests -p test_neral_six_arm_gpu.py -v
            if($LASTEXITCODE -ne 0){throw 'Six-arm GPU/reuse contract failed'}
            & $py -B -m unittest discover -s tests -p test_neral_six_arm_eval.py -v
            if($LASTEXITCODE -ne 0){throw 'Matched prompt conditions CPU contract failed'}
            & $py -B -m scripts.neral_six_arm_gpu --mode build --prior-dir $prior --run-dir $out
            if($LASTEXITCODE -ne 0){throw 'Original three-arm results do not match pinned raw; fail closed'}
          } finally {Pop-Location}
          [IO.File]::AppendAllText($env:GITHUB_ENV,
            "SIX_CONTROL=$control"+[Environment]::NewLine+
            "SIX_PY=$py"+[Environment]::NewLine+
            "SIX_FOLDER=$out"+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))
      - name: CPU verify immutable v5 and v6.1 local adapter receipts before GPU usage
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:USERPROFILE 'NERAL-QLoRA-Research'
          $base=Join-Path $env:USERPROFILE '.cache\neral\qwen25-smoke\c03e6d358207e414f1eca0bb1891e29f1db0e242\installed_models\hf-qwen25-coder-7b'
          $v5=Join-Path $root 'v5-r16-480-42378021782-1\adapter'
          $v61=Join-Path $root 'v61-replay-120-42411765250-1\candidate-adapter'
          $receipt=Join-Path $root 'v61-replay-120-42411765250-1\scalar-private.json'
          if(-not(Test-Path -LiteralPath $base -PathType Container) -or
             -not(Test-Path -LiteralPath $v5 -PathType Container) -or
             -not(Test-Path -LiteralPath $v61 -PathType Container) -or
             -not(Test-Path -LiteralPath $receipt -PathType Leaf)){
            throw 'Pinned base or original v5/v61 weights absent'
          }
          Push-Location $env:SIX_CONTROL
          try {
            $env:PYTHONPATH=$env:SIX_CONTROL
            & $env:SIX_PY -B -m scripts.neral_v61_new_dev_eval --mode verify --run-dir $env:SIX_FOLDER --candidate-receipt $receipt --candidate-adapter $v61 --v5-adapter $v5
            if($LASTEXITCODE -ne 0){throw 'Adapter receipt/weights SHA mismatch'}
          } finally {Pop-Location}
          [IO.File]::AppendAllText($env:GITHUB_ENV,
            "SIX_BASE=$base"+[Environment]::NewLine+
            "SIX_V5=$v5"+[Environment]::NewLine+
            "SIX_V61=$v61"+[Environment]::NewLine+
            "SIX_RECEIPT=$receipt"+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))
      - name: GPU 1/3 - genuine Qwen ZERO-shot (missing arm)
        run: |
          $ErrorActionPreference='Stop'
          Push-Location $env:SIX_CONTROL
          try {
            $env:PYTHONPATH=$env:SIX_CONTROL
            & $env:SIX_PY -B -m scripts.neral_six_arm_gpu --mode run --arm qwen_zero --run-dir $env:SIX_FOLDER --base $env:SIX_BASE --v5 $env:SIX_V5 --v61 $env:SIX_V61 --receipt $env:SIX_RECEIPT --out (Join-Path $env:SIX_FOLDER 'qwen_zero.jsonl')
            if($LASTEXITCODE -ne 0){throw 'Qwen zero-shot inference incomplete'}
          } finally {Pop-Location}
      - name: GPU 2/3 - NERAL v5 THREE-shot (missing arm)
        run: |
          $ErrorActionPreference='Stop'
          Push-Location $env:SIX_CONTROL
          try {
            $env:PYTHONPATH=$env:SIX_CONTROL
            & $env:SIX_PY -B -m scripts.neral_six_arm_gpu --mode run --arm v5_three --run-dir $env:SIX_FOLDER --base $env:SIX_BASE --v5 $env:SIX_V5 --v61 $env:SIX_V61 --receipt $env:SIX_RECEIPT --out (Join-Path $env:SIX_FOLDER 'v5_three.jsonl')
            if($LASTEXITCODE -ne 0){throw 'v5 three-shot inference incomplete'}
          } finally {Pop-Location}
      - name: GPU 3/3 - NERAL v6.1 THREE-shot (missing arm)
        run: |
          $ErrorActionPreference='Stop'
          Push-Location $env:SIX_CONTROL
          try {
            $env:PYTHONPATH=$env:SIX_CONTROL
            & $env:SIX_PY -B -m scripts.neral_six_arm_gpu --mode run --arm v61_three --run-dir $env:SIX_FOLDER --base $env:SIX_BASE --v5 $env:SIX_V5 --v61 $env:SIX_V61 --receipt $env:SIX_RECEIPT --out (Join-Path $env:SIX_FOLDER 'v61_three.jsonl')
            if($LASTEXITCODE -ne 0){throw 'v61 three-shot inference incomplete'}
          } finally {Pop-Location}
      - name: CPU six-arm same-input paired scoring; no adapter or release promotion
        run: |
          $ErrorActionPreference='Stop'
          Push-Location $env:SIX_CONTROL
          try {
            $env:PYTHONPATH=$env:SIX_CONTROL
            & $env:SIX_PY -B -m scripts.neral_six_arm_gpu --mode combine --run-dir $env:SIX_FOLDER
            if($LASTEXITCODE -ne 0){throw 'Prompt parity paired comparison invalid'}
          } finally {Pop-Location}
          $summary=Get-Content -LiteralPath (Join-Path $env:SIX_FOLDER 'sixarm-summary.json') -Raw|ConvertFrom-Json
          if($summary.status -ne 'NERAL_6ARM_PROMPT_MATCHED_REUSED_DEV72_DIAGNOSTIC' -or
             $summary.historical_dev72_reused -ne $true -or
             $summary.release_validated -ne $false -or
             $summary.adapter_promoted -ne $false -or
             $summary.weight_superiority_proven -ne $false -or
             $summary.scores.qwen_zero.total -ne 72 -or
             $summary.scores.v61_three.total -ne 72){
            throw 'Reject incomplete or falsely-promoted six-arm benchmark report'
          }
          $public=Join-Path $env:SIX_CONTROL 'sixarm_scalar'
          if(Test-Path -LiteralPath $public){throw 'Do not overwrite previous scalar'}
          New-Item -ItemType Directory -Path $public -ErrorAction Stop|Out-Null
          Copy-Item -LiteralPath (Join-Path $env:SIX_FOLDER 'sixarm-summary.json') -Destination (Join-Path $public 'summary.json')
          Write-Host 'NERAL_6ARM_PROMPT_MATCHED_DIAGNOSTIC_COMPLETED: raw outputs private'
      - name: Upload only six-arm scalar diagnostic (no raw answers or adapter weights)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: neral-six-arm-matched-prompts-scalar
          path: control/sixarm_scalar/summary.json
          if-no-files-found: error
          retention-days: 14
