name: Phoenix guarded chat preview CPU once (NO GPU / NO TRAINING)

on:
  push:
    branches: [experiment/phoenix-sft-fp32-audit]
    paths: ['.github/workflows/phoenix-guarded-preview-cpu-once.yml']

permissions:
  contents: read

concurrency:
  group: neral-nextgen-local-gpu-training
  cancel-in-progress: false

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guarded decoder, CPU metadata and diagnostic contracts (no model files)
        working-directory: frontier350/nextgen_v1
        run: |
          python3 -m unittest -v test_helios_guarded_preview test_helios_guarded_diagnostic test_phoenix_continuity_cpu_probe
          python3 -m py_compile helios_guarded_preview.py helios_guarded_diagnostic.py
  real-public-fixture-cpu:
    needs: synthetic-tests
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - name: Reuse isolated exact-commit checkout without creating permanent run-ID copies
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: phoenix_guarded_preview_source
          persist-credentials: false
          clean: true
      - name: CPU-only guarded inference on 8 PUBLIC development prompts; counts only
        run: |
          $ErrorActionPreference = 'Stop'
          function ToWsl([string]$p) {
            $f = [IO.Path]::GetFullPath($p)
            if ($f -notmatch '^([A-Za-z]):\\(.*)$') { throw 'Absolute Windows path required' }
            return '/mnt/' + $matches[1].ToLowerInvariant() + '/' + $matches[2].Replace('\','/')
          }
          $repo = Join-Path $env:GITHUB_WORKSPACE 'phoenix_guarded_preview_source'
          $assets = if ($env:NERAL_ASSETS_ROOT) { $env:NERAL_ASSETS_ROOT } else { Join-Path $env:USERPROFILE 'Documents\Codex\2026-09-05\lo\outputs\neral' }
          $checkpoint = 'D:\NeralScaleV81\_continuity_v5\continuity_002073161216_f7a73e283421.pt'
          if (-not (Test-Path -LiteralPath $assets -PathType Container) -or -not (Test-Path -LiteralPath $checkpoint -PathType Leaf)) { throw 'Missing private tokenizer assets or pinned checkpoint' }
          if ((Get-PSDrive -Name C).Free -lt 30GB -or (Get-PSDrive -Name D).Free -lt 200GB) { throw 'Disk reserve failed, refusing CPU inference' }
          $digest = (Get-FileHash -LiteralPath $checkpoint -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne 'f7a73e283421975acc34e13afc38378be4eab11da34e8e6b46fc7cb0cda883e7') { throw 'Checkpoint SHA mismatch; refuse model load' }
          foreach ($p in @($repo, $assets, $checkpoint)) { if ($p.Contains("'")) { throw 'Unsafe WSL shell path' } }
          $cmd = "set -euo pipefail; export CUDA_VISIBLE_DEVICES=-1 PYTHONDONTWRITEBYTECODE=1; cd '$(ToWsl $repo)'; ~/.venvs/neral-triton-py312/bin/python -u frontier350/nextgen_v1/helios_guarded_diagnostic.py --execute --trusted-local-checkpoint --assets-root '$(ToWsl $assets)' --checkpoint '$(ToWsl $checkpoint)' --budget 32"
          & wsl.exe -- bash -lc $cmd
          if ($LASTEXITCODE -ne 0) { throw 'Guarded CPU diagnostic blocked or failed; do not claim successful rollout' }
          Write-Host 'Finished public-fixture guarded CPU health only. No private text or weights uploaded; no GPU, training, candidate model or quality claim.'
