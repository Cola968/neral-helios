name: NERAL V4.4 two-port and GPU read-only inspection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 4
    defaults:
      run:
        shell: powershell
    steps:
      - name: Inspect NERAL listeners and GPU without modifying services
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -cne 'W39-GAMINGPC-Neral'){throw 'WRONG_RUNNER'}
          $gpu=@(& nvidia-smi.exe --query-gpu=name,memory.total,memory.free,memory.used --format=csv,noheader,nounits)
          if($LASTEXITCODE -ne 0){throw 'GPU_QUERY_FAILED'}
          Write-Host ('V44_GPU '+($gpu -join '; '))
          $compute=@(& nvidia-smi.exe --query-compute-apps=pid,used_gpu_memory --format=csv,noheader,nounits)
          if($LASTEXITCODE -eq 0){
            foreach($row in $compute){
              if($row -match '^\s*(\d+)\s*,\s*(\d+|\[N/A\]|N/A)\s*$'){
                $id=[int]$Matches[1];$mem=$Matches[2]
                $p=Get-Process -Id $id -ErrorAction SilentlyContinue
                $name=if($p -and $p.ProcessName -match '^[A-Za-z0-9_.-]{1,100}$'){$p.ProcessName}else{'unknown'}
                Write-Host ('V44_GPU_PROCESS '+(@{pid=$id;name=$name;used_mib=$mem}|ConvertTo-Json -Compress))
              }
            }
          }
          foreach($port in @(9690,9692)){
            $listeners=@(Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue)
            $owners=@()
            foreach($id in @($listeners|Select-Object -ExpandProperty OwningProcess -Unique)){
              $p=Get-Process -Id $id -ErrorAction SilentlyContinue
              $proc=Get-CimInstance Win32_Process -Filter ('ProcessId = '+[int]$id) -ErrorAction SilentlyContinue
              $line=if($proc){[string]$proc.CommandLine}else{''}
              $owners+=@{pid=$id;name=if($p -and $p.ProcessName -match '^[A-Za-z0-9_.-]{1,100}$'){$p.ProcessName}else{'unknown'};preview=($line -match 'neral_preview_server|neral_v43_verified_start');v43_flag=($line -match 'v43')}
            }
            $http=0;$v43=$null;$web=$null
            try{
              $base='http://127.0.0.1:'+$port
              $resp=Invoke-WebRequest -Uri ($base+'/health') -UseBasicParsing -TimeoutSec 5
              $http=[int]$resp.StatusCode
              $h=$resp.Content|ConvertFrom-Json
              $web=$h.web_search.live_enabled
              $session=New-Object Microsoft.PowerShell.Commands.WebRequestSession
              Invoke-WebRequest ($base+'/') -UseBasicParsing -WebSession $session -TimeoutSec 5|Out-Null
              $profile=Invoke-RestMethod ($base+'/api/neral/chat/three-tier/status') -WebSession $session -TimeoutSec 5
              $v43=$profile.v43_profile;$web=$profile.web_search.live_enabled
            }catch{}
            Write-Host ('V44_PORT '+(@{port=$port;http=$http;v43=$v43;live_web=$web;owners=$owners;listeners=$listeners.Count}|ConvertTo-Json -Compress -Depth 5))
          }
          $task=Get-ScheduledTask -TaskName 'NERAL-PR558-ThreeTier-909d1419c9ff' -ErrorAction SilentlyContinue
          Write-Host ('V44_ORIGINAL_TASK '+(@{exists=($null -ne $task);state=if($task){[string]$task.State}else{'missing'}}|ConvertTo-Json -Compress))
          Write-Host 'READ_ONLY_NO_SERVICE_PROCESS_TASK_CHANGES'
