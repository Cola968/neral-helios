name: NERAL PR558 read-only localhost listener identity diagnostics
on:
  push:
    branches: [feat/neral-three-tier-local-live-20261117]
    paths: ['.github/workflows/neral-three-tier-port-owner-readonly.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  port-owner-readonly:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 6
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect only the loopback listener, no process stop or model load
        run: |
          $ErrorActionPreference='Stop'
          $task=Get-ScheduledTask -TaskName 'NERAL-PR558-ThreeTier-909d1419c9ff' -ErrorAction SilentlyContinue
          $listen=@(Get-NetTCPConnection -LocalAddress '127.0.0.1' -LocalPort 9690 -State Listen -ErrorAction SilentlyContinue)
          $out=@{task_present=($null -ne $task);task_running=($null -ne $task -and [string]$task.State -eq 'Running');listeners=$listen.Count}
          $uniquePids=@($listen | Select-Object -ExpandProperty OwningProcess -Unique)
          $out['unique_owner_count']=$uniquePids.Count
          $out['owners']=@()
          $expectedPath=[IO.Path]::GetFullPath('D:/neral-qlora/venv/Scripts/python.exe')
          foreach($listenPid in $uniquePids){
            $proc=Get-CimInstance Win32_Process -Filter ("ProcessId = "+[int]$listenPid) -ErrorAction SilentlyContinue
            $line=if($null -ne $proc){[string]$proc.CommandLine}else{''}
            $entry=@{
              is_python=($null -ne $proc -and [string]$proc.Name -match '(?i)^pythonw?\.exe$')
              has_three_tier=($line -match '(?i)--experimental-three-tier-hf')
              has_preview=($line -match '(?i)-m\s+neral_preview_server')
              has_helios=($line -match '(?i)--helios-v2-full')
              exact_python_exe=($null -ne $proc -and [string]::Equals([IO.Path]::GetFullPath([string]$proc.ExecutablePath),$expectedPath,[StringComparison]::OrdinalIgnoreCase))
            }
            if($null -ne $proc){
              $parent=Get-CimInstance Win32_Process -Filter ("ProcessId = "+[int]$proc.ParentProcessId) -ErrorAction SilentlyContinue
              $entry['parent_name']=if($null -ne $parent){[string]$parent.Name}else{'not_running'}
              $entry['parent_has_server_flags']=($null -ne $parent -and [string]$parent.CommandLine -match '(?i)--experimental-three-tier-hf')
              if($null -ne $parent -and [int]$parent.ParentProcessId -gt 0){
                $grandparent=Get-CimInstance Win32_Process -Filter ("ProcessId = "+[int]$parent.ParentProcessId) -ErrorAction SilentlyContinue
                $entry['grandparent_name']=if($null -ne $grandparent){[string]$grandparent.Name}else{'not_running'}
                $entry['grandparent_managed_script']=($null -ne $grandparent -and [string]$grandparent.CommandLine -like '*Start-Neral-Three-Tier-Service.ps1*')
              }
              $entry['executable_same_binary_as_venv']=((Test-Path -LiteralPath ([string]$proc.ExecutablePath) -PathType Leaf) -and
                ((Get-FileHash -LiteralPath $proc.ExecutablePath -Algorithm SHA256).Hash -eq
                 (Get-FileHash -LiteralPath $expectedPath -Algorithm SHA256).Hash))
            }
            $out['owners']+=,$entry
          }
          Write-Host ('NERAL_PR558_PORT_OWNER_SAFE_FLAGS '+($out|ConvertTo-Json -Compress -Depth 5))
          Write-Host 'NERAL_PR558_READONLY_NO_PROCESS_TOUCHED'


      - name: Read-only post-failure owner HTTP and original-backup integrity flags
        run: |
          $ErrorActionPreference='Stop'
          $backup=Join-Path $env:LOCALAPPDATA 'neral-v41-backup-45199017715'
          $root=Join-Path $env:LOCALAPPDATA 'NERAL/three-tier-pr558-909d1419c9ff/NERAL-1.0-Local'
          $files=@('neral_v41_context.py','neral_verified_notes.py',
            'neral_evidence_agent.py','neral_obsidian_deep.py','neral_local_wiki.py',
            'neral_v42_deadline.py','neral_v42_telemetry.py','neral_v42_quality.py',
            'neral_three_tier_runtime.py','neral_preview_server.py',
            'templates/neral_preview.html','static/neral-preview.js','static/neral-reference-ui.js')
          $backupPresent=Test-Path -LiteralPath $backup -PathType Container
          $checked=0
          $mismatches=0
          if($backupPresent){
            foreach($path in $files){
              $src=Join-Path $backup $path
              $dst=Join-Path $root $path
              if(Test-Path -LiteralPath $src -PathType Leaf){
                $checked++
                if(-not(Test-Path -LiteralPath $dst -PathType Leaf)){
                  $mismatches++
                }elseif((Get-FileHash -LiteralPath $src -Algorithm SHA256).Hash -ne
                         (Get-FileHash -LiteralPath $dst -Algorithm SHA256).Hash){
                  $mismatches++
                }
              }
            }
          }
          $http=(& curl.exe --noproxy '*' --silent --connect-timeout 2 --max-time 5 --output NUL --write-out '%{http_code}' 'http://127.0.0.1:9690/' 2>$null) -join ''
          Write-Host ('NERAL_DIAG3_READONLY_POSTFAIL_FLAGS backup_present='+$backupPresent+
            ' compared_files='+$checked+' mismatches='+$mismatches+
            ' http200='+($http.Trim() -eq '200'))
          Write-Host 'NERAL_DIAG3_READONLY_NO_FILE_OR_PROCESS_MUTATION'
          $global:LASTEXITCODE=0


      - name: Classify NERAL startup fault from known service stderr without printing logs
        run: |
          $ErrorActionPreference='Stop'
          $task=Get-ScheduledTask -TaskName 'NERAL-PR558-ThreeTier-909d1419c9ff' -ErrorAction Stop
          $info=Get-ScheduledTaskInfo -TaskName 'NERAL-PR558-ThreeTier-909d1419c9ff' -ErrorAction Stop
          $root=Join-Path $env:LOCALAPPDATA 'NERAL/three-tier-pr558-909d1419c9ff/NERAL-1.0-Local'
          $logs=@(
            (Join-Path $root 'local_state/neral-three-tier-error.log'),
            (Join-Path $root 'local_state/neral-three-tier.log'))
          $codes=@()
          $found=0
          foreach($log in $logs){
            if(Test-Path -LiteralPath $log -PathType Leaf){
              $found++
              $tail=([string[]](Get-Content -LiteralPath $log -Tail 100 -ErrorAction SilentlyContinue)) -join ' '
              if($tail -match '(?i)(?:out of memory|cuda oom|cuda.*memory|gpu memory cap|insufficient free gpu)'){$codes+='gpu_memory'}
              if($tail -match '(?i)(?:module.?not.?found|cannot import|importerror)'){$codes+='import_failure'}
              if($tail -match '(?i)(?:snapshot.*missing|adapter.*mismatch|checkpoint.*missing|model.*not.*found)'){$codes+='model_path_or_hash'}
              if($tail -match '(?i)(?:no module named waitress|waitress.*missing)'){$codes+='web_dependency'}
              if($tail -match '(?i)(?:traceback|exception|error:)'){$codes+='python_exception'}
              if($tail -match '(?i)(?:port 9690.*belegt|address already in use|address.*in use)'){$codes+='port_conflict'}
            }
          }
          $gpu=@(& nvidia-smi.exe --query-gpu=memory.used,memory.free --format=csv,noheader,nounits 2>$null)
          $vramValid=($LASTEXITCODE -eq 0 -and $gpu.Count -eq 1 -and [string]$gpu[0] -match '^\s*(\d+)\s*,\s*(\d+)\s*$')
          $used=if($vramValid){[int]$Matches[1]}else{-1}
          $free=if($vramValid){[int]$Matches[2]}else{-1}
          Write-Host ('NERAL_DIAG3_READONLY_STARTUP_CLASS task_state='+[string]$task.State+
            ' task_last_result='+[int]$info.LastTaskResult+
            ' stderr_logs_present='+$found+
            ' error_classes='+((@($codes|Select-Object -Unique)) -join ',')+
            ' gpu_used_mib='+$used+' gpu_free_mib='+$free)
          $global:LASTEXITCODE=0


      - name: Read-only pinned launch script and bounded startup log classifier
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:LOCALAPPDATA 'NERAL/three-tier-pr558-909d1419c9ff/NERAL-1.0-Local'
          $service=Join-Path $root 'Start-Neral-Three-Tier-Service.ps1'
          $text=if(Test-Path -LiteralPath $service -PathType Leaf){[IO.File]::ReadAllText($service)}else{''}
          $candidates=@()
          foreach($dir in @($root,(Join-Path $root 'local_state'),(Join-Path $root 'logs'))){
            if(Test-Path -LiteralPath $dir -PathType Container){
              $candidates+=@(Get-ChildItem -LiteralPath $dir -File -ErrorAction SilentlyContinue |
                Where-Object {$_.Name -match '(?i)(error|stderr|startup|service|three-tier|preview).*\.log$' } |
                Select-Object -First 10)
            }
          }
          $candidates=@($candidates | Sort-Object FullName -Unique)
          $err=@()
          foreach($entry in $candidates){
            $raw=([string[]](Get-Content -LiteralPath $entry.FullName -Tail 160 -ErrorAction SilentlyContinue)) -join ' '
            if($raw -match '(?i)(?:out of memory|cuda.*memory|insufficient free gpu)'){$err+='gpu_memory'}
            if($raw -match '(?i)(?:module.?not.?found|cannot import|importerror)'){$err+='import_failure'}
            if($raw -match '(?i)(?:adapter.*mismatch|snapshot.*missing|checkpoint.*missing|model.*not.*found)'){$err+='model_or_adapter'}
            if($raw -match '(?i)(?:waitress.*missing|no module named waitress)'){$err+='waitress'}
            if($raw -match '(?i)(?:traceback|exception|error:)'){$err+='python_exception'}
            if($raw -match '(?i)(?:port.*9690.*used|address already in use)'){$err+='port_conflict'}
            if($raw -match '(?i)(?:No module named|FileNotFoundError|PermissionError)'){$err+='missing_file_or_permission'}
          }
          Write-Host ('NERAL_DIAG3_SERVICE_START_CLASS service_file_present='+($text.Length -gt 0)+
            ' invokes_python='+($text -match '(?i)(?:python|neral_preview_server)')+
            ' has_log_redirect='+($text -match '(?i)(?:RedirectStandardError|2>)')+
            ' selected_logs='+$candidates.Count+
            ' sanitized_errors='+((@($err|Select-Object -Unique)) -join ','))
          Write-Host 'NERAL_DIAG3_READONLY_NO_START_ATTEMPT'
          $global:LASTEXITCODE=0


      - name: NERAL_START_FORENSICS_20261123 exact task environment and bounded exception frames
        run: |
          $ErrorActionPreference='Stop'
          $name='NERAL-PR558-ThreeTier-909d1419c9ff'
          $root=Join-Path $env:LOCALAPPDATA 'NERAL/three-tier-pr558-909d1419c9ff/NERAL-1.0-Local'
          $script=Join-Path $root 'Start-Neral-Three-Tier-Service.ps1'
          $py='D:/neral-qlora/venv/Scripts/python.exe'
          $task=Get-ScheduledTask -TaskName $name -ErrorAction Stop
          $info=Get-ScheduledTaskInfo -TaskName $name -ErrorAction Stop
          $schtext=(& schtasks.exe /Query /TN $name /FO LIST /V 2>&1) -join ' '
          $global:LASTEXITCODE=0
          Write-Host ('NERAL_FORENSIC_TASK state='+[string]$task.State+
            ' last_result='+[int]$info.LastTaskResult+
            ' last_run='+$info.LastRunTime.ToString('s')+
            ' missed_runs='+[int]$info.NumberOfMissedRuns+
            ' task_principal_type='+[string]$task.Principal.LogonType+
            ' task_action_executable='+[IO.Path]::GetFileName([string]$task.Actions[0].Execute)+
            ' task_action_has_service='+([string]$task.Actions[0].Arguments -like '*Start-Neral-Three-Tier-Service.ps1*')+
            ' schtasks_query_ok='+($schtext.Length -gt 100))
          $serviceText=if(Test-Path -LiteralPath $script -PathType Leaf){[IO.File]::ReadAllText($script)}else{''}
          $pattern='(?im)^\s*[^#\r\n]*(Start-Process|RedirectStandard|Out-File|Add-Content|Start-ScheduledTask|python\.exe|neral_preview_server|Write-Error|Write-Host|exit|return)'
          $patterns=[regex]::Matches($serviceText,$pattern)
          $clues=@()
          foreach($m in $patterns){
            $lineNo=($serviceText.Substring(0,$m.Index).Split([char]10)).Count
            $command=[regex]::Match($m.Value,'(?i)Start-Process|RedirectStandard\w*|Out-File|Add-Content|Start-ScheduledTask|python\.exe|neral_preview_server|Write-Error|Write-Host|exit|return').Value
            $clues+=($lineNo.ToString()+':'+$command)
          }
          Write-Host ('NERAL_FORENSIC_SERVICE script_exists='+($serviceText.Length -gt 0)+
            ' length='+$serviceText.Length+
            ' line_clues='+(($clues|Select-Object -First 35) -join ','))
          $pyok=Test-Path -LiteralPath $py -PathType Leaf
          $deps=@{}
          foreach($d in @('D:/neral-qlora-v2/qwen35-4b-hf/config.json',
                          'D:/neral-qlora/checkpoint/config.json',
                          'D:/neral-qlora-v2/v2full-43931510428-1-helios/manifest.json',
                          (Join-Path $root 'neral_preview_server.py'),
                          (Join-Path $root 'neral_three_tier_runtime.py'))){
            $deps[[IO.Path]::GetFileName($d)+'_'+$deps.Count]=(Test-Path -LiteralPath $d -PathType Leaf)
          }
          $docker=(Get-Service -Name 'com.docker.service' -ErrorAction SilentlyContinue)
          $kiwix=@(Get-NetTCPConnection -LocalPort 9691 -State Listen -ErrorAction SilentlyContinue)
          $p9690=@(Get-NetTCPConnection -LocalPort 9690 -State Listen -ErrorAction SilentlyContinue)
          $pythonProcs=@(Get-CimInstance Win32_Process -Filter "Name = 'python.exe' OR Name = 'pythonw.exe'" -ErrorAction SilentlyContinue)
          $ours=@($pythonProcs|Where-Object { $_.CommandLine -match 'neral_preview_server' -and $_.CommandLine -match '--experimental-three-tier-hf' })
          $gpu=@(& nvidia-smi.exe --query-gpu=memory.used,memory.free --format=csv,noheader,nounits 2>$null)
          $global:LASTEXITCODE=0
          Write-Host ('NERAL_FORENSIC_ENV venv_python='+$pyok+
            ' local_files='+($deps|ConvertTo-Json -Compress)+
            ' docker_service='+$(if($docker){[string]$docker.Status}else{'absent'})+
            ' kiwix_9691='+$kiwix.Count+
            ' netstat_9690='+$p9690.Count+
            ' python_processes='+$pythonProcs.Count+' neral_python_processes='+$ours.Count+
            ' nvidia_smi_numeric='+($gpu -join ';'))
          $logs=@()
          foreach($dir in @($root,(Join-Path $root 'local_state'),
                  (Join-Path $root 'logs'),(Join-Path (Split-Path $root -Parent) 'local_state'))){
            if(Test-Path -LiteralPath $dir -PathType Container){
              $logs+=@(Get-ChildItem -LiteralPath $dir -File -ErrorAction SilentlyContinue |
                Where-Object {$_.Name -match '(?i)(neral|three|preview|startup|error|stdout|stderr|service).*\.(log|err|out|txt)$'} |
                Select-Object -First 20)
            }
          }
          $logs=@($logs|Sort-Object FullName -Unique)
          Write-Host ('NERAL_FORENSIC_LOG_DISCOVERY count='+$logs.Count+
            ' file_names='+(($logs|ForEach-Object {$_.Name}|Select-Object -First 25)-join ','))
          foreach($entry in $logs){
            $lines=@(Get-Content -LiteralPath $entry.FullName -Tail 120 -ErrorAction SilentlyContinue)
            $errors=@($lines|Where-Object { $_ -match '^(Traceback \(most recent call last\):|[A-Za-z_][\w.]*(Error|Exception):|.*(?:Fatal Python error|PYTHONPATH|CUDA out of memory).*)$' })
            $frames=@($lines|Where-Object { $_ -match '^\s*File "([^"]+)", line (\d+), in ([^\s]+)' }|Select-Object -Last 7|ForEach-Object {
              $m=[regex]::Match($_,'^\s*File "([^"]+)", line (\d+), in ([^\s]+)')
              ([IO.Path]::GetFileName($m.Groups[1].Value)+':'+$m.Groups[2].Value+':'+$m.Groups[3].Value)
            })
            $classes=@($errors|ForEach-Object {
              if($_ -match '^([A-Za-z_][\w.]*(?:Error|Exception)):\s*(.*)$'){
                $type=$Matches[1];$msg=$Matches[2]
                if($msg -match '(?i)No module named\s+[''"]?([\w.]+)'){ $type+':missing_module:'+$Matches[1] }
                elseif($msg -match '(?i)(out of memory|cuda|GPU memory)'){ $type+':cuda_or_memory' }
                elseif($msg -match '(?i)(cannot import name\s+[''"]?([\w]+))'){ $type+':import_name:'+$Matches[2] }
                elseif($msg -match '(?i)(WinError\s+\d+)'){ $type+':'+$Matches[1] }
                else {$type+':details_private'}
              }else{'traceback_or_fatal'}
            }|Select-Object -Unique -Last 8)
            Write-Host ('NERAL_FORENSIC_LOG name='+$entry.Name+' lastwrite='+$entry.LastWriteTime.ToString('s')+
              ' lines_examined='+$lines.Count+' classes='+(($classes)-join '|')+
              ' frames='+(($frames)-join '|'))
          }
          try{
            $ev=@(Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-TaskScheduler/Operational'; StartTime=(Get-Date).AddHours(-5)} -MaxEvents 250 -ErrorAction Stop |
              Where-Object {$_.Message -like ('*'+$name+'*')} | Select-Object -First 16)
            Write-Host ('NERAL_FORENSIC_TASK_EVENTS count='+$ev.Count+
              ' ids='+(($ev|ForEach-Object {([string]$_.Id+':'+$_.TimeCreated.ToString('HH:mm:ss'))})-join ','))
          }catch{
            Write-Host 'NERAL_FORENSIC_TASK_EVENTS unavailable'
          }
          $global:LASTEXITCODE=0
