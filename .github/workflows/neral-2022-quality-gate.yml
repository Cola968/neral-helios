name: NERAL 2022 quality gate (offline CPU)
on:
  pull_request:
    paths:
      - 'neral_2022_gate.py'
      - 'neral_2022_cases_v1.json'
      - 'tests/test_neral_2022_gate.py'
      - 'docs/NERAL_2022_QUALITY_GATE.md'
      - '.github/workflows/neral-2022-quality-gate.yml'
permissions:
  contents: read
jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline contracts (no Ollama and no weights)
        run: python -m unittest -v tests.test_neral_2022_gate
      - name: Plan never starts inference
        run: python -m neral_2022_gate --plan --cases neral_2022_cases_v1.json
      - name: Syntax
        run: python -m py_compile neral_2022_gate.py tests/test_neral_2022_gate.py
