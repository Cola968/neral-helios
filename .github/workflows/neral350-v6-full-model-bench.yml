name: Neral 350M V6 Full Model Benchmark

on:
  push:
    branches: [experiment/scale-v6]
    paths:
      - 'frontier350/v6_full_model_benchmark.py'
      - '.github/workflows/neral350-v6-full-model-bench.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neral-350m-scale-v4
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: Verify idle RTX 4070
        run: |
          $ErrorActionPreference='Stop'
          wsl.exe --shutdown; Start-Sleep -Seconds 3
          $gpu=(nvidia-smi --query-gpu=name --format=csv,noheader | Select-Object -First 1).Trim()
          $free=[int]((nvidia-smi --query-gpu=memory.free --format=csv,noheader,nounits | Select-Object -First 1).Trim())
          if($gpu -notmatch 'RTX 4070'){throw 'expected RTX 4070 runner'}
          if($free -lt 9000){throw ("GPU not idle enough for V6 benchmark; free MiB="+$free)}

      - name: Run isolated full-model benchmark
        run: |
          $ErrorActionPreference='Stop'
          $p=(Get-Location).Path
          $repo='/mnt/'+$p.Substring(0,1).ToLower()+'/'+$p.Substring(3).Replace('\','/')
          $cmd="set -e; cd '$repo'; export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True; ~/.venvs/neral-triton-py312/bin/python -m py_compile frontier350/v6_full_model_benchmark.py frontier350/v6_chunked_frozen_head_ce.py; ~/.venvs/neral-triton-py312/bin/python -u frontier350/v6_full_model_benchmark.py --out frontier350_v6_full_model_bench/report.json --seq 512 --batches 24,16,8,4 --warmup 1 --measured 3"
          wsl.exe -- bash -lc $cmd
          $code=$LASTEXITCODE
          wsl.exe --shutdown; Start-Sleep -Seconds 3
          if($code -ne 0){throw 'V6 full-model benchmark failed'}

      - name: Print benchmark
        if: always()
        run: |
          if(Test-Path frontier350_v6_full_model_bench/report.json){Get-Content frontier350_v6_full_model_bench/report.json -Raw | Write-Host}
          nvidia-smi --query-gpu=name,temperature.gpu,memory.used,memory.total --format=csv,noheader

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neral350-v6-full-model-bench-${{ github.run_id }}
          path: frontier350_v6_full_model_bench/
          retention-days: 30
