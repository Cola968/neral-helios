name: NERAL real Qwen loopback E2E (one-shot, authorized 2026-11-01)
# Exactly one opt-in push. Not cron, pull_request or workflow_dispatch.
on:
  push:
    branches:
      - probe/neral-qwen-local-e2e-once-20261101
    paths:
      - gpu_requests/qwen_e2e_readonly_20261101.trigger

permissions:
  contents: read

concurrency:
  group: neral-qwen-e2e-readonly-once-20261101
  cancel-in-progress: false

jobs:
  live-qwen-readonly:
    if: "github.event.head_commit.message == 'request approved one-off Qwen E2E synthetic read-only'"
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 12
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - name: Checkout immutable approved probe branch without deleting local assets
        uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - name: Locate existing local NERAL Python (do not install software)
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @()
          if ($env:NERAL_PYTHON) { $candidates += $env:NERAL_PYTHON }
          if ($env:NERAL_ASSETS_ROOT) { $candidates += (Join-Path $env:NERAL_ASSETS_ROOT '.venv\Scripts\python.exe') }
          $candidates += (Join-Path $env:USERPROFILE 'Documents\Codex\2026-09-05\lo\outputs\neral\.venv\Scripts\python.exe')
          $py = $candidates | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) } | Select-Object -First 1
          if (-not $py) { throw 'Existing NERAL virtualenv Python is unavailable; nothing installed' }
          & $py -c "import flask, torch; assert torch.__version__; print('PREFLIGHT_EXISTING_DEPENDENCIES_OK')"
          if ($LASTEXITCODE -ne 0) { throw 'Existing dependencies missing; downloads forbidden' }
          "NERAL_PROBE_PYTHON=$py" >> $env:GITHUB_ENV
      - name: Read-only GPU availability status (no model modification)
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:NERAL_PROBE_PYTHON" -c "from neral_qwen_live_probe import _localhost_json,verify_installed_model; assert verify_installed_model(_localhost_json('/api/tags')); print('LOCAL_QWEN_PREINSTALLED_AND_OLLAMA_AVAILABLE')"
          if ($LASTEXITCODE -ne 0) { throw 'Ollama not running or exact model not installed; no downloads attempted' }
          $idleReadings = 0
          for ($attempt = 0; $attempt -lt 12; $attempt++) {
            $gpu = & nvidia-smi --query-gpu=memory.total,memory.free,utilization.gpu --format=csv,noheader,nounits 2>$null
            if ($LASTEXITCODE -ne 0 -or -not $gpu) { throw 'GPU unavailable; no inference attempted' }
            $parts = ($gpu | Select-Object -First 1) -split ','
            if ($parts.Count -lt 3) { throw 'Invalid GPU status; no inference attempted' }
            $free = [int]($parts[1].Trim())
            $busy = [int]($parts[2].Trim())
            Write-Host ("GPU_PREFLIGHT_READING free_vram_mb={0} utilization_pct={1}" -f $free,$busy)
            if ($free -ge 8192 -and $busy -le 35) { $idleReadings += 1 } else { $idleReadings = 0 }
            if ($idleReadings -ge 2) { break }
            if ($attempt -lt 11) { Start-Sleep -Seconds 15 }
          }
          if ($idleReadings -lt 2) { throw 'GPU remains active after bounded wait; no model inference attempted' }
          Write-Host 'GPU_PREFLIGHT_OK (two consecutive low-utilization samples and >=8 GiB free)'
      - name: Offline dry-run (must perform no inference)
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          & "$env:NERAL_PROBE_PYTHON" -X utf8 neral_qwen_live_probe.py --plan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real Flask-to-local-Qwen inference (three synthetic requests only)
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        timeout-minutes: 9
        run: |
          & "$env:NERAL_PROBE_PYTHON" -X utf8 neral_qwen_live_probe.py --execute-local-qwen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
