name: Arctus350 teacher candidate CPU integrity
on:
  pull_request:
    paths:
      - 'frontier350/arctus350_teacher_gate.py'
      - 'tests/test_arctus350_teacher_gate.py'
      - 'tests/test_arctus350_instruction_curriculum_v1.py'
      - 'frontier350/arctus350_instruction_curriculum_v1.py'
      - 'docs/ARCTUS350_TEACHER_SFT.md'
      - '.github/workflows/arctus350-teacher-ci.yml'
permissions:
  contents: read
jobs:
  teacher-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CPU-only offline importer tests
        run: python -m unittest -v tests.test_arctus350_teacher_gate
      - name: Original Arctus instruction curriculum CPU-only tests
        run: python -m unittest -v tests.test_arctus350_instruction_curriculum_v1
      - name: Syntax
        run: python -m py_compile frontier350/arctus350_teacher_gate.py tests/test_arctus350_teacher_gate.py frontier350/arctus350_instruction_curriculum_v1.py tests/test_arctus350_instruction_curriculum_v1.py
