name: NERAL Lotto Lab (CPU)
on:
  pull_request:
    paths:
      - 'neral_lotto_lab.py'
      - 'tests/test_neral_lotto_lab.py'
      - 'docs/NERAL_LOTTO_LAB.md'
      - '.github/workflows/neral-lotto-lab-ci.yml'
  push:
    paths:
      - 'neral_lotto_lab.py'
      - 'tests/test_neral_lotto_lab.py'
      - '.github/workflows/neral-lotto-lab-ci.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.4.2
      - run: python -m pytest -q tests/test_neral_lotto_lab.py
      - run: python -m neral_lotto_lab compare --fields 6 --draws 500 --seed 42
