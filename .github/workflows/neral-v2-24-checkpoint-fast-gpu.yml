name: NERAL DEV24 full HF paired checkpointed fast256 GPU Docker-required
on:
  push:
    branches: [feat/qlora-v2-full-and-luna]
    paths:
      - '.github/workflows/neral-v2-24-checkpoint-fast-gpu.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neral-qwen7b-r32-gpu-exclusive
  cancel-in-progress: false
jobs:
  full24-live-rtx4070:
    # Existing CPU checkpoint/Luna preflight passed in run 44073640758.
    # One queued recovery only; no package installation or repeated GPU dispatch.
    if: github.ref == 'refs/heads/feat/qlora-v2-full-and-luna'
    runs-on: [self-hosted,windows,x64,neral-gpu]
    timeout-minutes: 240
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    env:
      HF_HOME: 'D:/neral-qlora-v2/hf-cache'
      HF_HUB_CACHE: 'D:/neral-qlora-v2/hf-cache/hub'
      HF_XET_CACHE: 'D:/neral-qlora-v2/hf-cache/xet'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - name: Ensure pinned sources, immutable adapters and per-case checkpoint directory on D
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:GITHUB_WORKSPACE 'source'
          $py='D:/neral-qlora/venv/Scripts/python.exe'
          $base='D:/neral-qlora/checkpoint'
          $v1='D:/neral-qlora/full01/adapter'
          $full='D:/neral-qlora-v2/v2full-43931510428-1-helios'
          $ckpt='D:/neral-qlora-v2/dev24-hf-sourcefirst-bound256-v2-20261117'
          $out="D:/neral-qlora-v2/dev24-hf-fast-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.json"
          $tool="D:/neral-qlora-v2/dev24-hf-docker-preflight-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.json"
          foreach($f in @($py,(Join-Path $base 'config.json'),(Join-Path $v1 'adapter_config.json'),
             (Join-Path $full 'adapter/adapter_model.safetensors'),(Join-Path $full 'manifest.json'))){
             if(-not(Test-Path -LiteralPath $f -PathType Leaf)){throw ('Frozen model/source missing: '+$f)}
          }
          $hm=Get-Content -LiteralPath (Join-Path $full 'manifest.json') -Raw|ConvertFrom-Json
          if($hm.status -ne 'frozen_adapter_ready_for_heldout_comparison' -or $hm.rank -ne 16 -or $hm.train_rows -ne 1100 -or $hm.val_rows -ne 140 -or $hm.test_rows_opened -ne 0){throw 'Helios frozen source receipt drift'}
          foreach($f in @($out,$tool)){if(Test-Path $f){throw 'Do not overwrite report'}}
          $env:PYTHONPATH=$src
          $vars=@{D24_SRC=$src;D24_PY=$py;D24_BASE=$base;D24_V1=$v1;D24_FULL=$full;
                  D24_CKPT=$ckpt;D24_OUT=$out;D24_TOOL=$tool;PYTHONPATH=$src}
          foreach($entry in $vars.GetEnumerator()){
            [IO.File]::AppendAllText($env:GITHUB_ENV,($entry.Key+'='+$entry.Value+[Environment]::NewLine),[Text.UTF8Encoding]::new($false))
          }
          Write-Host 'FROZEN_DEV24_DATA_AND_ADAPTER_RECEIPTS_PASS_SEALED40_UNOPENED'

      - name: Require active Windows Docker Desktop before claiming full pipeline
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'W39-GAMINGPC-Neral'){throw 'Unexpected Windows runner'}
          & cmd.exe /d /c 'docker info >NUL 2>&1'
          if($LASTEXITCODE -ne 0){
            # Consolidates queued HKCU startup run 44077136686 into this job;
            # no second startup job can race the comparison on runner recovery.
            $entries=@(Get-ItemProperty -Path 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -eq 'Docker Desktop' })
            if($entries.Count -ne 1){throw 'Not exactly one registered per-user Docker Desktop'}
            $root=[string]$entries[0].InstallLocation
            if([string]::IsNullOrWhiteSpace($root)){throw 'Docker registration has no InstallLocation'}
            $exe=Join-Path $root 'Docker Desktop.exe'
            if(-not(Test-Path -LiteralPath $exe -PathType Leaf)){throw 'Registered Docker Desktop executable missing'}
            if(-not(Get-Process -Name 'Docker Desktop' -ErrorAction SilentlyContinue)){
              Start-Process -FilePath $exe -ErrorAction Stop
              Write-Host 'EXISTING_REGISTERED_DOCKER_START_REQUESTED_ONCE'
            }
            $deadline=[DateTime]::UtcNow.AddSeconds(90)
            do{
              Start-Sleep -Seconds 3
              & cmd.exe /d /c 'docker info >NUL 2>&1'
              $ready=($LASTEXITCODE -eq 0)
            }until($ready -or [DateTime]::UtcNow -ge $deadline)
            if(-not $ready){throw 'WINDOWS_DOCKER_UNAVAILABLE_FULL_PIPELINE24_BLOCKED; no retry or CPU substitute'}
          }
          # Fail closed instead of implicitly downloading/installing an image.
          foreach($image in @('python:3.12.8-alpine3.21','python:3.11-alpine')){
            & docker image inspect $image 1>$null
            if($LASTEXITCODE -ne 0){throw ('Required preinstalled Docker image missing: '+$image)}
          }
          Push-Location $env:D24_SRC
          try{
            & $env:D24_PY -B -m scripts.neral_v2_tools_regression_smoke --out $env:D24_TOOL
            if($LASTEXITCODE -ne 0){throw 'Docker and SymPy NetworkX Z3 independent verification failed'}
            # Real source-first controller, real Docker, real Z3. CPU only.
            & $env:D24_PY -B -m scripts.neral_hf_source_docker_smoke
            if($LASTEXITCODE -ne 0){throw 'CPU/Docker source-first Python and Z3 integration failed; GPU run blocked'}
          }finally{Pop-Location}
          Write-Host 'WINDOWS_DOCKER_SYMPY_NETWORKX_Z3_AST_READY_FOR_REAL_PIPELINE24'

      - name: Verify RTX4070 GPU compute availability without blocking ordinary WDDM graphics
        run: |
          $ErrorActionPreference='Stop'
          # Under Windows WDDM nvidia-smi can list desktop/compositor/browser graphics
          # applications as compute-apps. Presence of a PID alone does not prove
          # that an independent CUDA model is running.
          $rows=@(& nvidia-smi --query-compute-apps=pid --format=csv,noheader,nounits)
          if($LASTEXITCODE -ne 0){throw 'Cannot verify GPU process inventory'}
          foreach($item in @($rows | Where-Object {$_.Trim()})){
            $idText=$item.Trim()
            if($idText -notmatch '^\d+$'){throw 'Unparseable GPU PID inventory; abort'}
            $gpuPid=[int]$idText
            $proc=Get-Process -Id $gpuPid -ErrorAction SilentlyContinue
            if($proc -and $proc.ProcessName -match '^(?i:pythonw?(?:[._-].*)?|ollama(?:[._-].*)?|llama(?:[._-]server)?|vllm|triton|comfyui|blender|pytorch|torchrun)$'){
              throw ('GPU compute worker detected; preserving active workload: '+$proc.ProcessName)
            }
          }
          # A loaded Ollama model is a separate exclusive compute workload.
          $loadedCount=0
          try {
            $modelList=Invoke-RestMethod -Uri 'http://127.0.0.1:11434/api/ps' -TimeoutSec 5
            $loadedCount=@($modelList.models | Where-Object {$null -ne $_}).Count
          } catch {
            Write-Host 'OLLAMA_API_UNAVAILABLE_NO_MODEL_UNLOAD_ATTEMPTED'
          }
          if($loadedCount -gt 0){throw 'Ollama model already loaded; no GPU work interrupted'}
          $g=@(& nvidia-smi --query-gpu=name,memory.total,memory.free --format=csv,noheader,nounits)
          if($LASTEXITCODE -ne 0 -or $g.Count -ne 1){throw 'RTX4070 absent'}
          $p=$g[0].Split(',')
          if($p.Count -ne 3 -or $p[0] -notmatch 'RTX 4070'){throw 'Unexpected GPU identity'}
          $totalMiB=[int]$p[1].Trim()
          $freeMiB=[int]$p[2].Trim()
          if($totalMiB -lt 11500 -or $freeMiB -lt 9500){throw 'Insufficient free VRAM for DEV24'}
          Start-Sleep -Seconds 3
          $g2=@(& nvidia-smi --query-gpu=name,memory.total,memory.free --format=csv,noheader,nounits)
          if($LASTEXITCODE -ne 0 -or $g2.Count -ne 1){throw 'Cannot recheck GPU memory'}
          $q=$g2[0].Split(',')
          if($q.Count -ne 3 -or $q[0] -notmatch 'RTX 4070' -or [int]$q[2].Trim() -lt 9500){
            throw 'VRAM no longer available after idle observation'
          }
          Write-Host 'WINDOWS_WDDM_DESKTOP_PROCESSES_TOLERATED'
          Write-Host ('DEV24_FAST_GPU_READY '+$g2[0])

      - name: Paired 24 real full NERAL pipeline v1 v2 with persistent case checkpoints and bounded 256-token attempts
        timeout-minutes: 210
        run: |
          $ErrorActionPreference='Stop'
          # Durable, atomic one-shot claim survives workflow reruns and failures.
          # Never remove automatically: completed case checkpoints remain reusable
          # only after explicit review of any interrupted attempt.
          $claim='D:/neral-qlora-v2/dev24-hf-sourcefirst-bound256-v2-20261117.auto-start-20261117.json'
          $stream=[IO.File]::Open($claim,[IO.FileMode]::CreateNew,[IO.FileAccess]::Write,[IO.FileShare]::None)
          try{
            $receipt=@{run_id=$env:GITHUB_RUN_ID;attempt=$env:GITHUB_RUN_ATTEMPT;sha=$env:GITHUB_SHA;utc=[DateTime]::UtcNow.ToString('o')}|ConvertTo-Json -Compress
            $bytes=[Text.Encoding]::UTF8.GetBytes($receipt)
            $stream.Write($bytes,0,$bytes.Length)
            $stream.Flush($true)
          }finally{$stream.Dispose()}
          Write-Host 'DEV24_DURABLE_SINGLE_START_CLAIMED'
          Push-Location $env:D24_SRC
          try{
            & $env:D24_PY -B -m scripts.neral_v2_pipeline24_hf --base $env:D24_BASE --v1 $env:D24_V1 --full $env:D24_FULL --out $env:D24_OUT --checkpoint-root $env:D24_CKPT
            if($LASTEXITCODE -ne 0){throw '24-case paired comparison failed; completed per-case evidence remains on D for resume'}
          }finally{Pop-Location}
          $m=Get-Content -LiteralPath $env:D24_OUT -Raw|ConvertFrom-Json
          if($m.status -ne '24_original_cases_through_real_neral_verifier_HF_engine' -or
              $m.v1_pipeline.complete_pairs -ne 24 -or $m.v2full_pipeline.complete_pairs -ne 24 -or
              $m.per_generation_max_new_tokens -ne 256){throw 'Incomplete or different protocol scored as full DEV24'}
          if($m.v2full_pipeline.release_gate_passed -ne $true){
            throw 'DEV24_RELEASE_GATE_BLOCKED: verifications, zero regressions, and gains required'
          }
          Write-Host 'DEV24_RELEASE_GATE_PASSED_V2_FULL'
          Write-Host ('NERAL_V2_DEV24_RESULT '+($m.v2full_vs_v1_pipeline|ConvertTo-Json -Compress))
          Write-Host 'NERAL_FULL24_V1_V2_GPU_COMPLETE'

      - name: Upload only numerical summary and per-case scalar checkpoints
        if: always() && env.D24_CKPT != ''
        uses: actions/upload-artifact@v4
        with:
          name: neral-dev24-checkpoint256-${{ github.run_id }}
          path: |
            ${{ env.D24_OUT }}
            ${{ env.D24_TOOL }}
            ${{ env.D24_CKPT }}/v1/manifest.json
            ${{ env.D24_CKPT }}/v1/cases/*.json
            ${{ env.D24_CKPT }}/v2full/manifest.json
            ${{ env.D24_CKPT }}/v2full/cases/*.json
          if-no-files-found: warn
          retention-days: 30
