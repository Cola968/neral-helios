name: Phoenix prompt-format ablation on PC once (CPU ONLY)
on:
  push:
    branches: [experiment/phoenix-sft-fp32-audit]
    paths: ['.github/workflows/phoenix-prompt-ablation-on-pc-once.yml']
permissions:
  contents: read
concurrency:
  group: neral-nextgen-local-gpu-training
  cancel-in-progress: false
jobs:
  real-own-weight-prompt-ablation:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 35
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - name: Checkout exact isolated source (no persisted credentials)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: phoenix_format_source
          clean: true
          persist-credentials: false
      - name: Verify exact local checkpoint and run CPU-only format ablation
        run: |
          $ErrorActionPreference='Stop'
          function WslPath([string]$p) {
            $full=[IO.Path]::GetFullPath($p)
            if($full -notmatch '^([A-Za-z]):\\(.*)$') { throw 'Only absolute Windows drive paths accepted' }
            return '/mnt/' + $matches[1].ToLowerInvariant() + '/' + $matches[2].Replace('\','/')
          }
          $repo=[IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'phoenix_format_source'))
          $workspace=[IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\')+'\'
          if(-not $repo.StartsWith($workspace,[StringComparison]::OrdinalIgnoreCase) -or [IO.Path]::GetFileName($repo) -ne 'phoenix_format_source') { throw 'Unexpected checkout path' }
          $code=Join-Path $repo 'frontier350\nextgen_v1\helios_prompt_ablation.py'
          $checkpoint='D:\NeralScaleV81\_continuity_v5\continuity_002073161216_f7a73e283421.pt'
          $assets=if($env:NERAL_ASSETS_ROOT) { $env:NERAL_ASSETS_ROOT } else { Join-Path $env:USERPROFILE 'Documents\Codex\2026-09-05\lo\outputs\neral' }
          $private='D:\NeralPrivateAssets\phoenix'
          $previous=Join-Path $private 'helios_quality_4b9e3902e0a8.json'
          foreach($file in @($code,$checkpoint,$previous)) { if(-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw 'Required source/checkpoint/prior result missing' } }
          foreach($dir in @($assets,$private)) { if(-not (Test-Path -LiteralPath $dir -PathType Container)) { throw 'Required local directory missing' } }
          if((Get-PSDrive C).Free -lt 30GB -or (Get-PSDrive D).Free -lt 200GB) { throw 'Disk reserve failed' }
          if((Get-FileHash -LiteralPath $checkpoint -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'f7a73e283421975acc34e13afc38378be4eab11da34e8e6b46fc7cb0cda883e7') { throw 'Checkpoint SHA mismatch; do not load' }
          foreach($p in @($repo,$assets,$private,$checkpoint,$previous)) { if($p.Contains("'")) { throw 'Unsupported apostrophe in shell path' } }
          $name='helios_quality_'+'${{ github.sha }}'.Substring(0,12)+'.json'
          if(Test-Path -LiteralPath (Join-Path $private $name)) { throw 'Refusing to overwrite existing diagnostic' }
          $cmd="set -euo pipefail; export CUDA_VISIBLE_DEVICES=-1 PYTHONDONTWRITEBYTECODE=1 OMP_NUM_THREADS=4 MKL_NUM_THREADS=4; cd '$(WslPath $repo)'; ~/.venvs/neral-triton-py312/bin/python -u frontier350/nextgen_v1/helios_prompt_ablation.py --execute --trusted-local-checkpoint --assets-root '$(WslPath $assets)' --checkpoint '$(WslPath $checkpoint)' --private-dir '$(WslPath $private)' --previous-report '$(WslPath $previous)' --output-name '$name'"
          Write-Host 'CPU-only: same verified own weights; 3 public cases x 5 prompt styles; 3 x 3 bounded free generations. No private answers uploaded.'
          & wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0) { throw 'Prompt ablation failed; no training was attempted' }
          Write-Host ('LOCAL_PRIVATE_PROMPT_ABLATION|' + (Join-Path $private $name))
          Write-Host 'No GPU, training, checkpoint mutation, upload, independent benchmark or claim of quality gain.'
