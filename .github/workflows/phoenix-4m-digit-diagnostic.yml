name: Phoenix 4Mi latent digit diagnostic

on:
  push:
    branches: [experiment/phoenix-blind-ab-audit-20260919]
    paths:
      - '.github/workflows/phoenix-4m-digit-diagnostic.yml'
      - 'frontier350/nextgen_v1/phoenix_4m_digit_diagnostic.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neral-nextgen-local-gpu-training
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - name: Checkout exact diagnostic revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: phoenix_4m_digit_${{ github.run_id }}
          clean: false
          persist-credentials: false

      - name: Run public-development latent digit ranking
        run: |
          $ErrorActionPreference='Stop'
          function ToWsl([string]$p) {
            $f=[IO.Path]::GetFullPath($p)
            if($f -notmatch '^([A-Za-z]):\\(.*)$'){throw 'Absolute Windows path required'}
            return '/mnt/'+$matches[1].ToLowerInvariant()+'/'+$matches[2].Replace('\','/')
          }
          $repo=Join-Path $env:GITHUB_WORKSPACE ('phoenix_4m_digit_'+$env:GITHUB_RUN_ID)
          $checkpoint='D:\NeralPrivateAssets\phoenix\foundation_train_35972614466\resume.pt'
          $sha='d54d3f752b22be09257164459c3bf56b0dd5c430db023882c4546430988a4963'
          $assets=if($env:NERAL_ASSETS_ROOT){$env:NERAL_ASSETS_ROOT}else{Join-Path $env:USERPROFILE 'Documents\Codex\2026-09-05\lo\outputs\neral'}
          $private='D:\NeralPrivateAssets\phoenix'
          $out=Join-Path $private ('digit_diagnostic_4m_'+$env:GITHUB_RUN_ID+'.json')
          foreach($p in @($repo,$checkpoint,$assets,$private,$out)){if($p.Contains("'")){throw 'Unsafe quote in path'}}
          if(-not(Test-Path -LiteralPath $checkpoint -PathType Leaf)){throw '4Mi checkpoint missing'}
          if((Get-FileHash -LiteralPath $checkpoint -Algorithm SHA256).Hash.ToLowerInvariant() -ne $sha){throw '4Mi checkpoint SHA mismatch'}
          if(Test-Path -LiteralPath $out){throw 'Create-only diagnostic output exists'}
          nvidia-smi --query-gpu=name,memory.free,utilization.gpu,temperature.gpu --format=csv,noheader

          $cmd="set -euo pipefail; cd '$(ToWsl $repo)'; test -x ~/.venvs/neral-triton-py312/bin/python; ~/.venvs/neral-triton-py312/bin/python -B -m py_compile frontier350/nextgen_v1/phoenix_4m_digit_diagnostic.py; ~/.venvs/neral-triton-py312/bin/python -B -u frontier350/nextgen_v1/phoenix_4m_digit_diagnostic.py --execute --trusted-own-checkpoint --checkpoint '$(ToWsl $checkpoint)' --assets-root '$(ToWsl $assets)' --out '$(ToWsl $out)'"
          & wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0){throw '4Mi latent digit diagnostic failed'}
          Write-Host 'Per-case public-development details remain local; only aggregates were logged.'

      - name: Post-run GPU telemetry
        if: always()
        run: |
          nvidia-smi --query-gpu=name,memory.used,memory.free,utilization.gpu,temperature.gpu --format=csv,noheader
