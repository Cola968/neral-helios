name: Neral 50M B2 100M

on:
  workflow_dispatch:
  push:
    branches:
      - gpu-run-50m-b2

permissions:
  contents: read

concurrency:
  group: neral-50m-b2-100m
  cancel-in-progress: false

jobs:
  train-and-benchmark:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 360
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false

      - name: Validate local environment
        id: env
        run: |
          $ErrorActionPreference='Stop'
          if (-not $env:NERAL_ASSETS_ROOT) { throw 'Set NERAL_ASSETS_ROOT on the runner.' }
          if (-not $env:NERAL_PYTHON) { throw 'Set NERAL_PYTHON to the CUDA venv python.exe.' }
          if (-not (Test-Path $env:NERAL_ASSETS_ROOT -PathType Container)) { throw "Missing assets root: $env:NERAL_ASSETS_ROOT" }
          if (-not (Test-Path $env:NERAL_PYTHON -PathType Leaf)) { throw "Missing Python: $env:NERAL_PYTHON" }
          "assets=$env:NERAL_ASSETS_ROOT" >> $env:GITHUB_OUTPUT
          "python=$env:NERAL_PYTHON" >> $env:GITHUB_OUTPUT

      - name: Attach existing B1 corpus
        run: |
          $ErrorActionPreference='Stop';$assets='${{ steps.env.outputs.assets }}';$source=Join-Path $assets 'pretrain50_data'
          foreach($f in @('train_de.bin','train_en.bin','val_de.bin','val_en.bin','documents.jsonl')) {
            if (-not (Test-Path (Join-Path $source $f) -PathType Leaf)) { throw "Missing B1 corpus asset: $f" }
          }
          if (Test-Path 'pretrain50_data') { Remove-Item 'pretrain50_data' -Recurse -Force }
          New-Item -ItemType Junction -Path 'pretrain50_data' -Target $source | Out-Null

      - name: Build or attach provenance-first B2 corpus
        id: b2data
        run: |
          $ErrorActionPreference='Stop';$assets='${{ steps.env.outputs.assets }}';$py='${{ steps.env.outputs.python }}'
          $b2=Join-Path $assets 'pretrain50_b2_data'
          $required=@('train_de.bin','train_en.bin','val_de.bin','val_en.bin','documents.jsonl','manifest.json')
          $valid=(Test-Path $b2 -PathType Container)
          if ($valid) {
            foreach($f in $required) { if (-not (Test-Path (Join-Path $b2 $f) -PathType Leaf)) { $valid=$false;break } }
          }
          if (-not $valid) {
            Write-Host 'No complete local B2 corpus found. Building the pinned public-data bootstrap.'
            & $py -m pip install --disable-pip-version-check -r requirements-data.txt
            $sources=Join-Path $assets 'b2_sources_auto'
            if (Test-Path $sources) { Remove-Item $sources -Recurse -Force }
            if (Test-Path $b2) { Remove-Item $b2 -Recurse -Force }
            & $py bootstrap_b2_sources.py --out $sources
            & $py prepare_pretrain50_b2.py --source-root $sources --out $b2 --target-train-tokens 100000000
          } else {
            Write-Host 'Using existing local B2 corpus.'
          }
          foreach($f in $required) { if (-not (Test-Path (Join-Path $b2 $f) -PathType Leaf)) { throw "Missing B2 corpus asset after preparation: $f" } }
          if (Test-Path 'pretrain50_b2_data') { Remove-Item 'pretrain50_b2_data' -Recurse -Force }
          New-Item -ItemType Junction -Path 'pretrain50_b2_data' -Target $b2 | Out-Null
          $m=Get-Content 'pretrain50_b2_data\manifest.json' -Raw|ConvertFrom-Json
          if ([int64]$m.actual_train_tokens -lt 75000000) { throw "B2 corpus is too small for the 100M cumulative milestone: $($m.actual_train_tokens) train tokens" }
          "manifest=$($m.source_manifest_sha256)" >> $env:GITHUB_OUTPUT
          Write-Host "B2 selected train tokens: $($m.actual_train_tokens)"

      - name: RTX health check
        run: |
          $py='${{ steps.env.outputs.python }}'
          & $py -c "import json,torch; assert torch.cuda.is_available(); assert torch.cuda.is_bf16_supported(); print(json.dumps({'gpu':torch.cuda.get_device_name(0),'vram_gib':round(torch.cuda.get_device_properties(0).total_memory/2**30,2),'torch':torch.__version__,'cuda':torch.version.cuda,'bf16':True}))"
          nvidia-smi --query-gpu=name,driver_version,memory.total,memory.free,temperature.gpu,power.draw --format=csv,noheader

      - name: Resolve B1 baseline and B2 state
        id: state
        run: |
          $ErrorActionPreference='Stop';$assets='${{ steps.env.outputs.assets }}'
          $b1out=Join-Path $assets 'runs\neral50m_stage_b_full';$b1best=Join-Path $b1out 'best_validation.pt';$b1latest=Join-Path $b1out 'latest.pt';$b1summary=Join-Path $b1out 'summary.json'
          if (-not (Test-Path $b1summary -PathType Leaf)) { throw 'B1 summary missing.' }
          $s=Get-Content $b1summary -Raw|ConvertFrom-Json
          if (-not $s.complete) { throw "B1 must complete before B2: $($s.stop)" }
          if (-not (Test-Path $b1best -PathType Leaf)) { $b1best=$b1latest }
          if (-not (Test-Path $b1best -PathType Leaf)) { throw 'B1 checkpoint missing.' }
          "b1=$b1best" >> $env:GITHUB_OUTPUT
          $b2out=Join-Path $assets 'runs\neral50m_b2_100m';$b2latest=Join-Path $b2out 'latest.pt';$b2summary=Join-Path $b2out 'summary.json'
          $complete=$false
          if (Test-Path $b2summary -PathType Leaf) { $b2s=Get-Content $b2summary -Raw|ConvertFrom-Json;$complete=[bool]$b2s.complete }
          if (Test-Path $b2latest -PathType Leaf) { $resume=$b2latest } else { $resume=$b1best }
          "b2_out=$b2out" >> $env:GITHUB_OUTPUT;"b2_resume=$resume" >> $env:GITHUB_OUTPUT;"b2_complete=$($complete.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          $candidates=@((Join-Path $assets 'export\pilot_02\neral20m.pt'),(Join-Path $assets 'checkpoints\neral20m.pt'))
          $base20=$candidates|Where-Object { Test-Path $_ -PathType Leaf }|Select-Object -First 1
          if ($base20) { "base20=$base20" >> $env:GITHUB_OUTPUT } else { Write-Host '20M checkpoint absent; direct 20M columns will be omitted.' }

      - name: Create report directories
        run: |
          foreach($d in @('baseline20','b1','b2')) { New-Item -ItemType Directory -Force -Path (Join-Path 'runner_reports' $d)|Out-Null }

      - name: Benchmark 20M Preview 02 on frozen suites
        if: ${{ steps.state.outputs.base20 != '' }}
        run: |
          $py='${{ steps.env.outputs.python }}';$c='${{ steps.state.outputs.base20 }}'
          & $py free_generation50.py --checkpoint $c --out runner_reports/baseline20/free.json --max-tokens 64
          & $py benchmark_v3.py $c --out runner_reports/baseline20/v3.json --max-new-tokens 96
          & $py benchmark_v4.py $c --out runner_reports/baseline20/v4.json --max-new-tokens 96
          & $py benchmark_raw_math50.py $c --out runner_reports/baseline20/rawmath.json --max-new-tokens 32

      - name: Benchmark B1 before B2
        run: |
          $py='${{ steps.env.outputs.python }}';$c='${{ steps.state.outputs.b1 }}'
          & $py free_generation50.py --checkpoint $c --out runner_reports/b1/free.json --max-tokens 64
          & $py benchmark_v3.py $c --out runner_reports/b1/v3.json --max-new-tokens 96
          & $py benchmark_v4.py $c --out runner_reports/b1/v4.json --max-new-tokens 96
          & $py benchmark_raw_math50.py $c --out runner_reports/b1/rawmath.json --max-new-tokens 32

      - name: Train B2 to 100M cumulative tokens without train-block replay
        if: ${{ steps.state.outputs.b2_complete != 'true' }}
        run: |
          $py='${{ steps.env.outputs.python }}'
          & $py pretrain50_b2.py --resume '${{ steps.state.outputs.b2_resume }}' --data pretrain50_b2_data --old-data pretrain50_data --out '${{ steps.state.outputs.b2_out }}' --target-cumulative-tokens 100000000 --seq 256 --batch 32 --peak-lr 0.0001 --min-lr 0.00001 --warmup-fraction 0.02 --eval-every 250 --validation-blocks 192

      - name: Resolve B2 selected checkpoint
        id: b2
        run: |
          $ErrorActionPreference='Stop';$out='${{ steps.state.outputs.b2_out }}';$summary=Join-Path $out 'summary.json';$best=Join-Path $out 'best_validation.pt';$latest=Join-Path $out 'latest.pt'
          if (-not (Test-Path $summary -PathType Leaf)) { throw 'B2 summary missing.' }
          $s=Get-Content $summary -Raw|ConvertFrom-Json
          if (-not $s.complete) { throw "B2 incomplete: $($s.stop)" }
          if (-not (Test-Path $best -PathType Leaf)) { $best=$latest }
          if (-not (Test-Path $best -PathType Leaf)) { throw 'B2 selected checkpoint missing.' }
          "best=$best" >> $env:GITHUB_OUTPUT;"summary=$summary" >> $env:GITHUB_OUTPUT

      - name: Benchmark B2 on the same frozen suites
        run: |
          $py='${{ steps.env.outputs.python }}';$c='${{ steps.b2.outputs.best }}'
          & $py free_generation50.py --checkpoint $c --out runner_reports/b2/free.json --max-tokens 64
          & $py benchmark_v3.py $c --out runner_reports/b2/v3.json --max-new-tokens 96
          & $py benchmark_v4.py $c --out runner_reports/b2/v4.json --max-new-tokens 96
          & $py benchmark_raw_math50.py $c --out runner_reports/b2/rawmath.json --max-new-tokens 32

      - name: Build exact B1-to-B2 comparison
        run: |
          $py='${{ steps.env.outputs.python }}'
          $args=@('summarize_b2.py','--b1-free','runner_reports/b1/free.json','--b1-v3','runner_reports/b1/v3.json','--b1-v4','runner_reports/b1/v4.json','--b1-rawmath','runner_reports/b1/rawmath.json','--b2-free','runner_reports/b2/free.json','--b2-v3','runner_reports/b2/v3.json','--b2-v4','runner_reports/b2/v4.json','--b2-rawmath','runner_reports/b2/rawmath.json','--training-summary','${{ steps.b2.outputs.summary }}','--out-json','runner_reports/B2_COMPARISON.json','--out-md','runner_reports/B2_COMPARISON.md')
          if (Test-Path 'runner_reports/baseline20/free.json') { $args+=@('--baseline20-free','runner_reports/baseline20/free.json','--baseline20-v3','runner_reports/baseline20/v3.json','--baseline20-v4','runner_reports/baseline20/v4.json','--baseline20-rawmath','runner_reports/baseline20/rawmath.json') }
          & $py @args
          Get-Content runner_reports/B2_COMPARISON.md

      - name: Run B2 regression tests
        run: |
          $py='${{ steps.env.outputs.python }}'
          & $py -m pytest tests/test_b2_bootstrap.py tests/test_b2_data.py tests/test_pretrain50_stage_b.py tests/test_model50.py -q --junitxml=runner_reports/pytest.xml

      - name: Persist reports and corpus manifest locally
        if: always()
        run: |
          $dest=Join-Path '${{ steps.env.outputs.assets }}' ('reports\runner_50m_b2_'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path $dest|Out-Null
          if (Test-Path runner_reports) { Copy-Item 'runner_reports\*' $dest -Recurse -Force }
          if (Test-Path 'pretrain50_b2_data\manifest.json') { Copy-Item 'pretrain50_b2_data\manifest.json' (Join-Path $dest 'b2_corpus_manifest.json') -Force }
          if (Test-Path '${{ steps.b2.outputs.summary }}') { Copy-Item '${{ steps.b2.outputs.summary }}' (Join-Path $dest 'b2_training_summary.json') -Force }

      - name: Assert private weights and corpus stay local
        if: always()
        run: |
          if (Test-Path runner_reports) {
            $bad=Get-ChildItem runner_reports -Recurse -File|Where-Object { $_.Extension -in '.pt','.pth','.bin','.safetensors','.parquet','.gz' }
            if ($bad) { throw 'Private model/corpus file found in upload directory.' }
          }

      - name: Upload reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neral-50m-b2-100m-benchmarks
          path: runner_reports/
          if-no-files-found: warn
          retention-days: 14
