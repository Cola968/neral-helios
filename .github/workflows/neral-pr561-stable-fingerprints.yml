name: NERAL PR561 stable source fingerprints and Docker base inspection
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/neral-pr561-stable-fingerprints.yml'
permissions:
  contents: read
concurrency:
  group: neral-pr561-stable-fingerprints
  cancel-in-progress: false
jobs:
  check:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 8
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compare running stable source against PR branch without modifications
        run: |
          $ErrorActionPreference='Stop'
          $stable=Join-Path $env:LOCALAPPDATA 'NERAL/three-tier-pr558-909d1419c9ff/NERAL-1.0-Local'
          $files=@('neral_web_search.py','neral_everyday_verified.py','neral_three_tier_runtime.py','static/neral-preview.js','neral_preview_server.py','static/neral-reference-ui.js')
          $out=@()
          foreach($rel in $files){
            $local=Join-Path $stable $rel
            if(-not(Test-Path -LiteralPath $local -PathType Leaf)){
              $out+=@{file=$rel;installed='MISSING';target='UNKNOWN';base='UNKNOWN'};continue
            }
            $old=(& git -c core.autocrlf=true hash-object --path=$rel $local).Trim()
            $new=(& git rev-parse ('HEAD:'+$rel)).Trim()
            $base=(& git rev-parse ('17fafd37ce0ae8a750a7777b94b57816af0ad1ce:'+$rel)).Trim()
            $out+=@{file=$rel;installed=$old;target=$new;base=$base}
          }
          $image=$false;$ready=$false
          try{
            & docker info --format '{{.ServerVersion}}' 2>$null | Out-Null
            $ready=($LASTEXITCODE -eq 0)
            if($ready){
              & docker image inspect python:3.11-alpine *> $null
              $image=($LASTEXITCODE -eq 0)
            }
          }catch{}
          $drives=@(Get-PSDrive -PSProvider FileSystem | Where-Object {$_.Name -in ('C','D')} | ForEach-Object {
            @{drive=$_.Name;free_gib=[math]::Round($_.Free/1GB,1)}
          })
          Write-Host ('NERAL_PR561_STABLE_FINGERPRINTS '+(@{files=$out;docker_ready=$ready;legacy_python_image_present=$image;drives=$drives}|ConvertTo-Json -Compress -Depth 5))
          exit 0
      - name: Execute safe read-only import probe from standalone file, check actual HTTP session
        run: |
          $ErrorActionPreference='Stop'
          $old=Join-Path $env:LOCALAPPDATA 'NERAL/three-tier-pr558-909d1419c9ff/NERAL-1.0-Local'
          $new=Join-Path $env:LOCALAPPDATA 'NERAL/pr561-v1-77e124c98e61/NERAL-1.0-Local'
          $py='D:/neral-qlora/venv/Scripts/python.exe'
          $script=Join-Path $env:GITHUB_WORKSPACE 'scripts/neral_pr561_import_diag.py'
          if(-not(Test-Path -LiteralPath $script -PathType Leaf)){throw 'Diagnostic source absent'}
          foreach($entry in @(@{label='old';dir=$old},@{label='candidate';dir=$new})){
            if(-not(Test-Path -LiteralPath $entry.dir -PathType Container)){
              Write-Host ('NERAL_IMPORT_LOCATION_MISSING '+$entry.label)
              continue
            }
            $env:PYTHONPATH=(Join-Path $old 'local_state/three-tier-web-deps')+[IO.Path]::PathSeparator+$entry.dir
            Push-Location -LiteralPath $entry.dir
            try {
              $previousPreference=$ErrorActionPreference
              $ErrorActionPreference='Continue'
              try{$rows=@(& $py -B $script 2>&1)}finally{$ErrorActionPreference=$previousPreference}
              foreach($row in $rows){
                if([string]$row -like 'NERAL_SAFE_IMPORT *'){
                  Write-Host ('NERAL_PR561_IMPORT_RESULT '+$entry.label+' '+[string]$row)
                }
              }
            }finally{Pop-Location}
          }
          $status=@{http200=$false;three_tier=$false;levels=$false}
          try{
            $session=New-Object Microsoft.PowerShell.Commands.WebRequestSession
            $home=Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:9690/' -WebSession $session -TimeoutSec 7
            $reply=Invoke-RestMethod -Uri 'http://127.0.0.1:9690/api/neral/preview/session' -WebSession $session -TimeoutSec 7
            $status.http200=($home.StatusCode -eq 200)
            $status.three_tier=($reply.three_tier_enabled -eq $true)
            $status.levels=((@($reply.three_tier_levels) -join ',') -eq 'Luna,Terra,Helios')
          }catch{}
          Write-Host ('NERAL_PR561_CURRENT_SESSION '+($status|ConvertTo-Json -Compress))
          Write-Host 'NERAL_READONLY_IMPORT_DIAGNOSTIC_NO_FILES_CHANGED'
