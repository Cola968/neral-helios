name: NERAL experimental TIR hard36 development GPU gate
on:
  pull_request:
    paths:
      - 'scripts/neral_same_base_ab_score.py'
      - 'scripts/neral_same_base_live.py'
      - 'scripts/neral_tir_hard_live.py'
      - 'tests/test_neral_tir_hard_live.py'
      - 'neral_high_verified_first.py'
      - 'neral_tir_experimental.py'
      - 'neral_local_chat_api.py'
      - 'tests/test_neral_experimental_tir.py'
      - 'tests/test_neral_same_base_ab_score.py'
      - 'tests/test_neral_same_base_live.py'
      - '.github/workflows/neral-tir-hard36-gpu.yml'
  workflow_dispatch:
    inputs:
      authorize:
        description: 'NERAL_TIR_HARD36_GPU_MANUAL_ONLY'
        required: true
        type: string
      release_run_id:
        description: 'Successful MAIN release run for exact workflow SHA'
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  cpu-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install preview-only HTTP dependencies
        run: python -m pip install -r requirements-neral-preview.txt
      - name: Paired scorer CPU tests
        run: python -B -m unittest discover -s tests -p test_neral_same_base_ab_score.py -v
      - name: Real collector and router CPU tests
        run: python -B -m unittest discover -s tests -p test_neral_same_base_live.py -v
      - name: Experimental TIR and strict suffix regression tests
        run: python -B -m unittest discover -s tests -p test_neral_experimental_tir.py -v
      - name: Hard36 development-generator and tool-count contracts
        run: python -B -m unittest discover -s tests -p test_neral_tir_hard_live.py -v
      - name: Syntax
        run: python -B -m py_compile scripts/neral_same_base_ab_score.py scripts/neral_same_base_live.py
      - name: Experimental TIR static syntax
        run: python -B -m py_compile neral_tir_experimental.py neral_high_verified_first.py neral_local_chat_api.py
      - name: Hard36 live collector syntax
        run: python -B -m py_compile scripts/neral_tir_hard_live.py
  gpu-real-three-arm:
    needs: cpu-contracts
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.authorize == 'NERAL_TIR_HARD36_GPU_MANUAL_ONLY'
    concurrency:
      group: neral-qwen7b-r32-gpu-exclusive
      cancel-in-progress: false
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 240
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    env:
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      HF_HUB_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      NERAL_EXPERIMENTAL_TIR: '1'
      WANDB_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
          clean: true
      - name: Verify exact SHA release receipt and free GPU before inference
        run: |
          $ErrorActionPreference='Stop'
          if($env:RELEASE_RUN_ID -notmatch '^[0-9]{9,15}$'){throw 'Invalid release run ID'}
          $url="https://api.github.com/repos/"+$env:GITHUB_REPOSITORY+"/actions/runs/"+$env:RELEASE_RUN_ID
          $receipt=Invoke-RestMethod -Uri $url -Headers @{Accept='application/vnd.github+json'} -TimeoutSec 30
          if($receipt.name -ne 'NERAL 1.0 release candidate - offline package and LIVE Windows PC smoke' -or
             $receipt.status -ne 'completed' -or $receipt.conclusion -ne 'success' -or
             $receipt.event -ne 'push' -or $receipt.head_branch -ne 'main' -or
             $receipt.head_sha -ne $env:GITHUB_SHA){throw 'Exact SHA MAIN release is not green'}
          & docker image inspect python:3.11-alpine *> $null
          if($LASTEXITCODE -ne 0){throw 'Offline Docker Python image missing; no pull permitted'}
          $gpu=& nvidia-smi --query-gpu=memory.free,utilization.gpu --format=csv,noheader,nounits
          if($LASTEXITCODE -ne 0){throw 'No GPU telemetry'}
          $v=($gpu|Select-Object -First 1)-split ','
          if($v.Count -ne 2 -or [int]$v[0].Trim() -lt 7000 -or [int]$v[1].Trim() -gt 25){
            throw 'GPU busy or memory insufficient'}
          $code=Join-Path $env:GITHUB_WORKSPACE 'control'
          $root=Join-Path $env:USERPROFILE 'NERAL-QLoRA-Research'
          $base=Join-Path $root 'training-env-py312\Scripts\python.exe'
          if(-not(Test-Path -LiteralPath $base -PathType Leaf)){throw 'Local Python 3.12 missing'}
          $venv=Join-Path $env:RUNNER_TEMP ('neral-tir-hard-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
          if(Test-Path -LiteralPath $venv){throw 'Refuse existing venv'}
          & $base -B -m venv $venv
          if($LASTEXITCODE -ne 0){throw 'venv failed'}
          $py=Join-Path $venv 'Scripts\python.exe'
          & $py -B -m pip install --disable-pip-version-check --no-input --no-cache-dir -r (Join-Path $code 'requirements-neral-preview.txt')
          if($LASTEXITCODE -ne 0){throw 'Dependencies failed'}
          $receiptPath=Join-Path $env:RUNNER_TEMP ('neral-tir-hard-receipt-'+$env:GITHUB_RUN_ID+'.json')
          if(Test-Path -LiteralPath $receiptPath){throw 'Existing release receipt'}
          $receipt | Select-Object name,status,conclusion,head_branch,event,head_sha |
            ConvertTo-Json -Compress | Set-Content -LiteralPath $receiptPath -Encoding ascii
          [IO.File]::AppendAllText($env:GITHUB_ENV,
            ('SAME_BASE_PY='+$py+[Environment]::NewLine+
             'SAME_BASE_CODE='+$code+[Environment]::NewLine+
             'SAME_BASE_RECEIPT='+$receiptPath+[Environment]::NewLine),
            [Text.UTF8Encoding]::new($false))
      - name: Run private HARD36 TIR A/B/C (Qwen3.5 pinned, opt-in) and export scalars
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:USERPROFILE 'NERAL-QLoRA-Research'
          $private=Join-Path $root ('tir-hard36-private-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
          $scalar=Join-Path $env:SAME_BASE_CODE 'neral_tir_hard36_scalar'
          if((Test-Path -LiteralPath $private) -or (Test-Path -LiteralPath $scalar)){
            throw 'Refuse occupied output destinations'}
          Push-Location $env:SAME_BASE_CODE
          try{
            $env:PYTHONPATH=$env:SAME_BASE_CODE
            & $env:SAME_BASE_PY -B -m scripts.neral_tir_hard_live --private-output-dir $private --release-receipt-json $env:SAME_BASE_RECEIPT --authorize NERAL_TIR_HARD36_GPU_MANUAL_ONLY
            if($LASTEXITCODE -ne 0){throw 'Hard36 TIR benchmark incomplete'}
            $r=Get-Content -LiteralPath (Join-Path $private 'scalar-summary.json') -Raw | ConvertFrom-Json
            if($r.cases -ne 36 -or $r.release_validated -ne $false -or
               $r.independent_holdout_verified -ne $false -or
               $r.weight_improvement_proven -ne $false -or
               $r.router_superiority_proven -ne $false -or
               $r.gpu_telemetry.sample_count -lt 3){
              throw 'Misleading or incomplete benchmark report'}
            New-Item -ItemType Directory -Path $scalar -ErrorAction Stop|Out-Null
            Copy-Item -LiteralPath (Join-Path $private 'scalar-summary.json') -Destination (Join-Path $scalar 'summary.json')
            Write-Host 'Local private case prompts and answers never uploaded.'
          }finally{Pop-Location}
      - name: Upload scalar-only summary
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: neral-tir-hard36-aggregate-only
          path: control/neral_tir_hard36_scalar/summary.json
          retention-days: 14
          if-no-files-found: error
