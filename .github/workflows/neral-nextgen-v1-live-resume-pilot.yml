name: Neral NextGen V9 REAL resume pilot and live step logs

on:
  push:
    branches: [experiment/nextgen-v1-isolated]
    paths: ['.github/workflows/neral-nextgen-v1-live-resume-pilot.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neral-nextgen-v1-real-resume-pilot
  cancel-in-progress: false

jobs:
  isolated-eight-step-ab:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 40
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: Independently pinned read-only asset and GPU preflight
        id: guard
        run: |
          $ErrorActionPreference='Stop'
          $assets=if($env:NERAL_ASSETS_ROOT){$env:NERAL_ASSETS_ROOT}else{'C:\Users\astad\Documents\Codex\2026-09-05\lo\outputs\neral'}
          $anchor=Join-Path $assets 'runs\neral350_autorecovery_neral-autorecovery-v1-20260912-r1_selected\resume.pt'
          $main=Join-Path $assets 'frontier350_safe_v8_arctus-safe-v8-20260912-r1_xling05\train'
          $replay=Join-Path $assets 'frontier350_replay_v9_20260912'
          $outputParent='D:\NeralScaleV81'
          $armA=Join-Path $outputParent ('nextgen_ab_' + $env:GITHUB_RUN_ID + '_a')
          $armB=Join-Path $outputParent ('nextgen_ab_' + $env:GITHUB_RUN_ID + '_b')
          function W([string]$p){$f=[IO.Path]::GetFullPath($p);if($f.Length -lt 3 -or $f[1] -ne ':'){throw 'expected Windows drive path'};return '/mnt/'+$f.Substring(0,1).ToLower()+'/'+$f.Substring(3).Replace('\','/')}
          $repo=W (Get-Location).Path
          $anchorSHA='ef3ee045203f1bfb7b9f501db800408b095aa5ef29da5d22a8a9486e115e9f7c'
          $tokenizerSHA='4a25bb40ad66e2d5a674d32e95bc0076d13cdb4decb4d508226124711e2aa7dd'
          $cmd="set -e; cd '$repo'; ~/.venvs/neral-triton-py312/bin/python -m py_compile frontier350/nextgen_v1/live_v9.py frontier350/nextgen_v1/compare_v9_training_state.py; ~/.venvs/neral-triton-py312/bin/python frontier350/nextgen_v1/real_gpu_preflight.py --anchor '$(W $anchor)' --anchor-sha256 '$anchorSHA' --main-data '$(W $main)' --replay '$(W $replay)' --tokenizer-sha256 '$tokenizerSHA' --arm-a '$(W $armA)' --arm-b '$(W $armB)'"
          New-Item -ItemType Directory -Path frontier350_nextgen_live_logs -Force | Out-Null
          $result=& wsl.exe -- bash -lc $cmd 2>&1
          $exitCode=$LASTEXITCODE
          $result | Out-File -LiteralPath frontier350_nextgen_live_logs/preflight.json -Encoding utf8
          $result | Write-Host
          if($exitCode -ne 0){throw 'Read-only preflight failed: NO TRAINING STARTED'}
          "repo=$repo" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "anchor=$(W $anchor)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "anchor_win=$anchor" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "anchor_sha=$anchorSHA" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "main=$(W $main)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "replay=$(W $replay)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "a=$(W $armA)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "b=$(W $armB)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "a_win=$armA" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "b_win=$armB" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Arm A real eight updates, one live JSON line per completed optimizer step
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ steps.guard.outputs.repo }}';$a='${{ steps.guard.outputs.a }}'
          $common="--anchor '${{ steps.guard.outputs.anchor }}' --anchor-sha '${{ steps.guard.outputs.anchor_sha }}' --main-data '${{ steps.guard.outputs.main }}' --replay '${{ steps.guard.outputs.replay }}' --mode replay_only --new-tokens 196608 --batch-size 4 --microbatches 12 --main-pack 9 --fast-replay-only --compile-mode default --lr 0.00002 --lr-end 0.00002 --replay-boost 1.78"
          $cmd="set -euo pipefail; cd '$repo'; export PYTHONPATH='$repo/frontier350'; export PYTHONUNBUFFERED=1; ~/.venvs/neral-triton-py312/bin/python -u frontier350/nextgen_v1/live_v9.py $common --out '$a'"
          & wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0){throw 'A interrupted/failed; no B start'}
          $s=Get-Content -LiteralPath '${{ steps.guard.outputs.a_win }}\summary.json' -Raw | ConvertFrom-Json
          if(!$s.complete -or $s.updates -ne 8 -or $s.new_tokens -ne 196608){throw 'A failed exact 8-step budget'}
          Copy-Item '${{ steps.guard.outputs.a_win }}\metrics.jsonl' frontier350_nextgen_live_logs/arm_a_metrics.jsonl
          Copy-Item '${{ steps.guard.outputs.a_win }}\summary.json' frontier350_nextgen_live_logs/arm_a_summary.json
          nvidia-smi --query-gpu=name,memory.free,temperature.gpu --format=csv,noheader

      - name: Arm B first three actual updates, retain recovery identity
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ steps.guard.outputs.repo }}';$b='${{ steps.guard.outputs.b }}'
          $common="--anchor '${{ steps.guard.outputs.anchor }}' --anchor-sha '${{ steps.guard.outputs.anchor_sha }}' --main-data '${{ steps.guard.outputs.main }}' --replay '${{ steps.guard.outputs.replay }}' --mode replay_only --new-tokens 196608 --batch-size 4 --microbatches 12 --main-pack 9 --fast-replay-only --compile-mode default --lr 0.00002 --lr-end 0.00002 --replay-boost 1.78"
          $cmd="set -euo pipefail; cd '$repo'; export PYTHONPATH='$repo/frontier350'; export PYTHONUNBUFFERED=1; ~/.venvs/neral-triton-py312/bin/python -u frontier350/nextgen_v1/live_v9.py $common --out '$b' --max-updates 3"
          & wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0){throw 'B first three updates failed; do not resume'}
          $s=Get-Content -LiteralPath '${{ steps.guard.outputs.b_win }}\summary.json' -Raw | ConvertFrom-Json
          if($s.complete -or $s.updates -ne 3 -or $s.new_tokens -ne 73728){throw 'B first segment counters invalid'}
          Copy-Item '${{ steps.guard.outputs.b_win }}\summary.json' frontier350_nextgen_live_logs/arm_b_first3_summary.json
          $digest=(Get-FileHash -LiteralPath '${{ steps.guard.outputs.b_win }}\resume.pt' -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "B recovery snapshot after step 3 SHA256=$digest"
          [ordered]@{schema=1;checkpoint_sha256=$digest;updates=3;new_tokens=73728} | ConvertTo-Json | Out-File frontier350_nextgen_live_logs/arm_b_first3_identity.json -Encoding utf8

      - name: Arm B process-boundary restart, remaining five updates
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ steps.guard.outputs.repo }}';$b='${{ steps.guard.outputs.b }}'
          $common="--anchor '${{ steps.guard.outputs.anchor }}' --anchor-sha '${{ steps.guard.outputs.anchor_sha }}' --main-data '${{ steps.guard.outputs.main }}' --replay '${{ steps.guard.outputs.replay }}' --mode replay_only --new-tokens 196608 --batch-size 4 --microbatches 12 --main-pack 9 --fast-replay-only --compile-mode default --lr 0.00002 --lr-end 0.00002 --replay-boost 1.78"
          $cmd="set -euo pipefail; cd '$repo'; export PYTHONPATH='$repo/frontier350'; export PYTHONUNBUFFERED=1; ~/.venvs/neral-triton-py312/bin/python -u frontier350/nextgen_v1/live_v9.py $common --out '$b' --resume '$b/resume.pt'"
          & wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0){throw 'B exact resume failed; no comparison claim'}
          $s=Get-Content -LiteralPath '${{ steps.guard.outputs.b_win }}\summary.json' -Raw | ConvertFrom-Json
          if(!$s.complete -or $s.updates -ne 8 -or $s.new_tokens -ne 196608){throw 'B resumed counters invalid'}
          Copy-Item '${{ steps.guard.outputs.b_win }}\metrics.jsonl' frontier350_nextgen_live_logs/arm_b_metrics.jsonl
          Copy-Item '${{ steps.guard.outputs.b_win }}\summary.json' frontier350_nextgen_live_logs/arm_b_summary.json

      - name: Exact state and full frozen-weight comparison (not a quality test)
        run: |
          $ErrorActionPreference='Stop'
          $a='${{ steps.guard.outputs.a_win }}\resume.pt';$b='${{ steps.guard.outputs.b_win }}\resume.pt'
          $ha=(Get-FileHash -LiteralPath $a -Algorithm SHA256).Hash.ToLowerInvariant()
          $hb=(Get-FileHash -LiteralPath $b -Algorithm SHA256).Hash.ToLowerInvariant()
          function W([string]$p){$f=[IO.Path]::GetFullPath($p);return '/mnt/'+$f.Substring(0,1).ToLower()+'/'+$f.Substring(3).Replace('\','/')}
          $repo='${{ steps.guard.outputs.repo }}'
          $cmd="set -e; cd '$repo'; ~/.venvs/neral-triton-py312/bin/python frontier350/nextgen_v1/compare_v9_training_state.py --arm-a '$(W $a)' --arm-b '$(W $b)' --sha-a '$ha' --sha-b '$hb' --anchor-sha '${{ steps.guard.outputs.anchor_sha }}' --updates 8 --tokens 196608 --acknowledge-trusted-local-pickle"
          $result=& wsl.exe -- bash -lc $cmd 2>&1
          $exitCode=$LASTEXITCODE
          $result | Out-File frontier350_nextgen_live_logs/exact_resume_comparison.json -Encoding utf8
          $result | Write-Host
          if($exitCode -ne 0){throw 'Exact state mismatch or untrusted comparison; NO promotion'}
          Write-Host 'Only short 4-trainable-block resume equality proved; NO 44k accepted end-to-end, NO NIS2 quality or production release.'

      - name: Upload public-to-private-job JSON diagnostics ONLY (no model or corpus)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neral-nextgen-real-resume-logs-${{ github.run_id }}
          path: frontier350_nextgen_live_logs/*.json*
          if-no-files-found: warn
          retention-days: 14
