name: Neral 350M Scale V6 Fast Guarded

on:
  push:
    branches: [experiment/scale-v6]
    paths: ['frontier350_scale_v6_requests/request.json']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: neral-350m-scale-v4
  cancel-in-progress: false

jobs:
  scale:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 900
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: Verify V6 request and idle RTX 4070
        id: request
        run: |
          $ErrorActionPreference='Stop'
          $request=Get-Content frontier350_scale_v6_requests/request.json -Raw|ConvertFrom-Json
          $expected='action,max_rounds,max_wall_minutes,request_id,target_tokens,version'
          if((($request.PSObject.Properties.Name|Sort-Object) -join ',') -ne $expected){throw 'unexpected request fields'}
          if($request.version -ne 6 -or $request.action -ne 'run_scale_v6_fast'){throw 'invalid action/version'}
          if($request.request_id -notmatch '^[A-Za-z0-9._-]{1,64}$'){throw 'unsafe request id'}
          if([long]$request.target_tokens -lt 1750000000 -or [long]$request.target_tokens -gt 10000000000){throw 'target_tokens out of range'}
          if([int]$request.max_rounds -lt 1 -or [int]$request.max_rounds -gt 4096){throw 'max_rounds out of range'}
          if([int]$request.max_wall_minutes -lt 15 -or [int]$request.max_wall_minutes -gt 900){throw 'max_wall_minutes out of range'}
          wsl.exe --shutdown 2>$null
          Start-Sleep -Seconds 3
          $gpu=(nvidia-smi --query-gpu=name --format=csv,noheader | Select-Object -First 1).Trim()
          $temp=[int]((nvidia-smi --query-gpu=temperature.gpu --format=csv,noheader,nounits | Select-Object -First 1).Trim())
          $free=[int]((nvidia-smi --query-gpu=memory.free --format=csv,noheader,nounits | Select-Object -First 1).Trim())
          Write-Host ("GPU="+$gpu); Write-Host ("GPUStartTempC="+$temp); Write-Host ("GPUFreeVRAMMiB="+$free)
          if($gpu -notmatch 'RTX 4070'){throw 'expected RTX 4070 runner'}
          if($temp -ge 85){throw 'GPU too hot'}
          if($free -lt 9000){throw ("Need >=9000 MiB free VRAM; found "+$free)}
          $assets=if($env:NERAL_ASSETS_ROOT){$env:NERAL_ASSETS_ROOT}else{'C:\Users\astad\Documents\Codex\2026-09-05\lo\outputs\neral'}
          $ddrive=Get-PSDrive -Name 'D' -ErrorAction Stop
          if($ddrive.Free -lt 25GB){throw 'need >=25 GiB free on D: scratch'}
          # Intentionally share the V5 parent so discover_initial sees the durable V5 continuity journal.
          $scratchWin=Join-Path 'D:\NeralScaleV5' ([string]$request.request_id)
          if(Test-Path -LiteralPath $scratchWin){throw 'scratch path already exists; refusing overwrite'}
          function W([string]$p){$full=[IO.Path]::GetFullPath($p); return '/mnt/'+$full.Substring(0,1).ToLower()+'/'+$full.Substring(3).Replace('\','/')}
          $outputs=@(
            "repo=$(W (Get-Location).Path)","assets=$(W $assets)","scratch=$(W $scratchWin)","scratch_win=$scratchWin",
            "request_id=$($request.request_id)","target_tokens=$($request.target_tokens)","max_rounds=$($request.max_rounds)","max_wall_minutes=$($request.max_wall_minutes)"
          )
          $utf8NoBom=New-Object System.Text.UTF8Encoding($false)
          foreach($line in $outputs){[IO.File]::AppendAllText($env:GITHUB_OUTPUT,$line+[Environment]::NewLine,$utf8NoBom); Write-Host ("OUTPUT "+$line)}
          exit 0

      - name: Apply validated turbo runtime and V6 fast patch
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ steps.request.outputs.repo }}'
          $cmd="set -e; cd '$repo'; bash frontier350/ensure_eval_runtime.sh; ~/.venvs/neral-triton-py312/bin/python frontier350/apply_v6_fast_patch.py; ~/.venvs/neral-triton-py312/bin/python -m py_compile frontier350/apply_v6_fast_patch.py frontier350/run_scale_v5.py frontier350/train_v5_stage_launcher.py frontier350/train_guarded_v9.py frontier350/eval_recovery_smoke_v3.py frontier350/eval_validation_loss350.py frontier350/eval_recovery_dev_v2.py frontier350/eval_bilingual_holdout_v1.py"
          wsl.exe -- bash -lc $cmd
          $code=$LASTEXITCODE
          wsl.exe --shutdown 2>$null
          Start-Sleep -Seconds 3
          if($code -ne 0){throw 'V6 runtime/source checks failed'}
          exit 0

      - name: Run V6 fast guarded continuation
        id: scale
        env:
          NERAL_TELEMETRY_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ steps.request.outputs.repo }}'; $assets='${{ steps.request.outputs.assets }}'; $scratch='${{ steps.request.outputs.scratch }}'
          $scratchWin='${{ steps.request.outputs.scratch_win }}'; $rid='${{ steps.request.outputs.request_id }}'
          $target='${{ steps.request.outputs.target_tokens }}'; $rounds='${{ steps.request.outputs.max_rounds }}'; $wall='${{ steps.request.outputs.max_wall_minutes }}'
          $reportWin=Join-Path (Get-Location).Path 'frontier350_scale_v6_report'
          $stopFile=Join-Path $env:RUNNER_TEMP ("neral-scale-v6-live-"+$rid+".stop")
          Remove-Item -LiteralPath $stopFile -Force -ErrorAction SilentlyContinue
          $telemetryScript=Join-Path (Get-Location).Path 'frontier350\live_telemetry.ps1'
          $telemetry=Start-Job -ScriptBlock {
            param($script,$scratchWin,$reportWin,$stopFile,$repoName,$runId)
            & $script -ScratchWin $scratchWin -ReportWin $reportWin -StopFile $stopFile -Repo $repoName -IssueNumber 102 -RunId $runId -TargetTps 50000 -UpdatesPerTrial 2048 -IntervalSeconds 20 -TotalTrials 4096
          } -ArgumentList $telemetryScript,$scratchWin,$reportWin,$stopFile,'Cola968/neral-helios','${{ github.run_id }}'
          $cmd="set -e; cd '$repo'; export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True; export CUDA_MODULE_LOADING=LAZY; export TORCHINDUCTOR_CACHE_DIR=~/.cache/neral_inductor; export CC=/usr/bin/gcc; export CXX=/usr/bin/g++; ~/.venvs/neral-triton-py312/bin/python -u frontier350/run_scale_v5.py --assets '$assets' --report frontier350_scale_v6_report --scratch '$scratch' --request-id '$rid' --target-tokens '$target' --max-rounds '$rounds' --max-wall-minutes '$wall'"
          try { wsl.exe -- bash -lc $cmd; $code=$LASTEXITCODE }
          finally {
            New-Item -ItemType File -Path $stopFile -Force | Out-Null
            Wait-Job -Job $telemetry -Timeout 30 | Out-Null
            Receive-Job -Job $telemetry -ErrorAction SilentlyContinue | Out-Null
            Stop-Job -Job $telemetry -ErrorAction SilentlyContinue
            Remove-Job -Job $telemetry -Force -ErrorAction SilentlyContinue
          }
          wsl.exe --shutdown 2>$null
          Start-Sleep -Seconds 4
          if($code -ne 0){throw 'V6 fast controller failed; durable continuity journal remains recoverable'}
          exit 0

      - name: Print final V6 result
        if: always()
        run: |
          if(Test-Path frontier350_scale_v6_report/selection.json){
            $r=Get-Content frontier350_scale_v6_report/selection.json -Raw|ConvertFrom-Json
            Write-Host ("CONTROLLER="+$r.controller)
            Write-Host ("FINAL_SAFE_TOKENS="+$r.final_safe_tokens)
            Write-Host ("FINAL_TRAIN_TOKENS="+$r.final_train_tokens)
            Write-Host ("FINAL_STATUS="+$r.final_status)
            Write-Host ("TARGET_TOKENS="+$r.target_tokens)
            Write-Host ("ROUNDS="+$r.rounds_this_run)
            Write-Host ("MAX_SOFTWARE_ROLLBACK_TOKENS="+$r.max_software_rollback_tokens)
            Write-Host ("WALL_MINUTES="+$r.wall_minutes)
          }
          exit 0

      - name: Final runner health
        if: always()
        run: |
          wsl.exe --shutdown 2>$null
          Start-Sleep -Seconds 3
          nvidia-smi --query-gpu=name,temperature.gpu,memory.used,memory.total --format=csv,noheader
          exit 0

      - name: Upload V6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neral350-scale-v6-fast-${{ github.run_id }}
          path: frontier350_scale_v6_report/
          retention-days: 30
