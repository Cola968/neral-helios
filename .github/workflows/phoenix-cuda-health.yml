name: Phoenix one-shot guarded SAFE CUDA health (NO TRAINING)

on:
  push:
    branches: [experiment/phoenix-sft-fp32-audit]
    paths: ['.github/workflows/phoenix-cuda-health.yml']

permissions:
  contents: read

concurrency:
  group: neral-nextgen-local-gpu-training
  cancel-in-progress: false

jobs:
  pinned-safe-cuda-inference-only:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 12
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - name: Isolated commit-pinned checkout; no credential persistence
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: phoenix_cuda_source_${{ github.run_id }}
          clean: false
          persist-credentials: false
      - name: Guard RTX 4070 idle state then read-only 64-token BF16 inference
        run: |
          $ErrorActionPreference = 'Stop'
          function ToWsl([string]$p) {
            $f = [IO.Path]::GetFullPath($p)
            if ($f -notmatch '^([A-Za-z]):\\(.*)$') { throw 'Absolute Windows path required' }
            return '/mnt/' + $matches[1].ToLowerInvariant() + '/' + $matches[2].Replace('\','/')
          }
          $repo = Join-Path $env:GITHUB_WORKSPACE ('phoenix_cuda_source_' + $env:GITHUB_RUN_ID)
          $assets = if ($env:NERAL_ASSETS_ROOT) { $env:NERAL_ASSETS_ROOT } else { Join-Path $env:USERPROFILE 'Documents\Codex\2026-09-05\lo\outputs\neral' }
          if (-not (Test-Path -LiteralPath $assets -PathType Container)) { throw 'Local assets unavailable: no inference' }
          if ($repo.Contains("'") -or $assets.Contains("'")) { throw 'Shell-unsafe local path: no inference' }
          $cmd = "set -euo pipefail; cd '$(ToWsl $repo)'; ~/.venvs/neral-triton-py312/bin/python -u frontier350/nextgen_v1/phoenix_cuda_diagnostic.py --execute --assets-root '$(ToWsl $assets)'"
          & wsl.exe -- bash -lc $cmd
          if ($LASTEXITCODE -ne 0) { throw 'CUDA diagnostic refused or failed: no quality/speed claim' }
          Write-Host 'Read-only CUDA inference diagnostic complete; public prompts, aggregate telemetry, no private answers and no training.'
