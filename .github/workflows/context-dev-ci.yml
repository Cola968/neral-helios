name: Context dev CI

on:
  pull_request:
    paths:
      - context_dev50.py
      - tests/test_context_dev50.py
      - .github/workflows/context-dev-ci.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile context dev suite
        run: python -m py_compile context_dev50.py
      - name: Install tests
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run context dev tests
        run: python -m pytest tests/test_context_dev50.py -q
