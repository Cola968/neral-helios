name: NERAL PR558 trusted single-file runtime correction in stable local preview
on:
  workflow_dispatch:
    inputs:
      confirmation:
        type: string
        required: true
        description: 'NERAL_PR558_VERIFIED_HISTORY_HOTFIX_APPROVED'
permissions:
  contents: read
concurrency:
  group: neral-qwen7b-r32-gpu-exclusive
  cancel-in-progress: false
jobs:
  stable-runtime-correction:
    if: inputs.confirmation == 'NERAL_PR558_VERIFIED_HISTORY_HOTFIX_APPROVED' && github.ref == 'refs/heads/feat/neral-three-tier-local-live-20261117'
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 14
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify frozen source and full question proof syntax
        run: |
          $ErrorActionPreference='Stop'
          $repo=($env:GITHUB_WORKSPACE)
          $actual=(& git -C $repo hash-object --no-filters (Join-Path $repo 'neral_three_tier_runtime.py')).Trim()
          if($actual -ne 'c2bda8aa38a7c504eda3d922e43b8e599666949b'){throw 'Source hash differs from reviewed history fix'}
          $py='D:/neral-qlora/venv/Scripts/python.exe'
          & $py -B -m py_compile (Join-Path $repo 'neral_three_tier_runtime.py')
          if($LASTEXITCODE -ne 0){throw 'New runtime syntax invalid'}
          Write-Host 'NERAL_PR558_HISTORY_PROOF_SOURCE_PINNED'
      - name: Update only NERAL-owned registered task runtime with rollback
        run: |
          $ErrorActionPreference='Stop'
          $version='909d1419c9ff'
          $taskName='NERAL-PR558-ThreeTier-'+$version
          $stable=Join-Path $env:LOCALAPPDATA ('NERAL/three-tier-pr558-'+$version+'/NERAL-1.0-Local')
          $destination=Join-Path $stable 'neral_three_tier_runtime.py'
          $source=Join-Path $env:GITHUB_WORKSPACE 'neral_three_tier_runtime.py'
          $server=Join-Path $stable 'Start-Neral-Three-Tier-Service.ps1'
          $task=Get-ScheduledTask -TaskName $taskName -ErrorAction Stop
          if(-not(Test-Path -LiteralPath $destination -PathType Leaf) -or
             -not(Test-Path -LiteralPath $server -PathType Leaf)){
            throw 'Managed NERAL stable files missing'
          }
          if([string]$task.State -ne 'Running' -or
             [string]$task.Actions[0].Arguments -notlike ('*'+$server+'*')){
            throw 'Expected exact self-owned NERAL task is not running the pinned service'
          }
          $old=(& git hash-object --no-filters $destination).Trim()
          if($old -ne '499f21c278f8c62d3ee82856f5fe8e978336f0d9'){
            throw 'Stable source drift: refuse to overwrite an unknown runtime'
          }
          $backup=Join-Path $stable 'local_state/neral_three_tier_runtime.pre-history-proof.py'
          if(Test-Path -LiteralPath $backup){throw 'History proof backup already present; refuse duplicate upgrade'}
          Copy-Item -LiteralPath $destination -Destination $backup -ErrorAction Stop
          $complete=$false
          try{
            Stop-ScheduledTask -TaskName $taskName -ErrorAction Stop
            for($i=0;$i -lt 35;$i++){
              $t=Get-ScheduledTask -TaskName $taskName
              if([string]$t.State -ne 'Running'){break}
              Start-Sleep -Milliseconds 500
            }
            $still=$false
            $probe=New-Object System.Net.Sockets.TcpClient
            try{$probe.Connect('127.0.0.1',9690);$still=$true}
            catch [System.Net.Sockets.SocketException]{}
            finally{$probe.Dispose()}
            if($still){throw 'Port remains occupied after task stop; no other local service is touched'}
            Copy-Item -LiteralPath $source -Destination $destination -Force
            $new=(& git hash-object --no-filters $destination).Trim()
            if($new -ne 'c2bda8aa38a7c504eda3d922e43b8e599666949b'){
              throw 'Upgraded local module differs from reviewed source'
            }
            Start-ScheduledTask -TaskName $taskName -ErrorAction Stop
            for($i=0;$i -lt 135;$i++){
              Start-Sleep -Milliseconds 800
              try{
                $session=New-Object Microsoft.PowerShell.Commands.WebRequestSession
                $page=Invoke-WebRequest -UseBasicParsing -WebSession $session -Uri 'http://127.0.0.1:9690/' -TimeoutSec 4
                $receipt=Invoke-RestMethod -WebSession $session -Uri 'http://127.0.0.1:9690/api/neral/preview/session' -TimeoutSec 4
                if($page.StatusCode -eq 200 -and $receipt.three_tier_enabled -eq $true){
                  $complete=$true;break
                }
              }catch{}
            }
            if(-not $complete){throw 'Upgraded preview did not start'}
            Write-Host 'NERAL_PR558_STABLE_RUNTIME_UPGRADED_HTTP_200'
          }finally{
            if(-not $complete){
              try{Stop-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue}catch{}
              Copy-Item -LiteralPath $backup -Destination $destination -Force
              try{Start-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue}catch{}
              Write-Host 'NERAL_PR558_ROLLBACK_ATTEMPTED'
            }
          }
