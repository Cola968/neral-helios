name: NERAL web-source retention CPU regression

on:
  pull_request:
    paths:
      - 'neral_web_api.py'
      - 'tests/test_neral_live_sources.py'
      - '.github/workflows/neral-web-preview-retention-ci.yml'
  push:
    branches:
      - fix/neral-web-retain-provider-previews-20261116
    paths:
      - 'neral_web_api.py'
      - 'tests/test_neral_live_sources.py'
      - '.github/workflows/neral-web-preview-retention-ci.yml'

permissions:
  contents: read

jobs:
  web-retention:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Flask>=3,<4'
      - name: Verify provider fallback preserves safe, relevant results
        run: python -B -m unittest discover -s tests -p test_neral_live_sources.py -v
