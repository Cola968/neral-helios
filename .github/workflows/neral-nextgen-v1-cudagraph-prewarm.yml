name: Neral NextGen V1 RoPE Cache CUDA Graph Recovery

on:
  push:
    branches: [experiment/nextgen-v1-isolated]
    paths: ['.github/workflows/neral-nextgen-v1-cudagraph-prewarm.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: neral-nextgen-v1-rope-cudagraph-recovery
  cancel-in-progress: false

jobs:
  guard-and-compare:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 40
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: No overlapping GPU jobs and safe RTX4070 conditions
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          foreach($id in @(35069331704,35080263936,35084101942,35084877377,35085807321,35086239657)){
            $r=Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/actions/runs/$id" -Headers $headers -Method Get -TimeoutSec 15
            if($r.status -ne 'completed'){throw "Prior GPU run $id still $($r.status): no concurrent compute"}
          }
          $gpu=(nvidia-smi --query-gpu=name --format=csv,noheader|Select-Object -First 1).Trim()
          $temp=[int]((nvidia-smi --query-gpu=temperature.gpu --format=csv,noheader,nounits|Select-Object -First 1).Trim())
          $free=[int]((nvidia-smi --query-gpu=memory.free --format=csv,noheader,nounits|Select-Object -First 1).Trim())
          if($gpu -notmatch 'RTX 4070' -or $temp -gt 78 -or $free -lt 9000){throw "GPU not safely idle: name=$gpu temp=$temp C free=$free MiB"}
          function W([string]$p){$f=[IO.Path]::GetFullPath($p); '/mnt/'+$f.Substring(0,1).ToLower()+'/'+$f.Substring(3).Replace('\','/')}
          "repo=$(W (Get-Location).Path)"|Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          exit 0

      - name: Validate probe and evidence scripts before CUDA
        run: |
          $ErrorActionPreference='Stop'; $repo='${{ steps.guard.outputs.repo }}'
          $cmd="set -e; cd '$repo'; ~/.venvs/neral-triton-py312/bin/python -m py_compile frontier350/nextgen_v1/probe.py frontier350/nextgen_v1/compare_probes.py; ~/.venvs/neral-triton-py312/bin/python -m unittest discover -v -s frontier350/nextgen_v1 -p test_probe_shape.py; ~/.venvs/neral-triton-py312/bin/python -m unittest discover -v -s frontier350/nextgen_v1 -p test_compare_probes.py"
          wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0){throw 'Safety/evidence contract test failed'}
          exit 0

      - name: Batch8 default compile unchanged control
        run: |
          $ErrorActionPreference='Stop'; $repo='${{ steps.guard.outputs.repo }}'
          $cmd="set -e; cd '$repo'; ~/.venvs/neral-triton-py312/bin/python -u frontier350/nextgen_v1/probe.py --execute --train-blocks 4 --execution compile-default --batch 8 --seq 512 --warmup 8 --steps 32 --out frontier350_nextgen_rope_recovery/default_b8.json"
          wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0){throw 'Default b8 control failed; reject candidate'}
          exit 0

      - name: Batch8 CUDA graph with prewarmed RoPE cache
        run: |
          $ErrorActionPreference='Stop'; $repo='${{ steps.guard.outputs.repo }}'
          $cmd="set -e; cd '$repo'; ~/.venvs/neral-triton-py312/bin/python -u frontier350/nextgen_v1/probe.py --execute --train-blocks 4 --execution compile-overhead --batch 8 --seq 512 --warmup 8 --steps 32 --out frontier350_nextgen_rope_recovery/reduce_b8.json"
          wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0){throw 'RoPE prewarm did not fix CUDA graphs; stop, no claim of improvement'}
          exit 0

      - name: Validate matched batch8 evidence without promotion
        run: |
          $ErrorActionPreference='Stop'; $repo='${{ steps.guard.outputs.repo }}'
          $cmd="set -e; cd '$repo'; ~/.venvs/neral-triton-py312/bin/python -u frontier350/nextgen_v1/compare_probes.py --baseline frontier350_nextgen_rope_recovery/default_b8.json --candidate frontier350_nextgen_rope_recovery/reduce_b8.json --out frontier350_nextgen_rope_recovery/ab_b8.json"
          wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0){throw 'Batch8 evidence not comparable; stop'}
          exit 0

      - name: Batch16 default compile unchanged control
        run: |
          $ErrorActionPreference='Stop'; $repo='${{ steps.guard.outputs.repo }}'
          $cmd="set -e; cd '$repo'; ~/.venvs/neral-triton-py312/bin/python -u frontier350/nextgen_v1/probe.py --execute --train-blocks 4 --execution compile-default --batch 16 --seq 512 --warmup 8 --steps 32 --out frontier350_nextgen_rope_recovery/default_b16.json"
          wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0){throw 'Default b16 control failed; reject candidate'}
          exit 0

      - name: Batch16 CUDA graph with prewarmed RoPE cache
        run: |
          $ErrorActionPreference='Stop'; $repo='${{ steps.guard.outputs.repo }}'
          $cmd="set -e; cd '$repo'; ~/.venvs/neral-triton-py312/bin/python -u frontier350/nextgen_v1/probe.py --execute --train-blocks 4 --execution compile-overhead --batch 16 --seq 512 --warmup 8 --steps 32 --out frontier350_nextgen_rope_recovery/reduce_b16.json"
          wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0){throw 'Batch16 CUDA graphs failed or guard tripped; no 50k claim'}
          exit 0

      - name: Validate matched batch16 evidence without promotion
        run: |
          $ErrorActionPreference='Stop'; $repo='${{ steps.guard.outputs.repo }}'
          $cmd="set -e; cd '$repo'; ~/.venvs/neral-triton-py312/bin/python -u frontier350/nextgen_v1/compare_probes.py --baseline frontier350_nextgen_rope_recovery/default_b16.json --candidate frontier350_nextgen_rope_recovery/reduce_b16.json --out frontier350_nextgen_rope_recovery/ab_b16.json"
          wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0){throw 'Batch16 evidence not comparable; stop'}
          exit 0

      - name: Preserve synthetic-only reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neral-nextgen-rope-recovery-${{ github.run_id }}
          path: frontier350_nextgen_rope_recovery/*.json
          if-no-files-found: warn
          retention-days: 30
