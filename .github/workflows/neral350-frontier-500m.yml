name: Neral 350M Frontier 500M Continuation

on:
  push:
    branches: [frontier/neral350-v1]
    paths:
      - 'frontier350_500m_requests/request.json'

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: neral-350m-frontier-500m
  cancel-in-progress: false

jobs:
  train500m:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 600
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - name: Checkout trusted Frontier branch
        uses: actions/checkout@v4
        with:
          ref: frontier/neral350-v1
          clean: true
          persist-credentials: false

      - name: Validate explicit bounded authorization
        id: req
        run: |
          $ErrorActionPreference='Stop'
          $p='frontier350_500m_requests\request.json'
          if(-not(Test-Path $p -PathType Leaf)){throw '500M request missing'}
          $r=Get-Content $p -Raw|ConvertFrom-Json
          $props=@($r.PSObject.Properties.Name|Sort-Object)
          if(($props -join ',') -ne 'action,architecture,data_request_id,request_id,stop_after_tokens,version'){throw 'unsupported request fields'}
          if([int]$r.version -ne 1 -or $r.action -ne 'resume_100m_to_500m'){throw 'invalid action'}
          if($r.architecture -ne 'frontier350-v1'){throw 'wrong architecture'}
          if([Int64]$r.stop_after_tokens -ne 500000000){throw 'continuation locked to 500M cumulative tokens'}
          foreach($x in @($r.request_id,$r.data_request_id)){if($x -notmatch '^[A-Za-z0-9._-]{1,64}$'){throw 'invalid request identifier'}}
          "data_id=$($r.data_request_id)" >> $env:GITHUB_OUTPUT

      - name: Resolve admitted corpus and 100M checkpoint
        id: env
        run: |
          $ErrorActionPreference='Stop'
          function W([string]$Path){$f=[IO.Path]::GetFullPath($Path);if($f -notmatch '^([A-Za-z]):\\(.*)$'){throw 'bad path'};$d=$matches[1].ToLower();$r=$matches[2] -replace '\\','/';return "/mnt/$d/$r"}
          $assets=if($env:NERAL_ASSETS_ROOT){$env:NERAL_ASSETS_ROOT}else{'C:\Users\astad\Documents\Codex\2026-09-05\lo\outputs\neral'}
          $source=Join-Path $assets 'runs\neral350_frontier_compiled_100m\resume.pt'
          $data=Join-Path $assets ('frontier350_bpe_foundation_1b_'+'${{ steps.req.outputs.data_id }}')
          $manifest=Join-Path $data 'manifest.json'
          $tokenizer=Join-Path $assets 'frontier350_assets\tokenizer.json'
          $python=Join-Path $assets 'frontier350_data_env\Scripts\python.exe'
          $out=Join-Path $assets 'runs\neral350_frontier_compiled_500m'
          foreach($p in @($source,$manifest,$tokenizer,$python)){if(-not(Test-Path $p -PathType Leaf)){throw "missing required file: $p"}}
          if(Test-Path $out){throw "refusing pre-existing 500M output path: $out"}
          & $python -c "import sys;from pathlib import Path;sys.path.insert(0,'frontier350');from security_policy350_bpe import validate_manifest;print(validate_manifest(Path(r'$manifest'),Path(r'$data'),Path(r'$tokenizer')))"
          if($LASTEXITCODE -ne 0){throw 'corpus admission re-check failed'}
          $m=Get-Content $manifest -Raw|ConvertFrom-Json
          if([Int64]$m.train_tokens -lt 1000000000){throw 'fresh training partition below 1B tokens'}
          New-Item -ItemType Directory -Force $out | Out-Null
          "repo=$(W (Get-Location).Path)" >> $env:GITHUB_OUTPUT
          "source=$(W $source)" >> $env:GITHUB_OUTPUT
          "train=$(W (Join-Path $data 'train'))" >> $env:GITHUB_OUTPUT
          "valid=$(W (Join-Path $data 'valid'))" >> $env:GITHUB_OUTPUT
          "out=$(W $out)" >> $env:GITHUB_OUTPUT
          "out_win=$out" >> $env:GITHUB_OUTPUT
          "python=$python" >> $env:GITHUB_OUTPUT
          "tokenizer_sha=$($m.tokenizer.tokenizer_sha256)" >> $env:GITHUB_OUTPUT

      - name: Resume 100M checkpoint only to 500M cumulative tokens
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ steps.env.outputs.repo }}'
          $metrics=Join-Path '${{ steps.env.outputs.out_win }}' 'metrics.jsonl'
          $telemetryArgs=@(
            'frontier350\live_telemetry.py',
            '--metrics',$metrics,
            '--repo','${{ github.repository }}',
            '--issue','97',
            '--run-id','${{ github.run_id }}',
            '--workflow','neral350-frontier-500m',
            '--interval','60'
          )
          $telemetry=Start-Process -FilePath '${{ steps.env.outputs.python }}' -ArgumentList $telemetryArgs -PassThru -NoNewWindow
          $trainExit=0
          try {
            wsl.exe -- bash -lc "set -e; cd '$repo'; export TORCHINDUCTOR_CACHE_DIR=~/.cache/neral_inductor; export CC=/usr/bin/gcc; export CXX=/usr/bin/g++; ~/.venvs/neral-triton-py312/bin/python -u frontier350/train350_compiled.py --train-data '${{ steps.env.outputs.train }}' --valid-data '${{ steps.env.outputs.valid }}' --out '${{ steps.env.outputs.out }}' --target-tokens 10000000000 --stop-after-tokens 500000000 --seq 512 --microbatch 4 --grad-accum 8 --lr 0.0003 --eval-every 500 --save-every 500 --log-every 10 --resume '${{ steps.env.outputs.source }}' --compile-mode default --numerical-check-every 1 --tokenizer-sha256 '${{ steps.env.outputs.tokenizer_sha }}'"
            $trainExit=$LASTEXITCODE
          } finally {
            if($trainExit -eq 0 -and -not $telemetry.HasExited){
              Wait-Process -Id $telemetry.Id -Timeout 70 -ErrorAction SilentlyContinue
            }
            if(-not $telemetry.HasExited){Stop-Process -Id $telemetry.Id -Force -ErrorAction SilentlyContinue}
          }
          if($trainExit -ne 0){throw 'bounded 500M continuation failed'}

      - name: Collect reports only
        if: always()
        run: |
          New-Item -ItemType Directory -Force frontier350_500m_report | Out-Null
          $out='${{ steps.env.outputs.out_win }}'
          if(-not[string]::IsNullOrWhiteSpace($out)){
            foreach($n in @('summary.json','metrics.jsonl')){$p=Join-Path $out $n;if(Test-Path $p -PathType Leaf){Copy-Item $p frontier350_500m_report\$n -Force}}
          }

      - name: Upload reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neral350-frontier-500m-${{ github.run_id }}
          path: frontier350_500m_report/
          retention-days: 30
          if-no-files-found: warn
