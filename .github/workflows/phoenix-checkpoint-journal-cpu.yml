name: Phoenix checkpoint journal recovery regression

on:
  push:
    branches: [experiment/phoenix-blind-ab-audit-20260919]
    paths:
      - '.github/workflows/phoenix-checkpoint-journal-cpu.yml'
      - 'frontier350/nextgen_v1/checkpoint_journal.py'
      - 'frontier350/nextgen_v1/test_checkpoint_journal.py'
      - 'frontier350/nextgen_v1/train_full_with_journal.py'
      - 'frontier350/nextgen_v1/storage_budget.py'

permissions:
  contents: read

concurrency:
  group: neral-checkpoint-journal-regression
  cancel-in-progress: true

jobs:
  recovery-regression:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: journal_test_${{ github.run_id }}
          clean: false
          persist-credentials: false

      - name: Run offline checkpoint journal tests
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          function ToWsl([string]$p) {
            $f=[IO.Path]::GetFullPath($p)
            if($f -notmatch '^([A-Za-z]):\\(.*)$') { throw 'Absolute Windows path required' }
            return '/mnt/' + $matches[1].ToLowerInvariant() + '/' + $matches[2].Replace('\','/')
          }
          $repo=Join-Path $env:GITHUB_WORKSPACE ('journal_test_' + $env:GITHUB_RUN_ID)
          $wsl=ToWsl $repo
          $cmd="set -euo pipefail; cd '$wsl/frontier350/nextgen_v1'; ~/.venvs/neral-triton-py312/bin/python -B -m unittest -v test_checkpoint_journal.py"
          & wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0) { throw 'Checkpoint journal regression tests failed' }
