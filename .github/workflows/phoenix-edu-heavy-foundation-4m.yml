name: Phoenix education-heavy 4Mi foundation A-B

on:
  push:
    branches: [experiment/phoenix-blind-ab-audit-20260919]
    paths:
      - '.github/workflows/phoenix-edu-heavy-foundation-4m.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neral-nextgen-local-gpu-training
  cancel-in-progress: false

jobs:
  edu-heavy-4m:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"

    steps:
      - name: Checkout exact education-heavy revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: phoenix_edu_heavy_${{ github.run_id }}
          clean: false
          persist-credentials: false

      - name: Build controlled corpus, train exact 4Mi, compare with current 4Mi leader
        run: |
          $ErrorActionPreference='Stop'
          function ToWsl([string]$p) {
            $f=[IO.Path]::GetFullPath($p)
            if($f -notmatch '^([A-Za-z]):\\(.*)$'){throw 'Absolute Windows path required'}
            return '/mnt/'+$matches[1].ToLowerInvariant()+'/'+$matches[2].Replace('\','/')
          }

          $repo=Join-Path $env:GITHUB_WORKSPACE ('phoenix_edu_heavy_'+$env:GITHUB_RUN_ID)
          $anchor='D:\NeralScaleV81\_continuity_v5\continuity_002073161216_f7a73e283421.pt'
          $anchorSha='f7a73e283421975acc34e13afc38378be4eab11da34e8e6b46fc7cb0cda883e7'
          $reference='D:\NeralPrivateAssets\phoenix\foundation_train_35972614466\resume.pt'
          $referenceSha='d54d3f752b22be09257164459c3bf56b0dd5c430db023882c4546430988a4963'
          $assets=if($env:NERAL_ASSETS_ROOT){$env:NERAL_ASSETS_ROOT}else{Join-Path $env:USERPROFILE 'Documents\Codex\2026-09-05\lo\outputs\neral'}
          $tokenizer=Join-Path $assets 'frontier350_assets\tokenizer.json'
          $private='D:\NeralPrivateAssets\phoenix'
          $corpus=Join-Path $private ('edu_heavy_refresh_'+$env:GITHUB_RUN_ID)
          $trainOut=Join-Path $private ('edu_heavy_train_'+$env:GITHUB_RUN_ID)
          $anchorEval=Join-Path $trainOut 'anchor_ab.json'
          $mixEval=Join-Path $trainOut 'mix_ab.json'

          foreach($p in @($repo,$anchor,$reference,$assets,$tokenizer,$private,$corpus,$trainOut,$anchorEval,$mixEval)){
            if($p.Contains("'")){throw 'Unsafe quote in path'}
          }
          foreach($p in @($anchor,$reference,$tokenizer)){
            if(-not(Test-Path -LiteralPath $p -PathType Leaf)){throw "Required file missing: $p"}
          }
          if((Get-FileHash -LiteralPath $anchor -Algorithm SHA256).Hash.ToLowerInvariant() -ne $anchorSha){throw 'Anchor SHA mismatch'}
          if((Get-FileHash -LiteralPath $reference -Algorithm SHA256).Hash.ToLowerInvariant() -ne $referenceSha){throw 'Current 4Mi reference SHA mismatch'}
          if((Get-FileHash -LiteralPath $tokenizer -Algorithm SHA256).Hash.ToLowerInvariant() -ne '4a25bb40ad66e2d5a674d32e95bc0076d13cdb4decb4d508226124711e2aa7dd'){throw 'Tokenizer SHA mismatch'}
          if((Test-Path -LiteralPath $corpus) -or (Test-Path -LiteralPath $trainOut)){throw 'Create-only output path already exists'}
          if((Get-PSDrive D).Free -lt 25GB){throw 'Less than 25 GiB free on D:'}

          $build="set -euo pipefail; cd '$(ToWsl $repo)'; test -x ~/.venvs/neral-triton-py312/bin/python; rm -rf .edu_deps; ~/.venvs/neral-triton-py312/bin/python -m pip install --disable-pip-version-check --no-input --quiet --target .edu_deps 'datasets==4.1.1' 'huggingface-hub>=0.34,<1.0'; export PYTHONPATH=.edu_deps:frontier350:frontier350/nextgen_v1; ~/.venvs/neral-triton-py312/bin/python -B -m py_compile frontier350/nextgen_v1/build_phoenix_edu_heavy_bpe_data.py frontier350/nextgen_v1/phoenix_foundation_refresh_dev.py frontier350/nextgen_v1/phoenix_foundation_refresh_public_dev_eval.py frontier350/nextgen_v1/phoenix_foundation_mix_ab.py; ~/.venvs/neral-triton-py312/bin/python -B -u frontier350/nextgen_v1/build_phoenix_edu_heavy_bpe_data.py --root '$(ToWsl $corpus)' --tokenizer '$(ToWsl $tokenizer)' --train-tokens 20000000 --valid-tokens 500000 --shard-tokens 5000000"
          & wsl.exe -- bash -lc $build
          if($LASTEXITCODE -ne 0){throw 'Education-heavy corpus build failed'}

          $manifest=Join-Path $corpus 'manifest.json'
          if(-not(Test-Path -LiteralPath $manifest -PathType Leaf)){throw 'Education-heavy manifest missing'}
          $manifestSha=(Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash.ToLowerInvariant()
          $m=Get-Content -LiteralPath $manifest -Raw|ConvertFrom-Json
          if($m.development_mix_profile -ne 'edu-heavy-75-10-15-v1'){throw 'Wrong education-heavy profile'}
          if([math]::Abs([double]$m.source_mix.fineweb_edu_en-0.75) -gt 1e-12 -or
             [math]::Abs([double]$m.source_mix.fineweb_en-0.10) -gt 1e-12 -or
             [math]::Abs([double]$m.source_mix.fineweb2_de-0.15) -gt 1e-12){throw 'Education-heavy source mix mismatch'}
          if($m.finemath_candidate_included -ne $false -or $m.production_eligible -ne $false){throw 'Unsafe corpus state'}

          Write-Host 'Pre-training GPU telemetry:'
          nvidia-smi --query-gpu=name,memory.total,memory.free,utilization.gpu,temperature.gpu --format=csv,noheader
          if($LASTEXITCODE -ne 0){throw 'GPU telemetry failed'}

          $train="set -euo pipefail; cd '$(ToWsl $repo)'; export PYTHONPATH=.edu_deps:frontier350:frontier350/nextgen_v1; ~/.venvs/neral-triton-py312/bin/python -B -u frontier350/nextgen_v1/phoenix_foundation_refresh_dev.py --execute --trusted-own-checkpoint --source-checkpoint '$(ToWsl $anchor)' --assets-root '$(ToWsl $assets)' --corpus-root '$(ToWsl $corpus)' --manifest-sha256 '$manifestSha' --out '$(ToWsl $trainOut)' --target-new-tokens 20000000 --stop-after-new-tokens 4194304 --seq 256 --microbatch 4 --grad-accum 1 --lr 0.00001 --compile-mode default"
          & wsl.exe -- bash -lc $train
          if($LASTEXITCODE -ne 0){throw 'Education-heavy 4Mi foundation training failed'}

          $summary=Get-Content -LiteralPath (Join-Path $trainOut 'summary.json') -Raw|ConvertFrom-Json
          if([int64]$summary.new_processed_tokens -ne 4194304 -or [int]$summary.layers_trained -ne 24){throw 'Education-heavy training did not reach exact 4Mi boundary'}
          if($summary.master_parameter_dtype -ne 'float32' -or $summary.adamw_moment_dtype -ne 'float32' -or $summary.compute_autocast_dtype -ne 'bfloat16'){throw 'Precision contract mismatch'}
          $candidate=Join-Path $trainOut 'resume.pt'
          $candidateSha=([string]$summary.resume_sha256).ToLowerInvariant()
          if((Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant() -ne $candidateSha){throw 'Education-heavy candidate SHA mismatch'}

          $evalAnchor="set -euo pipefail; cd '$(ToWsl $repo)'; export PYTHONPATH=.edu_deps:frontier350:frontier350/nextgen_v1; ~/.venvs/neral-triton-py312/bin/python -B -u frontier350/nextgen_v1/phoenix_foundation_refresh_public_dev_eval.py --execute --trusted-own-checkpoints --base-checkpoint '$(ToWsl $anchor)' --candidate-checkpoint '$(ToWsl $candidate)' --candidate-sha256 '$candidateSha' --assets-root '$(ToWsl $assets)' --out '$(ToWsl $anchorEval)'"
          & wsl.exe -- bash -lc $evalAnchor
          if($LASTEXITCODE -ne 0){throw 'Education-heavy anchor A/B failed'}

          $evalMix="set -euo pipefail; cd '$(ToWsl $repo)'; export PYTHONPATH=.edu_deps:frontier350:frontier350/nextgen_v1; ~/.venvs/neral-triton-py312/bin/python -B -u frontier350/nextgen_v1/phoenix_foundation_mix_ab.py --execute --trusted-own-checkpoints --reference '$(ToWsl $reference)' --reference-sha256 '$referenceSha' --candidate '$(ToWsl $candidate)' --candidate-sha256 '$candidateSha' --assets-root '$(ToWsl $assets)' --out '$(ToWsl $mixEval)'"
          & wsl.exe -- bash -lc $evalMix
          if($LASTEXITCODE -ne 0){throw 'Direct 4Mi mix A/B failed'}

          $ab=Get-Content -LiteralPath $mixEval -Raw|ConvertFrom-Json
          if($ab.production_eligible -ne $false -or $ab.independent_holdout -ne $false -or $ab.same_new_token_boundary -ne $true){throw 'Unsafe mix A/B state'}
          Write-Host '=== EDUCATION-HEAVY 4Mi DEVELOPMENT RECEIPT ==='
          [ordered]@{
            profile=$m.development_mix_profile
            manifest_sha256=$manifestSha
            candidate_sha256=$candidateSha
            training_wall_seconds=$summary.training_wall_seconds
            best_validation_loss=$summary.best_validation_loss
            reference=$ab.reference.summary
            candidate=$ab.candidate.summary
            delta=$ab.delta_candidate_minus_reference
            knowledge_delta=$ab.knowledge_delta_pct
            digit_delta=$ab.digit_delta
            production_eligible=$ab.production_eligible
          } | ConvertTo-Json -Compress -Depth 12 | Write-Host
          Write-Host 'All corpus shards/checkpoints/detailed generations remain local on D:.'

      - name: Post-run GPU telemetry
        if: always()
        run: |
          nvidia-smi --query-gpu=name,memory.used,memory.free,utilization.gpu,temperature.gpu --format=csv,noheader
