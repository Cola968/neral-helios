name: Neral 350M Throughput 50K V1

on:
  push:
    branches: [experiment/throughput-50k-v1]
    paths: ['frontier350_throughput_50k_v1_requests/request.json']

permissions:
  contents: read
  issues: write

concurrency:
  group: neral-350m-throughput-50k-v1
  cancel-in-progress: false

jobs:
  throughput-sweep:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: Verify benchmark request and RTX 4070 headroom
        id: request
        run: |
          $ErrorActionPreference='Stop'
          try {
            $request=Get-Content frontier350_throughput_50k_v1_requests/request.json -Raw|ConvertFrom-Json
            if((($request.PSObject.Properties.Name|Sort-Object) -join ',') -ne 'action,request_id,target_tps,updates,version,warmup_updates'){throw 'unexpected request fields'}
            if($request.version -ne 1 -or $request.action -ne 'run_throughput_50k_v1'){throw 'invalid action/version'}
            if($request.target_tps -ne 50000){throw 'V1 target must be exactly 50000 tok/s'}
            if($request.updates -lt 8 -or $request.updates -gt 30){throw 'updates outside bounded benchmark range'}
            if($request.warmup_updates -lt 1 -or $request.warmup_updates -ge ($request.updates-2)){throw 'invalid warmup range'}
            if($request.request_id -notmatch '^[A-Za-z0-9._-]{1,64}$'){throw 'unsafe request id'}

            wsl.exe --shutdown
            Start-Sleep -Seconds 5
            $gpu=(nvidia-smi --query-gpu=name --format=csv,noheader | Select-Object -First 1).Trim()
            $temp=[int]((nvidia-smi --query-gpu=temperature.gpu --format=csv,noheader,nounits | Select-Object -First 1).Trim())
            $free=[int]((nvidia-smi --query-gpu=memory.free --format=csv,noheader,nounits | Select-Object -First 1).Trim())
            Write-Host ("GPU="+$gpu)
            Write-Host ("GPUStartTempC="+$temp)
            Write-Host ("GPUFreeVRAMMiB="+$free)
            if($gpu -notmatch 'RTX 4070'){throw 'expected RTX 4070 runner'}
            if($temp -ge 85){throw 'GPU too hot to begin sweep'}
            if($free -lt 9000){throw ("Need >=9000 MiB free VRAM for safe geometry sweep; found "+$free)}

            $assets=if($env:NERAL_ASSETS_ROOT){$env:NERAL_ASSETS_ROOT}else{'C:\Users\astad\Documents\Codex\2026-09-05\lo\outputs\neral'}
            $cdrive=Get-PSDrive -Name ([IO.Path]::GetPathRoot($assets).Substring(0,1))
            $ddrive=Get-PSDrive -Name 'D' -ErrorAction Stop
            if($cdrive.Free -lt 10GB){throw 'need >=10 GiB free on assets drive'}
            if($ddrive.Free -lt 20GB){throw 'need >=20 GiB free on D: scratch'}
            $scratchWin=Join-Path 'D:\NeralThroughput50kV1' ([string]$request.request_id)
            if(Test-Path -LiteralPath $scratchWin){throw 'scratch path already exists; refusing overwrite'}

            function W([string]$p){
              $full=[IO.Path]::GetFullPath($p)
              return '/mnt/'+$full.Substring(0,1).ToLower()+'/'+$full.Substring(3).Replace('\','/')
            }
            $outputs=@(
              "repo=$(W (Get-Location).Path)",
              "assets=$(W $assets)",
              "scratch=$(W $scratchWin)",
              "request_id=$($request.request_id)",
              "target_tps=$($request.target_tps)",
              "updates=$($request.updates)",
              "warmup=$($request.warmup_updates)"
            )
            $utf8NoBom=New-Object System.Text.UTF8Encoding($false)
            foreach($line in $outputs){
              [IO.File]::AppendAllText($env:GITHUB_OUTPUT,$line+[Environment]::NewLine,$utf8NoBom)
              Write-Host ("OUTPUT "+$line)
            }
            $global:LASTEXITCODE=0
            Write-Host 'Throughput preflight passed.'
            exit 0
          } catch {
            Write-Error ("Throughput preflight failed: "+$_.Exception.Message)
            exit 1
          }

      - name: Runtime and source checks
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ steps.request.outputs.repo }}'
          $cmd="set -e; cd '$repo'; bash frontier350/ensure_eval_runtime.sh; ~/.venvs/neral-triton-py312/bin/python -m py_compile frontier350/train_guarded_v9.py frontier350/benchmark_throughput_50k_v1.py"
          wsl.exe -- bash -lc $cmd
          $code=$LASTEXITCODE
          wsl.exe --shutdown
          Start-Sleep -Seconds 3
          if($code -ne 0){throw 'throughput runtime/source checks failed'}
          exit 0

      - name: Sweep execution geometry toward 50K tok/s
        id: sweep
        env:
          NERAL_TELEMETRY_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ steps.request.outputs.repo }}'
          $assets='${{ steps.request.outputs.assets }}'
          $scratch='${{ steps.request.outputs.scratch }}'
          $rid='${{ steps.request.outputs.request_id }}'
          $target='${{ steps.request.outputs.target_tps }}'
          $updates='${{ steps.request.outputs.updates }}'
          $warmup='${{ steps.request.outputs.warmup }}'

          # Live telemetry is a CPU/network sidecar. It never touches model tensors,
          # CUDA state, optimizer state, datasets or the training process.
          $scratchWin=Join-Path 'D:\NeralThroughput50kV1' $rid
          $reportWin=Join-Path (Get-Location).Path 'frontier350_throughput_50k_v1_report'
          $stopFile=Join-Path $env:RUNNER_TEMP ("neral-live-"+$rid+".stop")
          Remove-Item -LiteralPath $stopFile -Force -ErrorAction SilentlyContinue
          $telemetryScript=Join-Path (Get-Location).Path 'frontier350\live_telemetry.ps1'
          $telemetry=Start-Job -ScriptBlock {
            param($script,$scratchWin,$reportWin,$stopFile,$repoName,$runId,$targetTps,$updatesPerTrial)
            & $script -ScratchWin $scratchWin -ReportWin $reportWin -StopFile $stopFile -Repo $repoName -IssueNumber 102 -RunId $runId -TargetTps ([double]$targetTps) -UpdatesPerTrial ([int]$updatesPerTrial) -IntervalSeconds 20 -TotalTrials 7
          } -ArgumentList $telemetryScript,$scratchWin,$reportWin,$stopFile,'${{ github.repository }}','${{ github.run_id }}',$target,$updates

          $cmd="set -e; cd '$repo'; export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True; export CUDA_MODULE_LOADING=LAZY; export TORCHINDUCTOR_CACHE_DIR=~/.cache/neral_inductor; export CC=/usr/bin/gcc; export CXX=/usr/bin/g++; ~/.venvs/neral-triton-py312/bin/python -u frontier350/benchmark_throughput_50k_v1.py --assets '$assets' --report frontier350_throughput_50k_v1_report --scratch '$scratch' --request-id '$rid' --target-tps '$target' --updates '$updates' --warmup-updates '$warmup'"
          try {
            wsl.exe -- bash -lc $cmd
            $code=$LASTEXITCODE
          } finally {
            New-Item -ItemType File -Path $stopFile -Force | Out-Null
            Wait-Job -Job $telemetry -Timeout 30 | Out-Null
            Receive-Job -Job $telemetry -ErrorAction SilentlyContinue | Out-Null
            Stop-Job -Job $telemetry -ErrorAction SilentlyContinue
            Remove-Job -Job $telemetry -Force -ErrorAction SilentlyContinue
          }
          wsl.exe --shutdown
          Start-Sleep -Seconds 4
          if($code -ne 0){throw 'bounded throughput sweep failed; no training configuration adopted'}
          exit 0

      - name: Print selection
        if: success()
        run: |
          $selection=Get-Content frontier350_throughput_50k_v1_report/selection.json -Raw|ConvertFrom-Json
          Write-Host ("TARGET_REACHED="+$selection.target_reached)
          Write-Host ("BASELINE_MEDIAN_TPS="+$selection.baseline.median_tps)
          Write-Host ("BEST="+$selection.best.name)
          Write-Host ("BEST_MEDIAN_TPS="+$selection.best.median_tps)
          Write-Host ("BEST_P10_TPS="+$selection.best.p10_tps)
          Write-Host ("SPEEDUP="+$selection.speedup_vs_legacy)
          Write-Host ("PEAK_ALLOCATED_GIB="+$selection.best.peak_allocated_gib)
          Write-Host ("PEAK_RESERVED_GIB="+$selection.best.peak_reserved_gib)
          exit 0

      - name: Final runner health
        if: always()
        run: |
          wsl.exe --shutdown
          Start-Sleep -Seconds 3
          nvidia-smi --query-gpu=name,temperature.gpu,memory.used,memory.total --format=csv,noheader
          exit 0

      - name: Upload throughput evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neral350-throughput-50k-v1-${{ github.run_id }}
          path: frontier350_throughput_50k_v1_report/
          retention-days: 30
