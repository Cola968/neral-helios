name: Neral GPU Control Bridge

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Read-only GPU action"
        required: true
        default: "gpu_status"
        type: choice
        options:
          - gpu_status
          - inspect_b2
          - benchmark_b2
          - run_tests
      request_id:
        description: "Audit id (A-Z, a-z, 0-9, dot, underscore, dash)"
        required: true
        default: "manual"
        type: string
  push:
    branches:
      - gpu-control-run
    paths:
      - gpu_requests/request.json

permissions:
  contents: read

# Share the B2 lock so a benchmark cannot overlap a GitHub-managed B2 writer.
# Astra/local processes are outside GitHub concurrency and must still be stopped before benchmarking.
concurrency:
  group: neral-50m-b2-100m
  cancel-in-progress: false

jobs:
  control:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 300
    defaults:
      run:
        shell: powershell
        working-directory: src

    steps:
      - name: Checkout trusted control code from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: src
          clean: true
          persist-credentials: false

      - name: Checkout request revision only
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: requestsrc
          clean: true
          persist-credentials: false

      - name: Validate private RTX environment
        id: env
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:NERAL_ASSETS_ROOT) { throw 'NERAL_ASSETS_ROOT is required.' }
          if (-not $env:NERAL_PYTHON) { throw 'NERAL_PYTHON is required.' }
          if (-not (Test-Path $env:NERAL_ASSETS_ROOT -PathType Container)) { throw 'NERAL_ASSETS_ROOT does not exist.' }
          if (-not (Test-Path $env:NERAL_PYTHON -PathType Leaf)) { throw 'NERAL_PYTHON does not exist.' }
          "assets=$env:NERAL_ASSETS_ROOT" >> $env:GITHUB_OUTPUT
          "python=$env:NERAL_PYTHON" >> $env:GITHUB_OUTPUT
          & $env:NERAL_PYTHON -c "import torch; assert torch.cuda.is_available(); assert torch.cuda.is_bf16_supported(); print(torch.cuda.get_device_name(0))"

      - name: Materialize restricted request
        env:
          CONTROL_ACTION: ${{ inputs.action }}
          CONTROL_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.event_name }}' -eq 'push') {
            $source = Join-Path '..\requestsrc' 'gpu_requests\request.json'
            if (-not (Test-Path $source -PathType Leaf)) { throw 'gpu_requests/request.json missing from trigger revision.' }
            Copy-Item $source 'control_request.json' -Force
          } else {
            if ($env:CONTROL_REQUEST_ID -notmatch '^[A-Za-z0-9._-]{1,64}$') { throw 'Invalid request_id.' }
            $allowed = @('gpu_status','inspect_b2','benchmark_b2','run_tests')
            if ($allowed -notcontains $env:CONTROL_ACTION) { throw 'Unsupported action.' }
            [ordered]@{version=1;request_id=$env:CONTROL_REQUEST_ID;action=$env:CONTROL_ACTION} |
              ConvertTo-Json -Compress | Set-Content -Encoding utf8 'control_request.json'
          }
          Get-Content 'control_request.json'

      - name: Execute allow-listed control action
        run: |
          $ErrorActionPreference = 'Stop'
          & '${{ steps.env.outputs.python }}' -X utf8 gpu_control_bridge.py `
            --request control_request.json `
            --assets '${{ steps.env.outputs.assets }}' `
            --reports gpu_control_reports

      - name: Reject private model or corpus uploads
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'gpu_control_reports') {
            $bad = Get-ChildItem 'gpu_control_reports' -Recurse -File | Where-Object {
              $_.Extension -in '.pt','.pth','.bin','.safetensors','.parquet','.gz'
            }
            if ($bad) { throw 'Private checkpoint/corpus found in control report directory.' }
          }

      - name: Persist reports locally
        if: always()
        run: |
          $dest = Join-Path '${{ steps.env.outputs.assets }}' ('reports\gpu_control\' + $env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          if (Test-Path 'gpu_control_reports') { Copy-Item 'gpu_control_reports\*' $dest -Recurse -Force }
          Write-Host "Persisted reports to $dest"

      - name: Upload reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neral-gpu-control-${{ github.run_id }}
          path: src/gpu_control_reports/
          if-no-files-found: warn
          retention-days: 14
