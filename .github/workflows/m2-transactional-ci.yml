name: Neral 50M M2 transactional CI

on:
  pull_request:
    paths:
      - 'm2_transactional50.py'
      - 'train_m2_pareto50.py'
      - 'tests/test_m2_transactional50.py'
      - '.github/workflows/m2-transactional-ci.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile M2 implementation
        run: python -m py_compile m2_transactional50.py train_m2_pareto50.py
      - name: Install tests
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run M2 transactional policy tests
        run: python -m pytest tests/test_m2_transactional50.py -q
