name: Phoenix replay-protected auto-SFT development sweep

on:
  workflow_dispatch:
    inputs:
      main_data_path:
        description: 'Absolute Windows path to admitted foundation train shards'
        required: true
        type: string
      foundation_admission_path:
        description: 'Absolute Windows path to foundation_corpus_admission_pass JSON'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: neral-nextgen-local-gpu-training
  cancel-in-progress: false

jobs:
  replay-sft:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 60
    steps:
      - name: Checkout exact replay-SFT revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: phoenix_replay_sft_${{ github.run_id }}
          clean: false
          persist-credentials: false

      - name: Verify foundation bytes and run replay-protected SFT sweep
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          function ToWsl([string]$p) {
            $f=[IO.Path]::GetFullPath($p)
            if($f -notmatch '^([A-Za-z]):\\(.*)$'){throw 'Absolute Windows path required'}
            return '/mnt/'+$matches[1].ToLowerInvariant()+'/'+$matches[2].Replace('\','/')
          }
          $repo=Join-Path $env:GITHUB_WORKSPACE ('phoenix_replay_sft_'+$env:GITHUB_RUN_ID)
          $base='D:\NeralScaleV81\_continuity_v5\continuity_002073161216_f7a73e283421.pt'
          $assets=if($env:NERAL_ASSETS_ROOT){$env:NERAL_ASSETS_ROOT}else{Join-Path $env:USERPROFILE 'Documents\Codex\2026-09-05\lo\outputs\neral'}
          $private='D:\NeralPrivateAssets'
          $archive=Join-Path $private 'sft50_sources\2023-11-05_oasst2_ready.messages.jsonl.gz'
          $main='${{ inputs.main_data_path }}'
          $admission='${{ inputs.foundation_admission_path }}'
          $replay=Join-Path $assets 'frontier350_replay_v9_20260912'
          $out=Join-Path $private ('phoenix\replay_sft_sweep_'+$env:GITHUB_RUN_ID)
          foreach($p in @($repo,$base,$assets,$private,$archive,$main,$admission,$replay,$out)){if($p.Contains("'")){throw 'Unsafe quote in path'}}
          foreach($p in @($base,$archive,$admission)){if(-not(Test-Path -LiteralPath $p -PathType Leaf)){throw 'Required file missing'}}
          foreach($p in @($assets,$private,$main,$replay)){if(-not(Test-Path -LiteralPath $p -PathType Container)){throw 'Required directory missing'}}
          if(Test-Path -LiteralPath $out){throw 'Create-only output exists'}
          nvidia-smi --query-gpu=name,memory.free,utilization.gpu,temperature.gpu --format=csv,noheader

          $cmd="set -euo pipefail; cd '$(ToWsl $repo)'; test -x ~/.venvs/neral-triton-py312/bin/python; ~/.venvs/neral-triton-py312/bin/python -B -m py_compile frontier350/nextgen_v1/phoenix_replay_protected_sft_sweep.py; ~/.venvs/neral-triton-py312/bin/python -B -u frontier350/nextgen_v1/phoenix_replay_protected_sft_sweep.py --execute --trusted-own-checkpoint --checkpoint '$(ToWsl $base)' --assets-root '$(ToWsl $assets)' --private-root '$(ToWsl $private)' --archive '$(ToWsl $archive)' --main-data '$(ToWsl $main)' --foundation-admission '$(ToWsl $admission)' --replay '$(ToWsl $replay)' --out '$(ToWsl $out)'"
          & wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0){throw 'Replay-protected SFT sweep failed'}

          $report=Join-Path $out 'report.json'
          if(-not(Test-Path -LiteralPath $report -PathType Leaf)){throw 'Replay-SFT report missing'}
          $r=Get-Content -LiteralPath $report -Raw|ConvertFrom-Json
          if($r.production_eligible -ne $false -or $r.human_review_complete -ne $false -or $r.independent_holdout_checked -ne $false){throw 'Unsafe promotion state'}
          Write-Host '=== SAFE REPLAY-SFT SUMMARY ==='
          [ordered]@{baseline=$r.baseline;qualified_count=$r.qualified_count;selected=$r.selected;candidate_checkpoint_written=$r.candidate_checkpoint_written;candidate_sha256=$r.candidate_sha256;production_eligible=$r.production_eligible}|ConvertTo-Json -Compress -Depth 8|Write-Host

      - name: Post-run GPU telemetry
        if: always()
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          nvidia-smi --query-gpu=name,memory.used,memory.free,utilization.gpu,temperature.gpu --format=csv,noheader
          Write-Host 'All data and checkpoint outputs remain local; nothing uploaded as an artifact.'
