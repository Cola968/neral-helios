name: NERAL v6 verified error replay CPU contracts
on:
  pull_request:
    paths:
      - 'scripts/neral_v6_replay_guard.py'
      - 'tests/test_neral_v6_replay_guard.py'
      - 'docs/NERAL_V6_REPLAY_GUARD.md'
      - '.github/workflows/neral-v6-replay-guard-ci.yml'
  push:
    paths:
      - 'scripts/neral_v6_replay_guard.py'
      - 'tests/test_neral_v6_replay_guard.py'
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test verified replay and held-out leakage protections
        run: python -m unittest discover -s tests -p test_neral_v6_replay_guard.py -v
      - name: Check syntax
        run: python -m py_compile scripts/neral_v6_replay_guard.py
