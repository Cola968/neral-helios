name: NERAL V4.3 Obsidian Math CPU-only
on:
  push:
    branches: ['feat/v43-obsidian-math-falsification-first-20261123']
    paths: ['scripts/neral_v43_obsidian_math.py','tests/test_neral_v43_math_cpu.py','.github/workflows/neral-v43-math-cpu.yml']
  pull_request:
    paths: ['scripts/neral_v43_obsidian_math.py','tests/test_neral_v43_math_cpu.py','.github/workflows/neral-v43-math-cpu.yml']
permissions:
  contents: read
jobs:
  math-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'sympy>=1.13,<2' 'z3-solver>=4.13,<5'
      - run: python -m py_compile scripts/neral_v43_obsidian_math.py tests/test_neral_v43_math_cpu.py
      - run: python -m unittest discover -s tests -p test_neral_v43_math_cpu.py -v
