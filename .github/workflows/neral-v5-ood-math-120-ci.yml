name: NERAL v5 novel math 120 CPU contracts
on:
  pull_request:
    paths:
      - 'scripts/neral_v5_ood_math_eval.py'
      - 'tests/test_neral_v5_ood_math_eval.py'
      - '.github/workflows/neral-v5-ood-math-120.yml'
      - '.github/workflows/neral-v5-ood-math-120-ci.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/neral_v5_ood_math_eval.py'
      - 'tests/test_neral_v5_ood_math_eval.py'
      - '.github/workflows/neral-v5-ood-math-120.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q scripts/neral_v5_ood_math_eval.py tests/test_neral_v5_ood_math_eval.py
      - run: python -m unittest discover -s tests -p test_neral_v5_ood_math_eval.py -v
