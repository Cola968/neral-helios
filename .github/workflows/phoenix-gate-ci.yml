name: Phoenix read-only evidence CPU tests
on:
  push:
    branches:
      - experiment/phoenix-sft-fp32-audit
    paths:
      - frontier350/nextgen_v1/phoenix_gate.py
      - frontier350/nextgen_v1/test_phoenix_gate.py
      - frontier350/nextgen_v1/phoenix_capture.py
      - frontier350/nextgen_v1/test_phoenix_capture.py
      - .github/workflows/phoenix-gate-ci.yml
  pull_request:
    branches:
      - experiment/nextgen-v1-isolated
    paths:
      - frontier350/nextgen_v1/phoenix_gate.py
      - frontier350/nextgen_v1/test_phoenix_gate.py
      - frontier350/nextgen_v1/phoenix_capture.py
      - frontier350/nextgen_v1/test_phoenix_capture.py
      - .github/workflows/phoenix-gate-ci.yml
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile frontier350/nextgen_v1/phoenix_gate.py frontier350/nextgen_v1/phoenix_capture.py frontier350/nextgen_v1/test_phoenix_gate.py frontier350/nextgen_v1/test_phoenix_capture.py
      - name: Run isolated synthetic contract tests
        run: python -m unittest discover -v -s frontier350/nextgen_v1 -p 'test_phoenix_*.py'
      - name: Evidence boundary
        run: echo 'CPU synthetic contracts only; NO GPU training, checkpoint inference, quality improvement or promotion.'
