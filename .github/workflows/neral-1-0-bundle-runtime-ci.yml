name: NERAL 1.0 extracted ZIP runtime and import closure
on:
  pull_request:
    paths:
      - 'scripts/build_neral_1_0_preview.py'
      - 'neral_logic_engine.py'
      - 'neral_logic_transfer.py'
      - 'neral_agent_autonomy.py'
      - 'neral_agent_sandbox.py'
      - 'solve.py'
      - 'tests/test_neral_1_0_standalone_release.py'
      - '.github/workflows/neral-1-0-bundle-runtime-ci.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/build_neral_1_0_preview.py'
      - 'neral_logic_engine.py'
      - 'neral_logic_transfer.py'
      - 'neral_agent_autonomy.py'
      - 'neral_agent_sandbox.py'
      - 'solve.py'
      - 'tests/test_neral_1_0_standalone_release.py'
permissions:
  contents: read
jobs:
  extracted-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-neral-preview.txt
      - name: Extract ZIP and invoke actual verified logic from installed files
        run: python -m unittest discover -s tests -p test_neral_1_0_standalone_release.py -v
      - name: Compile runtime imports and bundle script
        run: python -m py_compile neral_logic_transfer.py neral_logic_engine.py scripts/build_neral_1_0_preview.py
