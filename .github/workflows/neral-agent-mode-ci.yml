name: NERAL local agent mode
on:
  pull_request:
    paths:
      - 'agent_mode.py'
      - 'agent_quickfix.py'
      - 'agent_api.py'
      - 'app.py'
      - 'templates/index.html'
      - 'static/agent-mode.*'
      - 'tests/test_agent_*'
      - 'tests/test_agent_quickfix.py'
      - '.github/workflows/neral-agent-mode-ci.yml'
  push:
    branches: [main]
    paths:
      - 'agent_mode.py'
      - 'agent_quickfix.py'
      - 'agent_api.py'
      - 'tests/test_agent_*'
      - 'tests/test_agent_quickfix.py'
permissions:
  contents: read
jobs:
  local-agent-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Flask>=3,<4' pytest
      - run: python -m pytest -q tests/test_agent_mode.py tests/test_agent_api.py tests/test_agent_quickfix.py
      - run: node --check static/agent-mode.js
      - run: node --test tests/test_agent_ui.cjs
