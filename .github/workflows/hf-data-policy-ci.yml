name: HF data policy CI

on:
  pull_request:
    paths:
      - 'hf_source_policy50.py'
      - 'fetch_oasst2_sft50.py'
      - 'build_targeted_sft50_oasst2.py'
      - 'prepare_gsm8k_holdout50.py'
      - 'benchmark_gsm8k50.py'
      - 'run_50m_i1.py'
      - 'tests/test_hf_data_policy50.py'
      - 'tests/test_public_eval_policy50.py'
      - 'tests/test_gsm8k_benchmark50.py'
      - '.github/workflows/hf-data-policy-ci.yml'
  push:
    branches:
      - hf-oasst2-data-policy

permissions:
  contents: read

jobs:
  policy-and-human-data-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest numpy
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile HF data and external-eval pipeline
        run: |
          python -m py_compile hf_source_policy50.py fetch_oasst2_sft50.py build_targeted_sft50_oasst2.py prepare_gsm8k_holdout50.py benchmark_gsm8k50.py run_50m_i1.py
      - name: Validate source registry
        run: python hf_source_policy50.py > /tmp/hf-source-policy.json
      - name: Run OASST2 and external-holdout contract tests
        run: |
          python -m pytest tests/test_hf_data_policy50.py tests/test_public_eval_policy50.py tests/test_gsm8k_benchmark50.py -q
