name: Neral 350M Frontier RTX Pilot

on:
  push:
    branches: [frontier/neral350-v1]
    paths:
      - 'frontier350/model350.py'
      - 'frontier350/bench350.py'
      - '.github/workflows/neral350-frontier-pilot.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: neral-350m-frontier-pilot
  cancel-in-progress: true

jobs:
  rtx-pilot:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frontier/neral350-v1
          clean: true
          persist-credentials: false
      - name: Resolve GPU environment
        id: env
        run: |
          $ErrorActionPreference='Stop'
          $assets = if($env:NERAL_ASSETS_ROOT){$env:NERAL_ASSETS_ROOT}else{'C:\Users\astad\Documents\Codex\2026-09-05\lo\outputs\neral'}
          $python = if($env:NERAL_PYTHON){$env:NERAL_PYTHON}else{Join-Path $assets '.venv\Scripts\python.exe'}
          if(-not(Test-Path $python -PathType Leaf)){throw "Python missing: $python"}
          & $python -c "import torch; assert torch.cuda.is_available() and torch.cuda.is_bf16_supported(); print(torch.cuda.get_device_name(0)); print(torch.__version__); print(torch.version.cuda)"
          if($LASTEXITCODE -ne 0){throw 'CUDA/BF16 validation failed'}
          nvidia-smi --query-gpu=name,driver_version,memory.total,memory.free,temperature.gpu,power.draw --format=csv,noheader
          "python=$python" >> $env:GITHUB_OUTPUT
      - name: Compile Frontier pilot
        run: |
          & '${{ steps.env.outputs.python }}' -m py_compile frontier350/model350.py frontier350/bench350.py
          if($LASTEXITCODE -ne 0){throw 'compile failed'}
      - name: Deep32 BPE16K 512 mb4
        run: |
          New-Item -ItemType Directory -Force frontier350_pilot_report | Out-Null
          & '${{ steps.env.outputs.python }}' -u frontier350/bench350.py --out frontier350_pilot_report/deep32_512_mb4.json --seq 512 --microbatch 4 --steps 16 --warmup 4 --no-gradient-checkpointing --vocab-size 16384 --d-model 1024 --layers 32 --heads 16 --kv-heads 2 --ffn-hidden 2624 --label bpe16k-deep32
          if($LASTEXITCODE -ne 0){throw 'deep32 512 pilot failed'}
      - name: Wide24 BPE16K 512 mb4
        run: |
          & '${{ steps.env.outputs.python }}' -u frontier350/bench350.py --out frontier350_pilot_report/wide24_512_mb4.json --seq 512 --microbatch 4 --steps 16 --warmup 4 --no-gradient-checkpointing --vocab-size 16384 --d-model 1152 --layers 24 --heads 18 --kv-heads 2 --ffn-hidden 3136 --label bpe16k-wide24
          if($LASTEXITCODE -ne 0){throw 'wide24 512 pilot failed'}
      - name: Deep32 BPE16K 1024 mb1
        run: |
          & '${{ steps.env.outputs.python }}' -u frontier350/bench350.py --out frontier350_pilot_report/deep32_1024_mb1.json --seq 1024 --microbatch 1 --steps 14 --warmup 3 --no-gradient-checkpointing --vocab-size 16384 --d-model 1024 --layers 32 --heads 16 --kv-heads 2 --ffn-hidden 2624 --label bpe16k-deep32
          if($LASTEXITCODE -ne 0){throw 'deep32 1024 pilot failed'}
      - name: Wide24 BPE16K 1024 mb1
        run: |
          & '${{ steps.env.outputs.python }}' -u frontier350/bench350.py --out frontier350_pilot_report/wide24_1024_mb1.json --seq 1024 --microbatch 1 --steps 14 --warmup 3 --no-gradient-checkpointing --vocab-size 16384 --d-model 1152 --layers 24 --heads 18 --kv-heads 2 --ffn-hidden 3136 --label bpe16k-wide24
          if($LASTEXITCODE -ne 0){throw 'wide24 1024 pilot failed'}
      - name: Deep32 BPE16K 2048 mb1 checkpointed
        run: |
          & '${{ steps.env.outputs.python }}' -u frontier350/bench350.py --out frontier350_pilot_report/deep32_2048_gc.json --seq 2048 --microbatch 1 --steps 10 --warmup 3 --vocab-size 16384 --d-model 1024 --layers 32 --heads 16 --kv-heads 2 --ffn-hidden 2624 --label bpe16k-deep32
          if($LASTEXITCODE -ne 0){throw 'deep32 2048 pilot failed'}
      - name: Wide24 BPE16K 2048 mb1 checkpointed
        run: |
          & '${{ steps.env.outputs.python }}' -u frontier350/bench350.py --out frontier350_pilot_report/wide24_2048_gc.json --seq 2048 --microbatch 1 --steps 10 --warmup 3 --vocab-size 16384 --d-model 1152 --layers 24 --heads 18 --kv-heads 2 --ffn-hidden 3136 --label bpe16k-wide24
          if($LASTEXITCODE -ne 0){throw 'wide24 2048 pilot failed'}
      - name: Upload report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neral350-frontier-pilot-${{ github.run_id }}
          path: frontier350_pilot_report/
          retention-days: 30
          if-no-files-found: warn
