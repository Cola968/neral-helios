name: Phoenix Chatbot v1 project-owned behavior pilot

on:
  push:
    branches: [experiment/chatbot-v1-pilot-20260924]
    paths:
      - '.github/workflows/phoenix-chatbot-v1-pilot.yml'
      - 'frontier350/nextgen_v1/chatbot_v1_data.py'
      - 'frontier350/nextgen_v1/phoenix_chatbot_v1_pilot.py'
      - 'frontier350/nextgen_v1/test_chatbot_v1_pilot.py'

permissions:
  contents: read

concurrency:
  group: neral-nextgen-local-gpu-training
  cancel-in-progress: false

jobs:
  chatbot-v1-pilot:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"

    steps:
      - name: Checkout exact Chatbot-v1 revision without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: phoenix_chatbot_v1_${{ github.run_id }}
          clean: false
          persist-credentials: false

      - name: Compile and run CPU contracts before GPU
        run: |
          $ErrorActionPreference='Stop'
          function ToWsl([string]$p) {
            $f=[IO.Path]::GetFullPath($p)
            if($f -notmatch '^([A-Za-z]):\\(.*)$') { throw 'Absolute Windows path required' }
            return '/mnt/' + $matches[1].ToLowerInvariant() + '/' + $matches[2].Replace('\','/')
          }
          $repo=Join-Path $env:GITHUB_WORKSPACE ('phoenix_chatbot_v1_' + $env:GITHUB_RUN_ID)
          if($repo.Contains("'")) { throw 'Unsafe quote in checkout path' }
          $cmd="set -euo pipefail; cd '$(ToWsl $repo)'; test -x ~/.venvs/neral-triton-py312/bin/python; ~/.venvs/neral-triton-py312/bin/python -B -m py_compile frontier350/nextgen_v1/chatbot_v1_data.py frontier350/nextgen_v1/phoenix_chatbot_v1_pilot.py frontier350/nextgen_v1/test_chatbot_v1_pilot.py; ~/.venvs/neral-triton-py312/bin/python -B frontier350/nextgen_v1/test_chatbot_v1_pilot.py"
          & wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0) { throw 'Chatbot-v1 CPU contracts failed; GPU training was not started' }

      - name: Run bounded project-owned Chatbot-v1 behavior sweep
        run: |
          $ErrorActionPreference='Stop'
          function ToWsl([string]$p) {
            $f=[IO.Path]::GetFullPath($p)
            if($f -notmatch '^([A-Za-z]):\\(.*)$') { throw 'Absolute Windows path required' }
            return '/mnt/' + $matches[1].ToLowerInvariant() + '/' + $matches[2].Replace('\','/')
          }

          $repo=Join-Path $env:GITHUB_WORKSPACE ('phoenix_chatbot_v1_' + $env:GITHUB_RUN_ID)
          $source='D:\NeralScaleV81\_continuity_v5\continuity_002073161216_f7a73e283421.pt'
          $assets=if($env:NERAL_ASSETS_ROOT) { $env:NERAL_ASSETS_ROOT } else { Join-Path $env:USERPROFILE 'Documents\Codex\2026-09-05\lo\outputs\neral' }
          $private='D:\NeralPrivateAssets\phoenix'
          $out=Join-Path $private ('chatbot_v1_' + $env:GITHUB_RUN_ID)

          foreach($p in @($repo,$source,$assets,$private,$out)) {
            if($p.Contains("'")) { throw 'Unsafe quote in local path' }
          }
          if(-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw 'Historical 2.073B checkpoint missing' }
          if(-not (Test-Path -LiteralPath $assets -PathType Container)) { throw 'Neral assets root missing' }
          if(-not (Test-Path -LiteralPath $private -PathType Container)) { throw 'Private Phoenix root missing' }
          if(Test-Path -LiteralPath $out) { throw 'Create-only Chatbot-v1 output already exists' }
          if((Get-PSDrive D).Free -lt 15GB) { throw 'Less than 15 GiB free on D:' }

          $sourceHash=(Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sourceHash -ne 'f7a73e283421975acc34e13afc38378be4eab11da34e8e6b46fc7cb0cda883e7') { throw 'Historical checkpoint SHA mismatch' }

          Write-Host 'Pre-pilot GPU telemetry:'
          nvidia-smi --query-gpu=name,driver_version,memory.total,memory.free,utilization.gpu,temperature.gpu --format=csv,noheader
          if($LASTEXITCODE -ne 0) { throw 'nvidia-smi failed' }

          $cmd="set -euo pipefail; cd '$(ToWsl $repo)'; ~/.venvs/neral-triton-py312/bin/python -B -u frontier350/nextgen_v1/phoenix_chatbot_v1_pilot.py --execute --trusted-own-checkpoint --checkpoint '$(ToWsl $source)' --assets-root '$(ToWsl $assets)' --out '$(ToWsl $out)'"
          & wsl.exe -- bash -lc $cmd
          $pilotExit=$LASTEXITCODE

          $report=Join-Path $out 'report.json'
          if(-not (Test-Path -LiteralPath $report -PathType Leaf)) { throw "Chatbot-v1 report missing; pilot exit $pilotExit" }
          $r=Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if($r.classification -ne 'project_owned_chatbot_v1_behavior_development_only') { throw 'Wrong Chatbot-v1 report classification' }
          if($r.historical_source_unchanged -ne $true) { throw 'Historical checkpoint integrity failed' }
          if($r.external_sft_text_used -ne $false -or $r.private_holdout_opened -ne $false) { throw 'Unexpected data source state' }
          if($r.production_eligible -ne $false -or $r.quality_gain_verified -ne $false) { throw 'Unsafe promotion claim' }

          Write-Host '=== CHATBOT V1 SAFE DEVELOPMENT SUMMARY ==='
          [ordered]@{
            dataset_sha256=$r.dataset.dataset_sha256
            train_rows=$r.dataset.train_rows
            validation_rows=$r.dataset.validation_rows
            baseline_validation_loss=$r.baseline.validation_loss
            development_gate_passed=$r.development_gate_passed
            selected_config=if($r.selected_candidate){$r.selected_candidate.config.name}else{$null}
            selected_candidate_sha256=if($r.selected_candidate){$r.selected_candidate.candidate_sha256}else{$null}
            selected_delta=if($r.selected_candidate){$r.selected_candidate.gate.delta_candidate_minus_base}else{$null}
            next_action=$r.next_action
          } | ConvertTo-Json -Depth 8 -Compress | Write-Host

          if($pilotExit -ne 0 -or $r.development_gate_passed -ne $true) {
            throw 'No Chatbot-v1 recipe passed the development gates; candidate rejected'
          }
          Write-Host ('Winning development checkpoint remains local at ' + (Join-Path $out $r.selected_candidate.candidate_file))

      - name: Post-pilot GPU telemetry
        if: always()
        run: |
          nvidia-smi --query-gpu=name,memory.used,memory.free,utilization.gpu,temperature.gpu --format=csv,noheader
          Write-Host 'No checkpoint, generated answer, private asset or training output is uploaded by this workflow.'
