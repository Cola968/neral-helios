name: NERAL v3 math solver and verify-before-finish CPU contracts

on:
  pull_request:
    paths:
      - 'neral_agent_autonomy.py'
      - 'neral_agent_math.py'
      - 'neral_agent_sandbox.py'
      - 'agent_auto_api.py'
      - 'templates/index.html'
      - 'static/agent-auto.js'
      - 'benchmarks/neral_agent_coding_suite.json'
      - 'scripts/build_neral_agent_coding_suite.py'
      - 'scripts/neral_v3_combined.py'
      - 'tests/test_neral_agent_*.py'
      - 'tests/test_neral_isolated_unit.py'
      - '.github/workflows/neral-v3-agent-contracts.yml'
permissions:
  contents: read
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Flask>=3,<4'
      - name: Safety and behavior tests
        run: |
          python -m unittest discover -s tests -p test_agent_autonomy.py -q
          python -m unittest discover -s tests -p test_agent_pc_patch.py -q
          python -m unittest discover -s tests -p test_agent_sandbox.py -q
          python -m unittest discover -s tests -p test_agent_auto_api.py -q
          python -m unittest discover -s tests -p test_neral_agent_math.py -q
          python -m unittest discover -s tests -p test_neral_agent_verify.py -q
          python -m unittest discover -s tests -p test_neral_isolated_unit.py -q
          python -m unittest discover -s tests -p test_neral_agent_coding_suite.py -q
      - run: node --check static/agent-auto.js
      - run: python -m compileall -q neral_agent_math.py neral_agent_autonomy.py neral_agent_sandbox.py agent_auto_api.py scripts
