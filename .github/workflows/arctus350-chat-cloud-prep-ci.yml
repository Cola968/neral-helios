name: Arctus 350M chat cloud prep
on:
  push:
    branches: [arctus350-chat-cloud-prep]
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m py_compile frontier350/chat350_contract.py frontier350/chat350_data.py frontier350/chat350_sft_format.py frontier350/chat350_preference_format.py frontier350/chat350_generation_metrics.py frontier350/oasst2_human350.py frontier350/build_oasst2_multiturn350.py frontier350/build_oasst2_preferences350.py frontier350/build_neraltalk350_from_screened.py frontier350/precompute_dpo_ref350.py frontier350/train_dpo350.py frontier350/eval_replay350.py frontier350/score_chat350_capabilities.py frontier350/train_chat350.py frontier350/eval_chat350.py frontier350/compare_chat350.py tests/test_chat350_cloud_prep.py tests/test_chat350_human_alignment.py tests/test_chat350_capabilities.py tests/test_neraltalk350_adapter.py
      - name: Cases
        run: python -c "import json; d=json.load(open('frontier350/chat350_dev_cases.json',encoding='utf8')); c=json.load(open('frontier350/chat350_capability_cases.json',encoding='utf8')); assert len(d)>=10 and len(c)==30 and len({r['id'] for r in c})==30"
      - name: Unit tests
        run: python -m unittest tests.test_chat350_cloud_prep tests.test_chat350_human_alignment tests.test_chat350_capabilities tests.test_neraltalk350_adapter -v
