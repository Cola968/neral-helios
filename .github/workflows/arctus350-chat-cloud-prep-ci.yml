name: Arctus 350M chat cloud prep
on:
  push:
    branches: [arctus350-chat-cloud-prep]
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m py_compile frontier350/chat350_contract.py frontier350/chat350_data.py frontier350/chat350_sft_format.py frontier350/chat350_generation_metrics.py frontier350/build_neraltalk350_from_screened.py frontier350/train_chat350.py frontier350/eval_chat350.py frontier350/compare_chat350.py tests/test_chat350_cloud_prep.py tests/test_neraltalk350_adapter.py
      - name: Cases
        run: python -c "import json; x=json.load(open('frontier350/chat350_dev_cases.json',encoding='utf8')); assert len(x)>=10 and len({r['id'] for r in x})==len(x)"
      - name: Unit tests
        run: python -m unittest tests.test_chat350_cloud_prep tests.test_neraltalk350_adapter -v
