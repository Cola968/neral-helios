name: Arctus 350M chat cloud prep

on:
  push:
    branches: [arctus350-chat-cloud-prep]
    paths:
      - "frontier350/chat350_contract.py"
      - "frontier350/chat350_sft_format.py"
      - "tests/test_chat350_cloud_prep.py"
      - ".github/workflows/arctus350-chat-cloud-prep-ci.yml"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m py_compile frontier350/chat350_contract.py frontier350/chat350_sft_format.py tests/test_chat350_cloud_prep.py
      - name: Unit tests
        run: python -m unittest tests.test_chat350_cloud_prep -v
