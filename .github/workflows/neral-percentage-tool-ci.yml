name: NERAL exact percentage chat CPU regression
on:
  pull_request:
    paths:
      - 'neral_percentage_tool.py'
      - 'neral_local_chat_api.py'
      - 'tests/test_neral_percentage_tool.py'
      - '.github/workflows/neral-percentage-tool-ci.yml'
  push:
    branches: [main]
    paths:
      - 'neral_percentage_tool.py'
      - 'neral_local_chat_api.py'
      - 'tests/test_neral_percentage_tool.py'
      - '.github/workflows/neral-percentage-tool-ci.yml'
permissions:
  contents: read
jobs:
  percentage-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal CPU test dependency
        run: python -m pip install 'flask>=3,<4'
      - name: Exact percent and Flask routing tests
        run: python -m unittest discover -s tests -p 'test_neral_percentage_tool.py' -v
      - name: Existing quantitative tool regression tests
        run: python -m unittest discover -s tests -p 'test_neral_quant_exact.py' -v
      - name: Python syntax
        run: python -m compileall -q neral_percentage_tool.py neral_local_chat_api.py tests/test_neral_percentage_tool.py
