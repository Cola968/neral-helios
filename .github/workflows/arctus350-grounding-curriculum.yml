name: Arctus350 closed-world grounding curriculum CPU
on:
  push:
    branches: [research/arctus350-grounded-instruction-curriculum-v1-20261029]
  pull_request:
    paths:
      - 'frontier350/arctus350_grounding_curriculum_v1.py'
      - 'tests/test_arctus350_grounding_curriculum_v1.py'
      - '.github/workflows/arctus350-grounding-curriculum.yml'
permissions:
  contents: read
jobs:
  curriculum:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify deterministic corpus, immutability and independent answers
        run: python -m unittest tests.test_arctus350_grounding_curriculum_v1 -v
      - name: Assert source compiles
        run: python -m py_compile frontier350/arctus350_grounding_curriculum_v1.py
