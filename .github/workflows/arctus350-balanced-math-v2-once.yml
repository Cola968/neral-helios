name: Arctus350 Wednesday ONLY balanced bilingual arithmetic v2 native SFT
on:
  push:
    branches: [experiment/arctus350-balanced-math-v2-sft-20261028]
    paths:
      - '.github/workflows/arctus350-balanced-math-v2-once.yml'
permissions:
  contents: read
concurrency:
  group: arctus350-balanced-math-v2-20261028-one-session
  cancel-in-progress: false
jobs:
  cpu-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest tests.test_arctus350_balanced_math_v2_pilot tests.test_arctus350_balanced_arithmetic_v2 -v
      - run: python -m py_compile frontier350/arctus350_balanced_math_v2_pilot.py
  one-local-rtx4070:
    if: contains(github.event.head_commit.message,'RUN_ONCE_BALANCED_MATH_V2_20261028')
    needs: cpu-gates
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 35
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          path: arctus350_balanced_v2_sft_checkout
          clean: false
          persist-credentials: false
      - name: Verify own RTX4070 availability, Wednesday hard deadline, immutable previous experiment
        run: |
          $ErrorActionPreference='Stop'
          $now=[TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTimeOffset]::UtcNow,'W. Europe Standard Time')
          if($now.ToString('yyyy-MM-dd') -ne '2026-10-28' -or $now -ge [DateTimeOffset]::Parse('2026-10-28T20:15:00+01:00')){
            throw 'Owner has permitted only Wednesday evening GPU time; stop'
          }
          $assets=if($env:NERAL_ASSETS_ROOT){$env:NERAL_ASSETS_ROOT}else{'C:\Users\astad\Documents\Codex\2026-09-05\lo\outputs\neral'}
          $parent=Join-Path $assets 'runs\neral350_math_rescue256_40736349769\math_rescue_nonpromotable_only.pt'
          $tokenizer=Join-Path $assets 'frontier350_assets\tokenizer.json'
          $original=Join-Path $assets 'runs\neraltalk350-sanitized-allturn_40717899967'
          $v1=Join-Path $assets 'runs\neraltalk350-exact-smallmath_40725139301'
          $v2=Join-Path $assets 'runs\neraltalk350-balanced-math-v2_40737679738'
          $out=Join-Path $assets 'runs\neral350_math_balanced_v2_${{github.run_id}}'
          foreach($p in @($parent,$tokenizer)){
            if(-not(Test-Path -LiteralPath $p -PathType Leaf)){throw 'pinned local checkpoint/tokenizer missing'}
          }
          foreach($p in @($original,$v1,$v2)){
            if(-not(Test-Path -LiteralPath $p -PathType Container)){throw 'pinned original or synthetic dataset unavailable'}
          }
          if(Test-Path -LiteralPath $out){throw 'never overwrite an experimental model'}
          if((Get-FileHash -LiteralPath $parent -Algorithm SHA256).Hash.ToLowerInvariant() -ne '34f248b2392de3cbef51bae4300bb6bcf270dd8d7af7a95ce6c90bc56af37ff4'){
            throw '256-step parent SHA mismatch'
          }
          if((Get-FileHash -LiteralPath $tokenizer -Algorithm SHA256).Hash.ToLowerInvariant() -ne '4a25bb40ad66e2d5a674d32e95bc0076d13cdb4decb4d508226124711e2aa7dd'){
            throw 'locked tokenizer SHA mismatch'
          }
          $gpu=@(& nvidia-smi.exe --query-gpu=name,memory.total,memory.free,temperature.gpu --format=csv,noheader,nounits 2>$null)
          if($LASTEXITCODE -ne 0 -or $gpu.Count -ne 1 -or [string]$gpu[0] -notmatch '^\s*(.+?)\s*,\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*$'){
            throw 'GPU metrics unavailable; no experiment'
          }
          $name=$matches[1];$total=[int]$matches[2];$free=[int]$matches[3];$temp=[int]$matches[4]
          Write-Host "GPU=$name FREE_VRAM=$free MiB TEMP=$temp C"
          if($name -notlike '*RTX 4070*' -or $free -gt $total -or $free -lt 9216 -or $temp -ge 80){
            throw 'GPU busy or too hot; fail closed'
          }
          function W([string]$p){
            $full=[IO.Path]::GetFullPath($p)
            if($full -notmatch '^([A-Za-z]):\\'){throw 'unsafe nonlocal path'}
            return "/mnt/"+$matches[1].ToLowerInvariant()+"/"+$full.Substring(3).Replace('\','/')
          }
          $repo=Join-Path $env:GITHUB_WORKSPACE 'arctus350_balanced_v2_sft_checkout'
          $cmd="set -e; cd '$(W $repo)'; NERAL_LOCAL_SFT_ALLOW=1 OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=4 PYTHONPATH=frontier350 ~/.venvs/neral-triton-py312/bin/python -u -m frontier350.arctus350_balanced_math_v2_pilot --parent '$(W $parent)' --tokenizer '$(W $tokenizer)' --original '$(W $original)' --v1 '$(W $v1)' --v2 '$(W $v2)' --out '$(W $out)' --windows-free-mib $free --windows-temp-c $temp"
          wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0){throw 'local bounded native SFT did not complete'}
          Copy-Item -LiteralPath (Join-Path $out 'aggregate_report.json') -Destination (Join-Path $repo 'arctus350_math_v2_sft_${{github.run_id}}_aggregate.json')
      - name: Upload only aggregate generation results; no user dialogs or model weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arctus350-balanced-math-v2-guarded-gpu-aggregate
          path: arctus350_balanced_v2_sft_checkout/arctus350_math_v2_sft_*_aggregate.json
          retention-days: 7
          if-no-files-found: warn
