name: Neral 350M Guarded Replay V9
on:
  push:
    branches: [experiment/guarded-replay-v9]
    paths: ['frontier350_guarded_replay_v9_requests/request.json']
permissions:
  contents: read
concurrency:
  group: neral-350m-guarded-replay-v9
  cancel-in-progress: false
jobs:
  guarded-replay:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 240
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false
      - name: Verify bounded V9 request and disk
        id: request
        run: |
          $ErrorActionPreference='Stop'
          $request=Get-Content frontier350_guarded_replay_v9_requests/request.json -Raw|ConvertFrom-Json
          if((($request.PSObject.Properties.Name|Sort-Object) -join ',') -ne 'action,new_tokens,request_id,version'){throw 'unexpected request fields'}
          if($request.version -ne 1 -or $request.action -ne 'run_guarded_replay_v9' -or $request.new_tokens -ne 2000000){throw 'invalid V9 request'}
          if($request.request_id -notmatch '^[A-Za-z0-9._-]{1,64}$'){throw 'unsafe request id'}
          $assets=if($env:NERAL_ASSETS_ROOT){$env:NERAL_ASSETS_ROOT}else{'C:\Users\astad\Documents\Codex\2026-09-05\lo\outputs\neral'}
          $drive=Get-PSDrive -Name ([IO.Path]::GetPathRoot($assets).Substring(0,1))
          if($drive.Free -lt 7GB){throw 'V9 requires at least 7 GiB free; preserve existing checkpoints'}
          function W([string]$p){$p=[IO.Path]::GetFullPath($p);return '/mnt/'+$p.Substring(0,1).ToLower()+'/'+$p.Substring(3).Replace('\','/')}
          "repo=$(W (Get-Location).Path)" >> $env:GITHUB_OUTPUT
          "assets=$(W $assets)" >> $env:GITHUB_OUTPUT
          "request_id=$($request.request_id)" >> $env:GITHUB_OUTPUT
      - name: Runtime and source checks
        run: |
          $repo='${{ steps.request.outputs.repo }}'
          wsl.exe -- bash -lc "set -e; cd '$repo'; bash frontier350/ensure_eval_runtime.sh; ~/.venvs/neral-triton-py312/bin/python -m py_compile frontier350/protection_v9.py frontier350/train_guarded_v9.py frontier350/run_guarded_v9.py"
          if($LASTEXITCODE -ne 0){throw 'V9 runtime checks failed'}
      - name: GPU probes, identical A/B pilots, strict gates and bounded confirmation
        run: |
          $repo='${{ steps.request.outputs.repo }}';$assets='${{ steps.request.outputs.assets }}';$rid='${{ steps.request.outputs.request_id }}'
          $cmd="set -e; cd '$repo'; export TORCHINDUCTOR_CACHE_DIR=~/.cache/neral_inductor; export CC=/usr/bin/gcc; export CXX=/usr/bin/g++; ~/.venvs/neral-triton-py312/bin/python -u frontier350/run_guarded_v9.py --assets '$assets' --report frontier350_guarded_replay_v9_report --request-id '$rid'"
          wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0){throw 'V9 stopped; existing checkpoints retained for diagnosis/resume'}
      - name: Upload measured V9 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neral350-guarded-replay-v9-${{ github.run_id }}
          path: frontier350_guarded_replay_v9_report/
          retention-days: 30
