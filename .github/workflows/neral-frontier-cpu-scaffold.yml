name: NERAL Frontier December 2026 - CPU-only contracts
on:
  pull_request:
    paths:
      - 'neral_frontier/**'
      - 'schemas/neral-frontier-blind180.schema.json'
      - 'docs/NERAL_MASTERPLAN_2026_12_31.md'
      - 'tests/test_neral_frontier_cpu.py'
      - '.github/workflows/neral-frontier-cpu-scaffold.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 12
    env:
      CUDA_VISIBLE_DEVICES: '-1'
      HIP_VISIBLE_DEVICES: ''
      ROCR_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only dependencies
        run: python -m pip install 'sympy>=1.13,<2' 'z3-solver>=4.13,<5' 'pytest>=8,<10' 'hypothesis>=6,<7' 'jsonschema>=4,<5'
      - name: Verify solver imports and schema
        run: python -c "import sympy, z3, hypothesis, pytest, jsonschema; import json; jsonschema.Draft202012Validator.check_schema(json.load(open('schemas/neral-frontier-blind180.schema.json', encoding='utf-8')))"
      - name: Run synthetic CPU contract tests
        run: |
          python -m compileall -q neral_frontier tests/test_neral_frontier_cpu.py
          python -m unittest discover -s tests -p test_neral_frontier_cpu.py -v
