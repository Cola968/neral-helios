name: NERAL Qwen and Arctus CPU integration
on:
  push:
    branches: [codex/neral-qwen-unified-20261029]
  pull_request:
    paths:
      - app.py
      - chat_store.py
      - neral_assistant*.py
      - static/**
      - templates/**
      - tests/test_qwen*
      - .github/workflows/neral-qwen-unified.yml
concurrency:
  group: neral-qwen-unified-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HELIOS_ASSETS_ROOT: ${{ github.workspace }}/.test-qwen/assets
      HELIOS_STATE_ROOT: ${{ github.workspace }}/.test-qwen/state
      HELIOS_DEVICE: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q tests/test_qwen_integration.py tests/test_qwen_launcher.py tests/test_neral_assistant.py tests/test_neral_assistant_launcher.py tests/test_arctus_flask.py tests/test_helios_runtime.py tests/test_helios_chat_experience.py tests/test_helios_workspace.py tests/test_helios_i1_ready.py tests/test_helios_install.py
      - run: node --test tests/test_qwen_history.js tests/test_arctus_history.js tests/test_helios_history.js
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/test_helios_browser.cjs
      - run: node tests/test_helios_workspace.cjs
      - run: node tests/test_helios_chat_experience.cjs
      - run: node tests/test_arctus_browser.cjs
      - run: node tests/test_qwen_browser.cjs
