name: NERAL v4 novel benchmark CPU contracts
on:
  pull_request:
    paths:
      - 'scripts/neral_v4_novel_eval.py'
      - 'tests/test_neral_v4_novel_eval.py'
      - '.github/workflows/neral-v4-novel-eval.yml'
      - '.github/workflows/neral-v4-novel-eval-ci.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/neral_v4_novel_eval.py'
      - 'tests/test_neral_v4_novel_eval.py'
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_neral_v4_novel_eval.py -v
      - run: python -m compileall -q scripts/neral_v4_novel_eval.py
