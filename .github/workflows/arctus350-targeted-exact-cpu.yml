name: Arctus350 targeted exact-output FP32 pilot contracts
on:
  pull_request:
    types: [opened,synchronize]
    paths:
      - 'tests/test_arctus350_targeted_exact_pilot.py'
      - 'frontier350/arctus350_targeted_exact_pilot.py'
      - '.github/workflows/arctus350-targeted-exact-cpu.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest tests.test_arctus350_targeted_exact_pilot -v
      - run: python -m py_compile frontier350/arctus350_targeted_exact_pilot.py
