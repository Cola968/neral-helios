name: NERAL Web V4 read-only failed 20-case diagnosis (NO SERVICE MUTATION)
on:
  push:
    branches: [codex/neral-web-v4-20261121]
    paths:
      - '.github/workflows/neral-web-v4-diagnose.yml'
permissions:
  contents: read
jobs:
  owner-read-only:
    if: >-
      startsWith(github.event.head_commit.message, 'web-v4-diagnose-APPROVED:')
    runs-on: [self-hosted, Windows, X64, neral-gpu]
    concurrency:
      group: neral-v32-exclusive-local-9690
      cancel-in-progress: false
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - name: Read private 20-case error classes and status only; no live network call
        run: |
          $ErrorActionPreference='Stop'
          $p='D:/neral-web-v4-qa/44893336313-1/new-20-web-results.jsonl'
          if(-not(Test-Path -LiteralPath $p -PathType Leaf)){throw 'Private V4 case results missing'}
          $rows=@(Get-Content -LiteralPath $p -Encoding UTF8 | ForEach-Object { $_ | ConvertFrom-Json })
          if($rows.Count -ne 20){throw 'V4 test detail count not 20'}
          $counts=@{}
          foreach($row in $rows){
            $key=[string]$row.error_code
            if([string]::IsNullOrWhiteSpace($key)){$key='<empty_but_not_passed>'}
            if(-not $counts.ContainsKey($key)){$counts[$key]=0}
            $counts[$key]++
            Write-Host ('NERAL_V4_DIAG_CASE '+[int]$row.case+' pass='+[bool]$row.passed+' error='+$key+' latency='+[double]$row.seconds+' platform='+[string]$row.platform)
          }
          foreach($k in ($counts.Keys|Sort-Object)){
            Write-Host ('NERAL_V4_DIAG_ERROR_BUCKET '+$k+' '+$counts[$k])
          }
          $task=Get-ScheduledTask -TaskName 'NERAL-PR558-ThreeTier-909d1419c9ff' -ErrorAction Stop
          Write-Host ('NERAL_V4_DIAG_SERVICE_STATE '+$task.State)
          $response=@(& curl.exe --noproxy '*' --silent --connect-timeout 3 --max-time 8 --output NUL --write-out '%{http_code}' 'http://127.0.0.1:9690/')
          Write-Host ('NERAL_V4_DIAG_SERVICE_HTTP '+($response -join '').Trim())
