name: Neral 350M Frontier Stage-4 Triton

on:
  push:
    branches: [frontier/neral350-v1]
    paths:
      - 'frontier350_requests/speed_stage4_triton.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: neral-350m-frontier-stage4-triton
  cancel-in-progress: false

jobs:
  stage4-triton:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - name: Checkout Frontier branch
        uses: actions/checkout@v4
        with:
          ref: frontier/neral350-v1
          clean: true
          persist-credentials: false

      - name: Validate explicit Stage-4 request
        run: |
          $ErrorActionPreference='Stop'
          $p='frontier350_requests\speed_stage4_triton.json'
          if(-not(Test-Path $p -PathType Leaf)){throw 'Stage-4 request missing'}
          $r=Get-Content $p -Raw | ConvertFrom-Json
          $props=@($r.PSObject.Properties.Name | Sort-Object)
          if(($props -join ',') -ne 'action,architecture,request_id,seq,target_tps,version'){throw 'unsupported Stage-4 request fields'}
          if([int]$r.version -ne 1){throw 'unsupported request version'}
          if($r.action -ne 'speed_stage4_triton_frontier350'){throw 'wrong action'}
          if($r.architecture -ne 'frontier350-v1'){throw 'wrong architecture'}
          if([int]$r.seq -ne 512){throw 'Stage-4 sequence contract must be 512'}
          if([int]$r.target_tps -ne 15000){throw 'Stage-4 target must be 15000 tok/s'}
          if($r.request_id -notmatch '^[A-Za-z0-9._-]{1,64}$'){throw 'invalid request id'}

      - name: Resolve WSL2 and CUDA paths
        id: wsl
        run: |
          $ErrorActionPreference='Stop'
          if(-not(Get-Command wsl.exe -ErrorAction SilentlyContinue)){throw 'WSL executable not installed'}
          $distro=(wsl.exe --list --quiet | ForEach-Object { $_.Trim() } | Where-Object { $_ } | Select-Object -First 1)
          if(-not $distro){throw 'No WSL Linux distribution installed'}
          $repo=(Get-Location).Path
          $assets=if($env:NERAL_ASSETS_ROOT){$env:NERAL_ASSETS_ROOT}else{'C:\Users\astad\Documents\Codex\2026-09-05\lo\outputs\neral'}
          $repoWsl=(wsl.exe -d $distro -- wslpath -a $repo).Trim()
          $assetsWsl=(wsl.exe -d $distro -- wslpath -a $assets).Trim()
          $trainWsl="$assetsWsl/frontier350_bpe_pilot_v1/train"
          $venvWsl="$assetsWsl/.venv-wsl-triton"
          wsl.exe -d $distro -- bash -lc "set -e; uname -a; python3 --version; nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader; test -d '$trainWsl'"
          if($LASTEXITCODE -ne 0){throw 'WSL/CUDA/data probe failed'}
          "distro=$distro" >> $env:GITHUB_OUTPUT
          "repo_wsl=$repoWsl" >> $env:GITHUB_OUTPUT
          "train_wsl=$trainWsl" >> $env:GITHUB_OUTPUT
          "venv_wsl=$venvWsl" >> $env:GITHUB_OUTPUT

      - name: Prepare isolated Linux Triton environment
        run: |
          $ErrorActionPreference='Stop'
          $d='${{ steps.wsl.outputs.distro }}'
          $v='${{ steps.wsl.outputs.venv_wsl }}'
          $cmd=@"
          set -euo pipefail
          if [ ! -x '$v/bin/python' ]; then
            python3 -m venv '$v'
          fi
          P='$v/bin/python'
          if ! "`$P" -c 'import numpy, torch, triton; assert torch.__version__.startswith("2.8.")' >/dev/null 2>&1; then
            "`$P" -m pip install --upgrade pip wheel
            "`$P" -m pip install numpy
            "`$P" -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cu128
            "`$P" -c 'import triton' >/dev/null 2>&1 || "`$P" -m pip install triton==3.4.0
          fi
          "`$P" -c 'import torch,triton; print("torch",torch.__version__); print("cuda",torch.version.cuda); print("triton",getattr(triton,"__version__","unknown")); print("gpu",torch.cuda.get_device_name(0)); assert torch.cuda.is_available() and torch.cuda.is_bf16_supported()'
          "@
          wsl.exe -d $d -- bash -lc $cmd
          if($LASTEXITCODE -ne 0){throw 'isolated WSL Triton environment setup failed'}

      - name: Verify Stage-4 parameter contract
        run: |
          $ErrorActionPreference='Stop'
          $d='${{ steps.wsl.outputs.distro }}'
          $repo='${{ steps.wsl.outputs.repo_wsl }}'
          $py='${{ steps.wsl.outputs.venv_wsl }}/bin/python'
          wsl.exe -d $d -- bash -lc "set -e; cd '$repo'; '$py' -m py_compile frontier350/model350.py frontier350/model350_fast.py frontier350/speed_triton350.py; '$py' -c \"import sys; sys.path.insert(0,'frontier350'); from model350 import Neral350M; from model350_fast import Neral350MFast; a=Neral350M().parameter_report(); b=Neral350MFast().parameter_report(); print(a,b); assert a['total']==349825152 and b['total']==349825152\""
          if($LASTEXITCODE -ne 0){throw 'Stage-4 parameter contract failed'}

      - name: Benchmark WSL2 Triton and TorchInductor
        run: |
          $ErrorActionPreference='Stop'
          $d='${{ steps.wsl.outputs.distro }}'
          $repo='${{ steps.wsl.outputs.repo_wsl }}'
          $py='${{ steps.wsl.outputs.venv_wsl }}/bin/python'
          $train='${{ steps.wsl.outputs.train_wsl }}'
          New-Item -ItemType Directory -Force frontier350_stage4_report | Out-Null
          wsl.exe -d $d -- bash -lc "set -e; cd '$repo'; '$py' -u frontier350/speed_triton350.py --train-data '$train' --out frontier350_stage4_report/stage4_triton.json --seq 512 --steps 8 --warmup 3"
          if($LASTEXITCODE -ne 0){throw 'Stage-4 Triton benchmark failed'}

      - name: Print Stage-4 decision
        if: always()
        run: |
          $p='frontier350_stage4_report\stage4_triton.json'
          if(Test-Path $p -PathType Leaf){
            $r=Get-Content $p -Raw | ConvertFrom-Json
            Write-Host ("target_reached=" + $r.target_reached)
            Write-Host ("torch=" + $r.torch + " triton=" + $r.triton)
            if($null -ne $r.best){
              Write-Host ("best_tps=" + $r.best.e2e_tokens_per_second)
              Write-Host ("best_layout=" + $r.best.layout)
              Write-Host ("best_mb=" + $r.best.microbatch)
              Write-Host ("best_compile=" + $r.best.compile_mode)
            }
          }

      - name: Upload aggregate Stage-4 report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neral350-frontier-stage4-triton-${{ github.run_id }}
          path: frontier350_stage4_report/
          retention-days: 30
          if-no-files-found: warn
