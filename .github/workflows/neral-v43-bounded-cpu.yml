name: NERAL V4.3 bounded integration CPU-only
on:
  pull_request:
    paths:
      - neral_v43_bounded.py
      - neral_three_tier_runtime.py
      - tests/test_neral_v43_bounded_cpu.py
      - .github/workflows/neral-v43-bounded-cpu.yml
permissions:
  contents: read
jobs:
  bounded-cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install flask sympy z3-solver
      - run: python -m py_compile neral_v43_bounded.py neral_three_tier_runtime.py tests/test_neral_v43_bounded_cpu.py
      - run: python -m unittest discover -s tests -p test_neral_v43_bounded_cpu.py -v
