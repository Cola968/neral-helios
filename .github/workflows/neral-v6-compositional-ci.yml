name: NERAL v6 compositional candidate CPU contracts
on:
  pull_request:
    paths:
      - scripts/neral_v6_compositional.py
      - scripts/neral_v6_export.py
      - tests/test_neral_v6_export.py
      - tests/test_neral_v6_compositional.py
      - .github/workflows/neral-v6-compositional-ci.yml
      - docs/NERAL_V6_TRANSFER.md
  push:
    branches: [main]
    paths:
      - scripts/neral_v6_compositional.py
      - tests/test_neral_v6_compositional.py
      - .github/workflows/neral-v6-compositional-ci.yml
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate original CPU-only synthetic candidate
        run: |
          python -m unittest discover -s tests -p test_neral_v6_compositional.py -v
          python -m unittest discover -s tests -p test_neral_v6_export.py -v
      - name: Bytecode compile
        run: python -m py_compile scripts/neral_v6_compositional.py scripts/neral_v6_export.py
