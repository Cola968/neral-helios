name: NERAL V4.1 sealed 200 CPU contracts
on:
  push:
    branches: [codex/neral-v41-blind200-live-20261121]
    paths:
      - 'neral_three_tier_runtime.py'
      - 'scripts/neral_v41_blind200*.py'
      - 'tests/test_neral_v41_blind_live_cpu.py'
      - '.github/workflows/neral-v41-blind200-cpu.yml'
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt sympy z3-solver
      - name: Private bench contracts and runtime syntax
        run: |
          python -m py_compile scripts/neral_v41_blind200.py scripts/neral_v41_blind200_build.py scripts/neral_v41_blind200_live.py neral_three_tier_runtime.py
          python -m unittest discover -s tests -p test_neral_v41_blind_live_cpu.py -v
          python -m unittest discover -s tests -p test_neral_v41_blind200_cpu.py -v
          python -m unittest discover -s tests -p test_neral_v41_cpu.py -v
          python -m unittest discover -s tests -p test_neral_three_tier_api.py -v
