name: Phoenix full synthetic CPU regression on PC once
on:
  push:
    branches: [experiment/phoenix-sft-fp32-audit]
    paths:
      - '.github/workflows/phoenix-full-cpu-regression-on-pc-once.yml'
permissions:
  contents: read
concurrency:
  group: neral-local-storage-readonly
  cancel-in-progress: false
jobs:
  offline-regression:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 12
    steps:
      - name: Checkout exact pinned audited source without persisted Git credentials
        uses: actions/checkout@v4
        with:
          ref: 4012d87786351578fb9d9fd292c54df87c521d72
          path: phoenix_full_cpu_regression_source
          persist-credentials: false
      - name: Compile and execute synthetic Python contract suites without CUDA
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          function WslPath([string]$p) {
            $full=[IO.Path]::GetFullPath($p)
            if($full -notmatch '^([A-Za-z]):\\(.*)$') { throw 'Absolute Windows drive path required' }
            return '/mnt/' + $matches[1].ToLowerInvariant() + '/' + $matches[2].Replace('\','/')
          }
          $repo=[IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'phoenix_full_cpu_regression_source'))
          $workspace=[IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\')+'\'
          if(-not $repo.StartsWith($workspace,[StringComparison]::OrdinalIgnoreCase) -or [IO.Path]::GetFileName($repo) -ne 'phoenix_full_cpu_regression_source') { throw 'Unexpected checkout' }
          if((Get-PSDrive C).Free -lt 30GB -or (Get-PSDrive D).Free -lt 200GB) { throw 'Disk reserve failed' }
          if($repo.Contains("'")) { throw 'Unsupported quote in checkout path' }
          $cmd="set -euo pipefail; export CUDA_VISIBLE_DEVICES=-1 PYTHONDONTWRITEBYTECODE=1 OMP_NUM_THREADS=2 MKL_NUM_THREADS=2; cd '$(WslPath $repo)'; ~/.venvs/neral-triton-py312/bin/python -m py_compile frontier350/native_resume_preflight350.py frontier350/train350.py frontier350/train350_compiled.py frontier350/nextgen_v1/test_phoenix_native_resume_preflight.py; ~/.venvs/neral-triton-py312/bin/python -m unittest discover -s frontier350/nextgen_v1 -p 'test_phoenix_*.py'; ~/.venvs/neral-triton-py312/bin/python -m unittest discover -s frontier350/nextgen_v1 -p 'test_sft_*.py'; ~/.venvs/neral-triton-py312/bin/python -m unittest discover -s frontier350/nextgen_v1 -p 'test_storage_budget.py'; ~/.venvs/neral-triton-py312/bin/python -m unittest discover -s frontier350/nextgen_v1 -p 'test_checkpoint_journal.py'"
          Write-Host 'CPU-only synthetic code tests. No original assets, real weights, GPU training, dataset approval or cleanup.'
          & wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0) { throw 'CPU regression failed, see tests; no training started' }
          Write-Host 'Regression passed; synthetic checks do NOT establish answer quality or real 350M resume.'
