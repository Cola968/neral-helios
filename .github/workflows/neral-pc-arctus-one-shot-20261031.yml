name: Arctus350 one-shot trusted Windows CPU checks 2026-10-31
on:
  push:
    paths:
      - '.github/workflows/neral-pc-arctus-one-shot-20261031.yml'
permissions:
  contents: read
jobs:
  arctus-pc-checks:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 8
    env:
      HELIOS_DEVICE: cpu
      CUDA_VISIBLE_DEVICES: '-1'
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - name: Check hashes only; do not load private weights
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $ck = 'D:\NeralScaleV81\_continuity_v5\continuity_002073161216_f7a73e283421.pt'
          $tok = 'C:\Users\astad\Documents\Codex\2026-09-05\lo\outputs\neral\frontier350_assets\tokenizer.json'
          if (-not(Test-Path -LiteralPath $ck -PathType Leaf)) { throw 'Original recorded 2B+ continuity checkpoint missing' }
          if (-not(Test-Path -LiteralPath $tok -PathType Leaf)) { throw 'Tokenizer missing' }
          $ckHash = (Get-FileHash -LiteralPath $ck -Algorithm SHA256).Hash.ToLowerInvariant()
          $tokHash = (Get-FileHash -LiteralPath $tok -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($ckHash -ne 'f7a73e283421975acc34e13afc38378be4eab11da34e8e6b46fc7cb0cda883e7') { throw 'Original 2B+ checkpoint SHA256 differs' }
          if ($tokHash -ne '4a25bb40ad66e2d5a674d32e95bc0076d13cdb4decb4d508226124711e2aa7dd') { throw 'Locked BPE tokenizer SHA256 differs' }
          Write-Host 'CHECKPOINT_ORIGINAL_SHA256_VERIFIED=True'
          Write-Host 'LOCKED_TOKENIZER_SHA256_VERIFIED=True'
          Write-Host 'CONTENTS_UPLOADED=False'
      - name: Run native Arctus CPU-only selector and safety unit tests
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $p = 'C:\Users\astad\Documents\Codex\2026-09-05\lo\outputs\neral\.venv\Scripts\python.exe'
          if (-not(Test-Path -LiteralPath $p -PathType Leaf)) { throw 'NERAL Python missing' }
          & $p -m py_compile frontier350/select_bilingual_recovery_v6.py frontier350/vast4090_guard.py frontier350/secure_checkpoint350.py
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax failed' }
          & $p frontier350/offline_selector_selftest.py
          if ($LASTEXITCODE -ne 0) { throw 'Offline selector contract failed' }
          & $p -m pytest -q tests/test_vast4090_guard.py tests/test_vast4090_transfer.py tests/test_select_bilingual_recovery_v6_safety.py tests/test_arctus_selector_stdlib_selftest.py
          if ($LASTEXITCODE -ne 0) { throw 'Native Arctus CPU safety tests failed' }
