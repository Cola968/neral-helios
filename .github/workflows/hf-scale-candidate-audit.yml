name: Neral HF Scale Candidate Audit

on:
  push:
    branches:
      - data/mobile-feeder-v1
    paths:
      - '.github/workflows/hf-scale-candidate-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - key: finemath
            dataset: HuggingFaceTB/finemath
          - key: openwebmath
            dataset: open-web-math/open-web-math
          - key: stackedu
            dataset: HuggingFaceTB/stack-edu
          - key: dolma
            dataset: allenai/dolma
          - key: codeparrot
            dataset: codeparrot/codeparrot-clean
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_DATASETS_DISABLE_PROGRESS_BARS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'datasets>=3.2,<5' 'huggingface_hub>=0.30,<1' 'numpy>=2,<3'
      - name: Compile audit
        run: python -m py_compile audit_hf_scale_candidate50.py build_mobile_data_pack.py tokenizer.py
      - name: Sample ${{ matrix.dataset }}
        run: |
          python -u audit_hf_scale_candidate50.py \
            --dataset '${{ matrix.dataset }}' \
            --max-rows 2500 \
            --out 'candidate_audit/${{ matrix.key }}.json'
      - name: Enforce non-promotion contract
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path('candidate_audit/${{ matrix.key }}.json')
          r = json.loads(p.read_text(encoding='utf8'))
          assert r['dataset_id'] == '${{ matrix.dataset }}'
          assert r['automatic_training_admission'] is False
          assert len(r['revision']) >= 20
          print(json.dumps(r, indent=2, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: neral-hf-candidate-audit-${{ matrix.key }}-${{ github.run_id }}
          path: candidate_audit/${{ matrix.key }}.json
          if-no-files-found: error
          retention-days: 30
