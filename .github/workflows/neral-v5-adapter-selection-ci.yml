name: NERAL v5 explicit local Helios adapter channel CPU contracts
on:
  pull_request:
    paths:
      - 'agent_auto_api.py'
      - 'tests/test_neral_v5_adapter_selection.py'
      - 'docs/NERAL_V5_HELIOS_OPTIN.md'
      - '.github/workflows/neral-v5-adapter-selection-ci.yml'
  push:
    branches: [main]
    paths:
      - 'agent_auto_api.py'
      - 'tests/test_neral_v5_adapter_selection.py'
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install flask
      - run: python -m compileall -q agent_auto_api.py tests/test_neral_v5_adapter_selection.py
      - run: python -m unittest discover -s tests -p test_neral_v5_adapter_selection.py -v
