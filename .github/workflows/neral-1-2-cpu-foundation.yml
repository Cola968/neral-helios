name: NERAL 1.2 isolated CPU foundation
on:
  push:
    branches:
      - feat/neral-1-2-cpu-overnight-foundation
  pull_request:
    paths:
      - 'neral_cpu_foundation/**'
      - 'tests/cpu_foundation/**'
      - 'scripts/neral_cpu_foundation_build.py'
      - '.github/workflows/neral-1-2-cpu-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.4.2 sympy==1.14.0 networkx==3.6.1 z3-solver==4.15.3.0
      - name: CPU foundation tests (offline)
        run: python -m pytest -q tests/cpu_foundation
      - name: Build independently rechecked German CPU examples
        run: PYTHONPATH=. python -B scripts/neral_cpu_foundation_build.py --output cpu-artifacts
      - name: Upload evidence-only dataset and manifest
        uses: actions/upload-artifact@v4
        with:
          name: neral-1-2-verified-cpu-dataset
          path: cpu-artifacts/
  existing-pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt sympy==1.14.0 networkx==3.6.1 z3-solver==4.15.3.0
      - name: Install legacy CPU test dependencies
        run: |
          python -m pip install PyYAML cryptography
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Existing and new pytest suites
        run: python -m pytest -q tests
