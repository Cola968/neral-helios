name: NERAL THINK CPU contracts (offline)

on:
  pull_request:
    paths:
      - 'neral_think.py'
      - 'neral_code_trace.py'
      - 'tests/test_neral_code_trace.py'
      - 'docs/NERAL_VERIFIED_CODE_TRACE.md'
      - 'neral_local_chat_api.py'
      - 'tests/test_neral_think.py'
      - 'tests/test_neral_think_api.py'
      - 'tests/test_neral_think_ui.py'
      - 'static/neral-local-chat.js'
      - 'templates/index.html'
      - '.github/workflows/neral-think-ci.yml'
  push:
    paths:
      - 'neral_think.py'
      - 'neral_code_trace.py'
      - 'tests/test_neral_code_trace.py'
      - 'docs/NERAL_VERIFIED_CODE_TRACE.md'
      - 'neral_local_chat_api.py'
      - 'tests/test_neral_think.py'
      - 'tests/test_neral_think_api.py'
      - 'tests/test_neral_think_ui.py'
      - 'static/neral-local-chat.js'
      - 'templates/index.html'
      - '.github/workflows/neral-think-ci.yml'

permissions:
  contents: read

jobs:
  cpu_think:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Flask for HTTP contract tests
        run: python -m pip install 'Flask>=3.0,<4'
      - name: Run pure CPU THINK contract tests
        run: python -m unittest discover -s tests -p test_neral_think.py -v
      - name: Safe Python trace contracts without executing source
        run: python -m unittest discover -s tests -p test_neral_code_trace.py -v
      - name: Run HTTP contract tests
        run: python -m unittest discover -s tests -p test_neral_think_api.py -v
      - name: Verify opt-in Helios THINK controls
        run: |
          python -m unittest discover -s tests -p test_neral_think_ui.py -v
          node --check static/neral-local-chat.js
      - name: Check module syntax
        run: python -m py_compile neral_think.py neral_code_trace.py
