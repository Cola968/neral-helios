name: NERAL THINK CPU contracts (offline)

on:
  pull_request:
    paths:
      - 'neral_think.py'
      - 'neral_logic_engine.py'
      - 'neral_logic_transfer.py'
      - 'neral_quantitative_oracles.py'
      - 'neral_agent_python_trace.py'
      - 'tests/test_neral_agent_python_trace.py'
      - 'tests/test_neral_python_trace_fresh250.py'
      - 'neral_local_chat_api.py'
      - 'tests/test_neral_think.py'
      - 'tests/test_neral_logic_engine.py'
      - 'tests/test_neral_logic_transfer.py'
      - 'tests/test_neral_think_exact_domains.py'
      - 'tests/test_neral_think_api.py'
      - 'tests/test_neral_think_ui.py'
      - 'static/neral-local-chat.js'
      - 'templates/index.html'
      - '.github/workflows/neral-think-ci.yml'
  push:
    paths:
      - 'neral_think.py'
      - 'neral_logic_engine.py'
      - 'neral_logic_transfer.py'
      - 'neral_quantitative_oracles.py'
      - 'neral_agent_python_trace.py'
      - 'tests/test_neral_agent_python_trace.py'
      - 'tests/test_neral_python_trace_fresh250.py'
      - 'neral_local_chat_api.py'
      - 'tests/test_neral_think.py'
      - 'tests/test_neral_logic_engine.py'
      - 'tests/test_neral_logic_transfer.py'
      - 'tests/test_neral_think_exact_domains.py'
      - 'tests/test_neral_think_api.py'
      - 'tests/test_neral_think_ui.py'
      - 'static/neral-local-chat.js'
      - 'templates/index.html'
      - '.github/workflows/neral-think-ci.yml'

permissions:
  contents: read

jobs:
  cpu_think:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Flask for HTTP contract tests
        run: python -m pip install 'Flask>=3.0,<4'
      - name: Run pure CPU THINK contract tests
        run: python -m unittest discover -s tests -p test_neral_think.py -v
      - name: Verify bounded independent logical reasoning (CPU only)
        run: python -m unittest discover -s tests -p test_neral_logic_engine.py -v
      - name: Verify transfer logic on 256 unseen-parameter cases, hostile inputs and THINK
        run: python -m unittest discover -s tests -p test_neral_logic_transfer.py -v
      - name: Verify general arithmetic and Python trace routing (CPU only)
        run: python -m unittest discover -s tests -p test_neral_think_exact_domains.py -v
      - name: Run bounded AST Python-trace and THINK retry tests
        run: python -m unittest discover -s tests -p test_neral_agent_python_trace.py -v
      - name: Test 250 fresh Python trace cases and safety limits
        run: python -m unittest discover -s tests -p test_neral_python_trace_fresh250.py -v
      - name: Run HTTP contract tests
        run: python -m unittest discover -s tests -p test_neral_think_api.py -v
      - name: Verify opt-in Helios THINK controls
        run: |
          python -m unittest discover -s tests -p test_neral_think_ui.py -v
          node --check static/neral-local-chat.js
      - name: Check module syntax
        run: python -m py_compile neral_think.py neral_agent_python_trace.py
