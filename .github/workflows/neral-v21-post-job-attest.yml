name: NERAL V2.1 independent after-job Docker persistence + main HTTP 200
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/neral-v21-post-job-attest.yml'
permissions:
  contents: read
concurrency:
  group: neral-v1-v2-windows-deploy
  cancel-in-progress: false
jobs:
  post-job-readonly:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 9
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Independently attest merged V2.1 main files, persistent Docker and HTTP 200
        run: |
          $ErrorActionPreference='Stop'
          & git merge-base --is-ancestor c864e1d3537c6ccf48eb1421d8ceb4382e2125fb HEAD
          if($LASTEXITCODE -ne 0){throw 'PR563 V2.1 merge not an ancestor of main'}
          $root=Join-Path $env:LOCALAPPDATA 'NERAL/three-tier-pr558-909d1419c9ff/NERAL-1.0-Local'
          $taskName='NERAL-PR558-ThreeTier-909d1419c9ff'
          $service=Join-Path $root 'Start-Neral-Three-Tier-Service.ps1'
          $task=Get-ScheduledTask -TaskName $taskName -ErrorAction Stop
          if([string]$task.State -ne 'Running' -or
             [string]$task.Actions[0].Arguments -notlike ('*'+$service+'*')){
            throw 'Expected user-owned NERAL service not running'
          }
          $paths=@(
            'neral_three_tier_runtime.py','neral_z3_json_compiler.py',
            'neral_tir_experimental.py','neral_v21_attachment_data.py',
            'neral_preview_attachments.py','neral_preview_server.py',
            'neral_everyday_verified.py','neral_web_search.py','neral_web_api.py',
            'templates/neral_preview.html','static/neral-preview.js',
            'static/neral-clean-ui.css','static/neral-web-live.js')
          foreach($rel in $paths){
            $target=Join-Path $root $rel
            if(-not(Test-Path -LiteralPath $target -PathType Leaf)){
              throw ('Installed V2.1 main source missing: '+$rel)
            }
            $expected=(& git rev-parse ('HEAD:'+$rel)).Trim()
            $actual=(& git -c core.autocrlf=true hash-object --path=$rel $target).Trim()
            if($LASTEXITCODE -ne 0 -or $expected -ne $actual){
              throw ('Installed V2.1 main file differs: '+$rel)
            }
          }
          $listeners=@(Get-NetTCPConnection -LocalAddress '127.0.0.1' -LocalPort 9690 -State Listen -ErrorAction SilentlyContinue)
          if($listeners.Count -ne 1){throw 'No unique NERAL localhost listener'}
          $session=New-Object Microsoft.PowerShell.Commands.WebRequestSession
          $home=Invoke-WebRequest -UseBasicParsing -WebSession $session -Uri 'http://127.0.0.1:9690/' -TimeoutSec 9
          $api=Invoke-WebRequest -UseBasicParsing -WebSession $session -Uri 'http://127.0.0.1:9690/api/neral/preview/session' -TimeoutSec 9
          $data=$api.Content|ConvertFrom-Json
          if($home.StatusCode -ne 200 -or $api.StatusCode -ne 200 -or
             $data.three_tier_enabled -ne $true -or
             (@($data.three_tier_levels) -join ',') -ne 'Luna,Terra,Helios' -or
             $home.Content -notmatch 'id="forceSandbox"'){
            throw 'Live V2.1 three-tier homepage and toggle not ready'
          }
          $running=@(Get-Process -Name 'Docker Desktop' -ErrorAction SilentlyContinue)
          if($running.Count -eq 0){throw 'Docker Desktop did not persist beyond previous Actions job'}
          $docker=Join-Path $env:LOCALAPPDATA 'Programs/DockerDesktop/resources/bin/docker.exe'
          if(-not(Test-Path -LiteralPath $docker -PathType Leaf)){throw 'Pinned Docker CLI missing'}
          function TestOfflineDocker {
            $ErrorActionPreference='Continue'
            $id=@(& $docker image inspect --format '{{.Id}}' neral-python-tools:v2 2>$null)
            if($LASTEXITCODE -ne 0 -or $id.Count -lt 1){return $false}
            $out=@(& $docker run --rm --pull never --network none --read-only --memory 256m --cpus 0.5 --pids-limit 32 neral-python-tools:v2 python -B -c 'import sympy,z3;print(7*8)' 2>$null)
            return ($LASTEXITCODE -eq 0 -and ($out -join '').Trim() -eq '56')
          }
          if(-not(TestOfflineDocker)){throw 'Offline solver unavailable after previous Actions job cleanup'}
          Write-Host ('NERAL_V21_INDEPENDENT_POST_JOB_DOCKER_AND_HTTP_200_PASS files='+$paths.Count)
