name: Neral 50M Autonomous Campaign

on:
  workflow_dispatch:
  push:
    branches:
      - gpu-run-50m-campaign

permissions:
  contents: read

# Deliberately share the B2 concurrency key. This prevents the existing queued B2 job and
# the campaign from writing the same local B2 run directory at the same time.
concurrency:
  group: neral-50m-b2-100m
  cancel-in-progress: false

jobs:
  train-until-proven-win:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 900
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout exact campaign revision
        uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false

      - name: Validate private RTX environment
        id: env
        run: |
          $ErrorActionPreference='Stop'
          if (-not $env:NERAL_ASSETS_ROOT) { throw 'NERAL_ASSETS_ROOT is required.' }
          if (-not $env:NERAL_PYTHON) { throw 'NERAL_PYTHON is required.' }
          if (-not (Test-Path $env:NERAL_ASSETS_ROOT -PathType Container)) { throw 'NERAL_ASSETS_ROOT does not exist.' }
          if (-not (Test-Path $env:NERAL_PYTHON -PathType Leaf)) { throw 'NERAL_PYTHON does not exist.' }
          "assets=$env:NERAL_ASSETS_ROOT" >> $env:GITHUB_OUTPUT
          "python=$env:NERAL_PYTHON" >> $env:GITHUB_OUTPUT
          & $env:NERAL_PYTHON -c "import torch; assert torch.cuda.is_available() and torch.cuda.is_bf16_supported(); print({'gpu':torch.cuda.get_device_name(0),'torch':torch.__version__,'cuda':torch.version.cuda})"
          nvidia-smi --query-gpu=name,driver_version,memory.total,memory.free,temperature.gpu,power.draw --format=csv,noheader

      - name: Run benchmark-gated campaign
        id: campaign
        run: |
          $ErrorActionPreference='Stop'
          & '${{ steps.env.outputs.python }}' run_50m_campaign.py --assets '${{ steps.env.outputs.assets }}' --reports campaign_reports

      - name: Persist campaign reports locally
        if: always()
        run: |
          $dest=Join-Path '${{ steps.env.outputs.assets }}' ('reports\runner_50m_campaign_'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force $dest|Out-Null
          if (Test-Path campaign_reports) { Copy-Item campaign_reports\* $dest -Recurse -Force }

      - name: Assert uploads contain no model weights or corpora
        if: always()
        run: |
          if (Test-Path campaign_reports) {
            $bad=Get-ChildItem campaign_reports -Recurse -File|Where-Object { $_.Extension -in '.pt','.pth','.bin','.safetensors','.parquet','.gz' }
            if ($bad) { throw 'Private checkpoint/corpus found in report upload directory.' }
          }

      - name: Upload benchmark and decision reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neral-50m-autonomous-campaign-reports
          path: campaign_reports/
          if-no-files-found: warn
          retention-days: 14
