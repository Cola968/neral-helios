name: Arctus350 Flask CPU contracts
on:
  push:
    branches: [codex/arctus350-flask-experimental]
  pull_request:
    paths:
      - arctus_runtime.py
      - frontier350/**
      - app.py
      - chat_store.py
      - static/helios-core.js
      - static/neral.js
      - tests/test_arctus*
      - .github/workflows/arctus350-flask-cpu.yml
permissions:
  contents: read
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HELIOS_ASSETS_ROOT: ${{ runner.temp }}/empty-models
      HELIOS_STATE_ROOT: ${{ runner.temp }}/arctus-flask-state
      HELIOS_DEVICE: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q tests/test_arctus_flask.py tests/test_helios_runtime.py tests/test_helios_chat_experience.py tests/test_helios_workspace.py tests/test_helios_i1_ready.py tests/test_helios_install.py
      - run: node --test tests/test_helios_history.js tests/test_arctus_history.js
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/test_helios_chat_experience.cjs
      - run: node tests/test_arctus_browser.cjs
