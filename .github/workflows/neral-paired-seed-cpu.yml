name: NERAL paired benchmark sampling seed CPU contracts
on:
  pull_request:
    paths:
      - 'neral_agent_autonomy.py'
      - 'scripts/neral_high12_manual.py'
      - 'scripts/neral_tir12_manual.py'
      - 'tests/test_neral_ollama_diagnostics.py'
      - 'tests/test_neral_high12_manual.py'
      - 'tests/test_neral_tir12_manual.py'
      - '.github/workflows/neral-paired-seed-cpu.yml'
  push:
    branches: [main]
    paths:
      - 'neral_agent_autonomy.py'
      - 'scripts/neral_high12_manual.py'
      - 'scripts/neral_tir12_manual.py'
      - '.github/workflows/neral-paired-seed-cpu.yml'
permissions:
  contents: read
jobs:
  paired-seed-cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-neral-preview.txt
      - name: Ollama wire parity and fixed-seed boundaries
        run: python -B -m unittest discover -s tests -p test_neral_ollama_diagnostics.py -v
      - name: HIGH12 paired-case generator and scorer contracts
        run: python -B -m unittest discover -s tests -p test_neral_high12_manual.py -v
      - name: TIR12 same-pair scorer contracts
        run: python -B -m unittest discover -s tests -p test_neral_tir12_manual.py -v
      - name: Python syntax
        run: python -B -m py_compile neral_agent_autonomy.py scripts/neral_high12_manual.py scripts/neral_tir12_manual.py
