name: NERAL model agent contract tests
on:
  pull_request:
    paths:
      - 'neral_agent_autonomy.py'
      - 'neral_agent_hf.py'
      - 'neral_agent_sandbox.py'
      - 'agent_auto_api.py'
      - 'agent_mode.py'
      - 'app.py'
      - 'static/agent-auto.js'
      - 'templates/index.html'
      - 'tests/test_agent_auto*.py'
      - 'tests/test_agent_sandbox.py'
      - 'tests/test_agent_pc_patch.py'
      - '.github/workflows/neral-agent-model-ci.yml'
permissions:
  contents: read
jobs:
  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Flask>=3,<4'
      - run: python -m unittest discover -s tests -p 'test_agent_auto*.py' -v
      - run: python -m unittest discover -s tests -p test_agent_sandbox.py -v
      - run: python -m compileall -q neral_agent_autonomy.py neral_agent_hf.py neral_agent_sandbox.py agent_auto_api.py scripts/neral_agent_pc_live_smoke.py
      - run: python -m unittest discover -s tests -p test_agent_pc_patch.py -v
      - run: node --check static/agent-auto.js
