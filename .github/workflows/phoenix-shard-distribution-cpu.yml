name: Phoenix shard distribution synthetic CPU
on:
  pull_request:
    paths:
      - 'frontier350/nextgen_v1/phoenix_shard_distribution_audit.py'
      - 'frontier350/nextgen_v1/test_phoenix_shard_distribution_audit.py'
      - '.github/workflows/phoenix-shard-distribution-cpu.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-shard-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test synthetic shard audit only
        working-directory: frontier350/nextgen_v1
        run: |
          python -m py_compile phoenix_shard_distribution_audit.py test_phoenix_shard_distribution_audit.py
          python -m unittest -v test_phoenix_shard_distribution_audit.py
