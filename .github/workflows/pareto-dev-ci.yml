name: Pareto dev guard CI

on:
  pull_request:
    paths:
      - pareto_dev_guard50.py
      - tests/test_pareto_dev_guard50.py
      - .github/workflows/pareto-dev-ci.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Pareto guard
        run: python -m py_compile pareto_dev_guard50.py
      - name: Install tests
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run Pareto guard tests
        run: python -m pytest tests/test_pareto_dev_guard50.py -q
