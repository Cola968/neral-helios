name: NERAL 1.0 Python Code Check CPU contracts
on:
  pull_request:
    paths:
      - 'neral_preview_server.py'
      - 'tests/test_neral_1_0_codecheck_files.py'
      - 'requirements-neral-preview.txt'
      - '.github/workflows/neral-1-0-codecheck-ci.yml'
  push:
    branches: [main]
    paths:
      - 'neral_preview_server.py'
      - 'tests/test_neral_1_0_codecheck_files.py'
      - 'requirements-neral-preview.txt'
      - '.github/workflows/neral-1-0-codecheck-ci.yml'
permissions:
  contents: read
jobs:
  python-codecheck:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated preview server dependencies for tests
        run: python -m pip install -r requirements-neral-preview.txt
      - name: Code-check compilation boundaries and no code execution
        run: python -m unittest discover -s tests -p test_neral_1_0_codecheck_files.py -v
