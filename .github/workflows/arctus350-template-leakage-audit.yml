name: Arctus350 template leakage audit (CPU-only)
on:
  pull_request:
    paths:
      - 'frontier350/chat350_template_leakage_audit.py'
      - 'tests/test_chat350_template_leakage_audit.py'
      - '.github/workflows/arctus350-template-leakage-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CPU-only regression tests
        run: python -m unittest tests.test_chat350_template_leakage_audit -v
      - name: Python syntax
        run: python -m py_compile frontier350/chat350_template_leakage_audit.py tests/test_chat350_template_leakage_audit.py
