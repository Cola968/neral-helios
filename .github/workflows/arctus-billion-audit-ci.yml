name: Arctus350 billion-token near-duplicate integrity audit
on:
  pull_request:
    paths:
      - 'arctus_billion_audit.py'
      - 'tests/test_arctus_billion_audit.py'
      - '.github/workflows/arctus-billion-audit-ci.yml'
permissions:
  contents: read
jobs:
  no-gpu-offline-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Check syntax
        run: python -m py_compile arctus_billion_audit.py tests/test_arctus_billion_audit.py
      - name: Audit unit tests (no external requests, data, or GPU)
        run: python -m pytest -q tests/test_arctus_billion_audit.py
