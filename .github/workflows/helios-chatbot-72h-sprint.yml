name: Helios chatbot 72h sprint

on:
  push:
    branches: [sprint/helios-chatbot-72h-20260924]
    paths:
      - '.github/workflows/helios-chatbot-72h-sprint.yml'
      - 'frontier350/sprint72h_build_sft_sources.py'
      - 'frontier350/sprint72h_train_chat.py'
      - 'frontier350/sprint72h_eval_chat.py'
      - 'frontier350/sprint72h_chat_app.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neral-helios-chatbot-72h-sprint
  cancel-in-progress: true

jobs:
  chat-sft:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 360
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"

    steps:
      - name: Checkout exact sprint revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: helios_sprint_${{ github.run_id }}
          clean: false
          persist-credentials: false

      - name: Build data, train candidate, run chat A-B
        run: |
          $ErrorActionPreference='Stop'
          function ToWsl([string]$p) {
            $f=[IO.Path]::GetFullPath($p)
            if($f -notmatch '^([A-Za-z]):\\(.*)$') { throw "Absolute Windows path required: $p" }
            return '/mnt/' + $matches[1].ToLowerInvariant() + '/' + $matches[2].Replace('\','/')
          }

          $repo=Join-Path $env:GITHUB_WORKSPACE ('helios_sprint_' + $env:GITHUB_RUN_ID)
          $base='D:\NeralScaleV81\_continuity_v5\continuity_002073161216_f7a73e283421.pt'
          $assets=if($env:NERAL_ASSETS_ROOT){$env:NERAL_ASSETS_ROOT}else{Join-Path $env:USERPROFILE 'Documents\Codex\2026-09-05\lo\outputs\neral'}
          $tokenizer=Join-Path $assets 'frontier350_assets\tokenizer.json'
          $private='D:\NeralPrivateAssets\sprint72h\active'
          $src=Join-Path $private 'sources'
          $data=Join-Path $private 'data'
          $out=Join-Path $private 'chat'
          $archiveName='2023-11-05_oasst2_ready.messages.jsonl.gz'
          $archiveCandidates=@(
            (Join-Path 'D:\NeralPrivateAssets\sft50_sources' $archiveName),
            (Join-Path $assets ('sft50_sources\' + $archiveName)),
            (Join-Path $assets ('i1_work_v3_oasst2\sft_sources\' + $archiveName))
          )

          if(-not(Test-Path -LiteralPath $base -PathType Leaf)){throw 'Historical checkpoint missing'}
          if(-not(Test-Path -LiteralPath $tokenizer -PathType Leaf)){throw 'Tokenizer missing'}
          New-Item -ItemType Directory -Path $private -Force|Out-Null
          $dataReady=Join-Path $data 'manifest.json'
          if(-not(Test-Path -LiteralPath $dataReady -PathType Leaf)){
            # Any partial data/source tree from a failed preparation is disposable;
            # no model training could have been bound to it yet.
            foreach($p in @($src,$data)){
              if(Test-Path -LiteralPath $p){Remove-Item -LiteralPath $p -Recurse -Force}
            }
            New-Item -ItemType Directory -Path $src|Out-Null
            foreach($candidate in $archiveCandidates){
              if(Test-Path -LiteralPath $candidate -PathType Leaf){
                Copy-Item -LiteralPath $candidate -Destination (Join-Path $src $archiveName)
                Write-Host "Using local pinned OASST2 archive: $candidate"
                break
              }
            }
          } else {
            Write-Host "Reusing prepared sprint data: $data"
          }

          $repoW=ToWsl $repo
          $srcW=ToWsl $src
          $dataW=ToWsl $data
          $outW=ToWsl $out
          $baseW=ToWsl $base
          $tokW=ToWsl $tokenizer
          $py='~/.venvs/neral-triton-py312/bin/python'

          $compile="set -euo pipefail; cd '$repoW'; $py -B -m py_compile frontier350/sprint72h_build_sft_sources.py frontier350/sprint72h_train_chat.py frontier350/sprint72h_eval_chat.py frontier350/sprint72h_chat_app.py fetch_oasst2_sft50.py build_targeted_sft50_sources.py prepare_sft50.py prepare_sft50_i1.py"
          & wsl.exe -- bash -lc $compile
          if($LASTEXITCODE -ne 0){throw 'Sprint Python compile failed'}

          if(-not(Test-Path -LiteralPath $dataReady -PathType Leaf)){
            $prep="set -euo pipefail; cd '$repoW'; $py -B fetch_oasst2_sft50.py --out '$srcW' --max-en 16000 --max-de 6000; $py -B frontier350/sprint72h_build_sft_sources.py --root '$srcW' --per-generated-source 6000; $py -B prepare_sft50_i1.py --source-root '$srcW' --out '$dataW' --max-seq 512 --target-train-examples 20000"
            & wsl.exe -- bash -lc $prep
            if($LASTEXITCODE -ne 0){throw 'Sprint SFT data preparation failed'}
          }

          $manifest=Get-Content -LiteralPath $dataReady -Raw|ConvertFrom-Json
          if([int]$manifest.target_train_examples -ne 20000){throw 'Sprint pack is not 20k examples'}
          if([int]$manifest.prompt_group_overlap_audit.cross_split_prompt_group_overlap -ne 0){throw 'Prompt leakage detected'}
          if($manifest.external_model_calls -ne $false){throw 'External-model data detected'}

          Write-Host 'Pre-training GPU telemetry:'
          nvidia-smi --query-gpu=name,memory.free,utilization.gpu,temperature.gpu --format=csv,noheader

          $replay=Join-Path $assets 'frontier350_safe_v8_arctus-safe-v8-20260912-r1_xling05\train'
          $summaryPath=Join-Path $out 'summary.json'
          $resumePath=Join-Path $out 'resume.pt'
          $resumeFlag=''
          if(Test-Path -LiteralPath $summaryPath -PathType Leaf){
            Write-Host 'Sprint training already completed; preserving accepted local result.'
          } else {
            if((Test-Path -LiteralPath $out -PathType Container) -and -not(Test-Path -LiteralPath $resumePath -PathType Leaf)){
              Write-Warning 'Incomplete sprint output has no resumable snapshot; restarting only this SFT stage.'
              Remove-Item -LiteralPath $out -Recurse -Force
            }
            if(Test-Path -LiteralPath $resumePath -PathType Leaf){
              $resumeFlag=' --resume'
              Write-Host 'Resuming exact compact SFT state from active/chat/resume.pt.'
            }
            if(Test-Path -LiteralPath $replay -PathType Container){
              $replayW=ToWsl $replay
              $train="set -euo pipefail; cd '$repoW'; $py -B -u frontier350/sprint72h_train_chat.py --execute --trusted-own-checkpoint --checkpoint '$baseW' --tokenizer '$tokW' --data '$dataW' --out '$outW'$resumeFlag --replay-root '$replayW' --train-blocks 8 --steps 2000 --batch 4 --context 512 --peak-lr 0.000015 --min-lr 0.0000015 --sft-weight 0.85 --eos-weight 1.75 --eval-every 200 --patience 5 --min-delta 0.005"
            } else {
              Write-Warning 'Historical replay root absent; using chat-only SFT.'
              $train="set -euo pipefail; cd '$repoW'; $py -B -u frontier350/sprint72h_train_chat.py --execute --trusted-own-checkpoint --checkpoint '$baseW' --tokenizer '$tokW' --data '$dataW' --out '$outW'$resumeFlag --train-blocks 8 --steps 2000 --batch 4 --context 512 --peak-lr 0.000015 --min-lr 0.0000015 --sft-weight 1.0 --eos-weight 1.75 --eval-every 200 --patience 5 --min-delta 0.005"
            }
            & wsl.exe -- bash -lc $train
            if($LASTEXITCODE -ne 0){throw 'Sprint chat SFT failed'}
          }

          $summary=Get-Content -LiteralPath $summaryPath -Raw|ConvertFrom-Json
          $best=Join-Path $out 'best_chat.pt'
          $bestSha=([string]$summary.best_checkpoint_sha256).ToLowerInvariant()
          if((Get-FileHash -LiteralPath $best -Algorithm SHA256).Hash.ToLowerInvariant() -ne $bestSha){throw 'Best checkpoint SHA mismatch'}

          $evalOut=Join-Path $out 'chat_ab.json'
          $bestW=ToWsl $best
          $evalW=ToWsl $evalOut
          if(-not(Test-Path -LiteralPath $evalOut -PathType Leaf)){
            $eval="set -euo pipefail; cd '$repoW'; $py -B -u frontier350/sprint72h_eval_chat.py --execute --base '$baseW' --candidate '$bestW' --tokenizer '$tokW' --out '$evalW'"
            & wsl.exe -- bash -lc $eval
            if($LASTEXITCODE -ne 0){throw 'Sprint chat A-B execution failed'}
          } else {
            Write-Host 'Reusing completed local chat A-B report.'
          }
          $ab=Get-Content -LiteralPath $evalOut -Raw|ConvertFrom-Json

          Copy-Item -LiteralPath (Join-Path $repo 'frontier350\sprint72h_chat_app.py') -Destination (Join-Path $out 'sprint72h_chat_app.py') -Force
          Copy-Item -LiteralPath (Join-Path $repo 'frontier350\model350.py') -Destination (Join-Path $out 'model350.py') -Force
          New-Item -ItemType Directory -Path (Join-Path $out 'nextgen_v1') -Force|Out-Null
          Copy-Item -LiteralPath (Join-Path $repo 'frontier350\nextgen_v1\helios_chat_core.py') -Destination (Join-Path $out 'nextgen_v1\helios_chat_core.py') -Force
          Copy-Item -LiteralPath (Join-Path $repo 'frontier350\nextgen_v1\helios_chat_ui.html') -Destination (Join-Path $out 'nextgen_v1\helios_chat_ui.html') -Force
          Set-Content -LiteralPath (Join-Path $out 'nextgen_v1\__init__.py') -Value '' -Encoding utf8
          $launchCommand="cd '$outW'; ~/.venvs/neral-triton-py312/bin/python -u sprint72h_chat_app.py --execute --checkpoint '$bestW' --checkpoint-sha256 '$bestSha' --tokenizer '$tokW' --device cuda --port 9683"
          Set-Content -LiteralPath (Join-Path $out 'LAUNCH_COMMAND.txt') -Value $launchCommand -Encoding utf8

          Write-Host '=== HELIOS 72H SPRINT RESULT ==='
          [ordered]@{
            output=$out
            best_checkpoint_sha256=$bestSha
            baseline_validation_loss=$summary.baseline_validation_loss
            best_validation_loss=$summary.best_validation_loss
            best_step=$summary.best_step
            base_dev_correct=$ab.base.correct
            candidate_dev_correct=$ab.candidate.correct
            delta_correct=$ab.delta_correct
            chat_mvp_gate_passed=$ab.chat_mvp_gate_passed
            launch_command_file=(Join-Path $out 'LAUNCH_COMMAND.txt')
          }|ConvertTo-Json -Depth 5|Write-Host

      - name: Post-run GPU telemetry
        if: always()
        run: |
          nvidia-smi --query-gpu=name,memory.used,memory.free,utilization.gpu,temperature.gpu --format=csv,noheader
          Write-Host 'Sprint checkpoints remain local; nothing is uploaded.'
