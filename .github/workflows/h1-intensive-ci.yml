name: Neral 50M H1 intensive CI

on:
  pull_request:
    paths:
      - 'run_50m_h1_intensive.py'
      - 'h1_gate50.py'
      - 'tests/test_h1_gate50.py'
      - '.github/workflows/neral50m-h1-intensive.yml'
      - '.github/workflows/h1-intensive-ci.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile H1 scripts
        run: python -m py_compile run_50m_h1_intensive.py h1_gate50.py
      - name: Install tests
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run H1 gate tests
        run: python -m pytest tests/test_h1_gate50.py -q
