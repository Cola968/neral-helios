name: Neral 350M Frontier Compile Gate

on:
  push:
    branches: [frontier/neral350-v1]
    paths:
      - 'frontier350_compile_requests/request.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: neral-350m-frontier-compile-gate
  cancel-in-progress: false

jobs:
  compile-gate:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - name: Checkout trusted Frontier branch
        uses: actions/checkout@v4
        with:
          ref: frontier/neral350-v1
          clean: true
          persist-credentials: false

      - name: Validate explicit compile-gate request
        run: |
          $ErrorActionPreference='Stop'
          $p='frontier350_compile_requests\request.json'
          if(-not(Test-Path $p -PathType Leaf)){throw 'compile-gate request missing'}
          $r=Get-Content $p -Raw | ConvertFrom-Json
          $props=@($r.PSObject.Properties.Name | Sort-Object)
          if(($props -join ',') -ne 'action,architecture,request_id,version'){throw 'unsupported compile-gate request fields'}
          if([int]$r.version -ne 1){throw 'unsupported request version'}
          if($r.action -ne 'validate_checkpoint_native_compile'){throw 'wrong action'}
          if($r.architecture -ne 'frontier350-v1'){throw 'wrong architecture'}
          if($r.request_id -notmatch '^[A-Za-z0-9._-]{1,64}$'){throw 'invalid request id'}

      - name: Resolve WSL checkpoint and validation paths
        id: env
        run: |
          $ErrorActionPreference='Stop'
          if(-not(Get-Command wsl.exe -ErrorAction SilentlyContinue)){throw 'WSL executable missing'}
          function Convert-ToWslPath([string]$Path) {
            $full=[System.IO.Path]::GetFullPath($Path)
            if($full -notmatch '^([A-Za-z]):\\(.*)$'){throw "unsupported Windows path: $Path"}
            $drive=$matches[1].ToLower()
            $rest=$matches[2] -replace '\\','/'
            return "/mnt/$drive/$rest"
          }
          $repo=(Get-Location).Path
          $assets=if($env:NERAL_ASSETS_ROOT){$env:NERAL_ASSETS_ROOT}else{'C:\Users\astad\Documents\Codex\2026-09-05\lo\outputs\neral'}
          $checkpoint=Join-Path $assets 'runs\neral350_frontier_10b\resume.pt'
          $valid=Join-Path $assets 'frontier350_data\valid'
          if(-not(Test-Path $checkpoint -PathType Leaf)){throw "Frontier resume checkpoint missing: $checkpoint"}
          if(-not(Test-Path $valid -PathType Container)){throw "Frontier validation data missing: $valid"}
          $repoWsl=Convert-ToWslPath $repo
          $ckWsl=Convert-ToWslPath $checkpoint
          $validWsl=Convert-ToWslPath $valid
          wsl.exe -- bash -lc "set -e; test -f '$ckWsl'; test -d '$validWsl'; test -x \"$HOME/.venvs/neral-triton-py312/bin/python\"; '$HOME/.venvs/neral-triton-py312/bin/python' -c 'import torch; assert torch.__version__.startswith(\"2.8.\"); assert torch.cuda.is_available() and torch.cuda.is_bf16_supported(); print(torch.cuda.get_device_name(0))'"
          if($LASTEXITCODE -ne 0){throw 'WSL/PyTorch compile-gate environment unavailable'}
          "repo_wsl=$repoWsl" >> $env:GITHUB_OUTPUT
          "checkpoint_wsl=$ckWsl" >> $env:GITHUB_OUTPUT
          "valid_wsl=$validWsl" >> $env:GITHUB_OUTPUT

      - name: Run eager-vs-compiled numerical gate
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force frontier350_compile_report | Out-Null
          $repo='${{ steps.env.outputs.repo_wsl }}'
          $ck='${{ steps.env.outputs.checkpoint_wsl }}'
          $valid='${{ steps.env.outputs.valid_wsl }}'
          $out="$repo/frontier350_compile_report/compile_gate.json"
          wsl.exe -- bash -lc "set -e; cd '$repo'; export TORCHINDUCTOR_CACHE_DIR=\"$HOME/.cache/neral_inductor\"; export CC=/usr/bin/gcc; export CXX=/usr/bin/g++; '$HOME/.venvs/neral-triton-py312/bin/python' -u frontier350/validate_compile350.py --checkpoint '$ck' --valid-data '$valid' --out '$out' --seq 256 --batch 1 --eval-batches 4"
          if($LASTEXITCODE -ne 0){throw 'compiled numerical gate failed'}

      - name: Print decision
        if: always()
        run: |
          $p='frontier350_compile_report\compile_gate.json'
          if(Test-Path $p -PathType Leaf){
            $r=Get-Content $p -Raw | ConvertFrom-Json
            Write-Host ("passed=" + $r.passed)
            Write-Host ("eval_loss_max_abs=" + $r.differences.eval_loss_max_abs)
            Write-Host ("train_loss_abs=" + $r.differences.train_loss_abs)
            Write-Host ("logit_max_abs=" + $r.differences.logit_max_abs)
            Write-Host ("grad_max_abs=" + $r.differences.grad_max_abs)
          } else { Write-Host 'No compile gate report produced.' }

      - name: Upload report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neral350-frontier-compile-gate-${{ github.run_id }}
          path: frontier350_compile_report/
          retention-days: 30
          if-no-files-found: warn
