name: NERAL V2 final main localhost 9690 and installed-source verification
on:
  push:
    branches: [main]
    paths:
      - 'neral_three_tier_runtime.py'
      - 'neral_tir_experimental.py'
      - 'neral_docker_runtime.py'
      - 'static/neral-preview.js'
      - 'neral_v21_attachment_data.py'
      - 'neral_preview_attachments.py'
      - 'neral_preview_server.py'
      - 'templates/neral_preview.html'
      - 'static/neral-clean-ui.css'
      - 'scripts/neral_pr562_main_sync.ps1'
      - '.github/workflows/neral-v2-main-final-verification.yml'
permissions:
  contents: read
concurrency:
  group: neral-v1-v2-windows-deploy
  cancel-in-progress: false
jobs:
  main-local-install-attestation:
    # PR #567 is deployed by the V3 guarded main workflow, never by V2 sync.
    if: "!contains(github.event.head_commit.message, 'PR #567')"
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Parse owner-approved merged-main sync before any modification
        run: |
          $ErrorActionPreference='Stop'
          $target=Join-Path $env:GITHUB_WORKSPACE 'scripts/neral_pr562_main_sync.ps1'
          $tokens=$null;$parseErrors=$null
          [Management.Automation.Language.Parser]::ParseFile($target,[ref]$tokens,[ref]$parseErrors) | Out-Null
          if(@($parseErrors).Count -ne 0){throw 'Merged main synchronization script has PowerShell syntax errors'}
          if($env:GITHUB_REF -ne 'refs/heads/main'){throw 'Unexpected non-main ref'}
          & git merge-base --is-ancestor bf06134566caf0b48932c3690d7a4c570b9bef6a HEAD
          if($LASTEXITCODE -ne 0){throw 'PR562 merge commit missing from main'}
          Write-Host 'NERAL_PR562_MAIN_SYNC_SCRIPT_PARSE_PASS'
      - name: Ensure pinned user Docker Desktop engine persists across Actions jobs
        env:
          RUNNER_TRACKING_ID: ""
        run: |
          $ErrorActionPreference='Stop'
          # V2.1's Docker daemon must survive GitHub's post-job orphan cleanup.
          # No downloads, installer, new Windows service or remote image pull.
          $docker=Join-Path $env:LOCALAPPDATA 'Programs/DockerDesktop/resources/bin/docker.exe'
          $desktopExe=Join-Path $env:LOCALAPPDATA 'Programs/DockerDesktop/Docker Desktop.exe'
          if(-not(Test-Path -LiteralPath $docker -PathType Leaf) -or
             -not(Test-Path -LiteralPath $desktopExe -PathType Leaf)){
            throw 'Existing user-scoped Docker Desktop installation missing'
          }
          function TestSolverImage {
            $ErrorActionPreference='Continue'
            $lines=@(& $docker image inspect --format '{{.Id}}' neral-python-tools:v2 2>$null)
            return ($LASTEXITCODE -eq 0 -and $lines.Count -ge 1)
          }
          function TestSolverRun {
            $ErrorActionPreference='Continue'
            $lines=@(& $docker run --rm --pull never --network none --read-only --memory 256m --cpus 0.5 --pids-limit 32 neral-python-tools:v2 python -B -c 'import sympy,z3;print(7*8)' 2>$null)
            return ($LASTEXITCODE -eq 0 -and ($lines -join '').Trim() -eq '56')
          }
          if(-not(TestSolverImage)){
            $running=@(Get-Process -Name 'Docker Desktop' -ErrorAction SilentlyContinue)
            if($running.Count -eq 0){
              Start-Process -FilePath $desktopExe -ErrorAction Stop
              Write-Host 'NERAL_V21_PERSISTENT_DESKTOP_STARTED'
            }
            $ready=$false
            for($i=0;$i -lt 75;$i++){
              Start-Sleep -Seconds 2
              if(TestSolverImage){$ready=$true;break}
            }
            if(-not $ready){throw 'Pinned offline Docker engine/image unavailable'}
          }
          if(-not(TestSolverRun)){throw 'Pinned offline Docker solver executable probe failed'}
          Write-Host 'NERAL_V21_PERSISTENT_DOCKER_READY'
      - name: Synchronize approved main files and restart owned NERAL V2 service with rollback
        run: |
          $ErrorActionPreference='Stop'
          & .\scripts\neral_pr562_main_sync.ps1
          if($LASTEXITCODE -ne 0){throw 'Merged main sync/restart failed'}
          Write-Host 'NERAL_PR562_MAIN_SYNC_RESTART_COMPLETED'
      - name: Verify installed main source hashes, V2 service environment and live HTTP
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $root=Join-Path $env:LOCALAPPDATA 'NERAL/three-tier-pr558-909d1419c9ff/NERAL-1.0-Local'
          $taskName='NERAL-PR558-ThreeTier-909d1419c9ff'
          $service=Join-Path $root 'Start-Neral-Three-Tier-Service.ps1'
          $task=Get-ScheduledTask -TaskName $taskName -ErrorAction Stop
          if([string]$task.State -ne 'Running' -or
             [string]$task.Actions[0].Arguments -notlike ('*'+$service+'*')){
            throw 'Expected NERAL V2 owned task not running'
          }
          $text=[IO.File]::ReadAllText($service)
          if($text -notmatch 'NERAL_CODE_SANDBOX_V2' -or
             $text -notmatch '(?i)neral_preview_server' -or
             $text -notmatch '--experimental-three-tier-hf'){
            throw 'Installed service script does not enable V2 solver'
          }
          $paths=@('neral_three_tier_runtime.py','neral_z3_json_compiler.py','neral_tir_experimental.py',
            'neral_docker_runtime.py',
            'neral_v21_attachment_data.py','neral_preview_attachments.py','neral_preview_server.py',
            'neral_everyday_verified.py','neral_web_search.py','neral_web_api.py',
            'templates/neral_preview.html','static/neral-preview.js',
            'static/neral-clean-ui.css','static/neral-web-live.js')
          foreach($rel in $paths){
            $target=Join-Path $root $rel
            if(-not(Test-Path -LiteralPath $target -PathType Leaf)){
              throw ('Main source file absent from running installation: '+$rel)
            }
            $expected=(& git rev-parse ('HEAD:'+$rel)).Trim()
            $actual=(& git -c core.autocrlf=true hash-object --path=$rel $target).Trim()
            if($LASTEXITCODE -ne 0 -or $expected -ne $actual){
              throw ('Installed source differs from merged main: '+$rel)
            }
          }
          Write-Host ('NERAL_V2_FINAL_MAIN_SOURCE_BLOBS_PASS count='+$paths.Count)
          $listeners=@(Get-NetTCPConnection -LocalAddress '127.0.0.1' -LocalPort 9690 -State Listen -ErrorAction SilentlyContinue)
          if($listeners.Count -ne 1){throw 'Port 9690 listener not unique'}
          $session=New-Object Microsoft.PowerShell.Commands.WebRequestSession
          $h=Invoke-WebRequest -UseBasicParsing -WebSession $session -Uri 'http://127.0.0.1:9690/' -TimeoutSec 9
          $a=Invoke-WebRequest -UseBasicParsing -WebSession $session -Uri 'http://127.0.0.1:9690/api/neral/preview/session' -TimeoutSec 9
          $data=$a.Content|ConvertFrom-Json
          if($h.StatusCode -ne 200 -or $a.StatusCode -ne 200 -or
             $data.three_tier_enabled -ne $true -or
             (@($data.three_tier_levels) -join ',') -ne 'Luna,Terra,Helios'){
            throw 'Merged main V2 live session not ready'
          }
          $ui=Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:9690/static/neral-preview.js' -TimeoutSec 9
          if($ui.StatusCode -ne 200 -or [string]$ui.Content -notmatch 'Helios Code-Sandbox'){
            throw 'V2 UI origin marker not served'
          }
          $docker=(Get-Command docker.exe -ErrorAction Stop).Source
          & $docker image inspect neral-python-tools:v2 *> $null
          if($LASTEXITCODE -ne 0){throw 'Solver image not present after merged main'}
          $probe=@(& $docker run --rm --pull never --network none --read-only --memory 256m --cpus 0.5 --pids-limit 32 neral-python-tools:v2 python -B -c 'import sympy,z3;print(sympy.Rational(3,2)+sympy.Rational(1,2))')
          if($LASTEXITCODE -ne 0 -or ($probe -join '').Trim() -ne '2'){
            throw 'Merged main Docker solver not executing'
          }
          $page=Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:9690/' -TimeoutSec 9
          if($page.StatusCode -ne 200 -or $page.Content -notmatch 'id="forceSandbox"'){
            throw 'Merged V2.1 main force-sandbox toggle not visible on local homepage'
          }
          $uiJs=Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:9690/static/neral-preview.js' -TimeoutSec 9
          if($uiJs.StatusCode -ne 200 -or $uiJs.Content -notmatch 'force_sandbox'){
            throw 'Merged main V2.1 UI transport not served'
          }
          Write-Host 'NERAL_V21_FINAL_MAIN_FORCE_TOGGLE_HTTP_200_PASS'
          Write-Host 'NERAL_V2_FINAL_MAIN_PORT_9690_AND_SOLVER_PASS'
