name: NERAL RTX WSL Python/Ollama preflight (read only)
on:
  push:
    branches: [feature/neral-assistant-local-reasoning-20261027]
    paths:
      - .github/workflows/neral-assistant-wsl-preflight.yml
permissions:
  contents: read
jobs:
  wsl-preflight:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 3
    steps:
      - name: Probe WSL Python, packages and Windows loopback network without installs
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          & wsl.exe --exec python3 --version
          if ($LASTEXITCODE -ne 0) { throw 'No default WSL Python 3 interpreter' }
          $code = 'import importlib.util as m; print("WSL_PACKAGES " + " ".join(x+"="+str(m.find_spec(x) is not None) for x in ["torch","flask","waitress","numpy"]))'
          & wsl.exe --exec python3 -c $code
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect WSL Python packages' }
          $code2 = 'import urllib.request,json; op=urllib.request.build_opener(urllib.request.ProxyHandler({})); d=json.load(op.open("http://127.0.0.1:11434/api/tags",timeout=5)); print("WSL_LOCAL_OLLAMA_9B="+str(any(x.get("name")=="qwen3.5:9b" for x in d.get("models",[]))))'
          & wsl.exe --exec python3 -c $code2
          if ($LASTEXITCODE -ne 0) { Write-Host 'WSL cannot reach the Windows localhost Ollama service (no firewall changes attempted).' }
