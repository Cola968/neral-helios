name: Phoenix three-sampler read-only original OASST2 comparison (NO GPU)

# One-shot. Trigger only when THIS workflow is created or modified.
# Do not install software, touch model weights, export private corpus or train.
on:
  push:
    branches: [experiment/phoenix-sft-fp32-audit]
    paths: ['.github/workflows/phoenix-screened-probe-once.yml']

permissions:
  contents: read

concurrency:
  group: neral-nextgen-local-gpu-training
  cancel-in-progress: false

jobs:
  compare-original-source-in-memory:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 12
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - name: Isolated exact-commit checkout; never clean private assets
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: phoenix_screened_source_${{ github.run_id }}
          clean: false
          persist-credentials: false
      - name: Compare SHA-pinned original archive using existing WSL Python CPU
        run: |
          $ErrorActionPreference = 'Stop'
          function ToWsl([string]$p) {
            $f = [IO.Path]::GetFullPath($p)
            if ($f -notmatch '^([A-Za-z]):\\(.*)$') { throw 'Absolute Windows path required' }
            return '/mnt/' + $matches[1].ToLowerInvariant() + '/' + $matches[2].Replace('\','/')
          }
          $repo = Join-Path $env:GITHUB_WORKSPACE ('phoenix_screened_source_' + $env:GITHUB_RUN_ID)
          $root = if ($env:NERAL_ASSETS_ROOT) { $env:NERAL_ASSETS_ROOT } else { Join-Path $env:USERPROFILE 'Documents\Codex\2026-09-05\lo\outputs\neral' }
          $archive = Join-Path $root 'sft50_sources\2023-11-05_oasst2_ready.messages.jsonl.gz'
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw 'Pinned archive missing; no processing' }
          if ($repo.Contains("'") -or $root.Contains("'") -or $archive.Contains("'")) { throw 'Unsafe path; refusing source read' }
          $cmd = "set -euo pipefail; test -x ~/.venvs/neral-triton-py312/bin/python; cd '$(ToWsl $repo)'; ~/.venvs/neral-triton-py312/bin/python -u frontier350/nextgen_v1/phoenix_screened_probe.py --assets-root '$(ToWsl $root)' --archive '$(ToWsl $archive)'"
          & wsl.exe -- bash -lc $cmd
          if ($LASTEXITCODE -ne 0) { throw 'Three-way read-only comparison blocked; no data approved' }
      - name: Interpretation boundary
        run: Write-Host 'Aggregate diagnostic only; no GPU, model, downloads, training, source export, holdout, legal/privacy approval or measured chatbot quality.'
