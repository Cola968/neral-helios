name: Arctus350 original checkpoint weight-delta evidence
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'frontier350/arctus350_weight_delta.py'
      - 'tests/test_arctus350_weight_delta.py'
      - '.github/workflows/arctus350-real-weight-delta.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arctus350-real-weight-delta-readonly
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: All CPU-only weight delta contract tests
        run: python -m unittest tests.test_arctus350_weight_delta -v
      - name: Compile
        run: python -m py_compile frontier350/arctus350_weight_delta.py tests/test_arctus350_weight_delta.py
  authentic-local-delta:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    needs: contracts
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 14
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          path: arctus350_weight_delta_checkout
          clean: false
          persist-credentials: false
      - name: Inventory original checkpoints and run aggregate CPU-only delta
        run: |
          $ErrorActionPreference='Stop'
          $assets=if($env:NERAL_ASSETS_ROOT){$env:NERAL_ASSETS_ROOT}else{'C:\Users\astad\Documents\Codex\2026-09-05\lo\outputs\neral'}
          $base='D:\NeralScaleV81\_neral_safe_vault\SAFE-1010003584-ef3ee045203f1bfb7b9f501db800408b095aa5ef29da5d22a8a9486e115e9f7c\resume.pt'
          $two='D:\NeralScaleV81\_continuity_v5\continuity_002073161216_f7a73e283421.pt'
          $sft=Join-Path $assets 'runs\neral350_chat_chatpilot-humanbalanced1200-20261009\best_chat.pt'
          foreach($p in @($base,$two,$sft)){if(-not(Test-Path -LiteralPath $p -PathType Leaf)){throw 'missing pinned private source; no fallback'}}
          function W([string]$Path){
            $full=[IO.Path]::GetFullPath($Path)
            if($full -notmatch '^([A-Za-z]):\\'){throw 'unexpected Windows path'}
            return "/mnt/"+$matches[1].ToLowerInvariant()+"/"+$full.Substring(3).Replace('\','/')
          }
          $repo=Join-Path $env:GITHUB_WORKSPACE 'arctus350_weight_delta_checkout'
          $out="arctus350_real_weight_delta_${{github.run_id}}.json"
          $cmd="set -e; cd '$(W $repo)'; OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=4 ~/.venvs/neral-triton-py312/bin/python -u -m frontier350.arctus350_weight_delta --base '$(W $base)' --two-b '$(W $two)' --sft '$(W $sft)' --out '$out'"
          wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0){throw 'read-only checkpoint weight delta failed'}
      - name: Upload aggregate numeric metrics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arctus350-real-weight-delta-aggregate
          path: arctus350_weight_delta_checkout/arctus350_real_weight_delta_*.json
          retention-days: 7
          if-no-files-found: warn
