name: Arctus350 Vast 4090 preparation (offline CPU)
on:
  pull_request:
    paths:
      - frontier350/vast4090_guard.py
      - frontier350/train350.py
      - frontier350/train350_compiled.py
      - frontier350/select_bilingual_recovery_v6.py
      - frontier350/offline_selector_selftest.py
      - tests/test_arctus_selector_stdlib_selftest.py
      - frontier350/select_recovery_lr_pilot.py
      - frontier350/eval_bilingual_holdout_v1.py
      - frontier350/eval_recovery_dev_v2.py
      - frontier350/eval_validation_loss350.py
      - tests/test_select_bilingual_recovery_v6_safety.py
      - frontier350/secure_checkpoint350.py
      - tests/test_vast4090_guard.py
      - tests/test_vast4090_transfer.py
      - frontier350/vast4090_transfer.py
      - .github/workflows/arctus-vast4090-ci.yml
permissions:
  contents: read
jobs:
  safe-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline unit-test tools
        run: python -m pip install --disable-pip-version-check pytest
      - name: Syntax check (trainer imports not executed)
        run: python -m py_compile frontier350/vast4090_guard.py frontier350/vast4090_transfer.py frontier350/train350.py frontier350/train350_compiled.py frontier350/select_bilingual_recovery_v6.py frontier350/select_recovery_lr_pilot.py frontier350/eval_bilingual_holdout_v1.py frontier350/eval_recovery_dev_v2.py frontier350/eval_validation_loss350.py
      - name: Independently verify selector without torch, network or paid services
        run: python frontier350/offline_selector_selftest.py
      - name: Install restricted checkpoint CPU test dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy
          python -m pip install --disable-pip-version-check torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Test planning, checkpoint continuity and restricted legacy RNG checkpoint
        run: python -m pytest -q tests/test_vast4090_guard.py tests/test_vast4090_transfer.py tests/test_select_bilingual_recovery_v6_safety.py tests/test_arctus_selector_stdlib_selftest.py
      - name: Default read-only plan; no device, dataset or payment
        run: |
          python -m frontier350.vast4090_guard
          python -m frontier350.vast4090_transfer
