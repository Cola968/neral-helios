name: NERAL production dual-routing + blind100 CPU contracts
on:
  push:
    branches: [feat/neral-prod-dual-route-blind100-20261112]
  pull_request:
    paths:
      - 'neral_dual_routing.py'
      - 'neral_local_chat_api.py'
      - 'tests/test_neral_dual_routing_product_api.py'
      - 'scripts/neral_blind_100_*.py'
      - '.github/workflows/neral-prod-dual-blind100-cpu.yml'
permissions:
  contents: read
jobs:
  prod-dual-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-neral-preview.txt
      - name: Compile isolated dual path, no GPU or outbound models
        run: |
          python -B -m py_compile neral_dual_routing.py neral_local_chat_api.py
      - name: API fail-closed regression tests
        run: python -B -m unittest discover -s tests -p 'test_neral_dual_routing_product_api.py' -v
      - name: Guard and historical controller API tests
        run: python -B -m unittest discover -s tests -p 'test_neral_tir_regression_guard.py' -v
      - name: Earlier ablation and scorer CPU contracts
        run: python -B -m unittest discover -s tests -p 'test_neral_generalization_100_*.py' -v
      - name: Frozen prospective blind100 and real production scorer contracts
        run: |
          python -B -m py_compile scripts/neral_blind_100_cases.py scripts/neral_blind_100_gpu.py
          python -B -m unittest discover -s tests -p 'test_neral_blind_100_cpu.py' -v
      - name: Retry and exact prior-results resume checkpoint contracts
        run: python -B -m unittest discover -s tests -p 'test_neral_blind_retry_resume_cpu.py' -v
      - name: Separate CPU-only post-hoc parsing contracts; never alters primary score
        run: |
          python -B -m py_compile scripts/neral_blind_100_offline_score.py
          python -B -m unittest discover -s tests -p 'test_neral_blind_100_offline_score_cpu.py' -v
