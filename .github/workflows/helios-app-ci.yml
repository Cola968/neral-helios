name: Helios app CI

on:
  pull_request:
    paths:
      - 'apps/helios/**'
      - '.github/workflows/helios-app-ci.yml'
  push:
    branches:
      - helios-app-v0-1
    paths:
      - 'apps/helios/**'
      - '.github/workflows/helios-app-ci.yml'

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile Desktop
        run: gradle -p apps/helios :composeApp:compileKotlinDesktop --stacktrace
      - name: Assemble Android debug
        run: gradle -p apps/helios :composeApp:assembleDebug --stacktrace
