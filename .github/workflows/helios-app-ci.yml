name: Helios app CPU tests
on:
  pull_request:
    paths: ['neral_web_search.py', 'neral_web_api.py', 'agent_auto_api.py', 'billing/**', 'tests/test_neral_web_search.py', 'tests/test_agent_auto_api.py', 'tests/test_agent_autonomy.py', 'Start-Neral.ps1', 'tests/Test-NeralLauncher.ps1', 'app.py', 'neral_local_chat_api.py', 'neral_agent_autonomy.py', 'neral_agent_hf.py', 'tests/test_neral_local_chat_api.py', 'tests/test_neral_ab_lab.py', 'tests/test_projects.py', 'phone_gateway.py', 'setup_phone.py', 'chat_store.py', 'project_store.py', 'storage_codec.py', 'stream_runtime.py', 'model_catalog.py', 'import_neral.py', 'static/**', 'templates/**', 'tests/test_helios*', 'tests/test_projects.py', '.github/workflows/helios-app-ci.yml']
  push:
    branches: [helios-history-markdown-i1-ready]
permissions:
  contents: read
jobs:
  app-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HELIOS_DEVICE: cpu
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest numpy flask waitress
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q tests/test_helios_runtime.py tests/test_projects.py tests/test_helios_i1_ready.py tests/test_helios_install.py tests/test_helios_workspace.py tests/test_neral_local_chat_api.py tests/test_neral_ab_lab.py tests/test_neral_web_search.py tests/test_agent_auto_api.py tests/test_agent_autonomy.py
      - run: node --check static/workspace.js
      - run: node --check static/neral.js
      - run: node --check static/neral-web-search.js
      - run: node --check static/agent-auto.js
      - run: node --check static/neral-local-chat.js
      - run: node --check static/projects.js
      - run: node --check static/helios-core.js
      - run: node --test tests/test_helios_history.js
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/test_helios_browser.cjs
      - name: 'Live web provider smoke (non-gating: provider may block CI)'
        continue-on-error: true
        run: |
          python - <<'PY'
          from neral_web_search import WebSearch
          try:
              result = WebSearch().search("NASA Artemis mission")
              print("WEB_LIVE_SMOKE_RESULTS=", len(result["results"]))
              if not result["results"]:
                  raise RuntimeError("No parseable search results")
          except Exception as exc:
              print("WEB_LIVE_SMOKE_FAILED=", type(exc).__name__)
              raise
          PY
      - run: node tests/test_helios_workspace.cjs
  launcher-windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: powershell
        run: ./tests/Test-NeralLauncher.ps1 -Python (Get-Command python).Source
