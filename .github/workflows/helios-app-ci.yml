name: Helios app CPU tests
on:
  pull_request:
    paths: ['Start-Neral.ps1', 'tests/Test-NeralLauncher.ps1', 'app.py', 'phone_gateway.py', 'setup_phone.py', 'chat_store.py', 'project_store.py', 'storage_codec.py', 'stream_runtime.py', 'model_catalog.py', 'import_neral.py', 'import_frontier350.py', 'frontier350_contract.py', 'frontier_sidecar.py', 'package_cpu_app.py', 'static/**', 'templates/**', 'tests/test_helios*', 'tests/test_frontier*', 'tests/test_projects.py', '.github/workflows/helios-app-ci.yml']
  push:
    branches: [helios-history-markdown-i1-ready]
permissions:
  contents: read
jobs:
  app-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HELIOS_DEVICE: cpu
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest numpy flask waitress
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q tests/test_helios_runtime.py tests/test_projects.py tests/test_helios_i1_ready.py tests/test_helios_install.py tests/test_helios_workspace.py tests/test_frontier350_contract.py tests/test_frontier_sidecar.py
      - run: node --check static/workspace.js
      - run: node --check static/neral.js
      - run: node --check static/projects.js
      - run: node --check static/helios-core.js
      - run: node --test tests/test_helios_history.js
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/test_helios_browser.cjs
      - run: node tests/test_helios_workspace.cjs
  launcher-windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: powershell
        run: ./tests/Test-NeralLauncher.ps1 -Python (Get-Command python).Source
