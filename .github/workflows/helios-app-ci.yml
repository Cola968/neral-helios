name: Helios app CPU tests
on:
  pull_request:
    paths: ['app.py', 'static/**', 'templates/**', 'tests/test_helios_runtime.py', '.github/workflows/helios-app-ci.yml']
  push:
    branches: [helios-app-runtime-ux]
permissions:
  contents: read
jobs:
  app-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HELIOS_DEVICE: cpu
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest numpy flask waitress
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q tests/test_helios_runtime.py tests/test_projects.py
      - run: node --check static/neral.js
      - run: node --check static/projects.js
