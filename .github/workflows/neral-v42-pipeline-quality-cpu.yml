name: NERAL V4.2 pipeline quality CPU regressions
on:
  pull_request:
    paths:
      - neral_v42_quality.py
      - neral_evidence_agent.py
      - scripts/neral_v41_blind200_live.py
      - tests/test_neral_v42_pipeline_quality_cpu.py
      - .github/workflows/neral-v42-pipeline-quality-cpu.yml
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt sympy z3-solver
      - name: TDD exact-format tool-repair and source-veto contracts
        run: |
          python -m py_compile neral_v42_quality.py neral_evidence_agent.py scripts/neral_v41_blind200_live.py
          python -m unittest discover -s tests -p test_neral_v42_pipeline_quality_cpu.py -v
          python -m unittest discover -s tests -p test_neral_v42_obsidian_cpu.py -v
          python -m unittest discover -s tests -p test_neral_v41_blind_live_cpu.py -v
          python -m unittest discover -s tests -p test_neral_evidence_agent.py -v
          python -m unittest discover -s tests -p test_neral_v42_offline_rag.py -v
          python -m unittest discover -s tests -p test_neral_web_v4_cpu.py -v
