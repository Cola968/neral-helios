name: Phoenix reviewed SFT public development A-B

on:
  workflow_dispatch:
    inputs:
      base_checkpoint:
        description: 'Absolute Windows path to historical anchor or FP32 foundation-v2 base'
        required: true
        type: string
      base_sha256:
        description: 'Exact lowercase SHA-256 of base'
        required: true
        type: string
      candidate_checkpoint:
        description: 'Absolute Windows path to reviewed SFT v2 candidate'
        required: true
        type: string
      candidate_sha256:
        description: 'Exact lowercase SHA-256 of reviewed SFT candidate'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: neral-nextgen-local-gpu-training
  cancel-in-progress: false

jobs:
  public-dev-ab:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 35
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: phoenix_reviewed_sft_ab_${{ github.run_id }}
          clean: false
          persist-credentials: false

      - name: Compare reviewed SFT v2 candidate against its exact base
        run: |
          $ErrorActionPreference='Stop'
          function ToWsl([string]$p) {
            $f=[IO.Path]::GetFullPath($p)
            if($f -notmatch '^([A-Za-z]):\\(.*)$') { throw 'Absolute Windows path required' }
            return '/mnt/' + $matches[1].ToLowerInvariant() + '/' + $matches[2].Replace('\','/')
          }
          $repo=Join-Path $env:GITHUB_WORKSPACE ('phoenix_reviewed_sft_ab_' + $env:GITHUB_RUN_ID)
          $base='${{ inputs.base_checkpoint }}'
          $baseSha=('${{ inputs.base_sha256 }}').ToLowerInvariant()
          $candidate='${{ inputs.candidate_checkpoint }}'
          $candidateSha=('${{ inputs.candidate_sha256 }}').ToLowerInvariant()
          $assets=if($env:NERAL_ASSETS_ROOT){$env:NERAL_ASSETS_ROOT}else{Join-Path $env:USERPROFILE 'Documents\Codex\2026-09-05\lo\outputs\neral'}
          foreach($d in @($baseSha,$candidateSha)){if($d -notmatch '^[0-9a-f]{64}$'){throw 'Exact lowercase SHA-256 required'}}
          foreach($p in @($repo,$base,$candidate,$assets)){if($p.Contains("'")){throw 'Unsafe quote in path'}}
          foreach($p in @($base,$candidate)){if(-not(Test-Path -LiteralPath $p -PathType Leaf)){throw "Checkpoint missing: $p"}}
          if((Get-FileHash -LiteralPath $base -Algorithm SHA256).Hash.ToLowerInvariant() -ne $baseSha){throw 'Base SHA mismatch'}
          if((Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant() -ne $candidateSha){throw 'Candidate SHA mismatch'}
          $out=Join-Path (Split-Path -LiteralPath $candidate -Parent) ('reviewed_public_dev_ab_' + $env:GITHUB_RUN_ID + '.json')
          if(Test-Path -LiteralPath $out){throw 'Create-only A/B output exists'}

          $cmd="set -euo pipefail; cd '$(ToWsl $repo)'; test -x ~/.venvs/neral-triton-py312/bin/python; ~/.venvs/neral-triton-py312/bin/python -B -m py_compile frontier350/nextgen_v1/phoenix_reviewed_sft_public_dev_eval.py; ~/.venvs/neral-triton-py312/bin/python -B -u frontier350/nextgen_v1/phoenix_reviewed_sft_public_dev_eval.py --execute --trusted-own-checkpoints --base-checkpoint '$(ToWsl $base)' --base-sha256 '$baseSha' --candidate-checkpoint '$(ToWsl $candidate)' --candidate-sha256 '$candidateSha' --assets-root '$(ToWsl $assets)' --out '$(ToWsl $out)'"
          & wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0){throw 'Reviewed SFT public-development A/B failed'}
          Write-Host 'Detailed outputs remain private. Sealed holdout is not opened by this workflow.'

      - name: Post-evaluation GPU telemetry
        if: always()
        run: nvidia-smi --query-gpu=name,memory.used,memory.free,utilization.gpu,temperature.gpu --format=csv,noheader
