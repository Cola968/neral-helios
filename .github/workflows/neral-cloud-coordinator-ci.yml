name: NERAL Cloud Coordinator CPU contracts
on:
  pull_request:
    paths:
      - 'cloud/neral-coordinator/**'
      - '.github/workflows/neral-cloud-coordinator-ci.yml'
      - 'scripts/codex_cloud_check.py'
      - 'AGENTS.md'
permissions:
  contents: read
jobs:
  no-network-safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/codex_cloud_check.py
      - run: node --test cloud/neral-coordinator/worker.test.mjs
