name: NERAL NL schema consensus bridge CPU (fail closed)
on:
  push:
    branches: [feat/neral-nl-schema-consensus-bridge-20261112]
  pull_request:
    paths:
      - 'neral_nl_schema_bridge.py'
      - 'tests/test_neral_nl_schema_bridge.py'
      - 'tests/test_neral_nl_schema_old_cases.py'
      - 'tests/test_neral_nl_schema_probe.py'
      - 'scripts/neral_nl_schema_probe.py'
      - 'scripts/neral_nl_schema_diagnostics.py'
      - 'tests/test_neral_nl_schema_diagnostics.py'
      - '.github/workflows/neral-nl-schema-bridge-cpu.yml'
permissions:
  contents: read
jobs:
  bridge-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install finite solver and existing regression dependencies
        run: python -m pip install 'z3-solver>=4.13,<5' 'jsonschema>=4.20,<5'
      - name: Compile bridge and existing typed solver
        run: python -B -m py_compile neral_nl_schema_bridge.py neral_typed_constraints_v2.py neral_tir_regression_guard.py
      - name: Dual extraction RED/GREEN and strict guard
        run: python -B -m unittest discover -s tests -p 'test_neral_nl_schema_bridge.py' -v
      - name: Existing historical 02 and 06 plus 21453 (CPU fixture probes)
        run: python -B -m unittest discover -s tests -p 'test_neral_nl_schema_old_cases.py' -v
      - name: Manual local model probe contract (never execute GPU)
        run: python -B -m unittest discover -s tests -p 'test_neral_nl_schema_probe.py' -v
      - name: Instrumented local Ollama diagnostic contracts (mocks only; no GPU)
        run: python -B -m unittest discover -s tests -p 'test_neral_nl_schema_diagnostics.py' -v
      - name: Typed solver and guard regression suites
        run: |
          python -B -m unittest discover -s tests -p 'test_neral_typed_constraints_v2.py' -v
          python -B -m unittest discover -s tests -p 'test_neral_tir_regression_guard.py' -v
          python -B -m unittest discover -s tests -p 'test_neral_boolean_constraints.py' -v
