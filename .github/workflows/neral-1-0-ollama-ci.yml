name: NERAL 1.0 Ollama FAST/THINK inference regression
on:
  pull_request:
    paths:
      - 'neral_agent_autonomy.py'
      - 'neral_local_chat_api.py'
      - 'tests/test_neral_1_0_ollama_mode_contracts.py'
      - '.github/workflows/neral-1-0-ollama-ci.yml'
  push:
    branches: [main]
    paths:
      - 'neral_agent_autonomy.py'
      - 'neral_local_chat_api.py'
      - 'tests/test_neral_1_0_ollama_mode_contracts.py'
permissions:
  contents: read
jobs:
  inference:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install flask
      - name: Release FAST/THINK contract, no GPU or external inference
        run: python -m unittest discover -s tests -p test_neral_1_0_ollama_mode_contracts.py -v
      - name: Static compilation
        run: python -m py_compile neral_agent_autonomy.py neral_local_chat_api.py
