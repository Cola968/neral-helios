name: Neral 100M Helix GPU Probe

on:
  push:
    branches:
      - neral100-probe-run
    paths:
      - neral100_requests/probe.json

permissions:
  contents: read

concurrency:
  group: neral-100m-helix-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        working-directory: src
    steps:
      - name: Checkout trusted architecture code from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: src
          clean: true
          persist-credentials: false

      - name: Checkout authorization request only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: requestsrc
          clean: true
          persist-credentials: false

      - name: Validate request and CUDA runtime
        id: env
        run: |
          $ErrorActionPreference='Stop'
          $requestPath=Join-Path '..\requestsrc' 'neral100_requests\probe.json'
          if(-not(Test-Path $requestPath)){throw 'Helix probe request missing.'}
          $r=Get-Content $requestPath -Raw|ConvertFrom-Json
          $props=@($r.PSObject.Properties.Name|Sort-Object)
          if(($props -join ',') -ne 'action,request_id,version'){throw 'Unsupported probe request fields.'}
          if([int]$r.version -ne 1 -or $r.action -ne 'probe_neral100_helix'){throw 'Unsupported probe request.'}
          if($r.request_id -notmatch '^[A-Za-z0-9._-]{1,64}$'){throw 'Invalid request_id.'}
          $verifiedPython='C:\Users\astad\Documents\Codex\2026-09-05\lo\outputs\neral\.venv\Scripts\python.exe'
          $python=if($env:NERAL_PYTHON){$env:NERAL_PYTHON}else{$verifiedPython}
          if(-not(Test-Path $python -PathType Leaf)){throw "Python missing: $python"}
          & $python -c "import torch; assert torch.cuda.is_available(); assert torch.cuda.is_bf16_supported(); print(torch.__version__); print(torch.version.cuda); print(torch.cuda.get_device_name(0))"
          if($LASTEXITCODE -ne 0){throw 'CUDA/BF16 validation failed.'}
          "python=$python" >> $env:GITHUB_OUTPUT
          nvidia-smi --query-gpu=name,driver_version,memory.total,memory.free,temperature.gpu,power.draw --format=csv,noheader

      - name: Run non-training Helix architecture probe
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force helix_probe | Out-Null
          & '${{ steps.env.outputs.python }}' -X utf8 probe_neral100.py --out helix_probe\NERAL100_GPU_PROBE.json
          if($LASTEXITCODE -ne 0){throw 'Helix GPU probe failed.'}

      - name: Reject model or corpus uploads
        if: always()
        run: |
          if(Test-Path helix_probe){
            $bad=Get-ChildItem helix_probe -Recurse -File|Where-Object{$_.Extension -in '.pt','.pth','.bin','.safetensors','.parquet','.gz'}
            if($bad){throw 'Private model/corpus found in probe upload directory.'}
          }

      - name: Upload report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neral-100m-helix-probe-${{ github.run_id }}
          path: src/helix_probe/
          if-no-files-found: warn
          retention-days: 30
