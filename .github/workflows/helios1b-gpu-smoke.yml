name: Helios 1B RTX proxy smoke

on:
  pull_request:
    paths:
      - 'helios1b/**'
      - 'tests/test_model1b_architecture.py'
      - 'tests/test_model1b_resume.py'
      - 'tests/test_model1b_learning.py'
      - '.github/workflows/helios1b-gpu-smoke.yml'

permissions:
  contents: read

concurrency:
  group: helios1b-rtx-proxy
  cancel-in-progress: true

jobs:
  rtx-proxy:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 15
    defaults:
      run:
        shell: cmd
    env:
      NERAL_HELIOS_PYTHON: C:\Users\astad\Documents\Codex\2026-09-05\lo\outputs\neral\.venv\Scripts\python.exe

    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false

      - name: Verify exact isolated CUDA Python
        run: |
          @echo off
          if not exist "%NERAL_HELIOS_PYTHON%" (
            echo exact_neral_python_missing
            exit /b 1
          )
          "%NERAL_HELIOS_PYTHON%" -c "import json,torch,numpy,pytest; assert torch.cuda.is_available(); assert torch.cuda.is_bf16_supported(); print(json.dumps({'torch':torch.__version__,'cuda':torch.version.cuda,'gpu':torch.cuda.get_device_name(0),'bf16':torch.cuda.is_bf16_supported()}))"
          if errorlevel 1 exit /b 1
          nvidia-smi --query-gpu=name,memory.total,memory.free,temperature.gpu --format=csv,noheader

      - name: Prove architecture and exact CPU resume
        run: |
          @echo off
          set PYTEST_TMP=%RUNNER_TEMP%\pytest-helios1b
          if exist "%PYTEST_TMP%" rmdir /s /q "%PYTEST_TMP%"
          "%NERAL_HELIOS_PYTHON%" -m pytest -q --basetemp "%PYTEST_TMP%" tests/test_model1b_architecture.py tests/test_model1b_resume.py
          if errorlevel 1 exit /b 1

      - name: Run first RTX learnability experiment
        run: |
          @echo off
          set ROOT=%RUNNER_TEMP%\helios1b_learnability_v1
          if exist "%ROOT%" rmdir /s /q "%ROOT%"
          "%NERAL_HELIOS_PYTHON%" -m helios1b.learning_experiment --out "%ROOT%" --steps 40 --minimum-relative-improvement 0.50 --device cuda
          if errorlevel 1 exit /b 1

          if not exist runner_reports mkdir runner_reports
          copy /Y "%ROOT%\LEARNABILITY_RESULT.json" "runner_reports\LEARNABILITY_RESULT.json"
          copy /Y "%ROOT%\run\summary.json" "runner_reports\TRAINING_SUMMARY.json"
          copy /Y "%ROOT%\run\metrics.jsonl" "runner_reports\METRICS.jsonl"

      - name: Assert no weights or corpus are uploaded
        if: always()
        run: |
          @echo off
          if not exist runner_reports exit /b 0
          for /r runner_reports %%F in (*.pt *.pth *.bin *.safetensors) do (
            echo Forbidden model or corpus artifact: %%F
            exit /b 1
          )
          exit /b 0

      - name: Upload numeric/text evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helios1b-learnability-evidence
          path: runner_reports/
          if-no-files-found: warn
          retention-days: 14
