name: Phoenix OASST2 one-shot WSL source profile (NO GPU / NO TRAINING)

# Triggered only on creation/change of this workflow, never on code/test changes.
# The previously verified WSL interpreter is reused; no Windows setup-python,
# package installs, privilege changes, model access or private-text upload.
on:
  push:
    branches: [experiment/phoenix-sft-fp32-audit]
    paths: ['.github/workflows/phoenix-oasst2-wsl-profile-once.yml']

permissions:
  contents: read

concurrency:
  group: neral-nextgen-local-gpu-training
  cancel-in-progress: false

jobs:
  read-only-source-selection:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 12
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - name: Commit-pinned isolated checkout; never clean the private asset directory
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: phoenix_oasst2_source_${{ github.run_id }}
          clean: false
          persist-credentials: false
      - name: Profile original SHA-pinned public corpus using existing WSL Python only
        run: |
          $ErrorActionPreference = 'Stop'
          function ToWsl([string]$p) {
            $f = [IO.Path]::GetFullPath($p)
            if ($f -notmatch '^([A-Za-z]):\\(.*)$') { throw 'Absolute Windows path required' }
            return '/mnt/' + $matches[1].ToLowerInvariant() + '/' + $matches[2].Replace('\','/')
          }
          $repo = Join-Path $env:GITHUB_WORKSPACE ('phoenix_oasst2_source_' + $env:GITHUB_RUN_ID)
          $root = if ($env:NERAL_ASSETS_ROOT) { $env:NERAL_ASSETS_ROOT } else { Join-Path $env:USERPROFILE 'Documents\Codex\2026-09-05\lo\outputs\neral' }
          $archive = Join-Path $root 'sft50_sources\2023-11-05_oasst2_ready.messages.jsonl.gz'
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw 'Original private archive unavailable; no export or training' }
          if ($repo.Contains("'") -or $root.Contains("'") -or $archive.Contains("'")) { throw 'Shell-unsafe path; refuse source read' }
          $cmd = "set -euo pipefail; test -x ~/.venvs/neral-triton-py312/bin/python; cd '$(ToWsl $repo)'; ~/.venvs/neral-triton-py312/bin/python -u frontier350/nextgen_v1/phoenix_oasst2_profile.py --assets-root '$(ToWsl $root)' --archive '$(ToWsl $archive)'"
          & wsl.exe -- bash -lc $cmd
          if ($LASTEXITCODE -ne 0) { throw 'Read-only corpus profile failed; no approval or training' }
      - name: Explicit non-approval evidence boundary
        run: Write-Host 'Only pinned archive and real in-RAM chooser/tree split; no GPU, model, downloads, export, holdout, privacy/license signoff, data approval or training.'
