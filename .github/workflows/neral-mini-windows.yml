name: NERAL Mini Windows preview

on:
  pull_request:
    paths:
      - 'mini/**'
      - 'Start NERAL Mini.cmd'
      - 'Start-NERAL-Mini.ps1'
      - 'tests/test_neral_mini.py'
      - '.github/workflows/neral-mini-windows.yml'
  push:
    branches: [main]
    paths:
      - 'mini/**'
      - 'Start NERAL Mini.cmd'
      - 'Start-NERAL-Mini.ps1'
      - 'tests/test_neral_mini.py'
      - '.github/workflows/neral-mini-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mini-cpu-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimum CPU test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run local HTTP, security, fake-model, and integrity tests
        run: python -m pytest -q tests/test_neral_mini.py
      - name: Verify Python parses without GPU
        run: python -m py_compile mini/neral_mini.py
      - name: Validate embedded browser JavaScript
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('mini/index.html','utf8');
          const match = html.match(/<script>([\s\S]*?)<\/script>/);
          if (!match) throw Error('Missing local chat UI');
          new vm.Script(match[1], {filename:'mini/index.html'});
          if (html.includes('src="https://') || html.includes('href="https://')) {
            throw Error('Remote UI assets are forbidden');
          }
          console.log('NERAL Mini JS syntax and offline assets OK');
          NODE
      - name: Stage complete small Windows starter package
        run: |
          mkdir -p dist/NERAL-Mini/mini
          cp "Start NERAL Mini.cmd" "Start-NERAL-Mini.ps1" dist/NERAL-Mini/
          cp mini/neral_mini.py mini/index.html mini/README.md dist/NERAL-Mini/mini/
          test "$(find dist/NERAL-Mini -type f | wc -l)" -eq 5
          test ! -e dist/NERAL-Mini/mini/adapter_model.safetensors
      - name: Downloadable NERAL Mini ZIP (no weights or prompts)
        uses: actions/upload-artifact@v4
        with:
          name: NERAL-Mini-Windows
          path: dist/NERAL-Mini/
          retention-days: 14
          if-no-files-found: error

  windows-launcher-syntax:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse Windows PowerShell launcher without executing it
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'Start-NERAL-Mini.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            throw "NERAL Mini PowerShell parsing failed"
          }
          Write-Host 'Windows launcher syntax valid; no GPU code executed'
