name: Neral V7.2 Speed Candidate Benchmark Only

on:
  push:
    branches: [experiment/scale-v7-2]
    paths: ['frontier350_scale_v7_2_bench_requests/request.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neral-350m-scale-v4
  cancel-in-progress: false

jobs:
  speed-bench:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: Verify benchmark-only request and cool RTX 4070
        id: request
        run: |
          $ErrorActionPreference='Stop'
          $r=Get-Content frontier350_scale_v7_2_bench_requests/request.json -Raw|ConvertFrom-Json
          if($r.version -ne 72 -or $r.action -notin @('benchmark_fast4','benchmark_liger','benchmark_fused_layout')){throw 'invalid V7.2 benchmark request'}
          "action=$($r.action)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          wsl.exe --shutdown 2>$null; Start-Sleep -Seconds 3
          $gpu=(nvidia-smi --query-gpu=name --format=csv,noheader | Select-Object -First 1).Trim()
          $temp=[int]((nvidia-smi --query-gpu=temperature.gpu --format=csv,noheader,nounits | Select-Object -First 1).Trim())
          $free=[int]((nvidia-smi --query-gpu=memory.free --format=csv,noheader,nounits | Select-Object -First 1).Trim())
          Write-Host "GPU=$gpu TempC=$temp FreeVRAMMiB=$free Action=$($r.action)"
          if($gpu -notmatch 'RTX 4070'){throw 'expected RTX 4070'}
          if($temp -ge 82){throw 'GPU too hot for benchmark'}
          if($free -lt 9000){throw 'need >=9000 MiB free VRAM'}
          exit 0

      - name: Prepare runtime
        run: |
          $ErrorActionPreference='Stop'
          $p=(Get-Location).Path; $repo='/mnt/'+$p.Substring(0,1).ToLower()+'/'+$p.Substring(3).Replace('\','/')
          $cmd="set -e; cd '$repo'; bash frontier350/ensure_eval_runtime.sh; ~/.venvs/neral-triton-py312/bin/python -m py_compile frontier350/v7_2_fast4_microbench.py frontier350/v7_2_liger_flce_microbench.py frontier350/v7_2_fused_layout_microbench.py"
          wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0){throw 'V7.2 benchmark runtime preparation failed'}
          exit 0

      - name: Benchmark turbo50 versus Fast4
        if: steps.request.outputs.action == 'benchmark_fast4'
        run: |
          $ErrorActionPreference='Stop'
          $p=(Get-Location).Path; $repo='/mnt/'+$p.Substring(0,1).ToLower()+'/'+$p.Substring(3).Replace('\','/')
          $cmd="set -e; cd '$repo'; export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True; export CUDA_MODULE_LOADING=LAZY; export TORCHINDUCTOR_CACHE_DIR=~/.cache/neral_inductor_v72; ~/.venvs/neral-triton-py312/bin/python -u frontier350/v7_2_fast4_microbench.py --out frontier350_v7_2_bench/fast4.json --warmup 2 --measured 5 --min-ratio 1.08 --max-loss-diff 0.0002 --max-peak-reserved-gib 9.0"
          wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0){throw 'Fast4 benchmark process failed'}
          Get-Content frontier350_v7_2_bench/fast4.json -Raw | Write-Host
          exit 0

      - name: Install pinned Liger benchmark dependency
        if: steps.request.outputs.action == 'benchmark_liger'
        run: |
          $ErrorActionPreference='Stop'
          $cmd="set -e; mkdir -p ~/.cache/neral_liger_082; ~/.venvs/neral-triton-py312/bin/python -m pip install --disable-pip-version-check --no-deps --upgrade --target ~/.cache/neral_liger_082 liger-kernel==0.8.2"
          wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0){throw 'Pinned Liger install failed'}
          exit 0

      - name: Benchmark turbo50 versus Liger fused-linear CE
        if: steps.request.outputs.action == 'benchmark_liger'
        run: |
          $ErrorActionPreference='Stop'
          $p=(Get-Location).Path; $repo='/mnt/'+$p.Substring(0,1).ToLower()+'/'+$p.Substring(3).Replace('\','/')
          $cmd="set -e; cd '$repo'; export PYTHONPATH=~/.cache/neral_liger_082:\${PYTHONPATH:-}; export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True; export CUDA_MODULE_LOADING=LAZY; export TORCHINDUCTOR_CACHE_DIR=~/.cache/neral_inductor_v72_liger; ~/.venvs/neral-triton-py312/bin/python -u frontier350/v7_2_liger_flce_microbench.py --out frontier350_v7_2_bench/liger_flce.json --warmup 1 --measured 3 --min-ratio 1.08 --max-loss-diff 0.0002 --min-grad-cosine 0.999 --max-grad-rel-l2 0.01"
          wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0){throw 'Liger FLCE benchmark process failed'}
          Get-Content frontier350_v7_2_bench/liger_flce.json -Raw | Write-Host
          exit 0

      - name: Benchmark unfused versus fused transformer layout
        if: steps.request.outputs.action == 'benchmark_fused_layout'
        run: |
          $ErrorActionPreference='Stop'
          $p=(Get-Location).Path; $repo='/mnt/'+$p.Substring(0,1).ToLower()+'/'+$p.Substring(3).Replace('\','/')
          $cmd="set -e; cd '$repo'; export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True; export CUDA_MODULE_LOADING=LAZY; export TORCHINDUCTOR_CACHE_DIR=~/.cache/neral_inductor_v72_fused; ~/.venvs/neral-triton-py312/bin/python -u frontier350/v7_2_fused_layout_microbench.py --out frontier350_v7_2_bench/fused_layout.json --warmup 2 --measured 5 --min-ratio 1.10 --max-loss-diff 0.0002 --min-grad-cosine 0.999 --max-grad-rel-l2 0.01"
          wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0){throw 'Fused layout benchmark process failed'}
          Get-Content frontier350_v7_2_bench/fused_layout.json -Raw | Write-Host
          exit 0

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: neral-v7-2-speed-${{ github.run_id }}
          path: frontier350_v7_2_bench/*.json
          retention-days: 30
