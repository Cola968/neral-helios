name: NERAL animation contracts
on:
  pull_request:
    paths:
      - 'static/neral-motion.js'
      - 'static/neral-motion.css'
      - 'static/neral-preview.js'
      - 'templates/index.html'
      - 'templates/neral_preview.html'
      - 'tests/test_neral_motion.cjs'
      - 'tests/test_neral_modern_ui.cjs'
      - 'static/neral-modern.css'
      - 'static/neral-modern.js'
      - 'tests/test_neral_activity_v3.cjs'
      - 'static/neral-dynamic-ui.css'
      - 'static/neral-dynamic-ui.js'
      - 'tests/test_neral_dynamic_ui.cjs'
      - 'tests/test_neral_dynamic_ui_app.cjs'
      - 'static/neral.js'
      - 'static/neral-local-chat.js'
      - '.github/workflows/neral-motion-ci.yml'
  push:
    branches: [main]
    paths:
      - 'static/neral-motion.js'
      - 'static/neral-motion.css'
      - 'static/neral-preview.js'
      - 'templates/index.html'
      - 'templates/neral_preview.html'
      - 'tests/test_neral_motion.cjs'
      - 'tests/test_neral_modern_ui.cjs'
      - 'static/neral-modern.css'
      - 'static/neral-modern.js'
      - 'tests/test_neral_activity_v3.cjs'
      - 'static/neral-dynamic-ui.css'
      - 'static/neral-dynamic-ui.js'
      - 'tests/test_neral_dynamic_ui.cjs'
      - 'tests/test_neral_dynamic_ui_app.cjs'
      - 'static/neral.js'
      - 'static/neral-local-chat.js'
      - '.github/workflows/neral-motion-ci.yml'
permissions:
  contents: read
jobs:
  motion-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check static/neral-motion.js
      - run: node --check static/neral-preview.js
      - run: node --check static/neral-modern.js
      - run: node --check static/neral-dynamic-ui.js
      - run: node --check static/neral-local-chat.js
      - run: node --check static/neral.js
      - run: node --test tests/test_neral_motion.cjs tests/test_neral_activity_v3.cjs tests/test_neral_modern_ui.cjs tests/test_neral_dynamic_ui.cjs tests/test_neral_dynamic_ui_app.cjs
