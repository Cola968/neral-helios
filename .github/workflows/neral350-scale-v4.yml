name: Neral 350M Scale V4 Stop

on:
  push:
    branches: [experiment/scale-v4]
    paths: ['frontier350_scale_v4_requests/request.json']

concurrency:
  group: neral-350m-scale-v4
  cancel-in-progress: true

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - name: Stop active Scale V4 run
        run: echo "Stop request received; prior run in this concurrency group is cancelled."
