name: OASST2 targeted SFT preflight

on:
  pull_request:
    paths:
      - 'fetch_oasst2_sft50.py'
      - 'build_targeted_sft50_oasst2.py'
      - 'build_targeted_sft50_sources.py'
      - 'prepare_sft50.py'
      - 'hf_source_policy50.py'
      - '.github/workflows/neral50m-instruct-reviewed.yml'
      - '.github/workflows/oasst2-targeted-sft-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Stage D data tooling
        run: >-
          python -m py_compile
          hf_source_policy50.py
          fetch_oasst1_sft50.py
          fetch_oasst2_sft50.py
          build_targeted_sft50_sources.py
          build_targeted_sft50_oasst2.py
          prepare_sft50.py

      - name: Fetch pinned reviewed human OASST2
        run: python fetch_oasst2_sft50.py --out sft50_sources_ci --max-en 16000 --max-de 6000

      - name: Build deterministic targeted DE EN mix
        run: python build_targeted_sft50_oasst2.py --root sft50_sources_ci --per-generated-source 6000

      - name: Prepare contamination-screened Stage D corpus
        run: python prepare_sft50.py --source-root sft50_sources_ci --out sft50_data_ci --target-train-examples 0 --max-seq 1024

      - name: Enforce preflight contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          m = json.loads(Path('sft50_data_ci/manifest.json').read_text(encoding='utf8'))
          source_ids = {s['id'] for s in m['sources']}
          required = {
              'oasst2-human-en', 'oasst2-human-de',
              'neral-generated-de-core',
              'neral-generated-math-de', 'neral-generated-math-en',
              'neral-generated-code-de', 'neral-generated-code-en',
              'neral-generated-reasoning-de', 'neral-generated-reasoning-en',
          }
          assert source_ids == required, (source_ids, required)
          assert not any('oasst1' in sid for sid in source_ids)
          target = int(m['target_train_examples'])
          assert 19000 <= target <= 20000, target
          train = m['splits']['train']
          de = int(train['by_language'].get('de', 0))
          en = int(train['by_language'].get('en', 0))
          assert de >= 8500, de
          assert en >= 9500, en
          audit = m['prompt_group_overlap_audit']
          assert int(audit['cross_split_prompt_group_overlap']) == 0, audit
          assert m['external_model_calls'] is False
          summary = {
              'target_train_examples': target,
              'train_examples': int(train['examples']),
              'de_train_examples': de,
              'en_train_examples': en,
              'source_ids': sorted(source_ids),
              'rejected': m['rejected'],
              'prompt_group_overlap_audit': audit,
              'source_manifest_sha256': m['source_manifest_sha256'],
          }
          Path('OASST2_TARGETED_SFT_PREFLIGHT.json').write_text(
              json.dumps(summary, indent=2, ensure_ascii=False) + '\n', encoding='utf8'
          )
          print(json.dumps(summary, indent=2, ensure_ascii=False))
          PY

      - name: Upload manifests only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oasst2-targeted-sft-preflight
          path: |
            sft50_sources_ci/manifest.json
            sft50_data_ci/manifest.json
            OASST2_TARGETED_SFT_PREFLIGHT.json
          if-no-files-found: warn
          retention-days: 14
