name: Neral 350M local inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 12
    steps:
      - name: Find checkpoint paths without reading model contents
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          $root=if($env:NERAL_ASSETS_ROOT){$env:NERAL_ASSETS_ROOT}else{'C:\Users\astad\Documents\Codex\2026-09-05\lo\outputs\neral'}
          if(-not (Test-Path $root -PathType Container)){throw 'assets root missing'}
          Write-Output "ASSETS_ROOT=$root"
          Write-Output 'TOP_LEVEL_DIRECTORIES'
          Get-ChildItem -LiteralPath $root -Directory | Select-Object -ExpandProperty Name
          Write-Output 'CHECKPOINT_CANDIDATES (relative path and size MB only)'
          Get-ChildItem -LiteralPath $root -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object {$_.Extension -in @('.pt','.pth','.safetensors')} |
            Sort-Object Length -Descending |
            Select-Object -First 60 |
            ForEach-Object { $relative=$_.FullName.Substring($root.Length).TrimStart([char]92); '{0} | {1:N0} MB' -f $relative,($_.Length/1MB) }
          Write-Output 'LOCKED_TOKENIZER'
          foreach($relative in @('frontier350_assets\tokenizer.json','frontier350_bpe_recovery_pilot_arctus-recovery-lr-20260911-r2\train','frontier350_chat_data\neraltalk350-v3-20261009')){
            $full=Join-Path $root $relative
            Write-Output ("{0} = {1}" -f $relative,(Test-Path $full))
          }
          Write-Output 'FRONTIER_350_FOLDERS_AND_FILES'
          Get-ChildItem -LiteralPath $root -Directory -Filter 'frontier350_*' | ForEach-Object {
            Write-Output ('DIRECTORY '+$_.Name)
            Get-ChildItem -LiteralPath $_.FullName -File -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Length -gt 100MB } | Sort-Object Length -Descending | Select-Object -First 12 | ForEach-Object {
              $rel=$_.FullName.Substring($root.Length).TrimStart([char]92)
              Write-Output ('FILE '+$rel+' | '+[math]::Round($_.Length/1MB)+' MB')
            }
          }
          Write-Output 'OTHER_DRIVE_350_CANDIDATES'
          foreach($disk in @('D:\','E:\')) {
            if(-not (Test-Path $disk -PathType Container)){continue}
            Write-Output ('DRIVE '+$disk)
            Get-ChildItem -LiteralPath $disk -Directory -ErrorAction SilentlyContinue | ForEach-Object {
              if($_.Name -match '(?i)neral|helios|model|train|codex|project|output|ai|ki|work') {
                Write-Output ('CANDIDATE_DIRECTORY '+$_.FullName)
                Get-ChildItem -LiteralPath $_.FullName -File -Recurse -ErrorAction SilentlyContinue |
                  Where-Object { $_.Length -gt 600MB -and $_.Name -match '(?i)checkpoint|resume|latest|model|best|state|\.pt|\.pth|\.bin|\.safetensors' } |
                  Sort-Object Length -Descending | Select-Object -First 16 | ForEach-Object { Write-Output ('CANDIDATE_FILE '+$_.FullName+' | '+[math]::Round($_.Length/1MB)+' MB') }
              }
            }
          }
