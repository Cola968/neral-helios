name: NERAL v4 experimental rank16 480-step local QLoRA (manual only)
on:
  workflow_dispatch:
    inputs:
      authorize:
        type: string
        required: true
        description: 'Explicit experiment only: TRAIN_NERAL_V4_R16_480_FULL_EPOCH'
permissions:
  contents: read
concurrency:
  group: neral-qwen7b-r32-gpu-exclusive
  cancel-in-progress: false
jobs:
  local_experimental_train:
    if: github.ref == 'refs/heads/main' && inputs.authorize == 'TRAIN_NERAL_V4_R16_480_FULL_EPOCH'
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    env:
      HF_HUB_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      WANDB_DISABLED: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout latest approved pipeline (not weights)
        uses: actions/checkout@v4
        with:
          ref: main
          path: control
          clean: true
          persist-credentials: false

      - name: Checkout exact pinned original QLoRA source
        uses: actions/checkout@v4
        with:
          ref: a082738f9145722dec443141e5d7801a3ead93af
          path: trainer
          clean: true
          persist-credentials: false

      - name: Reproduce source pins and build isolated training candidate
        run: |
          $ErrorActionPreference='Stop'
          $py=Join-Path $env:USERPROFILE 'NERAL-QLoRA-Research\training-env-py312\Scripts\python.exe'
          $base=Join-Path $env:USERPROFILE '.cache\neral\qwen25-smoke\c03e6d358207e414f1eca0bb1891e29f1db0e242\installed_models\hf-qwen25-coder-7b'
          if(-not(Test-Path -LiteralPath $py -PathType Leaf) -or -not(Test-Path -LiteralPath $base -PathType Container)){
            throw 'Pinned local training environment or model not present'
          }
          $control=Join-Path $env:GITHUB_WORKSPACE 'control'
          $trainer=Join-Path $env:GITHUB_WORKSPACE 'trainer'
          foreach($path in @($control,$trainer)){
            & git -C $path -c core.autocrlf=false -c core.eol=lf checkout-index --force --all
            if($LASTEXITCODE -ne 0){throw 'Scratch source normalization failed'}
          }
          & $py -B (Join-Path $control 'scripts\neral_math_v2_restore.py') --root $trainer
          if($LASTEXITCODE -ne 0){throw 'Pinned original source integrity failed'}
          $generator=Join-Path $trainer 'scripts\neral_v4_curriculum.py'
          if(Test-Path -LiteralPath $generator){throw 'Pinned source collision'}
          Copy-Item -LiteralPath (Join-Path $control 'scripts\neral_v4_curriculum.py') -Destination $generator -ErrorAction Stop
          $trial=Join-Path $trainer 'scripts\neral_qlora_v4_r16_480.py'
          if(Test-Path -LiteralPath $trial){throw 'Trainer scratch file collision'}
          Push-Location $control
          try {
            $env:PYTHONPATH=$control
            & $py -B -m scripts.neral_v4_full_epoch_patcher --source (Join-Path $trainer 'scripts\neral_qlora_pilot.py') --out $trial
            if($LASTEXITCODE -ne 0){throw 'Exact trainer patch denied'}
            foreach($test in @('test_neral_v4_curriculum.py','test_neral_v4_trainer_bridge.py','test_neral_v4_token_preflight.py','test_neral_v4_train_patcher.py','test_neral_v4_full_epoch.py')){
              & $py -B -m unittest discover -s tests -p $test -v
              if($LASTEXITCODE -ne 0){throw 'CPU correctness contract failed'}
            }
          } finally {Pop-Location}
          $run=Join-Path $env:USERPROFILE "NERAL-QLoRA-Research\v4-r16-480-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if(Test-Path -LiteralPath $run){throw 'Never overwrite existing experiment'}
          New-Item -ItemType Directory -Path $run -ErrorAction Stop|Out-Null
          $data=Join-Path $run 'candidate'
          $converted=Join-Path $run 'trainer-data'
          Push-Location $control
          try {
            $env:PYTHONPATH=$control
            & $py -B -m scripts.neral_v4_curriculum --out $data
            if($LASTEXITCODE -ne 0){throw 'Generator failed'}
            & $py -B -m scripts.neral_v4_trainer_bridge --source $data --out $converted
            if($LASTEXITCODE -ne 0){throw 'Trainer format / test exclusion failed'}
            foreach($split in @('train','validation')){
              & $py -B $trial --dataset (Join-Path $converted ($split+'.jsonl')) --review-manifest (Join-Path $converted ($split+'.review.json')) --check-review --steps 480 --max-length 512 --lora-rank 16
              if($LASTEXITCODE -ne 0){throw 'Original pinned trainer rejected reviewed source'}
            }
            $tokenSummary=Join-Path $run 'tokenizer-scalar.json'
            $env:PYTHONPATH=$trainer
            & $py -B -m scripts.neral_v4_token_preflight --data $data --trainer-root $trainer --model-dir $base --summary $tokenSummary
            if($LASTEXITCODE -ne 0){throw 'Local Qwen tokenizer contract rejected corpus'}
            $token=Get-Content -LiteralPath $tokenSummary -Raw | ConvertFrom-Json
            if($token.local_qwen_tokenizer_verified -ne $true -or $token.completion_only_mask_checked -ne $true -or
               $token.total_rows -ne 2560 -or $token.trainable_examples -ne 1920 -or $token.training_performed -ne $false){
              throw 'Unverified Qwen tokenizer report'
            }
          } finally {Pop-Location}
          [IO.File]::AppendAllText($env:GITHUB_ENV,"V4_RUN_ROOT=$run"+[Environment]::NewLine+"V4_MODEL=$base"+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))

      - name: Check free GPU memory; never train with busy RTX 4070
        run: |
          $ErrorActionPreference='Stop'
          $raw=& nvidia-smi --query-gpu=memory.free,utilization.gpu --format=csv,noheader,nounits
          if($LASTEXITCODE -ne 0){throw 'GPU memory sensor unavailable'}
          $fields=($raw|Select-Object -First 1)-split ','
          if($fields.Count -ne 2 -or [int]$fields[0].Trim() -lt 10000 -or [int]$fields[1].Trim() -gt 20){
            throw 'RTX 4070 busy or free VRAM <10000 MiB: no training'
          }

      - name: Train separate experimental NERAL v4 rank16 adapter for exactly 480 steps
        run: |
          $ErrorActionPreference='Stop'
          $py=Join-Path $env:USERPROFILE 'NERAL-QLoRA-Research\training-env-py312\Scripts\python.exe'
          $trainer=Join-Path $env:GITHUB_WORKSPACE 'trainer'
          $script=Join-Path $trainer 'scripts\neral_qlora_v4_r16_480.py'
          $data=Join-Path $env:V4_RUN_ROOT 'trainer-data'
          $out=Join-Path $env:V4_RUN_ROOT 'adapter'
          if(Test-Path -LiteralPath $out){throw 'Adapter output already exists'}
          $env:PYTHONPATH=$trainer
          Push-Location $trainer
          try {
            & $py -B $script --dataset (Join-Path $data 'train.jsonl') --review-manifest (Join-Path $data 'train.review.json') --model-dir $env:V4_MODEL --output-dir $out --steps 480 --max-length 512 --adapter-version 0.4.0-pilot.1 --lora-rank 16 --run-local-gpu
            if($LASTEXITCODE -ne 0){throw 'NERAL v4 experimental training failed; never promote'}
          } finally {Pop-Location}

      - name: Verify sealed adapter and print scalar-only experimental results
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:V4_RUN_ROOT
          $folder=Join-Path $root 'adapter'
          $report=Get-Content -LiteralPath (Join-Path $folder 'training-report.json') -Raw | ConvertFrom-Json
          $manifest=Get-Content -LiteralPath (Join-Path $folder 'neral-adapter.json') -Raw | ConvertFrom-Json
          $config=Get-Content -LiteralPath (Join-Path $folder 'adapter_config.json') -Raw | ConvertFrom-Json
          $weight=Join-Path $folder 'adapter_model.safetensors'
          $sha=(Get-FileHash -Algorithm SHA256 -LiteralPath $weight).Hash.ToLowerInvariant()
          $review=Get-Content -LiteralPath (Join-Path $root 'trainer-data\train.review.json') -Raw | ConvertFrom-Json
          if($report.status -ne 'completed' -or $report.steps -ne 480 -or
             $report.optimizer_steps_completed -ne 480 -or $report.lora_rank -ne 16 -or
             $report.neral_trainable_parameters -ne 40370176 -or
             $config.r -ne 16 -or $config.lora_alpha -ne 16 -or
             $manifest.release_validated -ne $false -or
             $manifest.dataset_sha256 -ne $review.dataset_sha256 -or
             $manifest.files.'adapter_model.safetensors' -ne $sha){
            throw 'Unverified adapter weights or incomplete optimizer steps'
          }
          $result=[ordered]@{
            schema=1
            status='NERAL_V4_R16_TRAINED_NOT_DEPLOYED'
            steps_completed=480
            lora_rank=16
            trainable_parameters=40370176
            adapter_sha256=$sha
            data_sha256=$review.dataset_sha256
            release_validated=$false
            quality_improvement_proven=$false
            adapter_promoted=$false
            no_weights_or_prompts_uploaded=$true
          }
          $dest=Join-Path $env:GITHUB_WORKSPACE 'control\v4_training_scalar'
          if(Test-Path -LiteralPath $dest){throw 'Report already exists'}
          New-Item -ItemType Directory -Path $dest -ErrorAction Stop|Out-Null
          ($result|ConvertTo-Json -Compress) | Set-Content -LiteralPath (Join-Path $dest 'summary.json') -Encoding utf8
          Write-Output 'NERAL V4 rank16 480 optimizer steps completed and SHA-256 sealed locally; not deployed.'

      - name: Upload ONLY allowlisted scalar experiment report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: neral-v4-r16-480-scalar
          path: control/v4_training_scalar/summary.json
          retention-days: 14
          if-no-files-found: error


      - name: Compare Qwen base and saved NERAL on 128 novel tasks
        run: |
          $ErrorActionPreference='Stop'
          $py=Join-Path $env:USERPROFILE 'NERAL-QLoRA-Research\training-env-py312\Scripts\python.exe'
          $trainer=Join-Path $env:GITHUB_WORKSPACE 'trainer'
          $control=Join-Path $env:GITHUB_WORKSPACE 'control'
          $adapter=Join-Path $env:V4_RUN_ROOT 'adapter'
          $data=Join-Path $env:V4_RUN_ROOT 'candidate'
          $evalroot=Join-Path $env:V4_RUN_ROOT 'novel-128'
          if(Test-Path -LiteralPath $evalroot){throw 'Never overwrite a prior evaluation'}
          New-Item -ItemType Directory -Path $evalroot -ErrorAction Stop|Out-Null
          Push-Location $control
          try {
            $env:PYTHONPATH=$control
            & $py -B -m unittest discover -s tests -p test_neral_v4_novel_eval.py -v
            if($LASTEXITCODE -ne 0){throw 'Heldout safety contracts failed'}
            & $py -B -c "from scripts.neral_v4_novel_eval import verify_prompt_isolation;from pathlib import Path;import sys;assert verify_prompt_isolation(Path(sys.argv[1]))" $data
            if($LASTEXITCODE -ne 0){throw 'Heldout data overlap or source drift'}
          } finally {Pop-Location}
          $env:PYTHONPATH=$trainer
          foreach($variant in @('base','neral_v4')){
            $raw=& nvidia-smi --query-gpu=memory.free,utilization.gpu --format=csv,noheader,nounits
            if($LASTEXITCODE -ne 0){throw 'No GPU sensor for read-only evaluation'}
            $fields=($raw|Select-Object -First 1)-split ','
            if($fields.Count -ne 2 -or [int]$fields[0].Trim() -lt 9000 -or [int]$fields[1].Trim() -gt 20){
              throw "GPU busy or under 9000 MiB before $variant"
            }
            Push-Location $control
            try {
              & $py -B -m scripts.neral_v4_novel_eval --base $env:V4_MODEL --adapter $adapter --trainer-root $trainer --source-root $data --out (Join-Path $evalroot $variant) --variant $variant
              if($LASTEXITCODE -ne 0){throw "Novel A/B inference failed for $variant"}
            } finally {Pop-Location}
          }
          Push-Location $control
          try {
            & $py -B -m scripts.neral_v4_novel_eval --base $env:V4_MODEL --adapter $adapter --trainer-root $trainer --source-root $data --out (Join-Path $evalroot 'summary') --combine
            if($LASTEXITCODE -ne 0){throw 'Paired 128-case evaluation invalid'}
          } finally {Pop-Location}
          $dest=Join-Path $control 'novel_eval_scalar'
          if(Test-Path -LiteralPath $dest){throw 'Existing summary cannot be overwritten'}
          New-Item -ItemType Directory -Path $dest -ErrorAction Stop|Out-Null
          Copy-Item -LiteralPath (Join-Path $evalroot 'summary\summary.json') -Destination (Join-Path $dest 'summary.json') -ErrorAction Stop

      - name: Verify ONLY paired scalar results are exportable
        id: novel_guard
        if: always()
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:GITHUB_WORKSPACE 'control\novel_eval_scalar'
          if(-not(Test-Path -LiteralPath $dir -PathType Container)){exit 0}
          $files=@(Get-ChildItem -LiteralPath $dir -Recurse -File)
          if($files.Count -ne 1 -or $files[0].Name -ne 'summary.json' -or $files[0].Length -gt 14800){
            throw 'Unexpected local results or potential raw model data'
          }
          $p=Get-Content -LiteralPath $files[0].FullName -Raw|ConvertFrom-Json
          $allowed=@('schema','status','total','base','neral_v4','per_category','paired','base_revision','adapter_sha256','case_hash','trained_adapter_evaluated','independent_external_benchmark','general_improvement_proven','release_validated','weights_promoted','limitations')
          $keys=@($p.PSObject.Properties.Name)
          $data=Join-Path $env:V4_RUN_ROOT 'adapter\neral-adapter.json'
          if(-not(Test-Path -LiteralPath $data -PathType Leaf)){exit 0}
          $manifest=Get-Content -LiteralPath $data -Raw|ConvertFrom-Json
          if($keys.Count -ne $allowed.Count -or @($keys|Where-Object{$_ -notin $allowed}).Count -ne 0 -or
             $p.status -ne 'NERAL_V4_NOVEL_REPO_HOLDOUT_DIAGNOSTIC' -or $p.total -ne 128 -or
             $p.adapter_sha256 -ne $manifest.files.'adapter_model.safetensors' -or
             $p.base_revision -ne 'c03e6d358207e414f1eca0bb1891e29f1db0e242' -or
             $p.case_hash -notmatch '^[a-f0-9]{64}$' -or
             $p.release_validated -ne $false -or $p.weights_promoted -ne $false -or
             $p.general_improvement_proven -ne $false -or $p.independent_external_benchmark -ne $false){
            throw 'Illegal status, provenance, or unexpected top-level keys'
          }
          $cats=@('algebra','fractions','money','timezone','fuel','python_trace','sql','tool')
          if(@($p.per_category.PSObject.Properties.Name).Count -ne $cats.Count){throw 'Invalid benchmark categories'}
          $totalBase=0;$totalNew=0
          foreach($cat in $cats){
            $row=$p.per_category.$cat
            if($null -eq $row -or $row.total -ne 16 -or
               $row.base_correct -lt 0 -or $row.base_correct -gt 16 -or
               $row.neral_correct -lt 0 -or $row.neral_correct -gt 16 -or
               $row.net_gain -ne ($row.neral_correct - $row.base_correct)){throw 'Bad per-skill metric'}
            $totalBase+=$row.base_correct;$totalNew+=$row.neral_correct
          }
          if($totalBase -ne $p.base.correct -or $totalNew -ne $p.neral_v4.correct -or
             $p.paired.net_gain -ne ($totalNew-$totalBase) -or
             $p.paired.discordant -ne ($p.paired.improvements+$p.paired.regressions) -or
             $p.paired.exact_mcnemar_p -lt 0 -or $p.paired.exact_mcnemar_p -gt 1){
            throw 'Paired total inconsistent with domain outcomes'
          }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT,"safe=true"+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))

      - name: Upload novel-128-paired-scores without model responses
        if: always() && steps.novel_guard.outputs.safe == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: neral-v4-novel-128-paired-scores
          path: control/novel_eval_scalar/summary.json
          retention-days: 14
          if-no-files-found: error
