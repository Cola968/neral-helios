name: Version matrix CI

on:
  pull_request:
    paths:
      - benchmark_versions50.py
      - tests/test_version_matrix50.py
      - .github/workflows/neral50m-version-matrix.yml
      - .github/workflows/version-matrix-ci.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile version benchmark
        run: python -m py_compile benchmark_versions50.py
      - name: Install tests
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run version matrix tests
        run: python -m pytest tests/test_version_matrix50.py -q
