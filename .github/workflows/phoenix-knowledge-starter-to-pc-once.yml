name: Phoenix install knowledge starter to PC once (NO MODEL)
on:
  push:
    branches: [experiment/phoenix-sft-fp32-audit]
    paths: ['.github/workflows/phoenix-knowledge-starter-to-pc-once.yml']
permissions:
  contents: read
concurrency:
  group: neral-nextgen-local-gpu-training
  cancel-in-progress: false
jobs:
  place-starter-only:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - name: Refresh dedicated exact-commit Knowledge checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: phoenix_knowledge_preview_source
          clean: true
          persist-credentials: false
      - name: Verify entrypoints without starting server or model
        run: |
          $ErrorActionPreference = 'Stop'
          $owned = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'phoenix_knowledge_preview_source'))
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\') + '\'
          if (-not $owned.StartsWith($workspace, [StringComparison]::OrdinalIgnoreCase) -or [IO.Path]::GetFileName($owned) -ne 'phoenix_knowledge_preview_source') { throw 'Refusing unknown checkout location' }
          $folder = Join-Path $owned 'frontier350\nextgen_v1'
          $script = Join-Path $folder 'start_helios_knowledge.ps1'
          $starter = Join-Path $folder 'START_HELIOS_KNOWLEDGE.cmd'
          $preview = Join-Path $folder 'helios_knowledge_preview.py'
          if (-not (Test-Path -LiteralPath $script -PathType Leaf) -or -not (Test-Path -LiteralPath $starter -PathType Leaf) -or -not (Test-Path -LiteralPath $preview -PathType Leaf)) { throw 'Missing Knowledge entrypoint files' }
          $tokens = $null
          $issues = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($script,[ref]$tokens,[ref]$issues)
          if ($issues.Count -gt 0) { throw 'Knowledge launcher failed PowerShell syntax parsing' }
          if ((Get-PSDrive -Name C).Free -lt 30GB) { throw 'C reserve too small; stop before any model activity' }
          Write-Host ('KNOWLEDGE_STARTER_READY|' + $starter)
          Write-Host 'Only code checkout refreshed. No model loaded, server started, GPU used, checkpoint copied, dataset changed or training run.'
