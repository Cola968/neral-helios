name: Neral SFT additional automated review flags
on:
  push:
    branches: [experiment/nextgen-v1-isolated]
    paths: ['.github/workflows/neral-nextgen-sft-review-flags.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          path: nextgen_sft_review_repo
          clean: false
          persist-credentials: false
      - name: Audit split identity and flagged overlaps without logging any dialogue text
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          $stage='D:\NeralScaleV81\sft_review_stage_35126575836\review_only_candidates'
          if (-not (Test-Path -LiteralPath $stage -PathType Container)) {throw 'missing staging candidate directory'}
          $train=Join-Path $stage 'candidate_train.jsonl'
          $valid=Join-Path $stage 'candidate_validation.jsonl'
          $report=Join-Path $stage 'AUTOMATED_FLAGS.json'
          if (Test-Path -LiteralPath $report) {throw 'refuse to replace earlier audit results'}
          function To-WSL([string]$p) {
            if ($p -notmatch '^[CcDd]:\\' -or $p.Contains("'")) { throw 'unexpected local Windows path' }
            return ('/mnt/'+$p.Substring(0,1).ToLowerInvariant()+'/'+$p.Substring(3).Replace('\','/'))
          }
          $repo=To-WSL (Join-Path $env:GITHUB_WORKSPACE 'nextgen_sft_review_repo')
          $wTrain=To-WSL $train
          $wValid=To-WSL $valid
          $wOut=To-WSL $report
          & wsl.exe -- bash -lc "cd '$repo' && ~/.venvs/neral-triton-py312/bin/python frontier350/nextgen_v1/audit_sft_stage.py --train '$wTrain' --validation '$wValid' --benchmark benchmark_nis2_chat50.py --train-sha 58a4ef28db625b928a931f560978576eb216a603710b8ecb306e6c8f0aeb6f4e --validation-sha e34bd1cb9bde72048535769f3ad49516b5fa7d0d868db27fb7068837862fac26 --out '$wOut'"
          if($LASTEXITCODE -ne 0){throw 'audit failed; data not approved'}
          $audit=Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if($audit.approved_for_training -ne $false -or $audit.training_started -ne $false){throw 'review-only contract violated'}
          Write-Host ('review_report_present=true training_rows='+$audit.training_rows+' validation_rows='+$audit.validation_rows)
          Write-Host 'Human review still required. No training run, no model weights touched.'
      - name: Upload metadata-only flag report, never prompts or weights
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: neral-sft-metadata-flags-only
          path: D:\NeralScaleV81\sft_review_stage_35126575836\review_only_candidates\AUTOMATED_FLAGS.json
          if-no-files-found: error
          retention-days: 14
