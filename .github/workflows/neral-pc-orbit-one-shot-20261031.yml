name: NERAL Orbit — one-shot trusted PC CPU verification 2026-10-31
on:
  push:
    paths:
      - '.github/workflows/neral-pc-orbit-one-shot-20261031.yml'
permissions:
  contents: read
jobs:
  orbit-pc-tests:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 7
    env:
      HELIOS_PREPARATION_MODE: '1'
      HELIOS_ORBIT_ENABLED: '1'
      HELIOS_DEVICE: 'cpu'
      CUDA_VISIBLE_DEVICES: '-1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: false
      - name: Read-only Python syntax and synthetic research self-test
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $p = 'C:\Users\astad\Documents\Codex\2026-09-05\lo\outputs\neral\.venv\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $p -PathType Leaf)) { throw 'Trusted NERAL Python missing' }
          $env:HELIOS_STATE_ROOT = Join-Path $env:RUNNER_TEMP ('orbit-cpu-'+$env:GITHUB_RUN_ID)
          & $p -m py_compile neral_orbit.py neral_orbit_research.py app.py tests/test_neral_orbit.py tests/test_neral_orbit_research.py
          if ($LASTEXITCODE -ne 0) { throw 'Syntax failed' }
          & $p neral_orbit_research.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Self-test failed' }
      - name: Actual Orbit SQLite, Flask and security regression tests
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $p = 'C:\Users\astad\Documents\Codex\2026-09-05\lo\outputs\neral\.venv\Scripts\python.exe'
          $env:HELIOS_STATE_ROOT = Join-Path $env:RUNNER_TEMP ('orbit-cpu-'+$env:GITHUB_RUN_ID)
          & $p -m unittest tests.test_neral_orbit tests.test_neral_orbit_research -v
          if ($LASTEXITCODE -ne 0) { throw 'Orbit regression tests failed' }
