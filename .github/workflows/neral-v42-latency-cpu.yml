name: NERAL V4.2 latency routing CPU regression
on:
  pull_request:
    paths:
      - neral_three_tier_runtime.py
      - tests/test_neral_v42_latency_routing_cpu.py
      - .github/workflows/neral-v42-latency-cpu.yml
permissions:
  contents: read
jobs:
  latency-routing-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt sympy z3-solver
      - run: python -m unittest discover -s tests -p test_neral_v42_latency_routing_cpu.py -v
      - run: python -m unittest discover -s tests -p test_neral_v41_cpu.py -v
      - run: python -m unittest discover -s tests -p test_neral_three_tier_api.py -v
