name: Phoenix real OASST2 selector diagnostic (no export)
on:
  push:
    branches: [experiment/phoenix-sft-fp32-audit]
    paths: ['.github/workflows/phoenix-oasst2-real-select.yml']
permissions:
  contents: read
concurrency:
  group: neral-nextgen-local-gpu-training
  cancel-in-progress: false
jobs:
  local-real-selector-dry-run:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 12
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - name: Checkout exact profiling code into isolated directory without cleaning private assets
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: phoenix_selector_dry_run_${{ github.run_id }}
          clean: false
          persist-credentials: false
      - name: Make Python 3.12 available via official GitHub setup action
        uses: actions/setup-python@v5
        # The prior attempt failed solely on a new child PowerShell process using
        # Restricted execution policy. Apply Process scope to this step only;
        # MachinePolicy/UserPolicy imposed by an administrator still take precedence.
        env:
          PSExecutionPolicyPreference: Bypass
        with:
          python-version: '3.12'
          check-latest: false
      - name: Profile actual pinned source selection with no holdout claims or export
        run: |
          $ErrorActionPreference = 'Stop'
          $root = if ($env:NERAL_ASSETS_ROOT) { $env:NERAL_ASSETS_ROOT } else { Join-Path $env:USERPROFILE 'Documents\Codex\2026-09-05\lo\outputs\neral' }
          $archive = Join-Path $root 'sft50_sources\2023-11-05_oasst2_ready.messages.jsonl.gz'
          $script = Join-Path $env:GITHUB_WORKSPACE 'phoenix_selector_dry_run_${{ github.run_id }}\frontier350\nextgen_v1\phoenix_oasst2_profile.py'
          if (!(Test-Path -LiteralPath $script -PathType Leaf)) { throw 'Profiling code not checked out; no source opened.' }
          & python $script --assets-root "$root" --archive "$archive" 2>$null
          if ($LASTEXITCODE -ne 0) { throw 'Real source selector diagnostic blocked. No export, approval or training.' }
      - name: Record non-approval boundary
        run: Write-Host 'Real original source chooser and tree-split profile only. No private holdout supplied, no training JSONL written, no corpus approval, no SFT, GPU, model modifications or raw text uploads.'
