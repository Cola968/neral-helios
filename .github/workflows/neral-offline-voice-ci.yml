name: NERAL offline speech CPU contracts
on:
  pull_request:
    paths:
      - 'neral_local_voice.py'
      - 'neral_preview_server.py'
      - 'static/neral-local-voice.js'
      - 'static/neral-local-voice-worklet.js'
      - 'tests/test_neral_local_voice.py'
      - 'tests/test_neral_local_voice_browser.cjs'
      - 'scripts/build_neral_1_0_preview.py'
      - 'Install-Neral-Local-Voice.ps1'
      - '.github/workflows/neral-offline-voice-ci.yml'
  push:
    branches: [main]
    paths:
      - 'neral_local_voice.py'
      - 'neral_preview_server.py'
      - 'static/neral-local-voice.js'
      - 'static/neral-local-voice-worklet.js'
      - 'tests/test_neral_local_voice.py'
      - 'tests/test_neral_local_voice_browser.cjs'
      - 'scripts/build_neral_1_0_preview.py'
      - '.github/workflows/neral-offline-voice-ci.yml'
permissions:
  contents: read
jobs:
  local-voice:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-neral-preview.txt
      - name: Server voice contracts with inert mock engines
        run: python -m unittest discover -s tests -p test_neral_local_voice.py -v
      - name: Browser speech state machine, cancel and safe dispatch
        run: |
          node --check static/neral-local-voice.js
          node --test tests/test_neral_local_voice_browser.cjs
      - name: Existing voice and main chat regressions
        run: |
          node --test tests/test_neral_1_0_voice_client.cjs tests/test_neral_1_0_voice_v2.cjs
          python -m unittest discover -s tests -p test_neral_1_0_standalone_release.py -v
