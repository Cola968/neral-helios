name: App runtime tests

on:
  pull_request:
    paths:
      - 'app.py'
      - 'model.py'
      - 'model50.py'
      - 'security_guard.py'
      - 'code_check.py'
      - 'tests/test_app_kv_runtime.py'
      - '.github/workflows/app-runtime-tests.yml'

permissions:
  contents: read

jobs:
  app-kv-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - name: Test cancelable KV-cache app generation
        run: python -m pytest tests/test_app_kv_runtime.py -q
