name: NERAL V2 bounded free-code-loop CPU contracts
on:
  pull_request:
    paths:
      - 'neral_three_tier_runtime.py'
      - 'neral_tir_experimental.py'
      - 'docker/neral-code-v2.Dockerfile'
      - 'static/neral-preview.js'
      - 'scripts/neral_v2_live5.py'
      - 'tests/test_neral_code_loop_v2.py'
      - 'tests/test_neral_code_sandbox_image_v2.py'
      - 'tests/test_neral_code_loop_ui_v2.cjs'
      - '.github/workflows/neral-code-loop-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v2-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the bounded CPU test dependencies
        run: python -m pip install --disable-pip-version-check pytest flask z3-solver
      - name: Compile changed Python and browser source
        run: |
          python -m py_compile neral_three_tier_runtime.py neral_tir_experimental.py scripts/neral_v2_live5.py
          node --check static/neral-preview.js
      - name: V2 free-form model/tool orchestration, retries and Docker limits
        run: |
          python -m pytest -q tests/test_neral_code_loop_v2.py tests/test_neral_code_sandbox_image_v2.py tests/test_neral_three_tier_everyday.py
          python -m unittest discover -s tests -p test_neral_v2_live5_transport.py -v
          node --test tests/test_neral_code_loop_ui_v2.cjs tests/test_neral_three_tier_ui.cjs
