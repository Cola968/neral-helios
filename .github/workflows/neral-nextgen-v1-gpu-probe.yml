name: Neral NextGen V1 RTX4070 Compute Probe

on:
  push:
    branches: [experiment/nextgen-v1-isolated]
    paths: ['.github/workflows/neral-nextgen-v1-gpu-probe.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Deliberately NOT the V8.1/V8.2 concurrency group: GitHub replaces older
# pending runs within a group. This distinct group preserves queued V8.2.
# The SAME single-job self-hosted GPU runner is requested and preflight
# rejects active training or insufficient free VRAM rather than contending.
concurrency:
  group: neral-nextgen-v1-compute-probe
  cancel-in-progress: false

jobs:
  compute-only-ab:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: Verify training finished and GPU idle (never stop workloads)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $url='https://api.github.com/repos/${{ github.repository }}/actions/runs/35069331704'
          $active=Invoke-RestMethod -Uri $url -Headers $headers -Method Get -TimeoutSec 15
          if($active.status -ne 'completed'){throw "V8.1 still $($active.status): no NextGen GPU contention"}
          $gpu=(nvidia-smi --query-gpu=name --format=csv,noheader|Select-Object -First 1).Trim()
          $temp=[int]((nvidia-smi --query-gpu=temperature.gpu --format=csv,noheader,nounits|Select-Object -First 1).Trim())
          $free=[int]((nvidia-smi --query-gpu=memory.free --format=csv,noheader,nounits|Select-Object -First 1).Trim())
          if($gpu -notmatch 'RTX 4070'){throw "Unexpected GPU: $gpu"}
          if($temp -gt 78 -or $free -lt 9000){throw "GPU not idle/cool: temp=$temp C free=$free MiB; refusing to start"}
          function W([string]$p){$f=[IO.Path]::GetFullPath($p); '/mnt/'+$f.Substring(0,1).ToLower()+'/'+$f.Substring(3).Replace('\','/')}
          "repo=$(W (Get-Location).Path)"|Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host 'V8.1 finished; RTX 4070 idle preflight passed. Synthetic compute only.'
          exit 0

      - name: Eager BF16 real-model compute-only baseline
        run: |
          $ErrorActionPreference='Stop'; $repo='${{ steps.guard.outputs.repo }}'
          $cmd="set -e; cd '$repo'; ~/.venvs/neral-triton-py312/bin/python -u frontier350/nextgen_v1/probe.py --execute --train-blocks 4 --execution eager --batch 4 --seq 512 --warmup 3 --steps 12 --out frontier350_nextgen_gpu_probe/eager.json"
          wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0){throw 'Eager GPU probe failed; no compiled candidate started'}
          exit 0

      - name: Compiled BF16 real-model compute-only candidate
        run: |
          $ErrorActionPreference='Stop'; $repo='${{ steps.guard.outputs.repo }}'
          $cmd="set -e; cd '$repo'; ~/.venvs/neral-triton-py312/bin/python -u frontier350/nextgen_v1/probe.py --execute --train-blocks 4 --execution compile-default --batch 4 --seq 512 --warmup 3 --steps 12 --out frontier350_nextgen_gpu_probe/compiled.json"
          wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0){throw 'Compiled candidate failed; keep baseline and reject unproven optimization'}
          exit 0

      - name: Upload synthetic compute-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neral-nextgen-v1-compute-only-${{ github.run_id }}
          path: frontier350_nextgen_gpu_probe/*.json
          if-no-files-found: warn
          retention-days: 30
