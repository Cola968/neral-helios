name: Phoenix resume foundation refresh to 4Mi and public A-B

on:
  push:
    branches: [experiment/phoenix-blind-ab-audit-20260919]
    paths:
      - '.github/workflows/phoenix-current-refresh-resume-4m.yml'

permissions:
  contents: read

concurrency:
  group: neral-nextgen-local-gpu-training
  cancel-in-progress: false

jobs:
  resume-4m:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 75
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: phoenix_refresh_4m_${{ github.run_id }}
          clean: false
          persist-credentials: false

      - name: Resume exact 1Mi state to 4Mi and evaluate
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          function ToWsl([string]$p) {
            $f=[IO.Path]::GetFullPath($p)
            if($f -notmatch '^([A-Za-z]):\\(.*)$'){throw 'Absolute Windows path required'}
            return '/mnt/'+$matches[1].ToLowerInvariant()+'/'+$matches[2].Replace('\','/')
          }

          $repo=Join-Path $env:GITHUB_WORKSPACE ('phoenix_refresh_4m_'+$env:GITHUB_RUN_ID)
          $source='D:\NeralScaleV81\_continuity_v5\continuity_002073161216_f7a73e283421.pt'
          $assets=if($env:NERAL_ASSETS_ROOT){$env:NERAL_ASSETS_ROOT}else{Join-Path $env:USERPROFILE 'Documents\Codex\2026-09-05\lo\outputs\neral'}
          $corpus='D:\NeralPrivateAssets\phoenix\foundation_refresh_35900598370'
          $manifest=Join-Path $corpus 'manifest.json'
          $out='D:\NeralPrivateAssets\phoenix\foundation_train_35901126261'
          $resume=Join-Path $out 'resume.pt'
          $resumeSha='2af9d7afe0b034d326f594056f37a74434b0270a6ce661f167ed1d9613351724'
          $evalOut=Join-Path $out ('public_dev_ab_4m_'+$env:GITHUB_RUN_ID+'.json')

          foreach($p in @($repo,$source,$assets,$corpus,$manifest,$out,$resume,$evalOut)){if($p.Contains("'")){throw 'Unsafe quote in path'}}
          if(-not(Test-Path -LiteralPath $resume -PathType Leaf)){throw '1Mi resume checkpoint missing'}
          if((Get-FileHash -LiteralPath $resume -Algorithm SHA256).Hash.ToLowerInvariant() -ne $resumeSha){throw '1Mi resume SHA changed'}
          if(Test-Path -LiteralPath $evalOut){throw 'Create-only evaluation output exists'}
          $manifestSha=(Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash.ToLowerInvariant()
          if($manifestSha -ne 'f04313531e84b2d35ce684ff15a355079c087a2c0b2d9bd45cee2eda4a82c2f1'){throw 'Refresh manifest changed'}

          Write-Host 'Pre-resume GPU telemetry:'
          nvidia-smi --query-gpu=name,memory.total,memory.free,utilization.gpu,temperature.gpu --format=csv,noheader

          $cmd="set -euo pipefail; cd '$(ToWsl $repo)'; test -x ~/.venvs/neral-triton-py312/bin/python; ~/.venvs/neral-triton-py312/bin/python -B -m py_compile frontier350/nextgen_v1/phoenix_foundation_refresh_dev.py frontier350/nextgen_v1/phoenix_foundation_refresh_public_dev_eval.py; ~/.venvs/neral-triton-py312/bin/python -B -u frontier350/nextgen_v1/phoenix_foundation_refresh_dev.py --execute --trusted-own-checkpoint --source-checkpoint '$(ToWsl $source)' --assets-root '$(ToWsl $assets)' --corpus-root '$(ToWsl $corpus)' --manifest-sha256 '$manifestSha' --out '$(ToWsl $out)' --target-new-tokens 20000000 --stop-after-new-tokens 4194304 --resume '$(ToWsl $resume)' --resume-sha256 '$resumeSha' --seq 256 --microbatch 4 --grad-accum 1 --lr 0.00001"
          & wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0){throw 'Exact foundation resume to 4Mi failed'}

          $summary=Get-Content -LiteralPath (Join-Path $out 'summary.json') -Raw|ConvertFrom-Json
          if([int64]$summary.new_processed_tokens -ne 4194304){throw '4Mi token counter mismatch'}
          if([int]$summary.layers_trained -ne 24 -or $summary.checkpoint_kind -ne 'complete_resumable_state'){throw '4Mi checkpoint contract mismatch'}
          if($summary.source_unchanged -ne $true -or $summary.production_eligible -ne $false){throw 'Unsafe 4Mi summary state'}
          $newSha=$summary.resume_sha256
          if((Get-FileHash -LiteralPath $resume -Algorithm SHA256).Hash.ToLowerInvariant() -ne $newSha){throw '4Mi resume SHA mismatch'}

          Write-Host '=== SAFE 4Mi FOUNDATION SUMMARY ==='
          [ordered]@{
            new_processed_tokens=$summary.new_processed_tokens
            cumulative_reference_tokens=$summary.cumulative_reference_tokens
            optimizer_steps=$summary.optimizer_steps
            baseline_validation_loss=$summary.baseline_validation_loss_for_invocation
            best_validation_loss=$summary.best_validation_loss
            training_wall_seconds=$summary.training_wall_seconds
            peak_cuda_reserved_mib=$summary.peak_cuda_reserved_mib
            resume_sha256=$newSha
            production_eligible=$summary.production_eligible
          }|ConvertTo-Json -Compress|Write-Host

          $evalCmd="set -euo pipefail; cd '$(ToWsl $repo)'; ~/.venvs/neral-triton-py312/bin/python -B -u frontier350/nextgen_v1/phoenix_foundation_refresh_public_dev_eval.py --execute --trusted-own-checkpoints --base-checkpoint '$(ToWsl $source)' --candidate-checkpoint '$(ToWsl $resume)' --candidate-sha256 '$newSha' --assets-root '$(ToWsl $assets)' --out '$(ToWsl $evalOut)'"
          & wsl.exe -- bash -lc $evalCmd
          if($LASTEXITCODE -ne 0){throw '4Mi public development A/B failed'}
          Write-Host 'Detailed generations remain private.'

      - name: Post-run telemetry
        if: always()
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: nvidia-smi --query-gpu=name,memory.used,memory.free,utilization.gpu,temperature.gpu --format=csv,noheader
