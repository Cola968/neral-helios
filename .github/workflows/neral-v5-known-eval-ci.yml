name: NERAL v5 known-development A/B CPU contracts
on:
  pull_request:
    paths:
      - 'scripts/neral_v5_known_eval.py'
      - 'tests/test_neral_v5_known_eval.py'
      - '.github/workflows/neral-v5-known-eval.yml'
      - '.github/workflows/neral-v5-known-eval-ci.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/neral_v5_known_eval.py'
      - 'tests/test_neral_v5_known_eval.py'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_neral_v5_known_eval.py -v
      - run: python -m compileall -q scripts/neral_v5_known_eval.py
      - name: Lint manual evaluation workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -ignore 'label "neral-gpu" is unknown' .github/workflows/neral-v5-known-eval.yml
