name: Neral archive relocation D to C one-shot

on:
  push:
    branches: [experiment/phoenix-sft-fp32-audit]
    paths: ['.github/workflows/neral-relocate-archive-to-c-once.yml']

permissions:
  contents: read

concurrency:
  group: neral-nextgen-local-gpu-training
  cancel-in-progress: false

jobs:
  relocate:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - name: Relocate only inactive historical Neral generations
        run: |
          $ErrorActionPreference = 'Stop'
          $sources = @(
            'D:\NeralScaleV2',
            'D:\NeralScaleV4',
            'D:\NeralScaleV5',
            'D:\NeralThroughput50kV1',
            'D:\NeralThroughput60kV3'
          )
          $destRoot = 'C:\NeralArchive'

          # Never touch current/valuable live generations here.
          $forbidden = @('D:\NeralScaleV8','D:\NeralScaleV81','D:\NeralV82Gate','D:\NeralAutoRecoveryV1')
          foreach ($src in $sources) {
            if ($forbidden -contains $src) { throw "Refusing live path: $src" }
          }

          # Refuse relocation if any process command line references one of these sources.
          $cmdlines = Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Select-Object -ExpandProperty CommandLine -ErrorAction SilentlyContinue
          foreach ($src in $sources) {
            $needle = $src.ToLowerInvariant()
            foreach ($line in $cmdlines) {
              if ($line -and $line.ToLowerInvariant().Contains($needle)) { throw "Source appears active in a process; refusing: $src" }
            }
          }

          $existing = @($sources | Where-Object { Test-Path -LiteralPath $_ -PathType Container })
          if ($existing.Count -eq 0) { throw 'No archival source directories found' }

          $total = 0L
          foreach ($src in $existing) {
            $sum = (Get-ChildItem -LiteralPath $src -File -Recurse -Force -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
            if ($null -ne $sum) { $total += [int64]$sum }
          }
          $c = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'"
          $reserve = 30GB
          if ([int64]$c.FreeSpace - $total -lt $reserve) {
            throw ('C: would fall below 30 GiB free; refusing. NeedGiB=' + [math]::Round($total/1GB,2) + ' FreeGiB=' + [math]::Round($c.FreeSpace/1GB,2))
          }
          Write-Host ('ARCHIVE_TO_MOVE_GIB=' + [math]::Round($total/1GB,2))
          Write-Host ('C_FREE_BEFORE_GIB=' + [math]::Round($c.FreeSpace/1GB,2))
          New-Item -ItemType Directory -Path $destRoot -Force | Out-Null

          foreach ($src in $existing) {
            $name = Split-Path -Leaf $src
            $dst = Join-Path $destRoot $name
            if (Test-Path -LiteralPath $dst) { throw "Destination already exists; refusing overwrite: $dst" }

            $srcCount = @(Get-ChildItem -LiteralPath $src -File -Recurse -Force -ErrorAction SilentlyContinue).Count
            $srcBytes = (Get-ChildItem -LiteralPath $src -File -Recurse -Force -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
            if ($null -eq $srcBytes) { $srcBytes = 0 }

            New-Item -ItemType Directory -Path $dst | Out-Null
            & robocopy $src $dst /E /COPY:DAT /DCOPY:DAT /R:1 /W:1 /XJ /NFL /NDL /NP /NJH /NJS
            $rc = $LASTEXITCODE
            if ($rc -gt 7) { throw "Robocopy failed for $src with code $rc" }

            $dstCount = @(Get-ChildItem -LiteralPath $dst -File -Recurse -Force -ErrorAction SilentlyContinue).Count
            $dstBytes = (Get-ChildItem -LiteralPath $dst -File -Recurse -Force -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
            if ($null -eq $dstBytes) { $dstBytes = 0 }
            if ($srcCount -ne $dstCount -or [int64]$srcBytes -ne [int64]$dstBytes) {
              throw "Verification mismatch; keeping source and copied destination: $src"
            }

            Remove-Item -LiteralPath $src -Recurse -Force
            if (Test-Path -LiteralPath $src) { throw "Source removal failed after verified copy: $src" }
            & cmd.exe /c "mklink /J `"$src`" `"$dst`""
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $src)) { throw "Junction creation failed: $src" }
            Write-Host ("MOVED_AND_LINKED=" + $name + " bytes=" + $dstBytes)
          }

          $d = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='D:'"
          $c2 = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'"
          Write-Host ('C_FREE_AFTER_GIB=' + [math]::Round($c2.FreeSpace/1GB,2))
          Write-Host ('D_FREE_AFTER_GIB=' + [math]::Round($d.FreeSpace/1GB,2))
          Write-Host 'RELOCATION_COMPLETE=true'
