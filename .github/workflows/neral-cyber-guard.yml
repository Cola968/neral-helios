name: NERAL Cyber Guard local read-only validation
on:
  pull_request:
    paths:
      - 'cyber/**'
      - 'tests/test_neral_cyber_guard.py'
      - 'Start NERAL Cyber.cmd'
      - '.github/workflows/neral-cyber-guard.yml'
  push:
    branches: [main]
    paths:
      - 'cyber/**'
      - 'tests/test_neral_cyber_guard.py'
      - 'Start NERAL Cyber.cmd'
      - '.github/workflows/neral-cyber-guard.yml'
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline policy and privacy regression
        run: python -m unittest discover -s tests -p test_neral_cyber_guard.py -v
      - name: Compile without loading Windows APIs
        run: python -m py_compile cyber/guard.py cyber/__init__.py tests/test_neral_cyber_guard.py
      - name: Package only read-only source and launcher
        shell: bash
        run: |
          mkdir -p dist/NERAL-Cyber-Guard/cyber
          cp "Start NERAL Cyber.cmd" dist/NERAL-Cyber-Guard/
          cp cyber/__init__.py cyber/guard.py cyber/windows_snapshot.ps1 cyber/README.md dist/NERAL-Cyber-Guard/cyber/
          test "$(find dist/NERAL-Cyber-Guard -type f | wc -l)" -eq 5
          ! grep -R -E -i 'new-netfirewallrule|set-netfirewallprofile|remove-netfirewallrule|invoke-webrequest' dist/NERAL-Cyber-Guard
      - name: Publish local Windows Cyber Guard preview
        uses: actions/upload-artifact@v4
        with:
          name: NERAL-Cyber-Guard-Windows
          path: dist/NERAL-Cyber-Guard/
          retention-days: 14
          if-no-files-found: error
  windows-powershell-parser:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Windows PowerShell syntax without execution
        shell: powershell
        run: |
          $tokens=$null
          $parseErrors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD 'cyber\windows_snapshot.ps1'),
              [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw 'Cyber Windows collector syntax invalid' }
      - name: Windows CPU tests only (no real firewall query)
        shell: pwsh
        run: python -m unittest discover -s tests -p test_neral_cyber_guard.py -v
