name: NERAL issue 554 focused CPU tests
on:
  pull_request:
    paths:
      - 'static/neral-preview.js'
      - 'neral_preview_attachments.py'
      - 'neral_agent_autonomy.py'
      - 'neral_local_chat_api.py'
      - 'tests/test_neral_issue_554_cancel.py'
      - 'tests/test_neral_issue_554_web.cjs'
      - 'tests/test_neral_issue_554_attachments.py'
      - '.github/workflows/neral-issue-554-ci.yml'
  push:
    branches: [fix/neral-runtime-audit-554-20261116]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Test public fresh-question routing and source status
        run: node --test tests/test_neral_issue_554_web.cjs
      - name: Validate JS syntax
        run: node --check static/neral-preview.js
  attachments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Dependencies
        run: python -m pip install 'Flask>=3,<4' 'pypdf>=5,<7' 'sympy>=1.13,<2' 'z3-solver==4.16.0.0'
      - name: High attachment responder contracts
        run: python -B -m unittest discover -s tests -p test_neral_issue_554_attachments.py -v
      - name: Request-scoped local model cancellation contracts
        run: python -B -m unittest discover -s tests -p test_neral_issue_554_cancel.py -v
