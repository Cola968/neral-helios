name: Arctus350 isolated arithmetic specialist CPU safety contracts
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'frontier350/arctus350_math_specialist.py'
      - 'tests/test_arctus350_math_specialist.py'
      - '.github/workflows/arctus350-math-specialist-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest tests.test_arctus350_math_specialist -v
      - run: python -m py_compile frontier350/arctus350_math_specialist.py
