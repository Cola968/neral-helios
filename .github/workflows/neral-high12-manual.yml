name: NERAL HIGH12 paired Qwen vs HIGH (manual premerge)
on:
  workflow_dispatch:
    inputs:
      authorize:
        description: 'Type NERAL_HIGH12_GPU_MANUAL_ONLY (GPU inference, no training)'
        required: true
        type: string
      target_sha:
        description: 'Full 40-character current PR #503 head commit SHA'
        required: true
        type: string
  pull_request:
    paths:
      - 'scripts/neral_high12_manual.py'
      - 'tests/test_neral_high12_manual.py'
      - '.github/workflows/neral-high12-manual.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/neral_high12_manual.py'
      - 'tests/test_neral_high12_manual.py'
      - '.github/workflows/neral-high12-manual.yml'

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  cpu-contracts:
    name: CPU paired contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install preview-only dependencies
        run: python -m pip install -r requirements-neral-preview.txt
      - name: Balanced 12-case CPU and fail-closed paired ratchet
        run: python -B -m unittest discover -s tests -p test_neral_high12_manual.py -v

  verify-target:
    name: Verify exact authorized PR #503 SHA
    needs: cpu-contracts
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      AUTHORIZE: ${{ inputs.authorize }}
      TARGET_SHA: ${{ inputs.target_sha }}
    outputs:
      target_sha: ${{ steps.verify.outputs.target_sha }}
    steps:
      - id: verify
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "Cola968/neral-helios" ||
                "$AUTHORIZE" != "NERAL_HIGH12_GPU_MANUAL_ONLY" ||
                ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Authorization, repository or exact SHA invalid' >&2
            exit 1
          fi
          PR_JSON="$(gh api "repos/$GITHUB_REPOSITORY/pulls/503")"
          export PR_JSON
          python - <<'PY'
          import json, os, sys
          pr = json.loads(os.environ["PR_JSON"])
          ok = (
              pr.get("state") == "open"
              and pr.get("number") == 503
              and pr.get("head", {}).get("sha") == os.environ["TARGET_SHA"]
              and pr.get("head", {}).get("ref") == "fix/neral-high-first-pass-only-20261110"
              and pr.get("head", {}).get("repo", {}).get("full_name") == "Cola968/neral-helios"
              and pr.get("base", {}).get("ref") == "main"
              and pr.get("base", {}).get("repo", {}).get("full_name") == "Cola968/neral-helios"
          )
          if not ok:
              raise SystemExit("Target differs from exact in-repository PR #503 head")
          print("PR #503 source head and exact SHA verified")
          PY
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

  gpu-paired:
    name: 12 paired tasks on local RTX 4070 (opt-in)
    needs: verify-target
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 65
    concurrency:
      group: neral-qwen7b-r32-gpu-exclusive
      cancel-in-progress: false
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ needs.verify-target.outputs.target_sha }}
      NERAL_EXPERIMENTAL_TIR: '0'
      HF_HUB_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      WANDB_DISABLED: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout controller from protected default-branch workflow SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
          clean: true
      - name: Checkout exact PR #503 candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-target.outputs.target_sha }}
          path: candidate
          persist-credentials: false
          clean: true
      - name: Verify immutable HEAD, pinned Qwen and free local GPU
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -ne 'Cola968/neral-helios' -or
              $env:NERAL_EXPERIMENTAL_TIR -ne '0' -or
              $env:TARGET_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Rejected benchmark environment' }
          $actual = (& git -C (Join-Path $env:GITHUB_WORKSPACE 'candidate') rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:TARGET_SHA) { throw 'Wrong candidate checkout SHA' }
          $pr = gh api ('repos/' + $env:GITHUB_REPOSITORY + '/pulls/503') | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $pr.head.sha -ne $env:TARGET_SHA -or
              $pr.head.ref -ne 'fix/neral-high-first-pass-only-20261110') {
            throw 'PR changed after preflight; refuse GPU work'
          }
          $gpu = & nvidia-smi --query-gpu=memory.free,utilization.gpu --format=csv,noheader,nounits
          if ($LASTEXITCODE -ne 0) { throw 'GPU telemetry unavailable' }
          $v = ($gpu | Select-Object -First 1) -split ','
          if ($v.Count -ne 2 -or [int]$v[0].Trim() -lt 7000 -or
              [int]$v[1].Trim() -gt 25) { throw 'GPU busy; benchmark not started' }
          $base = Join-Path $env:USERPROFILE 'NERAL-QLoRA-Research/training-env-py312/Scripts/python.exe'
          if (-not (Test-Path -LiteralPath $base -PathType Leaf)) {
            throw 'Existing local Python 3.12 unavailable'
          }
          $envDir = Join-Path $env:RUNNER_TEMP ('neral-high12-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $envDir) { throw 'Refuse to overwrite existing Python environment' }
          & $base -B -m venv $envDir
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create isolated Python environment' }
          $py = Join-Path $envDir 'Scripts/python.exe'
          & $py -B -m pip install --disable-pip-version-check --no-input --no-cache-dir -r (Join-Path $env:GITHUB_WORKSPACE 'candidate/requirements-neral-preview.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Unable to install required local Python dependencies' }
          [IO.File]::AppendAllText($env:GITHUB_ENV, ('HIGH12_PY=' + $py + [Environment]::NewLine), [Text.UTF8Encoding]::new($false))
      - name: Run exactly 12 paired tasks, Qwen direct vs standard HIGH, no TIR
        id: gate
        run: |
          $ErrorActionPreference = 'Stop'
          $control = Join-Path $env:GITHUB_WORKSPACE 'control'
          $candidate = Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $dir = Join-Path $control 'neral_high12_scalar'
          if (Test-Path -LiteralPath $dir) { throw 'Refuse existing report directory' }
          New-Item -ItemType Directory -Path $dir -ErrorAction Stop | Out-Null
          $env:PYTHONPATH = $candidate
          Push-Location $candidate
          try {
            & $env:HIGH12_PY -B (Join-Path $control 'scripts/neral_high12_manual.py') --authorize NERAL_HIGH12_GPU_MANUAL_ONLY --target-sha $env:TARGET_SHA --out (Join-Path $dir 'summary.json')
            if ($LASTEXITCODE -ne 0) { throw 'Candidate did not pass the paired development ratchet or inference failed' }
          } finally { Pop-Location }
      - name: Upload scalar-only paired result (even on model regression)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neral-high12-paired-scalars
          path: control/neral_high12_scalar/summary.json
          retention-days: 14
          if-no-files-found: warn
