name: Phoenix paired evidence synthetic CPU
on:
  pull_request:
    paths:
      - 'frontier350/nextgen_v1/phoenix_paired_evidence.py'
      - 'frontier350/nextgen_v1/test_phoenix_paired_evidence.py'
      - 'frontier350/nextgen_v1/phoenix_blind_ab_audit.py'
      - '.github/workflows/phoenix-paired-evidence-cpu.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test synthetic evidence only
        working-directory: frontier350/nextgen_v1
        run: |
          python -m py_compile phoenix_blind_ab_audit.py phoenix_paired_evidence.py test_phoenix_paired_evidence.py
          python -m unittest -v test_phoenix_paired_evidence.py
