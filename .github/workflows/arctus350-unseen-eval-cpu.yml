name: Arctus350 unseen 76 VAL task eval CPU contracts
on:
  pull_request:
    types: [opened,synchronize]
    paths:
      - 'frontier350/arctus350_unseen_task_eval.py'
      - 'tests/test_arctus350_unseen_task_eval.py'
      - '.github/workflows/arctus350-unseen-eval-cpu.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest tests.test_arctus350_unseen_task_eval -v
      - run: python -m py_compile frontier350/arctus350_unseen_task_eval.py
