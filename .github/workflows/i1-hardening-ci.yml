name: I1 hardening CI

on:
  pull_request:
    paths:
      - 'run_50m_i1.py'
      - 'train_raw_math50_i1.py'
      - 'train_instruct50_i1.py'
      - 'build_targeted_sft50_sources.py'
      - 'prepare_sft50_i1.py'
      - 'benchmark_targeted50.py'
      - 'benchmarks50/targeted_v1.jsonl'
      - 'benchmark_bundle50.py'
      - 'build_promotion_comparison50.py'
      - 'i1_targets50.py'
      - 'i1_quality_gate50.py'
      - 'render_benchmark_report50.py'
      - 'run_current_benchmark50.py'
      - 'tests/test_i1_hardening.py'
      - '.github/workflows/i1-hardening-ci.yml'

permissions:
  contents: read

jobs:
  hardening-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest numpy
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile all I1 campaign scripts
        run: |
          python -m py_compile run_50m_i1.py train_raw_math50_i1.py train_instruct50_i1.py build_targeted_sft50_sources.py prepare_sft50_i1.py benchmark_targeted50.py benchmark_bundle50.py build_promotion_comparison50.py i1_targets50.py i1_quality_gate50.py render_benchmark_report50.py run_current_benchmark50.py
      - name: Run hardening and frozen-gate tests
        run: |
          python -m pytest tests/test_i1_hardening.py tests/test_i1_targets50.py tests/test_instruct50.py tests/test_benchmark_v5.py -q
