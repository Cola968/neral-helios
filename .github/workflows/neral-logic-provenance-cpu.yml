name: NERAL logic phase telemetry and PR537 evidence boundaries
on:
  push:
    branches: [feat/neral-logic-diagnostics-prospective-20261112]
permissions:
  contents: read
jobs:
  cpu-logic-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-neral-preview.txt
      - name: Fail-closed logic trace, PR537 proof-boundary contracts
        run: python -B -m unittest discover -s tests -p 'test_neral_logic_failure_provenance_cpu.py' -v
      - name: Latency optimization opt-in and untouched original provenance contracts
        run: python -B -m unittest discover -s tests -p 'test_neral_verified_fast_path_cpu.py' -v
      - name: Prospective never-inferred 100 exact golds and SHA-disjointness gate
        run: |
          python -B -m py_compile scripts/neral_prospective_100_cases.py
          python -B -m unittest discover -s tests -p 'test_neral_prospective_100_cpu.py' -v
      - name: Known six-case fast route smoke and pristine original corpus contracts
        run: |
          python -B -m py_compile scripts/neral_verified_fast_smoke.py
          python -B -m unittest discover -s tests -p 'test_neral_verified_fast_smoke_cpu.py' -v
      - name: Existing guard and production dual regression contracts
        run: |
          python -B -m unittest discover -s tests -p 'test_neral_tir_regression_guard.py' -v
          python -B -m unittest discover -s tests -p 'test_neral_dual_routing_product_api.py' -v
          python -B -m unittest discover -s tests -p 'test_neral_formatted_*.py' -v
