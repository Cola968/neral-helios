name: NERAL three-tier real RTX4070 local HF smoke
on:
  push:
    branches: [feat/neral-three-tier-local-live-20261117]
    paths:
      - '.github/workflows/neral-three-tier-gpu-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neral-qwen7b-r32-gpu-exclusive
  cancel-in-progress: false
jobs:
  cpu-route-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install targeted CPU test dependencies (no HF weights)
        run: python -m pip install --disable-pip-version-check pytest==8.4.2 Flask==3.1.3 z3-solver==4.16.0.0 sympy==1.14.0 networkx==3.6.1
      - name: Check syntax and real route / guard contracts
        run: |
          python -m py_compile neral_three_tier_runtime.py neral_preview_server.py scripts/neral_three_tier_gpu_smoke.py
          python -m pytest -q tests/test_neral_three_tier_api.py tests/test_neral_three_tier_runtime_inventory.py
          node --test tests/test_neral_three_tier_ui.cjs tests/test_neral_reference_ui.cjs
  rtx4070-three-tier-smoke:
    needs: cpu-route-contracts
    if: github.ref == 'refs/heads/feat/neral-three-tier-local-live-20261117' && github.event_name != 'pull_request'
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    env:
      HF_HOME: 'D:/neral-qlora-v2/hf-cache'
      HF_HUB_CACHE: 'D:/neral-qlora-v2/hf-cache/hub'
      HF_XET_CACHE: 'D:/neral-qlora-v2/hf-cache/xet'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - name: Check original local model snapshots, Docker and exclusively free RTX4070
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:GITHUB_WORKSPACE 'source'
          if((& git -C $src rev-parse HEAD).Trim() -ne $env:GITHUB_SHA){throw 'Source hash changed'}
          $py='D:/neral-qlora/venv/Scripts/python.exe'
          $base4='D:/neral-qlora-v2/qwen35-4b-hf'
          $base9='D:/neral-qlora/checkpoint'
          $full='D:/neral-qlora-v2/v2full-43931510428-1-helios'
          foreach($f in @($py,(Join-Path $base4 'model.safetensors.index.json'),(Join-Path $base9 'config.json'),
            (Join-Path $full 'manifest.json'),(Join-Path $full 'adapter/adapter_model.safetensors'))){
            if(-not(Test-Path -LiteralPath $f -PathType Leaf)){throw 'Frozen local model prerequisite absent'}
          }
          & cmd.exe /d /c 'docker info >NUL 2>&1'
          if($LASTEXITCODE -ne 0){throw 'Docker Desktop unavailable; no automatic start'}
          & docker image inspect python:3.11-alpine 1>$null
          if($LASTEXITCODE -ne 0){throw 'Required preinstalled Python sandbox image missing'}
          try{
            $loaded=Invoke-RestMethod -Uri 'http://127.0.0.1:11434/api/ps' -TimeoutSec 5
            if(@($loaded.models | Where-Object {$null -ne $_}).Count -gt 0){
              throw 'An existing Ollama model is loaded; preserve current work'
            }
          }catch{
            if($_.Exception.Message -like '*existing Ollama model*'){throw}
            Write-Host 'OLLAMA_LOCAL_API_UNAVAILABLE_NO_MODEL_UNLOAD_REQUESTED'
          }
          $g=@(& nvidia-smi --query-gpu=name,memory.total,memory.free --format=csv,noheader,nounits)
          if($LASTEXITCODE -ne 0 -or $g.Count -ne 1){throw 'RTX4070 unavailable'}
          $p=$g[0].Split(',')
          if($p.Count -ne 3 -or $p[0] -notmatch 'RTX 4070' -or [int]$p[2].Trim() -lt 9500){
            throw 'Insufficient GPU memory; existing workloads preserved'
          }
          Start-Sleep -Seconds 3
          $g2=@(& nvidia-smi --query-gpu=name,memory.total,memory.free --format=csv,noheader,nounits)
          $q=$g2[0].Split(',')
          if($LASTEXITCODE -ne 0 -or $g2.Count -ne 1 -or [int]$q[2].Trim() -lt 9500){
            throw 'VRAM no longer free; abort before model load'
          }
          $out=Join-Path $env:RUNNER_TEMP ('neral-three-tier-live-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT+'.json')
          $env:PYTHONPATH=$src
          $vars=@{TT_PY=$py;TT_SRC=$src;TT_BASE4=$base4;TT_BASE9=$base9;
                  TT_FULL=$full;TT_OUT=$out;PYTHONPATH=$src}
          foreach($entry in $vars.GetEnumerator()){
            [IO.File]::AppendAllText($env:GITHUB_ENV,($entry.Key+'='+[string]$entry.Value+[Environment]::NewLine),[Text.UTF8Encoding]::new($false))
          }
          Write-Host 'NERAL_THREE_TIER_GPU_EXCLUSIVE_PREFLIGHT_PASS'
      - name: Real sequential 4B Luna warm latency, 9B v2-full load, Python Docker and Z3
        timeout-minutes: 70
        run: |
          $ErrorActionPreference='Stop'
          Push-Location $env:TT_SRC
          try{
            & $env:TT_PY -B -m scripts.neral_three_tier_gpu_smoke --base4 $env:TT_BASE4 --base9 $env:TT_BASE9 --full $env:TT_FULL --out $env:TT_OUT
            if($LASTEXITCODE -ne 0){throw 'Actual 4B/9B GPU or source verifier smoke blocked'}
          }finally{Pop-Location}
      - name: Preserve only scalar report
        if: always() && env.TT_OUT != ''
        uses: actions/upload-artifact@v4
        with:
          name: neral-three-tier-real-rtx4070-${{ github.run_id }}
          path: ${{ env.TT_OUT }}
          retention-days: 14
          if-no-files-found: warn
