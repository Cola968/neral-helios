name: NERAL PR505 routing and parser diagnostics CPU
on:
  push:
    branches: [fix/neral-pr505-tir-cpu-routing-diagnostics-20261111]
permissions:
  contents: read
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-neral-preview.txt -r requirements-tests-turn0.txt
      - name: Turn-0 router and parser CPU tests
        run: python -B -m unittest discover -s tests -p test_neral_tir_turn0.py -v
      - name: Existing TIR behavior and sandbox contracts (mocked)
        run: python -B -m unittest discover -s tests -p test_neral_experimental_tir.py -v
      - name: Baseline TIR safety and telemetry
        run: python -B -m unittest discover -s tests -p test_neral_tir_observation.py -v
      - name: Structural routing and syntax
        run: python -B -m unittest discover -s tests -p test_neral_tir_structural.py -v
      - name: PR533 compound direct source and one-turn solver repair CPU
        run: python -B -m unittest discover -s tests -p test_neral_pr533_compound_controller_cpu.py -v
      - name: PR533 deeper singleton UNSAT and Expr diagnostics
        run: python -B -m unittest discover -s tests -p test_neral_pr533_deep_structure_cpu.py -v
      - name: PR533 first AST diff and minimal UNSAT core regression
        run: python -B -m unittest discover -s tests -p test_neral_pr533_unsat_core_ast_diff_cpu.py -v
      - name: PR533 model-relaxation and proven integer AST semantics CPU tests
        run: python -B -m unittest discover -s tests -p test_neral_pr533_unsat_semantic_cpu.py -v
      - name: PR533 UNSAT and structural AST fingerprint regression
        run: python -B -m unittest discover -s tests -p test_neral_pr533_structural_fingerprints.py -v
      - name: PR533 literal cardinality and AST equivalence regression
        run: python -B -m unittest discover -s tests -p test_neral_pr533_boolean_ast_gpu_regression.py -v
      - name: TIR12 CPU scoring regression
        run: python -B -m unittest discover -s tests -p test_neral_tir12_manual.py -v
