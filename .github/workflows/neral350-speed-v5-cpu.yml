name: Neral 350M Speed V5 CPU equivalence
on:
  push:
    branches: [experiment/speed-equivalence-v5]
    paths: ['frontier350/*v5*', 'tests/test_speed*v5.py', '.github/workflows/neral350-speed-v5-cpu.yml']
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.2.6
      - run: python -m unittest discover -s tests -p 'test_speed*v5.py' -v
