name: Model unit tests

on:
  pull_request:
    paths:
      - 'model.py'
      - 'model50.py'
      - 'config.py'
      - 'architectures.py'
      - 'train_instruct50.py'
      - 'train_raw_math50.py'
      - 'benchmark_v5_long_context.py'
      - 'tests/test_kv_cache.py'
      - 'tests/test_instruct50.py'
      - 'tests/test_benchmark_v5.py'
      - '.github/workflows/model-unit-tests.yml'

permissions:
  contents: read

jobs:
  model-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest numpy
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run cache instruction and v5 correctness tests
        run: python -m pytest tests/test_kv_cache.py tests/test_instruct50.py tests/test_benchmark_v5.py -q
