name: Neral NextGen V1 CUDA Graphs 50k A-B

on:
  push:
    branches: [experiment/nextgen-v1-isolated]
    paths: ['.github/workflows/neral-nextgen-v1-cudagraph-ab.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Separate concurrency from other Neral GPU workflows: no queued job eviction.
# Self-hosted single RTX4070 worker and independent idle/thermal/VRAM guard.
concurrency:
  group: neral-nextgen-v1-cudagraph-ab
  cancel-in-progress: false

jobs:
  matched-cudagraph-ab:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 35
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: Require all earlier Neral GPU experiments complete and RTX4070 idle
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          foreach($id in @(35069331704,35080263936,35084101942,35084877377,35085807321)){
            $r=Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/actions/runs/$id" -Headers $headers -Method Get -TimeoutSec 15
            if($r.status -ne 'completed'){throw "Previous GPU run $id still $($r.status); no contention"}
          }
          $gpu=(nvidia-smi --query-gpu=name --format=csv,noheader|Select-Object -First 1).Trim()
          $temp=[int]((nvidia-smi --query-gpu=temperature.gpu --format=csv,noheader,nounits|Select-Object -First 1).Trim())
          $free=[int]((nvidia-smi --query-gpu=memory.free --format=csv,noheader,nounits|Select-Object -First 1).Trim())
          if($gpu -notmatch 'RTX 4070' -or $temp -gt 78 -or $free -lt 9000){throw "GPU busy/unsafe: name=$gpu temp=$temp C free=$free MiB"}
          function W([string]$p){$f=[IO.Path]::GetFullPath($p); '/mnt/'+$f.Substring(0,1).ToLower()+'/'+$f.Substring(3).Replace('\','/')}
          "repo=$(W (Get-Location).Path)"|Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          exit 0

      - name: Validate unchanged 50k probe and shape safety tests
        run: |
          $ErrorActionPreference='Stop'; $repo='${{ steps.guard.outputs.repo }}'
          $cmd="set -e; cd '$repo'; ~/.venvs/neral-triton-py312/bin/python -m py_compile frontier350/nextgen_v1/probe.py; ~/.venvs/neral-triton-py312/bin/python -m unittest discover -v -s frontier350/nextgen_v1 -p test_probe_shape.py"
          wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0){throw 'Preflight shape tests failed'}
          exit 0

      - name: Batch 8 default-compile reference (matched)
        run: |
          $ErrorActionPreference='Stop'; $repo='${{ steps.guard.outputs.repo }}'
          $cmd="set -e; cd '$repo'; ~/.venvs/neral-triton-py312/bin/python -u frontier350/nextgen_v1/probe.py --execute --train-blocks 4 --execution compile-default --batch 8 --seq 512 --warmup 8 --steps 32 --out frontier350_nextgen_cuda_ab/default_b8.json"
          wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0){throw 'Batch8 reference failed: stop'}
          exit 0

      - name: Batch 8 reduce-overhead CUDA-graphs candidate
        run: |
          $ErrorActionPreference='Stop'; $repo='${{ steps.guard.outputs.repo }}'
          $cmd="set -e; cd '$repo'; ~/.venvs/neral-triton-py312/bin/python -u frontier350/nextgen_v1/probe.py --execute --train-blocks 4 --execution compile-overhead --batch 8 --seq 512 --warmup 8 --steps 32 --out frontier350_nextgen_cuda_ab/reduce_b8.json"
          wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0){throw 'Batch8 CUDA graphs failed or resource guard tripped; do NOT claim improvement'}
          exit 0

      - name: Batch 16 default-compile reference (matched)
        run: |
          $ErrorActionPreference='Stop'; $repo='${{ steps.guard.outputs.repo }}'
          $cmd="set -e; cd '$repo'; ~/.venvs/neral-triton-py312/bin/python -u frontier350/nextgen_v1/probe.py --execute --train-blocks 4 --execution compile-default --batch 16 --seq 512 --warmup 8 --steps 32 --out frontier350_nextgen_cuda_ab/default_b16.json"
          wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0){throw 'Batch16 reference failed: stop'}
          exit 0

      - name: Batch 16 reduce-overhead CUDA-graphs candidate
        run: |
          $ErrorActionPreference='Stop'; $repo='${{ steps.guard.outputs.repo }}'
          $cmd="set -e; cd '$repo'; ~/.venvs/neral-triton-py312/bin/python -u frontier350/nextgen_v1/probe.py --execute --train-blocks 4 --execution compile-overhead --batch 16 --seq 512 --warmup 8 --steps 32 --out frontier350_nextgen_cuda_ab/reduce_b16.json"
          wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0){throw 'Batch16 CUDA graphs failed or resource guard tripped; do NOT claim improvement'}
          exit 0

      - name: Upload independent, synthetic-only A-B JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neral-nextgen-v1-cudagraph-ab-${{ github.run_id }}
          path: frontier350_nextgen_cuda_ab/*.json
          if-no-files-found: warn
          retention-days: 30
