name: Post B3 reviewed stages

on:
  pull_request:
    paths:
      - 'summarize_weight_stage50.py'
      - 'rawmath_progress_gate50.py'
      - 'build_promotion_comparison50.py'
      - 'tests/test_post_b3_gates.py'
      - '.github/workflows/neral50m-rawmath-reviewed.yml'
      - '.github/workflows/neral50m-instruct-reviewed.yml'
      - '.github/workflows/post-b3-ci.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile post-B3 sources
        run: python -m py_compile summarize_weight_stage50.py rawmath_progress_gate50.py build_promotion_comparison50.py tests/test_post_b3_gates.py
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Test reviewed-stage gates
        run: python -m pytest tests/test_post_b3_gates.py -q
