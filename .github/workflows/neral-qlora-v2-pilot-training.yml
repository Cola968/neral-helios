name: NERAL QLoRA-v2 184 train / 32 val / 40 frozen test RTX4070 pilot

on:
  push:
    branches:
      - experiments/neral-1-2-qlora-v2-pilot-20261116
    paths:
      - 'scripts/neral_qlora_v2_pilot.py'
      - 'scripts/neral_qlora_v2_compare40.py'
      - 'tests/test_neral_qlora_v2_pilot.py'
      - '.github/workflows/neral-qlora-v2-pilot-training.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neral-qwen7b-r32-gpu-exclusive
  cancel-in-progress: false

jobs:
  cpu-dataset-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only test dependencies without any GPU model
        run: |
          python -m pip install pytest==8.4.2 sympy==1.14.0 networkx==3.6.1 z3-solver==4.16.0.0
      - name: Prove 184/32 separation, immutable SHA and evaluator refusal before freezing
        env:
          CUDA_VISIBLE_DEVICES: '-1'
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: python -m pytest -q tests/test_neral_qlora_v2_pilot.py

  gpu-pilot:
    needs: cpu-dataset-preflight
    if: github.ref == 'refs/heads/experiments/neral-1-2-qlora-v2-pilot-20261116' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      NERAL_PINNED_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          clean: true
          persist-credentials: false
      - name: Prove source, same Qwen3.5 checkpoint, v1 adapter, 184/32 split, D free space
        run: |
          $ErrorActionPreference = 'Stop'
          $src=Join-Path $env:GITHUB_WORKSPACE 'source'
          if((& git -C $src rev-parse HEAD).Trim() -ne $env:NERAL_PINNED_SOURCE_SHA){throw 'Source SHA mismatch'}
          $root='D:\neral-qlora'
          $checkpoint=Join-Path $root 'checkpoint'
          $v1=Join-Path $root 'full01/adapter'
          $new='D:\neral-qlora-v2'
          $pyCandidates=@(
            (Join-Path $root 'venv/Scripts/python.exe'),
            (Join-Path $env:USERPROFILE 'NERAL-QLoRA-Research/training-env-py312/Scripts/python.exe')
          )
          $py=$pyCandidates|Where-Object {Test-Path -LiteralPath $_ -PathType Leaf}|Select-Object -First 1
          if(-not $py){throw 'Pinned training Python missing'}
          if(-not(Test-Path -LiteralPath (Join-Path $checkpoint 'config.json') -PathType Leaf)){throw 'Local Qwen3.5-9B HF checkpoint missing'}
          if(-not(Test-Path -LiteralPath (Join-Path $v1 'adapter_config.json') -PathType Leaf)){throw 'Historic QLoRA v1 PEFT adapter missing'}
          $space=(Get-PSDrive -Name D).Free
          if($space -lt 8GB){throw 'Insufficient D: free storage for new isolated adapter'}
          $train=Join-Path $src 'datasets/neral_cpu_foundation/helios_terra_v2.jsonl'
          $val=Join-Path $src 'datasets/neral_cpu_foundation/helios_terra_v2.val.jsonl'
          $test=Join-Path $src 'datasets/neral_cpu_foundation/helios_terra_v2.test.jsonl'
          $runName=('qlora-v2-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
          $smoke=Join-Path $new ($runName+'-smoke')
          $full=Join-Path $new ($runName+'-full')
          if(Test-Path -LiteralPath $smoke){throw 'Smoke output exists'}
          if(Test-Path -LiteralPath $full){throw 'Full training output exists'}
          $env:PYTHONPATH=$src
          Push-Location $src
          try {
            & $py -B -m scripts.neral_qlora_v2_pilot --train $train --val $val --checkpoint $checkpoint --out $full --epochs 2 --context 2048 --check-only
            if($LASTEXITCODE -ne 0){throw 'TRAIN_VAL_PIN_OR_LEAK_CHECK_FAILED'}
          } finally {Pop-Location}
          if(-not(Test-Path -LiteralPath $new -PathType Container)){New-Item -ItemType Directory -Path $new -ErrorAction Stop | Out-Null}
          [IO.File]::AppendAllText($env:GITHUB_ENV,('V2_PY='+$py+[Environment]::NewLine+'V2_SOURCE='+$src+[Environment]::NewLine+'V2_CHECKPOINT='+$checkpoint+[Environment]::NewLine+'V2_V1='+$v1+[Environment]::NewLine+'V2_TRAIN='+$train+[Environment]::NewLine+'V2_VAL='+$val+[Environment]::NewLine+'V2_TEST='+$test+[Environment]::NewLine+'V2_SMOKE='+$smoke+[Environment]::NewLine+'V2_FULL='+$full+[Environment]::NewLine+'PYTHONPATH='+$src+[Environment]::NewLine),[Text.UTF8Encoding]::new($false))
          Write-Host 'QLORA_V2_SOURCE_AND_SPLITS_VERIFIED; test corpus unopened'

      - name: Stop resident Ollama models and verify free 12GB-class VRAM before PyTorch
        run: |
          $ErrorActionPreference='Stop'
          $ps=Invoke-RestMethod -Uri 'http://127.0.0.1:11434/api/ps' -Method Get -TimeoutSec 15
          $exe=Join-Path $env:LOCALAPPDATA 'Programs/Ollama/ollama.exe'
          if(-not(Test-Path -LiteralPath $exe -PathType Leaf)){
            $found=Get-Command ollama -ErrorAction Stop
            $exe=$found.Source
          }
          foreach($entry in @($ps.models)){
            if($entry -and $entry.name){
              Write-Host ('STOP_OLLAMA_MODEL '+$entry.name)
              & $exe stop $entry.name
              if($LASTEXITCODE -ne 0){throw 'Cannot unload local Ollama model'}
            }
          }
          Start-Sleep -Seconds 8
          $ps2=Invoke-RestMethod -Uri 'http://127.0.0.1:11434/api/ps' -Method Get -TimeoutSec 15
          if($null -ne $ps2.models -and @($ps2.models).Count -gt 0){throw 'Ollama still holds a GPU model'}
          $gpu=@(& nvidia-smi --query-gpu=name,memory.total,memory.free --format=csv,noheader,nounits)
          if($LASTEXITCODE -ne 0 -or $gpu.Count -ne 1){throw 'GPU inventory invalid'}
          Write-Host ('GPU_AFTER_OLLAMA_STOP '+$gpu[0])
          $parts=$gpu[0].Split(',')
          if($parts[0] -notmatch 'RTX 4070' -or [int]$parts[1].Trim() -lt 12000 -or [int]$parts[2].Trim() -lt 10000){
            throw 'RTX4070 12GB insufficient free VRAM; do not train'
          }

      - name: QLoRA-v2 one optimizer-step live GPU smoke – no test data
        run: |
          $ErrorActionPreference='Stop'
          Push-Location $env:V2_SOURCE
          try {
            & $env:V2_PY -B -m scripts.neral_qlora_v2_pilot --train $env:V2_TRAIN --val $env:V2_VAL --checkpoint $env:V2_CHECKPOINT --out $env:V2_SMOKE --epochs 2 --context 2048 --max-steps 1
            if($LASTEXITCODE -ne 0){throw 'One-step RTX4070 QLoRA-v2 smoke failed'}
            $m=Get-Content -LiteralPath (Join-Path $env:V2_SMOKE 'manifest.json') -Raw | ConvertFrom-Json
            if($m.optimizer_steps -ne 1 -or $m.test_rows_opened -ne 0){throw 'Smoke optimizer or test-isolation failure'}
          } finally {Pop-Location}
      - name: Two full QLoRA-v2 epochs – validation every epoch, freeze best adapter
        run: |
          $ErrorActionPreference='Stop'
          Push-Location $env:V2_SOURCE
          try {
            & $env:V2_PY -B -m scripts.neral_qlora_v2_pilot --train $env:V2_TRAIN --val $env:V2_VAL --checkpoint $env:V2_CHECKPOINT --out $env:V2_FULL --epochs 2 --context 2048
            if($LASTEXITCODE -ne 0){throw 'Two-epoch training did not finish'}
            $m=Get-Content -LiteralPath (Join-Path $env:V2_FULL 'manifest.json') -Raw | ConvertFrom-Json
            if($m.status -ne 'frozen_adapter_ready_for_heldout_comparison' -or $m.optimizer_steps -ne 46 -or $m.train_rows -ne 184 -or $m.val_rows -ne 32 -or $m.test_rows_opened -ne 0 -or $m.validation_history.Count -ne 2){throw 'Frozen adapter certification failed'}
          } finally {Pop-Location}
      - name: After frozen v2, evaluate 40-case split fairly against existing v1 PEFT
        run: |
          $ErrorActionPreference='Stop'
          Push-Location $env:V2_SOURCE
          try {
            & $env:V2_PY -B -m scripts.neral_qlora_v2_compare40 --trained $env:V2_FULL --v1 $env:V2_V1 --checkpoint $env:V2_CHECKPOINT --test $env:V2_TEST --train $env:V2_TRAIN --val $env:V2_VAL --out (Join-Path $env:V2_FULL 'comparison40.json')
            if($LASTEXITCODE -ne 0){throw 'Frozen 40-case comparison failed'}
          } finally {Pop-Location}
      - name: Publish scalar manifests and 40-case metrics only – NEVER weights or cases
        if: always() && env.V2_FULL != ''
        uses: actions/upload-artifact@v4
        with:
          name: neral-v2-training-and-comparison-${{ github.run_id }}
          path: |
            ${{ env.V2_SMOKE }}/manifest.json
            ${{ env.V2_FULL }}/manifest.json
            ${{ env.V2_FULL }}/comparison40.json
          if-no-files-found: warn
          retention-days: 30
