name: NERAL Autonomous Agent Core CI
on:
  push:
    branches: [plan/neral-autonomy-28d-20261027]
  pull_request:
    paths:
      - neral_dev_agent.py
      - tests/test_neral_dev_agent.py
      - .github/workflows/neral-dev-agent-ci.yml
permissions:
  contents: read
jobs:
  bounded-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Task continuation without network or paid inference
        run: python -m unittest tests.test_neral_dev_agent -v
      - name: Compile standalone state machine
        run: python -m py_compile neral_dev_agent.py
