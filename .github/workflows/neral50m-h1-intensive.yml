name: Neral 50M H1 1B-token Intensive

on:
  push:
    branches:
      - h1-train-run
    paths:
      - 'h1_requests/request.json'

permissions:
  contents: read

concurrency:
  group: neral-gpu-exclusive-training
  cancel-in-progress: false

jobs:
  h1:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 900
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        working-directory: src

    steps:
      - name: Checkout trusted H1 code from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: src
          clean: true
          persist-credentials: false

      - name: Checkout authorization request only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: requestsrc
          clean: true
          fetch-depth: 2
          persist-credentials: false

      - name: Validate exact authorization and RTX environment
        id: env
        run: |
          $ErrorActionPreference='Stop'
          if('${{ github.ref_name }}' -ne 'h1-train-run'){throw 'Untrusted H1 branch.'}
          $requestPath=Join-Path '..\requestsrc' 'h1_requests\request.json'
          if(-not(Test-Path $requestPath -PathType Leaf)){throw 'H1 request missing.'}
          $r=Get-Content $requestPath -Raw|ConvertFrom-Json
          $props=@($r.PSObject.Properties.Name|Sort-Object)
          if(($props -join ',') -ne 'action,request_id,version'){throw 'Unsupported request fields.'}
          if([int]$r.version -ne 1 -or $r.action -ne 'train_h1_1b'){throw 'Unsupported H1 request.'}
          if($r.request_id -notmatch '^[A-Za-z0-9._-]{1,64}$'){throw 'Invalid request_id.'}
          $changed=git -C ..\requestsrc diff-tree --no-commit-id --name-only -r '${{ github.sha }}'
          if(($changed|Measure-Object).Count -ne 1 -or $changed -ne 'h1_requests/request.json'){throw 'Authorization commit may change only the H1 request file.'}
          $verifiedAssets='C:\Users\astad\Documents\Codex\2026-09-05\lo\outputs\neral'
          $verifiedPython='C:\Users\astad\Documents\Codex\2026-09-05\lo\outputs\neral\.venv\Scripts\python.exe'
          $assets=if($env:NERAL_ASSETS_ROOT){$env:NERAL_ASSETS_ROOT}else{$verifiedAssets}
          $python=if($env:NERAL_PYTHON){$env:NERAL_PYTHON}else{$verifiedPython}
          if(-not(Test-Path $assets -PathType Container)){throw "Assets missing: $assets"}
          if(-not(Test-Path $python -PathType Leaf)){throw "Python missing: $python"}
          if($env:NERAL_TRACKIO_SPACE_ID -and -not $env:HF_TOKEN){throw 'HF_TOKEN is required when NERAL_TRACKIO_SPACE_ID is configured.'}
          & $python -c "import torch; assert torch.cuda.is_available() and torch.cuda.is_bf16_supported(); print(torch.__version__); print(torch.version.cuda); print(torch.cuda.get_device_name(0))"
          if($LASTEXITCODE -ne 0){throw 'CUDA/BF16 validation failed.'}
          "assets=$assets" >> $env:GITHUB_OUTPUT
          "python=$python" >> $env:GITHUB_OUTPUT
          nvidia-smi --query-gpu=name,driver_version,memory.total,memory.free,temperature.gpu,power.draw --format=csv,noheader

      - name: Run intensive H1 campaign with optional Trackio bridge
        run: |
          $ErrorActionPreference='Stop'
          $env:PYTHONUNBUFFERED='1'
          $assets='${{ steps.env.outputs.assets }}'
          $python='${{ steps.env.outputs.python }}'
          New-Item -ItemType Directory -Force 'h1_reports'|Out-Null
          if($env:NERAL_TRACKIO_ENABLED -eq '1'){
            & $python -m pip install --disable-pip-version-check trackio
            if($LASTEXITCODE -ne 0){throw 'Trackio install failed.'}
          }
          $cmd=@($python,'-u','-X','utf8','run_50m_h1_intensive.py','--assets',$assets,'--reports','h1_reports')
          & $python -u -X utf8 trackio_bridge50.py --assets $assets --telemetry-dir 'h1_reports\telemetry' --run-name ("neral50-h1-"+$env:GITHUB_RUN_ID) -- @cmd
          if($LASTEXITCODE -ne 0){throw 'H1 intensive campaign failed.'}

      - name: Reject private checkpoint or corpus uploads
        if: always()
        run: |
          if(Test-Path h1_reports){
            $bad=Get-ChildItem h1_reports -Recurse -File|Where-Object{$_.Extension -in '.pt','.pth','.bin','.safetensors','.parquet','.gz'}
            if($bad){throw 'Private model/corpus found in H1 upload directory.'}
          }

      - name: Persist H1 reports locally
        if: always()
        run: |
          $assets='${{ steps.env.outputs.assets }}'
          if(-not $assets){exit 0}
          $dest=Join-Path $assets ('reports\runner_50m_h1_'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force $dest|Out-Null
          if(Test-Path h1_reports){Copy-Item h1_reports\* $dest -Recurse -Force}
          Write-Host "Persisted H1 reports to $dest"

      - name: Upload reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neral-50m-h1-${{ github.run_id }}
          path: src/h1_reports/
          if-no-files-found: warn
          retention-days: 14
