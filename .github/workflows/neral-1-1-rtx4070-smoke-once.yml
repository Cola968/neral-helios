name: NERAL 1.1 safe proposal parser + unique logic RTX4070 same ten
on:
  push:
    branches: [verify/neral-1-1-ast-unique-format-rerun2-20261115]
    paths: [smoke_requests/neral_1_1_gpu_once.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: neral-1-1-ast-format-retest10
  cancel-in-progress: false

jobs:
  independent-cpu-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: '-1'
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fbc6d30d7645f2621d1cda17b0226fba2b162e98
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: review
          persist-credentials: false
      - name: Pin and one-shot request check, without GPU
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = 'fbc6d30d7645f2621d1cda17b0226fba2b162e98'
          python - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path('review/smoke_requests/neral_1_1_gpu_once.json').read_text(encoding='utf8'))
          assert r=={
              'authorization':'NERAL_1_1_AST_UNIQUE_BOUNDED_RTX4070_TEN_ONCE',
              'source_commit':'fbc6d30d7645f2621d1cda17b0226fba2b162e98',
              'case_count':10,'no_blind100_access':True,'no_training':True,
              'no_merge':True,'one_shot':True}
          print('PINNED_SYNTHETIC_ONE_SHOT_AUTHORIZATION_VERIFIED')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU proof dependencies only
        run: python -m pip install --disable-pip-version-check 'z3-solver>=4.13,<5' 'jsonschema>=4.20,<5' 'Flask>=3,<4'
      - name: Compile and CPU preflight eight new inputs
        env:
          PYTHONPATH: ${{ github.workspace }}/source
        run: |
          python -B -m py_compile review/review/neral_1_1_smoke_gpu.py source/neral_adaptive_planner.py
          python -B review/review/neral_1_1_smoke_gpu.py --preflight --authorize NERAL_1_1_AST_UNIQUE_BOUNDED_RTX4070_TEN_ONCE
      - name: Regress existing NERAL 1.1 controller, HTTP and source verifier
        env:
          PYTHONPATH: ${{ github.workspace }}/source
        run: |
          cd source
          python -B -m unittest discover -s tests -p test_neral_adaptive_planner.py -v
          python -B -m unittest discover -s tests -p test_neral_python_logic_verifier.py -v
          python -B -m unittest discover -s tests -p test_neral_adaptive_think_http.py -v

  real-rtx4070-smoke:
    needs: independent-cpu-preflight
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      WANDB_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fbc6d30d7645f2621d1cda17b0226fba2b162e98
          path: source
          persist-credentials: false
          clean: true
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: review
          persist-credentials: false
          clean: true
      - name: Verify original source, authorization, CPU dependencies, existing local Python
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:GITHUB_WORKSPACE 'source'
          $rev=Join-Path $env:GITHUB_WORKSPACE 'review'
          $r=Get-Content -LiteralPath (Join-Path $rev 'smoke_requests\neral_1_1_gpu_once.json') -Raw|ConvertFrom-Json
          if((& git -C $src rev-parse HEAD).Trim() -ne 'fbc6d30d7645f2621d1cda17b0226fba2b162e98'){throw 'Original source SHA changed'}
          if($r.authorization -ne 'NERAL_1_1_AST_UNIQUE_BOUNDED_RTX4070_TEN_ONCE' -or
             $r.source_commit -ne 'fbc6d30d7645f2621d1cda17b0226fba2b162e98' -or
             $r.case_count -ne 10 -or $r.no_blind100_access -ne $true -or
             $r.no_training -ne $true -or $r.no_merge -ne $true -or
             $r.one_shot -ne $true){throw 'Invalid one-shot request'}
          $defaultPy=Join-Path $env:USERPROFILE 'NERAL-QLoRA-Research\training-env-py312\Scripts\python.exe'
          $py=if($env:NERAL_PYTHON){$env:NERAL_PYTHON}else{$defaultPy}
          if(-not(Test-Path -LiteralPath $py -PathType Leaf)){throw 'Pre-existing Python missing; no install permitted'}
          # Lightweight isolated CPU dependencies: no Torch/model reinstall,
          # no mutation of the existing training environment or blind datasets.
          $deps=Join-Path $env:RUNNER_TEMP ('neral-smoke-deps-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $deps){throw 'Occupied dependency output path'}
          [IO.File]::AppendAllText($env:GITHUB_ENV,('NERAL_SMOKE_DEPS='+$deps+[Environment]::NewLine),[Text.UTF8Encoding]::new($false))
          & $py -B -m pip install --disable-pip-version-check --no-input --no-cache-dir --target $deps 'Flask>=3,<4' 'z3-solver>=4.13,<5' 'jsonschema>=4.20,<5'
          if($LASTEXITCODE -ne 0){throw 'Isolated minimal Python dependency install failed'}
          $env:PYTHONPATH=$src+';'+$deps
          & $py -B -c 'import flask,z3,jsonschema'
          if($LASTEXITCODE -ne 0){throw 'Isolated Python import check failed'}
          Write-Host 'ISOLATED_CPU_DEPS_OK'
          & $py -B (Join-Path $rev 'review\neral_1_1_smoke_gpu.py') --preflight --authorize NERAL_1_1_AST_UNIQUE_BOUNDED_RTX4070_TEN_ONCE
          if($LASTEXITCODE -ne 0){throw 'Local CPU preflight failed'}
          $root=if($env:NERAL_EVIDENCE_ROOT){$env:NERAL_EVIDENCE_ROOT}else{Join-Path $env:USERPROFILE 'NERAL-Smoke-Evidence'}
          if(-not(Test-Path -LiteralPath $root)){New-Item -ItemType Directory -Path $root -Force|Out-Null}
          $out=Join-Path $root ('neral-1-1-ast-unique-retest-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $out){throw 'Refuse occupied evidence output path'}
          [IO.File]::AppendAllText($env:GITHUB_ENV,(
             'NERAL_SMOKE_PY='+$py+[Environment]::NewLine+
             'NERAL_SMOKE_SRC='+$src+[Environment]::NewLine+
             'NERAL_SMOKE_REVIEW='+$rev+[Environment]::NewLine+
             'NERAL_SMOKE_OUT='+$out+[Environment]::NewLine+
             'NERAL_SMOKE_DEPS='+$deps+[Environment]::NewLine+
             'PYTHONPATH='+$env:PYTHONPATH+[Environment]::NewLine),[Text.UTF8Encoding]::new($false))
          Write-Host 'IMMUTABLE_PIN_OK; no 100-case data opened'
      - name: Assert real RTX4070, start existing Docker Desktop if required
        run: |
          $ErrorActionPreference='Stop'
          $gpu=& nvidia-smi --query-gpu=name --format=csv,noheader
          if($LASTEXITCODE -ne 0 -or ($gpu -join ' ') -notmatch 'RTX 4070'){throw 'No RTX4070'}
          function DockerReady {
            $old=$ErrorActionPreference;$ErrorActionPreference='Continue'
            try { $null=& docker info --format '{{.ServerVersion}}' 2>$null; return ($LASTEXITCODE -eq 0)}
            catch {return $false} finally {$ErrorActionPreference=$old}
          }
          if(-not(DockerReady)){
            $exe=Join-Path $env:LOCALAPPDATA 'Programs\DockerDesktop\Docker Desktop.exe'
            if(-not(Test-Path -LiteralPath $exe)){throw 'No Docker Desktop'}
            Start-Process -FilePath $exe -ErrorAction Stop
            for($i=0;$i -lt 30;$i++){if(DockerReady){break};Start-Sleep -Seconds 4}
          }
          if(-not(DockerReady)){throw 'Docker daemon unavailable'}
          & docker image inspect python:3.11-alpine | Out-Null
          if($LASTEXITCODE -ne 0){throw 'Preinstalled Python sandbox image missing'}
          Write-Host 'REAL_RTX4070_DOCKER_PREINSTALLED_READY'
      - name: Execute exactly eight real local Ollama + Docker cases, preserve raw replies
        run: |
          $ErrorActionPreference='Stop'
          Push-Location $env:NERAL_SMOKE_SRC
          try {
            & $env:NERAL_SMOKE_PY -B (Join-Path $env:NERAL_SMOKE_REVIEW 'review\neral_1_1_smoke_gpu.py') --live --authorize NERAL_1_1_AST_UNIQUE_BOUNDED_RTX4070_TEN_ONCE --out $env:NERAL_SMOKE_OUT
            if($LASTEXITCODE -ne 0){throw 'Incomplete smoke: preserve any evidence'}
          } finally {Pop-Location}
      - name: Assert 8 original cases and no mutation to original source checkout
        run: |
          $ErrorActionPreference='Stop'
          $env:NERAL_SMOKE_ROOT=$env:NERAL_SMOKE_OUT
          @'
          import json,os,pathlib
          root=pathlib.Path(os.environ["NERAL_SMOKE_ROOT"])
          summary=json.loads((root/"summary.json").read_text(encoding="utf8"))
          assert summary["case_count"]==10
          assert len(list(root.glob("s??-*.json")))==10
          print("TEN_RAW_CASE_FILES_VERIFIED")
          '@ | & $env:NERAL_SMOKE_PY -B -
          if($LASTEXITCODE -ne 0){throw 'Evidence count failed'}
          if((@(& git -C $env:NERAL_SMOKE_SRC status --porcelain)).Count -ne 0){throw 'Pinned source modified'}
      - name: Upload original raw QLoRA packets, Docker traces, Qwen and proofs
        if: always() && env.NERAL_SMOKE_OUT != ''
        uses: actions/upload-artifact@v4
        with:
          name: neral-1-1-ast-format-raw10-${{ github.run_id }}
          path: ${{ env.NERAL_SMOKE_OUT }}
          if-no-files-found: warn
          retention-days: 90
      - name: Redownload original artifact
        if: success()
        uses: actions/download-artifact@v4
        with:
          name: neral-1-1-ast-format-raw10-${{ github.run_id }}
          path: ${{ runner.temp }}/neral-1-1-verify-${{ github.run_id }}
      - name: Verify downloaded bytes equal local originals
        if: success()
        run: |
          $ErrorActionPreference='Stop'
          $env:NERAL_SMOKE_REMOTE=Join-Path $env:RUNNER_TEMP ('neral-1-1-verify-'+$env:GITHUB_RUN_ID)
          @'
          import hashlib,os,pathlib
          a=pathlib.Path(os.environ["NERAL_SMOKE_OUT"])
          b=pathlib.Path(os.environ["NERAL_SMOKE_REMOTE"])
          names={p.name for p in a.iterdir() if p.is_file()}
          assert len(names)==12 and 'summary.json' in names and 'manifest.json' in names
          assert names=={p.name for p in b.iterdir() if p.is_file()}
          for name in names:
              assert hashlib.sha256((a/name).read_bytes()).digest()==hashlib.sha256((b/name).read_bytes()).digest()
          print('REUPLOADED_GITHUB_RAW_EVIDENCE_VERIFIED; NO_MERGE_NO_TRAINING')
          '@ | & $env:NERAL_SMOKE_PY -B -
          if($LASTEXITCODE -ne 0){throw 'Artifact bytes differed'}

      - name: Cleanup isolated CPU-only pip dependencies
        if: always() && env.NERAL_SMOKE_DEPS != ''
        run: |
          $ErrorActionPreference='Continue'
          if(Test-Path -LiteralPath $env:NERAL_SMOKE_DEPS){
            Remove-Item -LiteralPath $env:NERAL_SMOKE_DEPS -Recurse -Force -ErrorAction SilentlyContinue
          }
