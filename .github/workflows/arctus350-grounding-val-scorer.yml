name: Arctus350 grounding VAL scorer CPU
on:
  push:
    branches: [research/arctus350-grounding-val-scorer-20261029]
  pull_request:
    paths:
      - 'frontier350/arctus350_grounding_val_scorer.py'
      - 'tests/test_arctus350_grounding_val_scorer.py'
      - 'frontier350/arctus350_grounding_curriculum_v1.py'
      - '.github/workflows/arctus350-grounding-val-scorer.yml'
permissions:
  contents: read
jobs:
  offline-val:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify strict VAL-only scoring without weights
        run: python -m unittest tests.test_arctus350_grounding_val_scorer tests.test_arctus350_grounding_curriculum_v1 -v
      - name: Python syntax
        run: python -m py_compile frontier350/arctus350_grounding_val_scorer.py tests/test_arctus350_grounding_val_scorer.py
