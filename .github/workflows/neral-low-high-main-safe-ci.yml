name: NERAL LOW HIGH safe integration with current preview
on:
  pull_request:
    paths:
      - 'neral_think.py'
      - 'neral_local_chat_api.py'
      - 'neral_agent_autonomy.py'
      - 'static/neral-preview.js'
      - 'templates/neral_preview.html'
      - 'tests/test_neral_low_high_main_merge.py'
      - 'scripts/neral_low_high_quality.py'
      - 'tests/test_neral_low_high_quality.py'
      - 'docs/NERAL_LOW_HIGH_QUALITY_GATE.md'
      - 'tests/test_neral_1_0_high_depth.py'
      - 'tests/test_neral_high_response_format.py'
      - '.github/workflows/neral-low-high-main-safe-ci.yml'
  push:
    branches: [main]
    paths:
      - 'neral_think.py'
      - 'neral_local_chat_api.py'
      - 'neral_agent_autonomy.py'
      - 'static/neral-preview.js'
      - 'templates/neral_preview.html'
      - 'tests/test_neral_low_high_main_merge.py'
      - 'scripts/neral_low_high_quality.py'
      - 'tests/test_neral_low_high_quality.py'
      - 'docs/NERAL_LOW_HIGH_QUALITY_GATE.md'
      - 'tests/test_neral_1_0_high_depth.py'
      - 'tests/test_neral_high_response_format.py'
      - '.github/workflows/neral-low-high-main-safe-ci.yml'
permissions:
  contents: read
jobs:
  low-high:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated preview dependencies for HTTP contracts
        run: python -m pip install -r requirements-neral-preview.txt
      - name: LOW/HIGH on current main without losing plugins
        run: python -m unittest discover -s tests -p test_neral_low_high_main_merge.py -v
      - name: Regression - identity and no stale HIGH context
        run: python -m unittest discover -s tests -p test_neral_chat_stale_context.py -v
      - name: Existing legacy THINK contracts unchanged
        run: python -m unittest discover -s tests -p test_neral_think.py -v
      - name: Existing HTTP THINK adapter contracts unchanged
        run: python -m unittest discover -s tests -p test_neral_think_api.py -v
      - name: HIGH review contract
        run: python -m unittest discover -s tests -p test_neral_1_0_high_depth.py -v
      - name: HIGH never destroys explicit code or JSON
        run: python -m unittest discover -s tests -p test_neral_high_response_format.py -v
      - name: Paired LOW/HIGH development scoring with provenance guard
        run: python -m unittest discover -s tests -p test_neral_low_high_quality.py -v
      - name: Existing standalone release and preview plugin contracts unchanged
        run: python -m unittest discover -s tests -p test_neral_1_0_voice_plugins.py -v
      - name: Browser JS and frontend multi-tool regressions
        run: |
          node --check static/neral-preview.js
          node --test tests/test_neral_chat_search_relevance.cjs
          node --test tests/test_neral_chat_markdown.cjs
          node --test tests/test_neral_1_0_voice_client.cjs tests/test_neral_1_0_project_files.cjs tests/test_neral_1_0_preview_history.cjs tests/test_neral_1_0_preview_cancel_v2.cjs
