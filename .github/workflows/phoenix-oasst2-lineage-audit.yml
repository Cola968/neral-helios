name: Phoenix full OASST2 human-pair lineage audit (read only)
on:
  push:
    branches: [experiment/phoenix-sft-fp32-audit]
    paths: ['.github/workflows/phoenix-oasst2-lineage-audit.yml']
permissions:
  contents: read
concurrency:
  group: neral-nextgen-local-gpu-training
  cancel-in-progress: false
jobs:
  inspect-all-source-metadata:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 12
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - name: Verify pinned gzip and inspect every message without exporting contents
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = 'pinned_archive'
          $file = $null; $gzip = $null; $reader = $null
          try {
            $root = if ($env:NERAL_ASSETS_ROOT) { $env:NERAL_ASSETS_ROOT } else { Join-Path $env:USERPROFILE 'Documents\Codex\2026-09-05\lo\outputs\neral' }
            $archive = Join-Path $root 'sft50_sources\2023-11-05_oasst2_ready.messages.jsonl.gz'
            if (!(Test-Path -LiteralPath $archive -PathType Leaf)) { throw 'Missing pinned source' }
            $item = Get-Item -LiteralPath $archive -Force
            if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or $item.Length -ne 54301900) { throw 'Wrong source size or link' }
            if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'a9f240c4c77aa1378364f70d37e753c07ba284e247b019d700e1947a0e5da751') { throw 'Wrong source digest' }
            $stage = 'parse_all_message_metadata'
            $messages = New-Object 'System.Collections.Generic.Dictionary[string,object]' ([StringComparer]::Ordinal)
            $file = [IO.File]::Open($archive, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::Read)
            $gzip = [IO.Compression.GZipStream]::new($file, [IO.Compression.CompressionMode]::Decompress)
            $reader = [IO.StreamReader]::new($gzip, [Text.Encoding]::UTF8)
            $lines = 0; $blank = 0; $overlongLine = 0; $duplicateIds = 0; $invalidIds = 0; $missingTree = 0; $invalidRank = 0
            while (($line = $reader.ReadLine()) -ne $null) {
              $lines++
              if ($lines -gt 200000) { throw 'Bridge message count bound exceeded' }
              if ($line.Length -gt 120000) { $overlongLine++; continue }
              if (!$line.Trim()) { $blank++; continue }
              $row = ConvertFrom-Json -InputObject $line -ErrorAction Stop
              $id = $row.message_id
              if (!($id -is [string]) -or !$id.Trim()) { $invalidIds++; continue }
              if ($messages.ContainsKey($id)) { $duplicateIds++; continue }
              $tree = if ($row.message_tree_id -is [string]) { $row.message_tree_id } else { '' }
              if (!$tree.Trim()) { $missingTree++ }
              $text = $row.text
              $usableText = ($text -is [string] -and $text.Trim().Length -gt 0)
              $length = if ($text -is [string]) { $text.Trim().Length } else { 0 }
              $human = (($row.deleted -ne $true) -and ($row.synthetic -is [bool]) -and ($row.synthetic -eq $false) -and ($row.review_result -is [bool]) -and ($row.review_result -eq $true) -and !$row.model_name)
              $rankOk = $true
              if ($null -ne $row.rank) { try { $parsedRank = [int]::Parse([string]$row.rank, [Globalization.NumberStyles]::Integer, [Globalization.CultureInfo]::InvariantCulture) } catch { $rankOk = $false } }
              if (!$rankOk) { $invalidRank++ }
              # Only structural metadata, language and lengths are retained, never dialog text.
              $messages.Add($id, [pscustomobject]@{ role = [string]$row.role; lang = [string]$row.lang; tree = $tree; parent = [string]$row.parent_id; human = [bool]$human; usable = [bool]$usableText; length = [int]$length; rank_ok = [bool]$rankOk })
            }
            if ($reader) { $reader.Dispose(); $reader = $null }
            if ($gzip) { $gzip.Dispose(); $gzip = $null }
            if ($file) { $file.Dispose(); $file = $null }
            $stage = 'resolve_all_eligible_parent_links'
            $candidate = @{ de = 0; en = 0 }; $eligible = @{ de = 0; en = 0 }; $parents = @{ de = (New-Object 'System.Collections.Generic.HashSet[string]'); en = (New-Object 'System.Collections.Generic.HashSet[string]') }
            $trees = @{ de = (New-Object 'System.Collections.Generic.HashSet[string]'); en = (New-Object 'System.Collections.Generic.HashSet[string]') }
            $missingParent = 0; $wrongParentRoleOrLang = 0; $unreviewedParent = 0; $treeMismatch = 0; $emptyOrOverlong = 0; $badSelectedRank = 0
            foreach ($entry in $messages.Values) {
              if ($entry.role -cne 'assistant' -or !($entry.lang -ceq 'de' -or $entry.lang -ceq 'en') -or !$entry.human) { continue }
              $lang = $entry.lang
              $candidate[$lang]++
              if (!$messages.ContainsKey($entry.parent)) { $missingParent++; continue }
              $parent = $messages[$entry.parent]
              if ($parent.role -cne 'prompter' -or $parent.lang -cne $lang) { $wrongParentRoleOrLang++; continue }
              if (!$parent.human) { $unreviewedParent++; continue }
              if (!$entry.tree -or $entry.tree -cne $parent.tree) { $treeMismatch++; continue }
              if (!$entry.usable -or !$parent.usable -or $entry.length -gt 8192 -or $parent.length -gt 8192) { $emptyOrOverlong++; continue }
              if (!$entry.rank_ok) { $badSelectedRank++; continue }
              $eligible[$lang]++
              [void]$parents[$lang].Add($entry.parent)
              [void]$trees[$lang].Add($entry.tree)
            }
            $safe = ($lines -gt 0 -and $blank -eq 0 -and $overlongLine -eq 0 -and $invalidIds -eq 0 -and $duplicateIds -eq 0 -and $missingTree -eq 0 -and $treeMismatch -eq 0 -and $badSelectedRank -eq 0 -and $parents['de'].Count -ge 50 -and $parents['en'].Count -ge 50)
            $report = [ordered]@{
              status = $(if ($safe) { 'lineage_metadata_pass_not_approved' } else { 'lineage_metadata_blocked' })
              archive_sha256_match = $true
              total_raw_messages = $lines
              unique_message_ids = $messages.Count
              blank_lines = $blank
              oversized_json_lines = $overlongLine
              invalid_message_ids = $invalidIds
              duplicate_message_ids = $duplicateIds
              missing_message_tree_ids = $missingTree
              assistant_reviewed_human_candidates = $candidate
              eligible_human_parent_child_pairs_before_best_rank_and_dedup = $eligible
              distinct_eligible_prompter_message_ids = @{de=$parents['de'].Count;en=$parents['en'].Count}
              distinct_eligible_conversation_trees_by_lang = @{de=$trees['de'].Count;en=$trees['en'].Count}
              missing_parent_ids = $missingParent
              wrong_parent_role_or_lang = $wrongParentRoleOrLang
              unreviewed_parents = $unreviewedParent
              tree_mismatch_or_missing_in_candidates = $treeMismatch
              empty_or_overlong_pair_text = $emptyOrOverlong
              invalid_rank_anywhere = $invalidRank
              invalid_eligible_rank = $badSelectedRank
              best_rank_dedup_and_heldout_overlap_checked = $false
              content_privacy_semantic_license_approved = $false
              holdout_v2_created = $false
              model_training_started = $false
              raw_data_uploaded = $false
            }
            Write-Host ('PHOENIX_FULL_LINEAGE ' + ($report | ConvertTo-Json -Depth 4 -Compress))
            if (!$safe) { throw 'Full metadata compatibility gate blocked' }
          } catch {
            Write-Host ('PHOENIX_FULL_LINEAGE {"status":"blocked","stage":"' + $stage + '","data_approved":false,"model_training_started":false,"raw_data_uploaded":false}')
            throw 'Full OASST2 metadata audit halted safely. No data export or training.'
          } finally {
            if ($reader) { $reader.Dispose() }
            if ($gzip) { $gzip.Dispose() }
            if ($file) { $file.Dispose() }
          }
      - name: Scope of results
        run: Write-Host 'Only pinned source metadata and aggregate counts inspected; no text output, file export, human approval, holdout creation, GPU or training. Human/license/privacy/semantic checks and best-rank actual converter remain pending.'
