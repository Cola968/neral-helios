name: Arctus350 bilingual arithmetic v2 protected split contracts
on:
  pull_request:
    types: [opened,synchronize]
    paths:
      - 'frontier350/arctus350_balanced_arithmetic_v2.py'
      - 'tests/test_arctus350_balanced_arithmetic_v2.py'
      - '.github/workflows/arctus350-balanced-arithmetic-v2.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest tests.test_arctus350_balanced_arithmetic_v2 -v
      - run: python -m py_compile frontier350/arctus350_balanced_arithmetic_v2.py
