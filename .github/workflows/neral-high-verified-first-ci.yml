name: NERAL HIGH verified-first CPU regression
on:
  pull_request:
    paths:
      - 'neral_high_verified_first.py'
      - 'neral_local_chat_api.py'
      - 'tests/test_neral_high_verified_first.py'
      - '.github/workflows/neral-high-verified-first-ci.yml'
permissions:
  contents: read
jobs:
  verified-first:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Flask for HTTP contract tests
        run: python -m pip install 'Flask>=3.0,<4'
      - name: HIGH exact preflight tests including REAL Flask API route
        run: python -B -m unittest discover -s tests -p test_neral_high_verified_first.py -v
      - name: Preserve old THINK contracts
        run: python -B -m unittest discover -s tests -p test_neral_think.py -v
      - name: Preserve existing HTTP verifier provenance
        run: python -B -m unittest discover -s tests -p test_neral_think_api.py -v
      - name: Preserve open-ended HIGH deep-review
        run: python -B -m unittest discover -s tests -p test_neral_1_0_high_depth.py -v
