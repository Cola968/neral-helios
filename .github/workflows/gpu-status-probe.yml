name: NERAL PR533 exact two-gate GPU (isolated verification branch)
on:
  workflow_dispatch:
    inputs:
      authorize:
        required: true
        type: string
        description: 'NERAL_PR533_TWO_GATE_GPU_MANUAL_ONLY'
      mode:
        required: true
        type: choice
        default: logic
        options: [readiness, logic, transfer, both, tir12, qlora-baseline, qlora-readiness]
permissions:
  contents: read
  pull-requests: read
  actions: read
jobs:
  docker-readiness:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/verify/neral-pr533-rtx4070-two-gates-20261112' &&
      inputs.mode == 'readiness' &&
      inputs.authorize == 'NERAL_PR533_TWO_GATE_GPU_MANUAL_ONLY'
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 5
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - name: Read-only Docker Linux-engine and offline image readiness
        run: |
          $cli = [bool](Get-Command docker -ErrorAction SilentlyContinue)
          $installedDefault = Test-Path -LiteralPath (Join-Path $env:ProgramFiles 'Docker\\Docker\\Docker Desktop.exe') -PathType Leaf
          $installedUser = Test-Path -LiteralPath (Join-Path $env:LOCALAPPDATA 'Programs\\Docker\\Docker\\Docker Desktop.exe') -PathType Leaf
          $server = $false
          $image = $false
          if($cli){
            try {
              $v = & docker version --format '{{.Server.Version}}' 2>$null
              $server = ($LASTEXITCODE -eq 0 -and -not [string]::IsNullOrWhiteSpace(($v | Out-String)))
            } catch {$server = $false}
            if($server){
              try {
                & docker image inspect python:3.11-alpine *> $null
                $image = ($LASTEXITCODE -eq 0)
              } catch {$image = $false}
            }
          }
          Write-Host "DOCKER_CLI_AVAILABLE=$cli"
          Write-Host "DOCKER_DESKTOP_DEFAULT_INSTALL=$installedDefault"
          Write-Host "DOCKER_DESKTOP_USER_INSTALL=$installedUser"
          Write-Host "DOCKER_LINUX_ENGINE_ONLINE=$server"
          Write-Host "DOCKER_OFFLINE_SANDBOX_IMAGE_PRESENT=$image"
          Write-Host "PR533_GATE_A_RECHECK_READY=$($server -and $image)"
          exit 0
  cpu-preflight:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/verify/neral-pr533-rtx4070-two-gates-20261112' &&
      inputs.authorize == 'NERAL_PR533_TWO_GATE_GPU_MANUAL_ONLY' &&
      (inputs.mode == 'logic' || inputs.mode == 'transfer' || inputs.mode == 'both' || inputs.mode == 'tir12')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: d280516e1a28a1cbdbc5b6b9b89d694769f6292f
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r candidate/requirements-neral-preview.txt
      - name: Prove repair wrapper, six-clause 12 and exact source CPU contracts
        run: python -B -m unittest discover -s tests -p test_neral_pr533_compound_controller_cpu.py -v
        working-directory: candidate
      - name: Prove repaired-provenance collector contract
        run: python -B -m unittest discover -s tests -p test_neral_same_base_live.py -v
        working-directory: candidate
      - name: Validate isolated live probe syntax
        run: python -B -m py_compile scripts/neral_pr533_two_gate_live.py
      - name: Run original TIR12 scoring and paired ratchet CPU contracts
        if: inputs.mode == 'tir12'
        working-directory: candidate
        run: python -B -m unittest discover -s tests -p test_neral_tir12_manual.py -v
      - name: Fresh logic-transfer oracle CPU contracts
        if: inputs.mode == 'transfer'
        run: |
          python -B -m unittest discover -s tests -p test_neral_pr533_logic_transfer.py -v
          python -B -m py_compile scripts/neral_pr533_logic_transfer.py
  gpu-logic-only:
    needs: cpu-preflight
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/verify/neral-pr533-rtx4070-two-gates-20261112' &&
      inputs.authorize == 'NERAL_PR533_TWO_GATE_GPU_MANUAL_ONLY' &&
      (inputs.mode == 'logic' || inputs.mode == 'both')
    concurrency:
      group: neral-qwen7b-r32-gpu-exclusive
      cancel-in-progress: false
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    env:
      HF_HUB_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      NERAL_EXPERIMENTAL_TIR: '1'
      TARGET_SHA: 'd280516e1a28a1cbdbc5b6b9b89d694769f6292f'
      MANUAL_AUTH: 'NERAL_PR533_TWO_GATE_GPU_MANUAL_ONLY'
      OUTER_SEED: '202611110533'
      RUN_BOTH: ${{ inputs.mode == 'both' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
          clean: true
      - uses: actions/checkout@v4
        with:
          ref: d280516e1a28a1cbdbc5b6b9b89d694769f6292f
          path: candidate
          persist-credentials: false
          clean: true
      - name: Check exact PR533 SHA and idle GPU (logic-only, no Docker)
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -ne 'Cola968/neral-helios'){throw 'Unexpected repository'}
          $actual=(& git -C (Join-Path $env:GITHUB_WORKSPACE 'candidate') rev-parse HEAD).Trim()
          if($LASTEXITCODE -ne 0 -or $actual -ne $env:TARGET_SHA){throw 'Candidate SHA mismatch'}
          $gpu=& nvidia-smi --query-gpu=memory.free,utilization.gpu --format=csv,noheader,nounits
          if($LASTEXITCODE -ne 0){throw 'GPU probe unavailable'}
          $values=($gpu|Select-Object -First 1) -split ','
          if($values.Count -ne 2 -or [int]$values[0].Trim() -lt 7000 -or [int]$values[1].Trim() -gt 25){
            throw 'GPU busy or insufficient memory'
          }
          $base=Join-Path $env:USERPROFILE 'NERAL-QLoRA-Research\training-env-py312\Scripts\python.exe'
          if(-not(Test-Path -LiteralPath $base -PathType Leaf)){throw 'Existing Python runtime not found'}
          $venv=Join-Path $env:RUNNER_TEMP ('neral-pr533-two-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
          if(Test-Path -LiteralPath $venv){throw 'Refuse occupied test environment'}
          & $base -B -m venv $venv
          if($LASTEXITCODE -ne 0){throw 'Unable to create isolated environment'}
          $py=Join-Path $venv 'Scripts\python.exe'
          & $py -B -m pip install --disable-pip-version-check --no-input --no-cache-dir -r (Join-Path $env:GITHUB_WORKSPACE 'candidate/requirements-neral-preview.txt')
          if($LASTEXITCODE -ne 0){throw 'Missing preview dependencies'}
          if($env:RUN_BOTH -eq '1'){
            & docker image inspect python:3.11-alpine *> $null
            if($LASTEXITCODE -ne 0){throw 'Local Docker Linux engine or offline sandbox image missing'}
          }
          [IO.File]::AppendAllText($env:GITHUB_ENV, ('TWO_GATE_PY='+$py+[Environment]::NewLine), [Text.UTF8Encoding]::new($false))
      - name: Run only real local RTX logic gate B and export scalar telemetry
        run: |
          $ErrorActionPreference='Stop'
          $candidate=Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $harness=Join-Path $env:GITHUB_WORKSPACE 'harness'
          $env:PYTHONPATH=$candidate
          Push-Location $candidate
          try {
            $flag=@()
            if($env:RUN_BOTH -eq '1'){$flag=@('--run-both')}
            & $env:TWO_GATE_PY -B (Join-Path $harness 'scripts/neral_pr533_two_gate_live.py') --authorize $env:MANUAL_AUTH --target-sha $env:TARGET_SHA --candidate-root $candidate --seed $env:OUTER_SEED @flag
            if($LASTEXITCODE -ne 0){throw 'PR533 A/B GPU gate rejected; TIR12 NOT authorized'}
          } finally { Pop-Location }

  gpu-logic-transfer:
    needs: cpu-preflight
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/verify/neral-pr533-rtx4070-two-gates-20261112' &&
      inputs.authorize == 'NERAL_PR533_TWO_GATE_GPU_MANUAL_ONLY' &&
      inputs.mode == 'transfer'
    concurrency:
      group: neral-qwen7b-r32-gpu-exclusive
      cancel-in-progress: false
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    env:
      HF_HUB_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      NERAL_EXPERIMENTAL_TIR: '1'
      TARGET_SHA: 'd280516e1a28a1cbdbc5b6b9b89d694769f6292f'
      MANUAL_AUTH: 'NERAL_PR533_LOGIC_TRANSFER_GPU_ONLY'
      OUTER_SEED: '202611110533'
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
          clean: true
      - uses: actions/checkout@v4
        with:
          ref: d280516e1a28a1cbdbc5b6b9b89d694769f6292f
          path: candidate
          persist-credentials: false
          clean: true
      - name: Check exact PR533 SHA and idle GPU (logic-only, no Docker)
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -ne 'Cola968/neral-helios'){throw 'Unexpected repository'}
          $actual=(& git -C (Join-Path $env:GITHUB_WORKSPACE 'candidate') rev-parse HEAD).Trim()
          if($LASTEXITCODE -ne 0 -or $actual -ne $env:TARGET_SHA){throw 'Candidate SHA mismatch'}
          $gpu=& nvidia-smi --query-gpu=memory.free,utilization.gpu --format=csv,noheader,nounits
          if($LASTEXITCODE -ne 0){throw 'GPU probe unavailable'}
          $values=($gpu|Select-Object -First 1) -split ','
          if($values.Count -ne 2 -or [int]$values[0].Trim() -lt 7000 -or [int]$values[1].Trim() -gt 25){
            throw 'GPU busy or insufficient memory'
          }
          $base=Join-Path $env:USERPROFILE 'NERAL-QLoRA-Research\training-env-py312\Scripts\python.exe'
          if(-not(Test-Path -LiteralPath $base -PathType Leaf)){throw 'Existing Python runtime not found'}
          $venv=Join-Path $env:RUNNER_TEMP ('neral-pr533-two-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
          if(Test-Path -LiteralPath $venv){throw 'Refuse occupied test environment'}
          & $base -B -m venv $venv
          if($LASTEXITCODE -ne 0){throw 'Unable to create isolated environment'}
          $py=Join-Path $venv 'Scripts\python.exe'
          & $py -B -m pip install --disable-pip-version-check --no-input --no-cache-dir -r (Join-Path $env:GITHUB_WORKSPACE 'candidate/requirements-neral-preview.txt')
          if($LASTEXITCODE -ne 0){throw 'Missing preview dependencies'}
          [IO.File]::AppendAllText($env:GITHUB_ENV, ('TWO_GATE_PY='+$py+[Environment]::NewLine), [Text.UTF8Encoding]::new($false))
      - name: Run four independent synthetic logics with real RTX and export safe scalars
        run: |
          $ErrorActionPreference='Stop'
          $candidate=Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $harness=Join-Path $env:GITHUB_WORKSPACE 'harness'
          $env:PYTHONPATH=$candidate
          Push-Location $candidate
          try {
            & $env:TWO_GATE_PY -B (Join-Path $harness 'scripts/neral_pr533_logic_transfer.py') --authorize $env:MANUAL_AUTH --target-sha $env:TARGET_SHA --candidate-root $candidate
            if($LASTEXITCODE -ne 0){throw 'Synthetic transfer gate not all passed; no TIR12 claim'}
          } finally { Pop-Location }

  # Manual-only candidate baseline from immutable main scorer 94ccac3fa9f14a7bf8ca65900c32a4e48d72b9d1.
  verify-target:
    name: Verify pinned PR #533 baseline SHA
    needs: cpu-preflight
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/verify/neral-pr533-rtx4070-two-gates-20261112' && inputs.mode == 'tir12'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      AUTHORIZE: ${{ inputs.authorize }}
      TARGET_SHA: 'd280516e1a28a1cbdbc5b6b9b89d694769f6292f'
      HIGH_SHA: '42071009bfe41e2fba1478d742a00f0cb88d6ab5'
    outputs:
      target_sha: ${{ steps.verify.outputs.target_sha }}
      high_sha: ${{ steps.verify.outputs.high_sha }}
    steps:
      - id: verify
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "Cola968/neral-helios" ||
                "$AUTHORIZE" != "NERAL_PR533_TWO_GATE_GPU_MANUAL_ONLY" ||
                ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ||
                ! "$HIGH_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Authorization, repository or exact SHA invalid' >&2
            exit 1
          fi
          PR_JSON="$(gh api "repos/$GITHUB_REPOSITORY/pulls/533")"
          PR_HIGH_JSON="$(gh api "repos/$GITHUB_REPOSITORY/pulls/503")"
          export PR_JSON PR_HIGH_JSON
          python - <<'PY'
          import json, os, sys
          pr = json.loads(os.environ["PR_JSON"])
          ok = (
              pr.get("state") == "open"
              and pr.get("number") == 533
              and pr.get("head", {}).get("sha") == os.environ["TARGET_SHA"]
              and pr.get("head", {}).get("ref") == "fix/neral-pr505-tir-cpu-routing-diagnostics-20261111"
              and pr.get("head", {}).get("repo", {}).get("full_name") == "Cola968/neral-helios"
              and pr.get("base", {}).get("ref") == "feat/neral-1-1-tir-observation-fallback-20261110"
              and pr.get("base", {}).get("repo", {}).get("full_name") == "Cola968/neral-helios"
          )
          high = json.loads(os.environ["PR_HIGH_JSON"])
          high_ok = (
              high.get("number") == 503 and high.get("state") == "closed"
              and high.get("merged_at") is not None
              and high.get("base", {}).get("ref") == "main"
              and high.get("head", {}).get("sha") == os.environ["HIGH_SHA"]
              and high.get("head", {}).get("ref") == "fix/neral-high-first-pass-only-20261110"
              and high.get("head", {}).get("repo", {}).get("full_name") == "Cola968/neral-helios"
          )
          if not (ok and high_ok):
              raise SystemExit("Exact merged HIGH #503 / main-based TIR #505 SHA pairing changed")
          print("PR #533 source head and exact SHA verified")
          PY
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "high_sha=$HIGH_SHA" >> "$GITHUB_OUTPUT"

  gpu-paired:
    name: PR533 pinned TIR12 paired GPU benchmark
    needs: verify-target
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/verify/neral-pr533-rtx4070-two-gates-20261112' && inputs.mode == 'tir12'
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 65
    concurrency:
      group: neral-qwen7b-r32-gpu-exclusive
      cancel-in-progress: false
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ needs.verify-target.outputs.target_sha }}
      HIGH_SHA: ${{ needs.verify-target.outputs.high_sha }}
      NERAL_EXPERIMENTAL_TIR: '1'
      HF_HUB_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      WANDB_DISABLED: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout controller from protected default-branch workflow SHA
        uses: actions/checkout@v4
        with:
          ref: '94ccac3fa9f14a7bf8ca65900c32a4e48d72b9d1'
          path: control
          persist-credentials: false
          clean: true
      - name: Checkout exact PR #533 candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-target.outputs.target_sha }}
          path: candidate
          persist-credentials: false
          clean: true
          fetch-depth: 0
      - name: Verify immutable HEAD, pinned Qwen and free local GPU
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -ne 'Cola968/neral-helios' -or
              $env:NERAL_EXPERIMENTAL_TIR -ne '1' -or
              $env:TARGET_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Rejected benchmark environment' }
          $actual = (& git -C (Join-Path $env:GITHUB_WORKSPACE 'candidate') rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:TARGET_SHA) { throw 'Wrong candidate checkout SHA' }
          & git -C (Join-Path $env:GITHUB_WORKSPACE 'candidate') merge-base --is-ancestor $env:HIGH_SHA HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Pinned PR #503 HIGH SHA is not ancestor of PR #533' }
          # Trust only the protected main controller script; never execute
          # candidate PR code to resume local services or bypass Docker.
          & (Join-Path $env:GITHUB_WORKSPACE 'control/scripts/neral_docker_desktop_preflight.ps1')
          if ($LASTEXITCODE -ne 0) { throw 'Local Docker preflight failed' }
          & docker image inspect python:3.11-alpine *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Pre-installed offline Python Docker sandbox missing' }
          $pr = gh api ('repos/' + $env:GITHUB_REPOSITORY + '/pulls/533') | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $pr.head.sha -ne $env:TARGET_SHA -or
              $pr.head.ref -ne 'fix/neral-pr505-tir-cpu-routing-diagnostics-20261111') {
            throw 'PR changed after preflight; refuse GPU work'
          }
          $gpu = & nvidia-smi --query-gpu=memory.free,utilization.gpu --format=csv,noheader,nounits
          if ($LASTEXITCODE -ne 0) { throw 'GPU telemetry unavailable' }
          $v = ($gpu | Select-Object -First 1) -split ','
          if ($v.Count -ne 2 -or [int]$v[0].Trim() -lt 7000 -or
              [int]$v[1].Trim() -gt 25) { throw 'GPU busy; benchmark not started' }
          $base = Join-Path $env:USERPROFILE 'NERAL-QLoRA-Research/training-env-py312/Scripts/python.exe'
          if (-not (Test-Path -LiteralPath $base -PathType Leaf)) {
            throw 'Existing local Python 3.12 unavailable'
          }
          $envDir = Join-Path $env:RUNNER_TEMP ('neral-tir12-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $envDir) { throw 'Refuse to overwrite existing Python environment' }
          & $base -B -m venv $envDir
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create isolated Python environment' }
          $py = Join-Path $envDir 'Scripts/python.exe'
          & $py -B -m pip install --disable-pip-version-check --no-input --no-cache-dir -r (Join-Path $env:GITHUB_WORKSPACE 'candidate/requirements-neral-preview.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Unable to install required local Python dependencies' }
          [IO.File]::AppendAllText($env:GITHUB_ENV, ('TIR12_PY=' + $py + [Environment]::NewLine), [Text.UTF8Encoding]::new($false))
      - name: Run exactly 12 paired tasks, Qwen direct vs two-stage experimental HIGH + TIR
        id: gate
        run: |
          $ErrorActionPreference = 'Stop'
          $control = Join-Path $env:GITHUB_WORKSPACE 'control'
          $candidate = Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $dir = Join-Path $control 'neral_tir12_scalar'
          if (Test-Path -LiteralPath $dir) { throw 'Refuse existing report directory' }
          New-Item -ItemType Directory -Path $dir -ErrorAction Stop | Out-Null
          $env:PYTHONPATH = $candidate
          Push-Location $candidate
          try {
            & $env:TIR12_PY -B (Join-Path $control 'scripts/neral_tir12_manual.py') --authorize NERAL_TIR12_GPU_MANUAL_ONLY --target-sha $env:TARGET_SHA --high-sha $env:HIGH_SHA --out (Join-Path $dir 'summary.json')
            if ($LASTEXITCODE -ne 0) { throw 'Candidate did not pass the paired development ratchet or inference failed' }
          } finally { Pop-Location }
      - name: Upload scalar-only paired result (even on model regression)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neral-pr533-tir12-paired-scalars
          path: control/neral_tir12_scalar/summary.json
          retention-days: 14
          if-no-files-found: warn

  qlora-holdout-cpu:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/verify/neral-pr533-rtx4070-two-gates-20261112' &&
      (inputs.mode == 'qlora-baseline' || inputs.mode == 'qlora-readiness') &&
      inputs.authorize == 'NERAL_PR533_TWO_GATE_GPU_MANUAL_ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '1c576bd820d5b65d76cbf65fb69146e8f40aec45'
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r candidate/requirements-neral-preview.txt
      - name: Check 24 holdout oracles and real inference/repair scoring
        run: |
          python -B -m unittest discover -s tests -p test_neral_qlora_holdout_live_cpu.py -v
          python -B -m scripts.neral_qlora_holdout_eval --holdout datasets/neral_qwen35_holdout_v1.jsonl
        working-directory: candidate
  qlora-holdout-gpu:
    needs: qlora-holdout-cpu
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/verify/neral-pr533-rtx4070-two-gates-20261112' &&
      (inputs.mode == 'qlora-baseline' || inputs.mode == 'qlora-readiness') &&
      inputs.authorize == 'NERAL_PR533_TWO_GATE_GPU_MANUAL_ONLY'
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 65
    concurrency:
      group: neral-qwen7b-r32-gpu-exclusive
      cancel-in-progress: false
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    env:
      NERAL_EXPERIMENTAL_TIR: '1'
      HF_HUB_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      QLORA_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '1c576bd820d5b65d76cbf65fb69146e8f40aec45'
          path: candidate
          persist-credentials: false
          clean: true
      - name: Verify immutable QLoRA candidate and inspect VRAM and installed training deps
        run: |
          $ErrorActionPreference='Stop'
          $candidate=Join-Path $env:GITHUB_WORKSPACE 'candidate'
          if($env:GITHUB_REPOSITORY -ne 'Cola968/neral-helios'){throw 'Unexpected repository'}
          $actual=(& git -C $candidate rev-parse HEAD).Trim()
          if($LASTEXITCODE -ne 0 -or $actual -ne '1c576bd820d5b65d76cbf65fb69146e8f40aec45'){throw 'QLoRA candidate commit changed'}
          $gpu=& nvidia-smi --query-gpu=memory.total,memory.free,utilization.gpu --format=csv,noheader,nounits
          if($LASTEXITCODE -ne 0){throw 'Missing Nvidia GPU'}
          $v=($gpu|Select-Object -First 1) -split ','
          if($v.Count -ne 3){throw 'Unexpected Nvidia GPU details'}
          Write-Host "GPU_TOTAL_MIB=$($v[0].Trim())"
          Write-Host "GPU_FREE_MIB=$($v[1].Trim())"
          Write-Host "GPU_UTIL_PERCENT=$($v[2].Trim())"
          $base=Join-Path $env:USERPROFILE 'NERAL-QLoRA-Research/training-env-py312/Scripts/python.exe'
          Write-Host "TRAIN_PYTHON_INSTALLED=$([bool](Test-Path -LiteralPath $base -PathType Leaf))"
          if(Test-Path -LiteralPath $base -PathType Leaf){
            & $base -B -c 'import json,importlib.util;print("TRAIN_DEPS="+json.dumps({m:bool(importlib.util.find_spec(m)) for m in ["torch","transformers","unsloth","peft","bitsandbytes","accelerate","safetensors"]},sort_keys=True))'
            if($LASTEXITCODE -ne 0){throw 'Existing Python probe failed'}
          }
          $cache=Join-Path $env:USERPROFILE '.cache/huggingface/hub'
          foreach($name in @('models--unsloth--Qwen3.5-9B','models--Qwen--Qwen3.5-9B')){
            Write-Host "$($name)_CACHE_PRESENT=$([bool](Test-Path -LiteralPath (Join-Path $cache $name)))"
          }
          if($env:QLORA_MODE -eq 'qlora-baseline'){
            if([int]$v[1].Trim() -lt 7000 -or [int]$v[2].Trim() -gt 25){throw 'GPU busy; refuse benchmark'}
          }
      - name: Build minimal local baseline runner
        if: env.QLORA_MODE == 'qlora-baseline'
        run: |
          $ErrorActionPreference='Stop'
          $base=Join-Path $env:USERPROFILE 'NERAL-QLoRA-Research/training-env-py312/Scripts/python.exe'
          if(-not(Test-Path -LiteralPath $base -PathType Leaf)){throw 'Existing Python not found'}
          $venv=Join-Path $env:RUNNER_TEMP ('neral-holdout24-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $venv){throw 'Refuse occupied virtualenv'}
          & $base -B -m venv $venv
          if($LASTEXITCODE -ne 0){throw 'Virtualenv failed'}
          $py=Join-Path $venv 'Scripts/python.exe'
          & $py -B -m pip install --disable-pip-version-check --no-input --no-cache-dir -r (Join-Path $env:GITHUB_WORKSPACE 'candidate/requirements-neral-preview.txt')
          if($LASTEXITCODE -ne 0){throw 'Preview dependencies failed'}
          [IO.File]::AppendAllText($env:GITHUB_ENV, ('HOLDOUT_PY='+$py+[Environment]::NewLine), [Text.UTF8Encoding]::new($false))
      - name: Run all 24 real local Qwen3.5 original and controller holdout tasks
        if: env.QLORA_MODE == 'qlora-baseline'
        run: |
          $ErrorActionPreference='Stop'
          $candidate=Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $dir=Join-Path $env:RUNNER_TEMP ('neral-holdout-scalar-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $dir){throw 'Refuse existing scalar output'}
          New-Item -ItemType Directory -Path $dir -ErrorAction Stop | Out-Null
          $env:PYTHONPATH=$candidate
          Push-Location $candidate
          try {
            & $env:HOLDOUT_PY -B -m scripts.neral_qlora_holdout_live --authorize NERAL_QLORA_HOLDOUT_GPU_MANUAL_ONLY --model qwen3.5:9b --baseline --holdout datasets/neral_qwen35_holdout_v1.jsonl --out (Join-Path $dir 'before_24_scalar.json')
            if($LASTEXITCODE -ne 0){throw '24-case local inference failed; no baseline claim'}
          } finally {Pop-Location}
          [IO.File]::AppendAllText($env:GITHUB_ENV, ('HOLDOUT_OUT='+$dir+[Environment]::NewLine), [Text.UTF8Encoding]::new($false))
      - name: Publish scalar-only baseline output without generated text
        if: env.QLORA_MODE == 'qlora-baseline' && success()
        uses: actions/upload-artifact@v4
        with:
          name: neral-qwen35-9b-before-qlora-holdout24
          path: ${{ env.HOLDOUT_OUT }}/before_24_scalar.json
          retention-days: 14
          if-no-files-found: error
