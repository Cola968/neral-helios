          path: candidate
          persist-credentials: false
          clean: true
      - name: Verify immutable QLoRA candidate and inspect VRAM and installed training deps
        run: |
          $ErrorActionPreference='Stop'
          $candidate=Join-Path $env:GITHUB_WORKSPACE 'candidate'
          if($env:GITHUB_REPOSITORY -ne 'Cola968/neral-helios'){throw 'Unexpected repository'}
          $actual=(& git -C $candidate rev-parse HEAD).Trim()
          if($LASTEXITCODE -ne 0 -or $actual -ne 'c364aa2b3cba3db007a95f671cb68cd67171f0d9'){throw 'QLoRA candidate commit changed'}
          $gpu=& nvidia-smi --query-gpu=memory.total,memory.free,utilization.gpu --format=csv,noheader,nounits
          if($LASTEXITCODE -ne 0){throw 'Missing Nvidia GPU'}
          $v=($gpu|Select-Object -First 1) -split ','
          if($v.Count -ne 3){throw 'Unexpected Nvidia GPU details'}
          Write-Host "GPU_TOTAL_MIB=$($v[0].Trim())"
          Write-Host "GPU_FREE_MIB=$($v[1].Trim())"
          Write-Host "GPU_UTIL_PERCENT=$($v[2].Trim())"
          $base=Join-Path $env:USERPROFILE 'NERAL-QLoRA-Research/training-env-py312/Scripts/python.exe'
          Write-Host "TRAIN_PYTHON_INSTALLED=$([bool](Test-Path -LiteralPath $base -PathType Leaf))"
          $drive=Split-Path -Qualifier $env:USERPROFILE
          $disk=(Get-PSDrive -Name $drive.TrimEnd(':') -ErrorAction Stop)
          Write-Host "USER_DRIVE_FREE_GIB=$([math]::Floor($disk.Free/1GB))"
          foreach($volume in @(Get-PSDrive -PSProvider FileSystem)){
            if($null -ne $volume.Free){
              Write-Host "DRIVE_$($volume.Name)_FREE_GIB=$([math]::Floor($volume.Free/1GB))"
            }
          }
          if(Test-Path -LiteralPath $base -PathType Leaf){
            & $base -B -c "import torch;print('CUDA_AVAILABLE=' + str(torch.cuda.is_available()) + ';TORCH_VERSION=' + str(torch.__version__) + ';CUDA_VERSION=' + str(torch.version.cuda))"
            if($LASTEXITCODE -ne 0){throw 'CUDA readiness probe failure'}
          }
          if(Test-Path -LiteralPath $base -PathType Leaf){
            & $base -B -c "import importlib.util;print('TRAIN_DEPS=' + ','.join(k + ':' + str(bool(importlib.util.find_spec(k))) for k in ('torch','transformers','unsloth','peft','bitsandbytes','accelerate','safetensors')))"
            if($LASTEXITCODE -ne 0){throw 'Existing Python probe failed'}
          }
          $cache=Join-Path $env:USERPROFILE '.cache/huggingface/hub'
          foreach($name in @('models--unsloth--Qwen3.5-9B','models--Qwen--Qwen3.5-9B')){
            Write-Host "$($name)_CACHE_PRESENT=$([bool](Test-Path -LiteralPath (Join-Path $cache $name)))"
          }
          if($env:QLORA_MODE -eq 'qlora-baseline'){
            if([int]$v[1].Trim() -lt 7000 -or [int]$v[2].Trim() -gt 25){throw 'GPU busy; refuse benchmark'}
          }
      - name: Build minimal local baseline runner
        if: env.QLORA_MODE == 'qlora-baseline'
        run: |
          $ErrorActionPreference='Stop'
          $base=Join-Path $env:USERPROFILE 'NERAL-QLoRA-Research/training-env-py312/Scripts/python.exe'
