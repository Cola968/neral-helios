name: NERAL PR533 exact two-gate GPU (isolated verification branch)
on:
  workflow_dispatch:
    inputs:
      authorize:
        required: true
        type: string
        description: 'NERAL_PR533_TWO_GATE_GPU_MANUAL_ONLY'
      mode:
        required: true
        type: choice
        default: logic
        options: [readiness, logic, transfer, both]
permissions:
  contents: read
jobs:
  docker-readiness:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/verify/neral-pr533-rtx4070-two-gates-20261112' &&
      inputs.mode == 'readiness' &&
      inputs.authorize == 'NERAL_PR533_TWO_GATE_GPU_MANUAL_ONLY'
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 5
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - name: Read-only Docker Linux-engine and offline image readiness
        run: |
          $cli = [bool](Get-Command docker -ErrorAction SilentlyContinue)
          $installedDefault = Test-Path -LiteralPath (Join-Path $env:ProgramFiles 'Docker\\Docker\\Docker Desktop.exe') -PathType Leaf
          $installedUser = Test-Path -LiteralPath (Join-Path $env:LOCALAPPDATA 'Programs\\Docker\\Docker\\Docker Desktop.exe') -PathType Leaf
          $server = $false
          $image = $false
          if($cli){
            try {
              $v = & docker version --format '{{.Server.Version}}' 2>$null
              $server = ($LASTEXITCODE -eq 0 -and -not [string]::IsNullOrWhiteSpace(($v | Out-String)))
            } catch {$server = $false}
            if($server){
              try {
                & docker image inspect python:3.11-alpine *> $null
                $image = ($LASTEXITCODE -eq 0)
              } catch {$image = $false}
            }
          }
          Write-Host "DOCKER_CLI_AVAILABLE=$cli"
          Write-Host "DOCKER_DESKTOP_DEFAULT_INSTALL=$installedDefault"
          Write-Host "DOCKER_DESKTOP_USER_INSTALL=$installedUser"
          Write-Host "DOCKER_LINUX_ENGINE_ONLINE=$server"
          Write-Host "DOCKER_OFFLINE_SANDBOX_IMAGE_PRESENT=$image"
          Write-Host "PR533_GATE_A_RECHECK_READY=$($server -and $image)"
          exit 0
  cpu-preflight:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/verify/neral-pr533-rtx4070-two-gates-20261112' &&
      inputs.authorize == 'NERAL_PR533_TWO_GATE_GPU_MANUAL_ONLY' &&
      (inputs.mode == 'logic' || inputs.mode == 'transfer' || inputs.mode == 'both')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 0341853b5184708790cca96e866e37870e1c8b43
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r candidate/requirements-neral-preview.txt
      - name: Prove repair wrapper, six-clause 12 and exact source CPU contracts
        run: python -B -m unittest discover -s tests -p test_neral_pr533_compound_controller_cpu.py -v
        working-directory: candidate
      - name: Prove repaired-provenance collector contract
        run: python -B -m unittest discover -s tests -p test_neral_same_base_live.py -v
        working-directory: candidate
      - name: Validate isolated live probe syntax
        run: python -B -m py_compile scripts/neral_pr533_two_gate_live.py
      - name: Fresh logic-transfer oracle CPU contracts
        if: inputs.mode == 'transfer'
        run: |
          python -B -m unittest discover -s tests -p test_neral_pr533_logic_transfer.py -v
          python -B -m py_compile scripts/neral_pr533_logic_transfer.py
  gpu-logic-only:
    needs: cpu-preflight
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/verify/neral-pr533-rtx4070-two-gates-20261112' &&
      inputs.authorize == 'NERAL_PR533_TWO_GATE_GPU_MANUAL_ONLY' &&
      (inputs.mode == 'logic' || inputs.mode == 'both')
    concurrency:
      group: neral-qwen7b-r32-gpu-exclusive
      cancel-in-progress: false
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    env:
      HF_HUB_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      NERAL_EXPERIMENTAL_TIR: '1'
      TARGET_SHA: '0341853b5184708790cca96e866e37870e1c8b43'
      MANUAL_AUTH: 'NERAL_PR533_TWO_GATE_GPU_MANUAL_ONLY'
      OUTER_SEED: '202611110533'
      RUN_BOTH: ${{ inputs.mode == 'both' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
          clean: true
      - uses: actions/checkout@v4
        with:
          ref: 0341853b5184708790cca96e866e37870e1c8b43
          path: candidate
          persist-credentials: false
          clean: true
      - name: Check exact PR533 SHA and idle GPU (logic-only, no Docker)
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -ne 'Cola968/neral-helios'){throw 'Unexpected repository'}
          $actual=(& git -C (Join-Path $env:GITHUB_WORKSPACE 'candidate') rev-parse HEAD).Trim()
          if($LASTEXITCODE -ne 0 -or $actual -ne $env:TARGET_SHA){throw 'Candidate SHA mismatch'}
          $gpu=& nvidia-smi --query-gpu=memory.free,utilization.gpu --format=csv,noheader,nounits
          if($LASTEXITCODE -ne 0){throw 'GPU probe unavailable'}
          $values=($gpu|Select-Object -First 1) -split ','
          if($values.Count -ne 2 -or [int]$values[0].Trim() -lt 7000 -or [int]$values[1].Trim() -gt 25){
            throw 'GPU busy or insufficient memory'
          }
          $base=Join-Path $env:USERPROFILE 'NERAL-QLoRA-Research\training-env-py312\Scripts\python.exe'
          if(-not(Test-Path -LiteralPath $base -PathType Leaf)){throw 'Existing Python runtime not found'}
          $venv=Join-Path $env:RUNNER_TEMP ('neral-pr533-two-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
          if(Test-Path -LiteralPath $venv){throw 'Refuse occupied test environment'}
          & $base -B -m venv $venv
          if($LASTEXITCODE -ne 0){throw 'Unable to create isolated environment'}
          $py=Join-Path $venv 'Scripts\python.exe'
          & $py -B -m pip install --disable-pip-version-check --no-input --no-cache-dir -r (Join-Path $env:GITHUB_WORKSPACE 'candidate/requirements-neral-preview.txt')
          if($LASTEXITCODE -ne 0){throw 'Missing preview dependencies'}
          if($env:RUN_BOTH -eq '1'){
            & docker image inspect python:3.11-alpine *> $null
            if($LASTEXITCODE -ne 0){throw 'Local Docker Linux engine or offline sandbox image missing'}
          }
          [IO.File]::AppendAllText($env:GITHUB_ENV, ('TWO_GATE_PY='+$py+[Environment]::NewLine), [Text.UTF8Encoding]::new($false))
      - name: Run only real local RTX logic gate B and export scalar telemetry
        run: |
          $ErrorActionPreference='Stop'
          $candidate=Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $harness=Join-Path $env:GITHUB_WORKSPACE 'harness'
          $env:PYTHONPATH=$candidate
          Push-Location $candidate
          try {
            $flag=@()
            if($env:RUN_BOTH -eq '1'){$flag=@('--run-both')}
            & $env:TWO_GATE_PY -B (Join-Path $harness 'scripts/neral_pr533_two_gate_live.py') --authorize $env:MANUAL_AUTH --target-sha $env:TARGET_SHA --candidate-root $candidate --seed $env:OUTER_SEED @flag
            if($LASTEXITCODE -ne 0){throw 'PR533 A/B GPU gate rejected; TIR12 NOT authorized'}
          } finally { Pop-Location }

  gpu-logic-transfer:
    needs: cpu-preflight
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/verify/neral-pr533-rtx4070-two-gates-20261112' &&
      inputs.authorize == 'NERAL_PR533_TWO_GATE_GPU_MANUAL_ONLY' &&
      inputs.mode == 'transfer'
    concurrency:
      group: neral-qwen7b-r32-gpu-exclusive
      cancel-in-progress: false
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    env:
      HF_HUB_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      NERAL_EXPERIMENTAL_TIR: '1'
      TARGET_SHA: '0341853b5184708790cca96e866e37870e1c8b43'
      MANUAL_AUTH: 'NERAL_PR533_LOGIC_TRANSFER_GPU_ONLY'
      OUTER_SEED: '202611110533'
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
          clean: true
      - uses: actions/checkout@v4
        with:
          ref: 0341853b5184708790cca96e866e37870e1c8b43
          path: candidate
          persist-credentials: false
          clean: true
      - name: Check exact PR533 SHA and idle GPU (logic-only, no Docker)
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -ne 'Cola968/neral-helios'){throw 'Unexpected repository'}
          $actual=(& git -C (Join-Path $env:GITHUB_WORKSPACE 'candidate') rev-parse HEAD).Trim()
          if($LASTEXITCODE -ne 0 -or $actual -ne $env:TARGET_SHA){throw 'Candidate SHA mismatch'}
          $gpu=& nvidia-smi --query-gpu=memory.free,utilization.gpu --format=csv,noheader,nounits
          if($LASTEXITCODE -ne 0){throw 'GPU probe unavailable'}
          $values=($gpu|Select-Object -First 1) -split ','
          if($values.Count -ne 2 -or [int]$values[0].Trim() -lt 7000 -or [int]$values[1].Trim() -gt 25){
            throw 'GPU busy or insufficient memory'
          }
          $base=Join-Path $env:USERPROFILE 'NERAL-QLoRA-Research\training-env-py312\Scripts\python.exe'
          if(-not(Test-Path -LiteralPath $base -PathType Leaf)){throw 'Existing Python runtime not found'}
          $venv=Join-Path $env:RUNNER_TEMP ('neral-pr533-two-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
          if(Test-Path -LiteralPath $venv){throw 'Refuse occupied test environment'}
          & $base -B -m venv $venv
          if($LASTEXITCODE -ne 0){throw 'Unable to create isolated environment'}
          $py=Join-Path $venv 'Scripts\python.exe'
          & $py -B -m pip install --disable-pip-version-check --no-input --no-cache-dir -r (Join-Path $env:GITHUB_WORKSPACE 'candidate/requirements-neral-preview.txt')
          if($LASTEXITCODE -ne 0){throw 'Missing preview dependencies'}
          [IO.File]::AppendAllText($env:GITHUB_ENV, ('TWO_GATE_PY='+$py+[Environment]::NewLine), [Text.UTF8Encoding]::new($false))
      - name: Run four independent synthetic logics with real RTX and export safe scalars
        run: |
          $ErrorActionPreference='Stop'
          $candidate=Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $harness=Join-Path $env:GITHUB_WORKSPACE 'harness'
          $env:PYTHONPATH=$candidate
          Push-Location $candidate
          try {
            & $env:TWO_GATE_PY -B (Join-Path $harness 'scripts/neral_pr533_logic_transfer.py') --authorize $env:MANUAL_AUTH --target-sha $env:TARGET_SHA --candidate-root $candidate
            if($LASTEXITCODE -ne 0){throw 'Synthetic transfer gate not all passed; no TIR12 claim'}
          } finally { Pop-Location }
