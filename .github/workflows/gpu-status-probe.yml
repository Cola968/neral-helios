name: Neral GPU Status Probe

on:
  push:
    branches:
      - gpu-status-ping-v2
    paths:
      - gpu_status_ping.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 5
    defaults:
      run:
        shell: cmd
    steps:
      - name: Probe runner and NVIDIA GPU
        run: |
          nvidia-smi --query-gpu=name,driver_version,memory.total,memory.free,temperature.gpu,power.draw --format=csv,noheader
