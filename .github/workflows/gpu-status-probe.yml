          $ErrorActionPreference='Stop'
          $candidate=Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $dir=Join-Path $env:RUNNER_TEMP ('neral-holdout-scalar-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $dir){throw 'Refuse existing scalar output'}
          New-Item -ItemType Directory -Path $dir -ErrorAction Stop | Out-Null
          $env:PYTHONPATH=$candidate
          Push-Location $candidate
          try {
            & $env:HOLDOUT_PY -B -m scripts.neral_qlora_holdout_live --authorize NERAL_QLORA_HOLDOUT_GPU_MANUAL_ONLY --model qwen3.5:9b --baseline --holdout datasets/neral_qwen35_holdout_v1.jsonl --out (Join-Path $dir 'before_24_scalar.json')
            if($LASTEXITCODE -ne 0){throw '24-case local inference failed; no baseline claim'}
          } finally {Pop-Location}
          [IO.File]::AppendAllText($env:GITHUB_ENV, ('HOLDOUT_OUT='+$dir+[Environment]::NewLine), [Text.UTF8Encoding]::new($false))
      - name: Publish scalar-only baseline output without generated text
        if: env.QLORA_MODE == 'qlora-baseline' && success()
