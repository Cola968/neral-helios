            & $py -B -m scripts.neral_generalization_100_ablation --authorize NERAL_QWEN35_ABLATION_GPU_MANUAL_ONLY --train 'D:\neral-qlora\train.jsonl' --holdout datasets/neral_qwen35_holdout_v1.jsonl --corpus (Join-Path $dir 'cases.jsonl') --manifest (Join-Path $dir 'cases-manifest.json') --out (Join-Path $dir 'ablation-100-scalar.json')
            if($LASTEXITCODE -ne 0){throw 'Real GPU ablation failed, refusing partial accuracy claim'}
          } finally {Pop-Location}
      - name: Upload scalar evidence only; no weights, generated code or full raw text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neral-qwen35-100-pure-ablation-dual-pr537
          path: |
            ${{ env.NERAL_ABLATION_DIR }}/cases-manifest.json
            ${{ env.NERAL_ABLATION_DIR }}/ablation-100-scalar.json
            ${{ env.NERAL_ABLATION_DIR }}/ablation-100-scalar.progress.jsonl
