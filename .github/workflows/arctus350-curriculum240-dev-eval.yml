name: Arctus350 real read-only 64-vs-240 SFT development A/B
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/arctus350-curriculum240-dev-eval.yml'
permissions:
  contents: read
concurrency:
  group: arctus350-curriculum64-vs240-readonly
  cancel-in-progress: false
jobs:
  compare-dev:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows, x64, neral-gpu]
    timeout-minutes: 18
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          path: arctus350_curriculum_dev_checkout
          clean: false
          persist-credentials: false
      - name: SHA-pin both locally trained models and evaluate identical 12 DEV questions
        run: |
          $ErrorActionPreference='Stop'
          $assets=if($env:NERAL_ASSETS_ROOT){$env:NERAL_ASSETS_ROOT}else{'C:\Users\astad\Documents\Codex\2026-09-05\lo\outputs\neral'}
          $old=Join-Path $assets 'runs\neral350_2b_fp32_clean64_40718736208\experimental_nonpromotable_64step.pt'
          $new=Join-Path $assets 'runs\neral350_2b_clean_curriculum240_40721755841\experimental_only_nonpromotable.pt'
          $tok=Join-Path $assets 'frontier350_assets\tokenizer.json'
          foreach($p in @($old,$new,$tok)){if(-not(Test-Path -LiteralPath $p -PathType Leaf)){throw 'missing SHA-pinned local asset'}}
          if((Get-FileHash -LiteralPath $old -Algorithm SHA256).Hash.ToLowerInvariant() -ne '57bbd1f70fcca6aee5e557b132d6b1b3f7b5e3378d0248923e5478bae36caf58'){throw '64-step file SHA mismatch'}
          if((Get-FileHash -LiteralPath $new -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b43144575954d1bee137f01ba0e1fa33438e8dfdda91fdee916a7e69e99db175'){throw '240-step file SHA mismatch'}
          $csv=@(& nvidia-smi.exe --query-gpu=name,memory.total,memory.free,temperature.gpu --format=csv,noheader,nounits 2>$null)
          if($LASTEXITCODE -ne 0 -or $csv.Count -ne 1 -or [string]$csv[0] -notmatch '^\s*(.+?)\s*,\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*$'){throw 'unreliable NVIDIA telemetry'}
          $name=$matches[1];$total=[int]$matches[2];$free=[int]$matches[3];$temp=[int]$matches[4]
          if($name -notlike '*RTX 4070*' -or $free -gt $total -or $free -lt 8192 -or $temp -ge 80){throw 'GPU readiness threshold failed'}
          function W([string]$Path){
            $p=[IO.Path]::GetFullPath($Path)
            if($p -notmatch '^([A-Za-z]):\\'){throw 'unsafe local path'}
            return "/mnt/"+$matches[1].ToLowerInvariant()+"/"+$p.Substring(3).Replace('\','/')
          }
          $repo=Join-Path $env:GITHUB_WORKSPACE 'arctus350_curriculum_dev_checkout'
          $cmd="set -e; cd '$(W $repo)'; PYTHONPATH=frontier350 ~/.venvs/neral-triton-py312/bin/python -u frontier350/eval_chat350.py --checkpoint '$(W $old)' --tokenizer '$(W $tok)' --cases frontier350/chat350_dev_cases.json --out arctus350_64_dev_${{github.run_id}}.json; PYTHONPATH=frontier350 ~/.venvs/neral-triton-py312/bin/python -u frontier350/eval_chat350.py --checkpoint '$(W $new)' --tokenizer '$(W $tok)' --cases frontier350/chat350_dev_cases.json --out arctus350_240_dev_${{github.run_id}}.json; PYTHONPATH=frontier350 ~/.venvs/neral-triton-py312/bin/python frontier350/compare_chat350.py --baseline arctus350_64_dev_${{github.run_id}}.json --candidate arctus350_240_dev_${{github.run_id}}.json --out arctus350_64_vs_240_comparison_${{github.run_id}}.json"
          wsl.exe -- bash -lc $cmd
          if($LASTEXITCODE -ne 0){throw 'read-only candidate A/B invalid or failed'}
      - name: Upload development comparisons only, no private checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arctus350-64-vs240-fp32-dev-only
          path: arctus350_curriculum_dev_checkout/arctus350_*_dev_*.json
          retention-days: 7
          if-no-files-found: warn
