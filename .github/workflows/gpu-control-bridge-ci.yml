name: GPU control bridge CI

on:
  pull_request:
    paths:
      - gpu_control_bridge.py
      - tests/test_gpu_control_bridge.py
      - .github/workflows/neral-gpu-control.yml
      - .github/workflows/gpu-control-bridge-ci.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile bridge
        run: python -m py_compile gpu_control_bridge.py
      - name: Test restricted request contract
        run: python -m pytest tests/test_gpu_control_bridge.py -q
      - name: Assert workflow remains read-only to model weights
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/neral-gpu-control.yml').read_text(encoding='utf8')
          forbidden=['pretrain50_b2.py','train_raw_math50.py','train_instruct50.py','run_50m_campaign.py']
          found=[x for x in forbidden if x in text]
          assert not found, found
          assert 'gpu-control-run' in text
          assert 'gpu_requests/request.json' in text
          PY
