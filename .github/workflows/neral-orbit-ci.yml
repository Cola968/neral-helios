name: NERAL Orbit task-board CPU contracts
on:
  pull_request:
    paths:
      - 'neral_orbit.py'
      - 'tests/test_neral_orbit.py'
      - 'tests/test_neral_orbit_research.py'
      - 'neral_orbit_research.py'
      - 'tests/test_neral_orbit_browser.cjs'
      - 'app.py'
      - 'templates/orbit.html'
      - 'static/orbit.js'
      - 'static/orbit.css'
      - '.github/workflows/neral-orbit-ci.yml'
permissions:
  contents: read
jobs:
  orbit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: No-cost standard-Python Orbit source safety checks (no network)
        run: python neral_orbit_research.py --self-test
      - run: pip install -r requirements.txt
      - run: pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: HELIOS_PREPARATION_MODE=1 HELIOS_DEVICE=cpu python -m unittest tests.test_neral_orbit tests.test_neral_orbit_research -v
      - run: HELIOS_PREPARATION_MODE=0 HELIOS_DEVICE=cpu python -m pytest -q tests/test_helios_chat_experience.py tests/test_helios_runtime.py
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/test_neral_orbit_browser.cjs
