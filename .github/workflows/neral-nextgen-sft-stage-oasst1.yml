name: Neral stage OASST1 SFT candidates - review only
on:
  push:
    branches: [experiment/nextgen-v1-isolated]
    paths: ['.github/workflows/neral-nextgen-sft-stage-oasst1.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neral-sft-input-staging
  cancel-in-progress: false
jobs:
  stage:
    name: stage-public-dialogue-candidates-without-training
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          path: nextgen_sft_stage_repo
          clean: false
          persist-credentials: false
      - name: Stage pinned OASST1 data on D without approving, training or publishing data
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          $run=$env:GITHUB_RUN_ID
          if (-not $run -or $run -notmatch '^[0-9]+$') { throw 'invalid run identity' }
          $base='D:\NeralScaleV81'
          if (-not (Test-Path -LiteralPath $base -PathType Container)) { throw 'D project root missing' }
          if ((Get-PSDrive -Name D).Free -lt 1073741824) { throw 'insufficient staging disk headroom' }
          $out=Join-Path $base ('sft_review_stage_'+$run)
          if (Test-Path -LiteralPath $out) { throw 'never overwrite/reuse staging directory' }
          New-Item -ItemType Directory -Path $out -ErrorAction Stop | Out-Null
          $name='2023-04-12_oasst_ready.messages.jsonl.gz'
          $previous=Join-Path $base ('sft_review_stage_35126393909\'+$name)
          if (Test-Path -LiteralPath $previous -PathType Leaf) {
            $source=$previous
            Write-Host 'Reusing prior local source read-only; no duplicate download.'
          } else {
            $source=Join-Path $out $name
            $url='https://huggingface.co/datasets/OpenAssistant/oasst1/resolve/fdf72ae0827c1cda404aff25b6603abec9e3399b/2023-04-12_oasst_ready.messages.jsonl.gz'
            Invoke-WebRequest -Uri $url -OutFile $source -MaximumRedirection 5 -TimeoutSec 180 -ErrorAction Stop
          }
          $length=(Get-Item -LiteralPath $source -ErrorAction Stop).Length
          if ($length -lt 1000000 -or $length -gt 150000000) { throw 'unexpected official source size' }
          function To-WSL([string]$p) {
            if ($p -notmatch '^[CcDd]:\\' -or $p.Contains("'")) { throw 'unexpected local Windows path' }
            return ('/mnt/'+$p.Substring(0,1).ToLowerInvariant()+'/'+$p.Substring(3).Replace('\','/'))
          }
          $repo=Join-Path $env:GITHUB_WORKSPACE 'nextgen_sft_stage_repo'
          $wslRepo=To-WSL $repo
          $wslSource=To-WSL $source
          $candidates=Join-Path $out 'review_only_candidates'
          $wslCandidates=To-WSL $candidates
          & wsl.exe -- bash -lc "cd '$wslRepo' && ~/.venvs/neral-triton-py312/bin/python frontier350/nextgen_v1/stage_oasst1_sft.py --source '$wslSource' --frozen-benchmark benchmark_nis2_chat50.py --out '$wslCandidates'"
          if ($LASTEXITCODE -ne 0) { throw 'data staging failed; no dataset approved or model trained' }
          $report=Get-Content -LiteralPath (Join-Path $candidates 'STAGING_REPORT.json') -Raw | ConvertFrom-Json
          if ($report.status -ne 'REVIEW_REQUIRED_NOT_APPROVED_NOT_TRAINED' -or $report.approved_for_training -ne $false) { throw 'staging protection was violated' }
          Write-Host ('staged_review_only=true source_bytes='+$length+' run_dir='+$out)
          Write-Host 'A HUMAN LICENSE/PRIVACY/NEAR-DUPLICATE REVIEW AND INDEPENDENT HOLDOUT REGISTRY ARE REQUIRED BEFORE SFT.'
      - name: Publish only non-text staging metadata - never dialogue data or weights
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: neral-sft-review-only-metadata
          path: D:\NeralScaleV81\sft_review_stage_${{ github.run_id }}\review_only_candidates\STAGING_REPORT.json
          retention-days: 14
          if-no-files-found: error
